<script>
const LESSONS_RAW =
[{"id": 1, "month": "10", "title": "Thì Hiện Tại Đơn", "theme": "Family life", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Family life</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Hiện tại đơn</strong> dùng cho những việc <strong>luôn đúng</strong>: thói quen lặp lại, sự thật hiển nhiên, lịch trình cố định.</p></blockquote><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Hiện tại đơn:   ═══════════════════════════════\n                quá khứ ───── bây giờ ───── tương lai</pre><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thói quen lặp lại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Marsha <strong>goes</strong> to dance lessons every Saturday.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Sự thật, chân lý</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Water <strong>boils</strong> at 100 degrees Celsius.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Lịch trình cố định</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The library <strong>opens</strong> at 8 a.m.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tình trạng lâu dài</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>My father <strong>works</strong> at a hospital.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Dấu hiệu nhận biết</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nhóm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ khoá</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Trạng từ tần suất</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">always · usually · often · sometimes · rarely · seldom · never</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cụm chỉ tần suất</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">every day/week/month · each Monday · once a week · twice a month</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khác</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">generally · normally · in general</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Vị trí trạng từ tần suất</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Quy tắc</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Trước</strong> động từ thường</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>often</strong> play football.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Sau</strong> động từ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I am <strong>often</strong> late.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">❌ <em>She usually is late.</em> → ✅ <em>She <strong>is usually</strong> late.</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + V / V(s·es)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>play</strong> football. · He <strong>plays</strong> football.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + do/does not + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>doesn&#x27;t work</strong> here.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nghi vấn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Do/Does + S + V?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Does</strong> Dan <strong>work</strong> at the cinema?</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ ngữ nào thêm -s?</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Chủ ngữ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Động từ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">I · you · we · they · danh từ <strong>số nhiều</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>không</strong> thêm -s</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">he · she · it · danh từ <strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>thêm -s</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Quy tắc thêm -s/-es:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cách thêm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">o, s, sh, ch, x</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thêm <strong>-es</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">go → go<strong>es</strong> · watch → watch<strong>es</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <strong>phụ âm + y</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đổi <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">y</code> → <strong>-ies</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">study → stud<strong>ies</strong> · carry → carr<strong>ies</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <strong>nguyên âm + y</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thêm <strong>-s</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">play → play<strong>s</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Còn lại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thêm <strong>-s</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">work → work<strong>s</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ Bất quy tắc: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have → <strong>has</strong></code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be → <strong>is / am / are</strong></code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 HOUSEWORK IN THE FAMILY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">In many families, parents do all the housework. They want their children to study and nothing else.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">But children who share the chores learn useful skills. They learn to use their time well. They also take responsibility for small jobs at home.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">These children usually get on with their brothers and sisters better, because everyone in the family helps.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(62 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, many parents ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> According to the passage, children who share the chores ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>do the housework</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to do the cleaning, washing and cooking in a home</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>share the chores</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to divide household tasks between people who live together</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take responsibility for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to accept that you are in charge of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>get on with (sb)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have a good relationship with someone</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>look after</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to take care of someone or something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The recycling centre ______ six days a week.", "o": ["operate", "operates", "operating", "to operate"], "a": 1}, {"q": "My sister and I ______ to school together every morning.", "o": ["walks", "walking", "walk", "walked"], "a": 2}, {"q": "Water ______ at 100 degrees Celsius.", "o": ["boil", "boils", "boiling", "to boil"], "a": 1}, {"q": "She ______ her homework before dinner.", "o": ["usually does", "does usually", "usually do", "do usually"], "a": 0}, {"q": "My brother ______ at the weekend.", "o": ["don't study", "doesn't study", "doesn't studies", "not study"], "a": 1}, {"q": "______ your father work at a hospital?", "o": ["Do", "Does", "Is", "Are"], "a": 1}, {"q": "According to the passage, many parents ______.", "o": ["ask their children to do the housework", "want their children only to study", "have no time for the housework", "teach their children useful skills"], "a": 1}, {"q": "According to the passage, children who share the chores ______.", "o": ["always get better marks", "spend less time with their family", "learn to use their time well", "do all the housework alone"], "a": 2}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["parents", "children", "skills", "jobs"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only children do the housework in these families.", "Children who help at home get on better with their siblings.", "Parents never do the housework.", "Housework makes children study less."], "a": 1}]}, {"id": 2, "month": "10", "title": "Thì Hiện Tại Tiếp Diễn", "theme": "For a better community", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> For a better community</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Hiện tại tiếp diễn</strong> dùng cho việc <strong>đang xảy ra ngay lúc nói</strong>, hoặc việc chỉ diễn ra <strong>trong một giai đoạn tạm thời</strong>.</p></blockquote><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Hiện tại tiếp diễn:  ──────────●──────────\n                              ↑\n                        (chỉ lúc này)</pre><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đang xảy ra lúc nói</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Jan <strong>is watching</strong> a DVD upstairs.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Giai đoạn tạm thời</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>is working</strong> at the museum until June.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Xu hướng đang thay đổi</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>More students <strong>are choosing</strong> online courses.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thói quen gây khó chịu</strong> (với <em>always</em>)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He <strong>is always losing</strong> his keys!</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Dấu hiệu nhận biết</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">now · right now · at the moment · at present · currently · today · this week · these days · Look! · Listen!</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⚠️ Động từ trạng thái — KHÔNG chia tiếp diễn</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Nhóm động từ mô tả <strong>trạng thái</strong> (cảm xúc, suy nghĩ, sở hữu), không mô tả hành động:</p><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">appear · be · believe · belong to · hate · have · include · know · like\nlove · need · prefer · see · seem · taste · think · understand · want</pre><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">❌ <em>I am knowing the answer.</em> → ✅ <em>I <strong>know</strong> the answer.</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Ngoại lệ:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">think</code> <strong>được</strong> chia tiếp diễn khi mô tả <strong>hành động thật sự</strong>:</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trạng thái</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Hành động</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>What <strong>do you think</strong> about his song?</em> (ý kiến)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I<strong>&#x27;m thinking</strong> about the match.</em> (đang nghĩ)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>has</strong> two brothers.</em> (sở hữu)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She<strong>&#x27;s having</strong> lunch.</em> (đang ăn)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He <strong>is</strong> very kind.</em> (bản chất)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He<strong>&#x27;s being</strong> rude today.</em> (đang cư xử)</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + am/is/are + V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>is working</strong> at the museum.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + am/is/are not + V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>aren&#x27;t coming</strong> today.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nghi vấn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Am/Is/Are + S + V-ing?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Are</strong> they <strong>testing</strong> the equipment?</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Quy tắc thêm -ing:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cách thêm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">e</code> câm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bỏ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">e</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">make → mak<strong>ing</strong> · write → writ<strong>ing</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1 nguyên âm + 1 phụ âm (từ 1 âm tiết)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">gấp đôi phụ âm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">run → ru<strong>nn</strong>ing · sit → si<strong>tt</strong>ing</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">ie</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đổi thành <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">y</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lie → l<strong>y</strong>ing · die → d<strong>y</strong>ing</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Còn lại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thêm <strong>-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">study → study<strong>ing</strong> · play → play<strong>ing</strong></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 A CLEAN-UP DAY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">This month, our school is running a clean-up project. Every Saturday, students are collecting rubbish along the river near the market.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">At the moment, about sixty students are taking part. They are working in small groups, and each group looks after one part of the river bank.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The local council is helping too. It is providing gloves and bags, and it is planning to build two new bins next month.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(75 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> What are the students doing this month?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> According to the passage, the local council ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] ss=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Chủ ngữ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Động từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">everyone · everybody · someone · nobody</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Everyone <strong>needs</strong> a break.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">each / every + danh từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Every student <strong>takes</strong> part.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">each of / one of / neither of + N số nhiều</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Each of the bins <strong>has</strong> a colour code.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + of + N → theo <strong>danh từ đầu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">tuỳ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The <strong>quality</strong> of these materials <strong>is</strong> poor.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a number of + N</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số nhiều</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>A number of staff <strong>have</strong> resigned.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the number of + N</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The number of applicants <strong>has</strong> risen.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Danh từ không đếm được (information, equipment, advice)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>số ít</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The equipment <strong>needs</strong> checking.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Bẫy chính:</strong> cụm <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">of + danh từ số nhiều</code> xen giữa khiến người học chia nhầm theo danh từ đó. ❌ <em>Each of the proposals <strong>were</strong> reviewed.</em> → ✅ <em>Each of the proposals <strong>was</strong> reviewed.</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 STAYING HEALTHY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Most doctors say that a healthy life does not need expensive equipment. Walking thirty minutes a day is enough for many people.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">These days, more Vietnamese families are taking up simple sports. In many parks, groups of older people are doing morning exercises together, and young people are cycling to work instead of driving.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Doctors also warn about food. They believe that people eat too much sugar and too little fruit. Cutting down on sweet drinks is one of the easiest ways to keep fit.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(88 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, a healthy life ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What are many Vietnamese families doing these days?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>keep fit</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to stay strong and healthy</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take up (a sport)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start doing an activity regularly</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cut down on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to use or do less of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be good for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have a positive effect on someone</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd: ctors never mention food.", "Sugar is the only health problem."], "a": 1}]}, {"id": 4, "month": "10", "title": "Thì Quá Khứ Đơn", "theme": "Inventions", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Inventions</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Quá khứ đơn</strong> dùng cho việc <strong>đã xảy ra và kết thúc hẳn</strong> tại một thời điểm trong quá khứ.</p></blockquote><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Quá khứ đơn:   ────●────────────────────\n                   ↑          bây giờ\n              (xong hẳn rồi)</pre><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Việc xong hẳn trong quá khứ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>installed</strong> the bins last Monday.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Chuỗi việc nối tiếp nhau</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He <strong>opened</strong> the door, <strong>took</strong> his bag and <strong>left</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thói quen trong quá khứ</strong> (nay không còn)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>walked</strong> to school every day when I was ten.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Dấu hiệu nhận biết</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">yesterday · last week/month/year · in 2020 · two days ago · then · when I was young</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Cấu trúc <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">used to</code></h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Dùng cho <strong>thói quen hoặc trạng thái trong quá khứ, nay không còn nữa</strong>.</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + <strong>used to</strong> + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>used to</strong> walk to school.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + <strong>didn&#x27;t use to</strong> + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>didn&#x27;t use to</strong> like coffee.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nghi vấn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Did + S + <strong>use to</strong> + V?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Did</strong> you <strong>use to</strong> live here?</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ Phân biệt: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">used to + V</code> (từng làm) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be used to + V-ing</code> (đã quen với việc gì).</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + V2/V-ed</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>installed</strong> the bins.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + did not + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The plan <strong>didn&#x27;t include</strong> rural areas.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nghi vấn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Did + S + V?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Did</strong> the council <strong>approve</strong> it?</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Quy tắc thêm -ed:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cách thêm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kết thúc bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">e</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thêm <strong>-d</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">live → live<strong>d</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phụ âm + <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">y</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đổi <c hed it with their feet. People called it the &quot;running machine&quot;.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">In 1861, a French inventor added pedals to the front wheel. The new machine became popular very quickly, but it was heavy and uncomfortable.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The modern bicycle arrived in the 1880s. It had two wheels of the same size and a chain. This design worked so well that people still use it today.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(85 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, the first bicycle ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What happened in 1861?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>come up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to think of an idea or a plan</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to do a task or piece of research</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>make progress</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to improve or move forward</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be based on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to use something as the main idea</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put into practice</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start using an idea in a real situation</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The company ______ its safety policy last March.", "o": ["updates", "updated", "is updating", "update"], "a": 1}, {"q": "She ______ to work by bus when she was a student.", "o": ["use to go", "used to go", "used to going", "uses to go"], "a": 1}, {"q": "______ the council approve the plan yesterday?", "o": ["Do", "Does", "Did", "Was"], "a": 2}, {"q": "They ______ the contract two weeks ago.", "o": ["sign", "signs", "signed", "have signed"], "a": 2}, {"q": "He ______ the report on time.", "o": ["didn't finished", "didn't finish", "doesn't finish", "not finished"], "a": 1}, {"q": "The engineers ______ the problem in 2021.", "o": ["find", "found", "finded", "finds"], "a": 1}, {"q": "According to the passage, the first bicycle ______.", "o": ["had pedals on the front wheel", "was pushed by the rider's feet", "appeared in France", "had two wheels of the same size"], "a": 1}, {"q": "What happened in 1861?", "o": ["The first bicycle appeared.", "Pedals were added to the front wheel.", "The chain was invented.", "The modern bicycle arrived."], "a": 1}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the 1880s", "the chain", "the modern bicycle", "the design"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The 1861 machine was light and comfortable.", "The modern design is still in use.", "Germans invented the chain.", "The running machine had pedals."], "a": 1}]}, {"id": 5, "month": "10", "title": "Thì Quá Khứ Tiếp Diễn", "theme": "Music", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Music</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Quá khứ tiếp diễn</strong> dùng cho việc <strong>đang diễn ra tại một thời điểm trong quá khứ</strong>.</p></blockquote><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Quá khứ tiếp diễn:  ──── ═══════ ────────\n                         ↑\n                    (lúc 8 giờ tối qua)</pre><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đang diễn ra tại một mốc quá khứ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>At 8 p.m. yesterday, I <strong>was watching</strong> the news.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hai việc song song</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>While she <strong>was cooking</strong>, he <strong>was cleaning</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Làm nền cho việc khác cắt ngang</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>was walking</strong> home when it started to rain.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Bối cảnh trong truyện kể</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The sun <strong>was shining</strong> and birds <strong>were singing</strong>.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Dấu hiệu nhận biết</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">at 8 p.m. yesterday · at that time · while · as · all morning · this time last week</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + was/were + V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>were repairing</strong> the road.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + was/were not + V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>wasn&#x27;t working</strong> then.</em></td></tr><tr class=\"odd:bg-white n we arrived, the orchestra was already tuning its instruments and people were finding their seats.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">While the first piece was playing, a young violinist suddenly stood up and performed alone. The audience was listening in complete silence. Nobody moved.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">At nine o&#x27;clock, we were still sitting in our seats, although the concert had two more hours to go. It was one of the best evenings of the year.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(89 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> What was happening when the writer arrived?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> According to the passage, the audience ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be fond of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate look forward to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to feel happy about something that will happen</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "At 3 p.m. yesterday, I ______ for the results.", "o": ["wait", "waited", "was waiting", "were waiting"], "a": 2}, {"q": "While the engineers ______ the line, it started to rain.", "o": ["test", "tested", "was testing", "were testing"], "a": 3}, {"q": "She ______ at that time, so she missed the call.", "o": ["drives", "drove", "was driving", "were driving"], "a": 2}, {"q": "They ______ the equipment all morning.", "o": ["check", "checked", "was checking", "were checking"], "a": 3}, {"q": "______ you ______ when I called?", "o": ["Did / work", "Were / working", "Was / working", "Do / work"], "a": 1}, {"q": "This time last week, we ______ in Hue.", "o": ["stay", "stayed", "was staying", "were staying"], "a": 3}, {"q": "What was happening when the writer arrived?", "o": ["The concert had finished.", "The orchestra was tuning its instruments.", "A violinist was playing alone.", "People were leaving the theatre."], "a": 1}, {"q": "According to the passage, the audience ______.", "o": ["talked during the performance", "left before nine o'clock", "listened without making any noise", "asked the violinist to stop"], "a": 2}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the theatre", "nine o'clock", "the concert", "the evening"], "a": 3}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The concert ended at nine o'clock.", "The writer went to the concert alone.", "The writer enjoyed the evening.", "The violinist played with the orchestra."], "a": 2}]}, {"id": 6, "month": "10", "title": "Đối C trong>Dùng cho</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Việc xong hẳn · chuỗi việc nối tiếp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Việc đang diễn ra tại mốc quá khứ · hai việc song song</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Dấu hiệu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">yesterday · last week · in 2020 · ago · then</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">while · at 8 p.m. yesterday · at that time · all morning</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Quy tắc <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">when</code> và <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">while</code></h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ nối</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đi với thì</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>while</strong> + việc <strong>dài</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quá khứ tiếp diễn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>While</strong> they <strong>were laying</strong> cables…</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text rived, she <strong>was cooking</strong>.</em> → cô ấy đã nấu từ trước, tôi đến giữa chừng.</li><li><em>When I arrived, she <strong>cooked</strong>.</em> → tôi đến rồi cô ấy mới bắt đầu nấu.</li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + was/were V-ing <strong>when</strong> S + V2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>were surveying</strong> <strong>when</strong> the equipment <strong>broke down</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>While</strong> + S + was/were V-ing, S + V2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>While</strong> we <strong>were waiting</strong>, the manager <strong>called</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>While</strong> + S + was/were V-ing, S + was/were V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>While</strong> he <strong>was writing</strong>, she <strong>was reviewing</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>When</strong> + S + V2, S + V2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>When</strong> the alarm <strong>rang</strong>, everyone <strong>left</strong>.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE DAY THE RIVER CHANGED</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">For years, factories along the Red River were releasing waste water directly into the river. Fish were disappearing, and local families were losing their main source of food.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">In 2019, while the city council was preparing a new development plan, a group of students carried out a simple survey. They tested the water at twelve points and published the results online.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The report spread quickly. Within three months, the council closed two factories and introduced strict rules. Today, fishermen say that the fish are slowly coming back.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(94 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, what were the factories doing for years?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What did the students do in 2019?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>release waste</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to let harmful material go into the air or water</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry out a survey</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to do a study to collect information</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be responsible for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be the cause of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-sla  factories doing for years?", "o": ["Closing down slowly", "Releasing waste water into the river", "Testing the water quality", "Helping local families"], "a": 1}, {"q": "What did the students do in 2019?", "o": ["They closed two factories.", "They wrote a development plan.", "They tested the water and published the results.", "They asked fishermen for help."], "a": 2}, {"q": "The word **\"They\"** in paragraph 2 refers to ______.", "o": ["factories", "the council", "students", "families"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The council acted within three months.", "All the factories were closed.", "The fish have completely returned.", "The students worked for the council."], "a": 0}]}, {"id": 7, "month": "10", "title": "Thì Hiện Tại Hoàn Thành", "theme": "Cities of the future", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Cities of the future</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Hiện tại hoàn thành</strong> dùng cho việc xảy ra trong quá khứ nhưng <strong>còn nối với hiện tại</strong> — hoặc còn kéo dài, hoặc kết quả còn tồn tại.</p></blockquote><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Hiện tại hoàn thành:  ●═══════════════►\n                      ↑              ↑\n                 bắt đầu trong    còn đến\n                   quá khứ         bây giờ</pre><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Trường hợp</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Việc kéo dài đến hiện tại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We <strong>have lived</strong> here since 2019.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Kết quả còn tồn tại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Speeds <strong>have improved</strong> significantly.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Kinh nghiệm</strong> (không rõ thời điểm)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>have never seen</strong> such a result.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Việc vừa mới xảy ra</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>has just finished</strong> the report.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Dấu hiệu nhận biết</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ khoá</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Vị trí</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>since</strong> + mốc thời gian</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">since 2019 · since March</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>for</strong> + khoảng thời gian</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">for ten years · for six months</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>already · just · never · ever</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">giữa <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have</code> và V3</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>yet</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">cuối câu phủ định và nghi vấn</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>so far · up to now · recently · over the past…</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đầu hoặc cuối câu</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Hiện tại hoàn thành tiếp diễn</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Dùng khi nhấn <strong>quá trình kéo dài</strong>, không nhấn kết quả:</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>They <strong>have been working</strong> here since June.</em> (nhấn: làm suốt từ tháng 6) <em>They <strong>have worked</strong> on three projects.</em> (nhấn: kết quả — ba dự án)</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-br 00\"><strong>will + V</strong></th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"><strong>be going to + V</strong></th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Dùng cho</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quyết định tức thì · dự đoán chủ quan · lời hứa · <strong>tờ rơi, thông báo</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Dự định có sẵn · dự đoán có bằng chứng</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Dấu hiệu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">tomorrow · next week · soon · in the future · I think/believe/hope · probably</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">already decided · Look at…!</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Ví dụ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The bag is heavy — I <strong>will help</strong> you.</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I <strong>am going to apply</strong> for that grant.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>I think prices <strong>will rise</strong>.</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Look at those clouds — it <strong>is going to rain</strong>.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Hiện tại tiếp diễn chỉ tương lai</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Dùng cho <strong>lịch hẹn đã sắp xếp cụ thể</strong> (có giờ, có địa điểm): <em>I <strong>am meeting</strong> the supervisor at 3 p.m. tomorrow.</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">💡 Mẹo cho đề thi</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Trong <strong>tờ rơi, thông báo, quảng cáo</strong> — thể loại chiếm phần lớn dạng điền từ — gần như luôn dùng <strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will</code></strong> hoặc <strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will be + V3</code></strong> (bị động tương lai).</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Will khẳng định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + will + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Applicants <strong>will get</strong> a certificate.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Will phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + won&#x27;t + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The centre <strong>won&#x27;t open</strong> on holidays.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Will nghi vấn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Will + S + V?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Will</strong> the drill <strong>take</strong> long?</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Be going to</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + am/is/are going to + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We <strong>are going to launch</strong> the campaign.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">HTTD chỉ tương lai</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + am/is/are + V-ing + thời gian</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She <strong>is presenting</strong> at 10 a.m. tomorrow.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 SUMMER JOBS FOR STUDENTS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Techworld Magazine is pleased to announce two part-time positions for undergraduates this summer. Successful applicants will work three days a week and will receive a certificate at the end.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">We are going to hold interviews in the first week of June. Candidates who reach the final round will meet the editor in person.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">No
