  content.innerHTML=`<div class="space-y-4 fade-in">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${kpi("fa-layer-group","Buổi học",LESSONS.length,"4 tháng · 56 buổi")}
      ${kpi("fa-list-check","Câu quiz",LESSONS.reduce((a,l)=>a+l.quiz.length,0),"trắc nghiệm 4 đáp án")}
      ${kpi("fa-clone","Thẻ từ vựng",LESSONS.reduce((a,l)=>a+l.vocab.length,0),"flashcard")}
      ${kpi("fa-pen-to-square","Đã sửa",edited,withRes+" buổi có link riêng")}
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <p class="font-bold text-[14px] mb-3">Tiến độ học viên</p>
      <div class="overflow-x-auto"><table class="w-full text-[13px]"><thead class="bg-slate-50"><tr><th class="text-left px-3 py-2">Tài khoản</th><th class="text-left px-3 py-2">Hoàn thành</th><th class="text-left px-3 py-2">Quiz đã làm</th><th class="text-left px-3 py-2">Điểm TB</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="4" class="px-3 py-4 text-slate-500">Chưa có dữ liệu trên thiết bị này</td></tr>'}</tbody></table></div>
      <p class="text-[12px] text-slate-500 mt-3">Muốn xem tiến độ của học viên trên máy khác: bảo học viên vào <strong>Cài đặt &amp; sao lưu</strong> → Sao chép mã, gửi mã cho bạn, rồi bạn dán mã vào phần Khôi phục.</p>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <p class="font-bold text-[14px] mb-3">Thống kê giáo trình</p>
      <div class="overflow-x-auto"><table class="w-full text-[13px]"><thead class="bg-slate-50"><tr><th class="text-left px-3 py-2">Tháng</th><th class="text-left px-3 py-2">Số buổi</th><th class="text-left px-3 py-2">Quiz</th><th class="text-left px-3 py-2">Từ vựng</th></tr></thead><tbody>${byMonth}</tbody></table></div>
    </div></div>`;
}
function adminRes(){
  const r=resources[editId]||{};
  const f=(id,label,val,ph)=>`<label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">${label}</span><input id="${id}" value="${esc(val||"")}" placeholder="${ph||"https://..."}" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] focus:outline-none focus:border-brand-500"></label>`;
  content.innerHTML=`<div class="space-y-4 fade-in">
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <p class="font-bold text-[14px] mb-1">Link dùng chung cho cả khoá</p>
      <p class="text-[12px] text-slate-500 mb-4">Áp dụng cho mọi buổi chưa có link riêng.</p>
      <div class="grid sm:grid-cols-3 gap-3">${f("gAudio","File nghe (audio)",globalRes.audio)}${f("gDocs","Tài liệu (docs)",globalRes.docs)}${f("gSlide","Slide bài giảng",globalRes.slide)}</div>
      <div class="mt-3">${f("gNote","Ghi chú cho học viên",globalRes.note,"VD: mật khẩu mở file là 2027")}</div>
      <button id="saveGlobal" class="mt-4 bg-brand-600 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Lưu link chung</button>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <p class="font-bold text-[14px] mb-3">Link riêng từng buổi</p>
      <select id="resLesson" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] mb-4">${LESSONS.map(l=>`<option value="${l.id}" ${l.id===editId?"selected":""}>Buổi ${l.id} — ${esc(l.title)}</option>`).join("")}</select>
      <div class="grid sm:grid-cols-3 gap-3">${f("rAudio","File nghe (audio)",r.audio)}${f("rDocs","Tài liệu (docs)",r.docs)}${f("rSlide","Slide bài giảng",r.slide)}</div>
      <div class="mt-3">${f("rNote","Ghi chú buổi này",r.note,"")}</div>
      <div class="flex gap-2 mt-4"><button id="saveRes" class="bg-brand-600 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Lưu link buổi ${editId}</button>
      <button id="clearRes" class="bg-white border border-slate-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Xoá link buổi này</button></div>
    </div></div>`;
  saveGlobal.onclick=()=>{globalRes={audio:gAudio.value.trim(),docs:gDocs.value.trim(),slide:gSlide.value.trim(),note:gNote.value.trim()};save("globalres",globalRes);toast("Đã lưu link chung")};
  resLesson.onchange=e=>{editId=+e.target.value;adminRes()};
  saveRes.onclick=()=>{resources[editId]={audio:rAudio.value.trim(),docs:rDocs.value.trim(),slide:rSlide.value.trim(),note:rNote.value.trim()};save("resources",resources);toast("Đã lưu link buổi "+editId)};
  clearRes.onclick=()=>{delete resources[editId];save("resources",resources);adminRes();toast("Đã xoá")};
}

/* --- form editor --- */
function getDraft(){if(!draft||draft.id!==editId){const l=byId(editId);draft=JSON.parse(JSON.stringify({id:l.id,title:l.title,theme:l.theme,blocks:l.blocks,vocab:l.vocab,quiz:l.quiz}))}return draft}
function adminEdit(){
  const d=getDraft();
  const ta=(v,rows)=>`<textarea rows="${rows}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-[13px] leading-relaxed focus:outline-none focus:border-brand-500">${esc(v)}</textarea>`;
  content.innerHTML=`<div class="space-y-4 fade-in">
    <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
      <select id="edLesson" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[13px]">${LESSONS.map(x=>`<option value="${x.id}" ${x.id===editId?"selected":""}>Buổi ${x.id} — ${esc(x.title)}</option>`).join("")}</select>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">Tên buổi học</span><input id="edTitle" value="${esc(d.title)}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-[13px]"></label>
        <label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">Chủ đề từ vựng</span><input id="edTheme" value="${esc(d.theme||"")}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-[13px]"></label>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-1"><p class="font-bold text-[14px]">Nội dung kiến thức</p>
        <button id="addBlock" class="text-[12px] font-semibold text-brand-700 bg-brand-50 rounded-lg px-3 py-1.5"><i class="fa-solid fa-plus mr-1"></i>Thêm mục</button></div>
      <p class="text-[12px] text-slate-500 mb-3">Mỗi mục gồm <strong>Tiêu đề</strong> và <strong>Nội dung</strong>. Nội dung gõ như văn bản thường; muốn in đậm dùng <code>**chữ đậm**</code>, xuống dòng gạch đầu dòng dùng <code>-</code>, bảng dùng dấu <code>|</code>.</p>
      <div id="blockList" class="space-y-3">
        ${d.blocks.map((b,i)=>`<div class="border border-slate-200 rounded-2xl p-3" data-b="${i}">
          <div class="flex gap-2 mb-2">
            <input class="bh flex-1 border border-slate-200 rounded-xl px-3 py-2 text-[13px] font-semibold" value="${esc(b.h)}" placeholder="Tiêu đề mục">
            <button class="bup w-9 rounded-xl bg-slate-100 text-slate-500 text-xs"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="bdel w-9 rounded-xl bg-red-50 text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
          <div class="bm">${ta(b.md,7)}</div></div>`).join("")}
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-3"><p class="font-bold text-[14px]">Sổ từ vựng (flashcard)</p>
        <button id="addVocab" class="text-[12px] font-semibold text-brand-700 bg-brand-50 rounded-lg px-3 py-1.5"><i class="fa-solid fa-plus mr-1"></i>Thêm thẻ</button></div>
      <div id="vocabList" class="space-y-2">
        ${d.vocab.map((v,i)=>`<div class="grid grid-cols-12 gap-2" data-v="${i}">
          <input class="vt col-span-3 border border-slate-200 rounded-xl px-3 py-2 text-[13px] font-semibold" value="${esc(v.t)}" placeholder="Từ / cụm từ">
          <input class="vp col-span-2 border border-slate-200 rounded-xl px-3 py-2 text-[13px]" value="${esc(v.p||"")}" placeholder="Từ loại">
          <input class="ve col-span-4 border border-slate-200 rounded-xl px-3 py-2 text-[13px]" value="${esc(v.e||"")}" placeholder="Định nghĩa tiếng Anh">
          <input class="vv col-span-2 border border-slate-200 rounded-xl px-3 py-2 text-[13px]" value="${esc(v.v||"")}" placeholder="Nghĩa tiếng Việt">
          <button class="vdel col-span-1 rounded-xl bg-red-50 text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>`).join("")}
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-3"><p class="font-bold text-[14px]">Quiz trắc nghiệm</p>
        <button id="addQ" class="text-[12px] font-semibold text-brand-700 bg-brand-50 rounded-lg px-3 py-1.5"><i class="fa-solid fa-plus mr-1"></i>Thêm câu hỏi</button></div>
      <div id="quizList" class="space-y-3">
        ${d.quiz.map((q,i)=>qRow(q,i)).join("")}
      </div>
    </div>

    <div class="flex flex-wrap gap-2 sticky bottom-3">
      <button id="saveAll" class="flex-1 bg-brand-600 text-white text-[13px] font-semibold rounded-xl px-4 py-3 shadow-lg"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Lưu buổi ${editId}</button>
      <button id="previewBtn" class="bg-slate-900 text-white text-[13px] font-semibold rounded-xl px-4 py-3">Xem thử</button>
      <button id="revertBtn" class="bg-white border border-slate-200 text-[13px] font-semibold rounded-xl px-4 py-3">Khôi phục bản gốc</button>
    </div></div>`;
  edLesson.onchange=e=>{editId=+e.target.value;draft=null;adminEdit()};
  const collect=()=>{
    const d=getDraft();
    d.title=edTitle.value.trim();d.theme=edTheme.value.trim();
    d.blocks=[...blockList.children].map(el=>({h:el.querySelector(".bh").value.trim(),md:el.querySelector("textarea").value}));
    d.vocab=[...vocabList.children].map(el=>({t:el.querySelector(".vt").value.trim(),p:el.querySelector(".vp").value.trim(),e:el.querySelector(".ve").value.trim(),v:el.querySelector(".vv").value.trim()})).filter(v=>v.t);
    d.quiz=[...quizList.children].map(el=>({q:el.querySelector(".qq").value.trim(),o:[...el.querySelectorAll(".qo")].map(x=>x.value.trim()),a:+el.querySelector(".qa").value})).filter(q=>q.q&&q.o.every(x=>x));
    return d};
  addBlock.onclick=()=>{const d=collect();d.blocks.push({h:"Mục mới",md:""});adminEdit()};
  addVocab.onclick=()=>{const d=collect();d.vocab.push({t:"",p:"",e:"",v:""});adminEdit()};
  addQ.onclick=()=>{const d=collect();d.quiz.push({q:"",o:["","","",""],a:0});adminEdit()};
  content.querySelectorAll(".bdel").forEach((b,i)=>b.onclick=()=>{const d=collect();d.blocks.splice(i,1);adminEdit()});
  content.querySelectorAll(".bup").forEach((b,i)=>b.onclick=()=>{if(!i)return;const d=collect();[d.blocks[i-1],d.blocks[i]]=[d.blocks[i],d.blocks[i-1]];adminEdit()});
  content.querySelectorAll(".vdel").forEach((b,i)=>b.onclick=()=>{const d=collect();d.vocab.splice(i,1);adminEdit()});
  content.querySelectorAll(".qdel").forEach((b,i)=>b.onclick=()=>{const d=collect();d.quiz.splice(i,1);adminEdit()});
  saveAll.onclick=()=>{const d=collect();
    overrides[editId]={title:d.title,theme:d.theme,blocks:d.blocks,vocab:d.vocab,quiz:d.quiz};
    save("overrides",overrides);Object.assign(byId(editId),overrides[editId]);toast("Đã lưu buổi "+editId)};
  previewBtn.onclick=()=>{const d=collect();
    openModal("Xem thử buổi "+editId,d.title,`<article class="bg-white rounded-2xl border border-slate-200 p-5">${d.blocks.map(b=>`<section class="mb-5"><h3 class="text-[15px] font-extrabold text-brand-800 mb-2">${esc(b.h)}</h3>${md2html(b.md)}</section>`).join("")}</article>`)};
  revertBtn.onclick=()=>{if(!confirm("Khôi phục nội dung gốc của buổi "+editId+"?"))return;
    delete overrides[editId];save("overrides",overrides);
    Object.assign(byId(editId),JSON.parse(JSON.stringify(LESSONS_RAW.find(x=>x.id===editId))));draft=null;adminEdit();toast("Đã khôi phục")};
}
function qRow(q,i){return `<div class="border border-slate-200 rounded-2xl p-3" data-q="${i}">
  <div class="flex gap-2 mb-2"><span class="w-7 h-9 flex items-center justify-center text-[12px] font-bold text-slate-400">${i+1}</span>
    <input class="qq flex-1 border border-slate-200 rounded-xl px-3 py-2 text-[13px] font-semibold" value="${esc(q.q)}" placeholder="Nội dung câu hỏi">
    <button class="qdel w-9 rounded-xl bg-red-50 text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
  <div class="grid sm:grid-cols-2 gap-2">${q.o.map((o,j)=>`<div class="flex items-center gap-2"><span class="w-6 h-6 rounded-md bg-slate-100 text-[11px] font-bold flex items-center justify-center">${"ABCD"[j]}</span>
    <input class="qo flex-1 border border-slate-200 rounded-xl px-3 py-2 text-[13px]" value="${esc(o)}" placeholder="Đáp án ${"ABCD"[j]}"></div>`).join("")}</div>
  <div class="mt-2 flex items-center gap-2"><span class="text-[12px] font-semibold text-slate-600">Đáp án đúng:</span>
    <select class="qa border border-slate-200 rounded-xl px-3 py-1.5 text-[13px]">${[0,1,2,3].map(j=>`<option value="${j}" ${q.a===j?"selected":""}>${"ABCD"[j]}</option>`).join("")}</select></div></div>`}

/* ===== SETTINGS / BACKUP CODE ===== */
settingsBtn.onclick=()=>{
  const code=btoa(unescape(encodeURIComponent(JSON.stringify({o:overrides,r:resources,g:globalRes,p:progress}))));
  openModal("Cài đặt & sao lưu","Sao chép mã để lưu tiến trình hoặc chuyển sang máy khác",`
    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-1">Mã sao lưu của bạn</p>
        <p class="text-[12px] text-slate-500 mb-3">Gồm tiến độ học, điểm quiz, nội dung đã sửa và link tài liệu. Lưu mã này vào Zalo/Notes để dùng lại.</p>
        <textarea id="bkCode" rows="5" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono text-[11px] break-all">${esc(code)}</textarea>
        <div class="flex flex-wrap gap-2 mt-3">
          <button id="copyCode" class="bg-brand-600 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5"><i class="fa-regular fa-copy mr-1.5"></i>Sao chép mã</button>
          <button id="dlCode" class="bg-slate-900 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5"><i class="fa-solid fa-download mr-1.5"></i>Tải file .txt</button>
        </div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-1">Khôi phục từ mã</p>
        <p class="text-[12px] text-slate-500 mb-3">Dán mã đã lưu vào ô dưới rồi bấm Khôi phục. Dữ liệu hiện tại sẽ bị ghi đè.</p>
        <textarea id="rsCode" rows="5" placeholder="Dán mã sao lưu vào đây..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono text-[11px]"></textarea>
        <button id="restoreBtn" class="mt-3 bg-emerald-600 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5"><i class="fa-solid fa-rotate-left mr-1.5"></i>Khôi phục</button>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-1">Xoá dữ liệu</p>
        <p class="text-[12px] text-slate-500 mb-3">Nhớ sao chép mã trước khi xoá.</p>
        <div class="flex flex-wrap gap-2">
          <button id="clearProg" class="bg-amber-50 text-amber-700 border border-amber-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Xoá tiến độ học</button>
          <button id="clearAll" class="bg-red-50 text-red-600 border border-red-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Xoá toàn bộ dữ liệu</button>
        </div>
      </div>
    </div>`);
  copyCode.onclick=async()=>{try{await navigator.clipboard.writeText(bkCode.value)}catch(e){bkCode.select();document.execCommand("copy")}toast("Đã sao chép mã")};
  dlCode.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bkCode.value],{type:"text/plain"}));a.download="ma-sao-luu-thptqg.txt";a.click()};
  restoreBtn.onclick=()=>{
    try{const d=JSON.parse(decodeURIComponent(escape(atob(rsCode.value.trim()))));
      overrides=d.o||{};resources=d.r||{};globalRes=d.g||globalRes;progress=d.p||{};
      save("overrides",overrides);save("resources",resources);save("globalres",globalRes);save("progress",progress);
      toast("Khôi phục thành công");setTimeout(()=>location.reload(),700);
    }catch(e){toast("Mã không hợp lệ",true)}};
  clearProg.onclick=()=>{if(confirm("Xoá toàn bộ tiến độ học?")){progress={};save("progress",progress);location.reload()}};
  clearAll.onclick=()=>{if(confirm("Xoá toàn bộ dữ liệu (tiến độ, nội dung đã sửa, link)?")){["overrides","resources","globalres","progress"].forEach(k=>localStorage.removeItem(LS(k)));location.reload()}};
};
function openModal(title,sub,html){modalTitle.textContent=title;modalSub.textContent=sub||"";modalBody.innerHTML=html;modal.classList.remove("hidden")}
closeModal.onclick=()=>modal.classList.add("hidden");
function toast(msg,err){const t=document.createElement("div");
  t.className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[13px] font-semibold shadow-lg "+(err?"bg-red-600 text-white":"bg-slate-900 text-white");
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

if(user&&ACCOUNTS[user.username]){loginModal.classList.add("hidden");initSession()}
</script>
