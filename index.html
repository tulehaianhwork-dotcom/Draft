: "to produce less rubbish", "v": ""}], "quiz": [{"q": "Your ______ at the meeting is highly appreciated.", "o": ["attend", "attendance", "attentive", "attentively"], "a": 1}, {"q": "We need to raise public ______ of the issue.", "o": ["aware", "awareness", "awarely", "awaring"], "a": 1}, {"q": "There is a clear ______ between the two proposals.", "o": ["differ", "different", "difference", "differently"], "a": 2}, {"q": "All ______ must wear identification badges.", "o": ["employ", "employment", "employees", "employable"], "a": 2}, {"q": "Effective ______ is the key to the project's success.", "o": ["lead", "leader", "leadership", "leading"], "a": 2}, {"q": "The ______ of this equipment requires a specialist.", "o": ["install", "installed", "installation", "installing"], "a": 2}, {"q": "According to the passage, the improvement came from ______.", "o": ["one major decision", "a number of small changes", "expensive new equipment", "a national programme"], "a": 1}, {"q": "What did the council do first?", "o": ["Installed new bins", "Started a bicycle scheme", "Raised public awareness", "Measured pollution levels"], "a": 2}, {"q": "The word **\"It\"** in paragraph 1 refers to ______.", "o": ["the district", "the improvement", "the decision", "the council"], "a": 1}, {"q": "According to the scientist, the success of the programme comes from ______.", "o": ["its simplicity", "its cost", "its equipment", "its size"], "a": 0}]}, {"id": 18, "month": "11", "title": "Word Form Ii: Tính Từ Và Trạng Từ", "theme": "Broadband and rural life", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Tính từ** bổ nghĩa cho **danh từ** — trả lời \"cái gì như thế nào?\"\n> **Trạng từ** bổ nghĩa cho **động từ, tính từ, cả câu** — trả lời \"làm như thế nào?\""}, {"h": "② CÁCH SỬ DỤNG", "md": "| Cần **TÍNH TỪ** khi | Cần **TRẠNG TỪ** khi |\n|---|---|\n| Đứng **trước danh từ**: *an **effective** way* | Bổ nghĩa **động từ thường**: *improved **significantly*** |\n| Sau `to be`: *is **essential*** | Bổ nghĩa **tính từ khác**: ***extremely** effective* |\n| Sau linking verb `seem, become, remain, look, feel`: *remained **calm*** | **Đầu câu + dấu phẩy**: ***Consequently**, …* |\n| Sau `very / quite / extremely / highly`: *highly **reliable*** | Bổ nghĩa cả câu: *The team worked **efficiently**.* |"}, {"h": "③ CẤU TRÚC — BẢNG HẬU TỐ", "md": "| Loại | Hậu tố | Ví dụ |\n|---|---|---|\n| **Tính từ** | -ful / -less | helpful · careless · effortless |\n| | -ive | effective · productive · impressive |\n| | -able / -ible | reliable · comparable · responsible |\n| | -al / -ial | environmental · essential · financial |\n| | -ous | dangerous · previous · numerous |\n| | -ing / -ed | interest**ing** (gây ra) / interest**ed** (cảm thấy) |\n| **Trạng từ** | -ly | quickly · significantly · effectively |\n\n⚠️ **Đuôi `-ly` nhưng là TÍNH TỪ:** `friendly · lovely · likely · costly · timely · elderly`\n\n⚠️ **Cặp `-ing / -ed`:**\n- **-ing** = vật/việc **gây ra** cảm giác: *The lecture was **boring**.*\n- **-ed** = người **cảm thấy**: *The audience was **bored**.*"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 BROADBAND COMES TO MARSH COUNTY\n\n> For years, the isolated villages of Marsh County struggled with unreliable copper cables that could not handle increasing demand.\n>\n> In 2023, the council committed to laying fibre optic cables to every household. To minimise disruption, the cables were placed along existing verges, while community halls served as temporary installation hubs.\n>\n> Initial results were impressive. Villagers reported speeds comparable to city standards, with significantly improved reliability. Consequently, two neighbouring counties have requested guidance on adopting the model. Residents are highly satisfied, although some elderly people say the new system is unnecessarily complicated.\n\n*(96 từ)*\n\n\n\n**1.** According to the passage, what was the problem before 2023?\n\n**2.** Why were the cables placed along existing verges?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be comparable to", "p": "adj phr", "e": "to be similar in size or quality to something", "v": ""}, {"t": "minimise disruption", "p": "v phr", "e": "to reduce the trouble caused by a change", "v": ""}, {"t": "be satisfied with", "p": "adj phr", "e": "to be pleased with something", "v": ""}, {"t": "handle demand", "p": "v phr", "e": "to deal successfully with what people need", "v": ""}, {"t": "adopt a model", "p": "v phr", "e": "to start using a particular system", "v": ""}], "quiz": [{"q": "The results were extremely ______.", "o": ["impress", "impression", "impressive", "impressively"], "a": 2}, {"q": "Speeds have improved ______ over the past year.", "o": ["significant", "significance", "significantly", "signify"], "a": 2}, {"q": "This is an ______ issue for the whole community.", "o": ["essence", "essential", "essentially", "essentials"], "a": 1}, {"q": "______, neighbouring counties requested guidance.", "o": ["Consequent", "Consequence", "Consequently", "Consequences"], "a": 2}, {"q": "She remained ______ throughout the negotiation.", "o": ["calm", "calmly", "calmness", "calming"], "a": 0}, {"q": "The audience found the lecture ______.", "o": ["bore", "boring", "bored", "boredom"], "a": 1}, {"q": "According to the passage, what was the problem before 2023?", "o": ["There were no community halls.", "The copper cables were unreliable.", "The villages had no electricity.", "Fibre optic cables were too fast."], "a": 1}, {"q": "Why were the cables placed along existing verges?", "o": ["To reduce the cost", "To minimise disruption", "To reach the community halls", "To improve the speed"], "a": 1}, {"q": "The word **\"Consequently\"** in paragraph 3 is closest in meaning to ______.", "o": ["However", "As a result", "Similarly", "Although"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Everyone is completely satisfied.", "Some elderly residents find the system complicated.", "No other county is interested.", "Speeds are slower than in cities."], "a": 1}]}, {"id": 19, "month": "11", "title": "Kỹ Thuật \"Nhìn Chỗ Trống Đoán Từ Loại\"", "theme": "The world of work", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng hợp.** Kỹ thuật này cho phép làm đúng câu điền từ **ngay cả khi không biết nghĩa của từ**."}, {"h": "① NGỮ PHÁP", "md": "Tổng hợp buổi 17 và 18 thành **một quy trình 3 bước** áp dụng máy móc."}, {"h": "② CÁCH SỬ DỤNG — QUY TRÌNH 3 BƯỚC", "md": "**Bước 1 — Che 4 phương án lại.** Chỉ nhìn chỗ trống và 3 từ trước, 3 từ sau.\n\n**Bước 2 — Xác định từ loại cần điền:**\n\n| Từ đứng ngay TRƯỚC chỗ trống | Cần điền | Ví dụ |\n|---|---|---|\n| a / an / the / my / your / students' | **Danh từ** | *the **installation*** |\n| Tính từ (essential, primary, public) | **Danh từ** | *public **awareness*** |\n| Giới từ (of, in, for, with, about) | **Danh từ / V-ing** | *aware **of pollution*** |\n| to be / seem / remain / become | **Tính từ** | *is **essential*** |\n| very / quite / extremely / highly | **Tính từ** | *highly **reliable*** |\n| Động từ thường | **Trạng từ** | *improved **significantly*** |\n| Đầu câu + có dấu phẩy sau | **Trạng từ liên kết** | ***Consequently**, …* |\n| Modal (will, must, can, should) / to | **Động từ nguyên thể** | *should **consider*** |\n\n**Bước 3 — Mở phương án, loại theo đuôi từ.** Thường loại được 3/4 ngay."}, {"h": "③ SƠ ĐỒ RA QUYẾT ĐỊNH", "md": "```\nChỗ trống đứng ở đâu?\n├─ Sau mạo từ / sở hữu / tính từ  → DANH TỪ   (-tion, -ment, -ness, -ity, -ance)\n├─ Trước danh từ                  → TÍNH TỪ   (-ful, -ive, -able, -al, -ous)\n├─ Sau to be / linking verb       → TÍNH TỪ\n├─ Sau động từ thường             → TRẠNG TỪ  (-ly)\n├─ Đầu câu + dấu phẩy             → TRẠNG TỪ LIÊN KẾT\n└─ Sau modal / to                 → ĐỘNG TỪ NGUYÊN THỂ\n```\n\n⚠️ Kỹ thuật này giải quyết khoảng **85%** câu hỏi từ loại. Phần còn lại cần biết collocation — học ở tháng 12."}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 CHOOSING A FIRST JOB\n\n> Career advisers say that the first job is rarely the most important decision a graduate makes. What matters more is the development of skills that transfer between industries.\n>\n> Employers frequently report that technical knowledge can be taught quickly, while habits such as reliability and clear communication take far longer to build. A graduate who works efficiently in a small company may therefore gain more than one who joins a famous firm and does routine tasks.\n>\n> Consequently, advisers recommend asking one simple question at an interview: what will I actually do in the first six months? The honesty of the answer is often revealing.\n\n*(104 từ)*\n\n\n\n**1.** According to career advisers, the first job ______.\n\n**2.** What do employers say takes longer to build?\n\n\n**4.** What do advisers recommend asking at an interview?"}], "vocab": [{"t": "apply for", "p": "phr v", "e": "to ask formally for a job or a place", "v": ""}, {"t": "transferable skills", "p": "n phr", "e": "abilities that are useful in many different jobs", "v": ""}, {"t": "gain experience", "p": "v phr", "e": "to get knowledge from doing something", "v": ""}, {"t": "routine tasks", "p": "n phr", "e": "ordinary work that is done regularly", "v": ""}, {"t": "stand out", "p": "phr v", "e": "to be much better or more noticeable than others", "v": ""}], "quiz": [{"q": "The ______ of the campaign exceeded expectations.", "o": ["succeed", "success", "successful", "successfully"], "a": 1}, {"q": "Waste must be sorted ______ before collection.", "o": ["proper", "properly", "property", "proprietor"], "a": 1}, {"q": "This is an ______ effective way to reduce costs.", "o": ["extreme", "extremely", "extremity", "extremist"], "a": 1}, {"q": "Their ______ to the scheme was immediate.", "o": ["respond", "response", "responsive", "responsively"], "a": 1}, {"q": "The council should ______ the proposal carefully.", "o": ["consideration", "considerate", "consider", "considerably"], "a": 2}, {"q": "A ______ internet connection is required.", "o": ["stable", "stability", "stably", "stabilise"], "a": 0}, {"q": "According to career advisers, the first job ______.", "o": ["is the most important decision", "is rarely the most important decision", "should always be at a famous firm", "determines a graduate's whole career"], "a": 1}, {"q": "What do employers say takes longer to build?", "o": ["Technical knowledge", "Habits such as reliability and communication", "Company reputation", "Routine task skills"], "a": 1}, {"q": "The word **\"one\"** in paragraph 2 refers to ______.", "o": ["a company", "a task", "a graduate", "an employer"], "a": 2}, {"q": "What do advisers recommend asking at an interview?", "o": ["What the salary will be", "How famous the company is", "What the work will actually involve", "How many people work there"], "a": 2}]}, {"id": 20, "month": "11", "title": "Câu Điều Kiện Loại 0, 1, 2", "theme": "Global warming", "blocks": [{"h": "① NGỮ PHÁP", "md": "Câu điều kiện nói về quan hệ **nếu — thì**. Ba loại đầu khác nhau ở **mức độ có thật**:\n\n> **Loại 0** = luôn đúng (chân lý, quy luật).\n> **Loại 1** = có thật, có thể xảy ra ở tương lai.\n> **Loại 2** = không có thật ở hiện tại (giả định trái sự thật)."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Loại | Dùng khi | Dấu hiệu |\n|---|---|---|\n| **0** | Quy luật, hướng dẫn | Thay `if` bằng `when` vẫn đúng nghĩa |\n| **1** | Điều kiện thực tế trong tờ rơi, thông báo | **`will`** ở vế chính |\n| **2** | Giả định trái với hiện tại | **`would`** ở vế chính; `were` với mọi chủ ngữ |\n\n🔴 **Cách nhận biết nhanh nhất:** nhìn **vế chính** trước.\n`will` → loại 1 · `would` → loại 2 · cả hai vế hiện tại đơn → loại 0"}, {"h": "③ CẤU TRÚC", "md": "| Loại | Công thức | Ví dụ |\n|---|---|---|\n| **0** | If + S + V(s/es), S + V(s/es) | *If you **heat** ice, it **melts**.* |\n| **1** | If + S + V(s/es), S + **will** + V | *If everyone **works** together, we **will make** a difference.* |\n| **1** biến thể | If + S + V(s/es), S + can/should/must + V | *If you **need** help, you **can call** us.* |\n| **2** | If + S + V2/were, S + **would** + V | *If the council **had** more funds, it **would extend** the scheme.* |\n| **2** với be | If + S + **were** (mọi ngôi) | *If I **were** you, I **would apply**.* |\n\n📌 Vế `if` đứng sau thì **bỏ dấu phẩy**: *We will make a difference **if** everyone works together.*"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 IF THE ICE MELTS\n\n> Scientists agree on one simple rule: if the average temperature rises, polar ice melts. That is not a prediction but a physical fact.\n>\n> What happens next is less certain. If the ice sheets of Greenland disappear completely, sea levels will rise by around seven metres. Cities such as Ho Chi Minh City and Bangkok will lose large areas of land.\n>\n> Many researchers argue that if governments acted faster, the worst effects could still be avoided. Others are less hopeful. If the current rate of emissions continues, they say, the world will pass a dangerous threshold within thirty years.\n\n*(103 từ)*\n\n\n\n**1.** According to the passage, if the average temperature rises ______.\n\n**2.** What would happen if the Greenland ice sheets disappeared?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "cut emissions", "p": "v phr", "e": "to reduce the gases released into the air", "v": ""}, {"t": "sea level", "p": "n phr", "e": "the average height of the sea", "v": ""}, {"t": "take action", "p": "v phr", "e": "to do something to deal with a problem", "v": ""}, {"t": "be at risk", "p": "adj phr", "e": "to be in danger of harm or loss", "v": ""}, {"t": "contribute to", "p": "phr v", "e": "to be one of the causes of something", "v": ""}], "quiz": [{"q": "If the school ______ enough volunteers, the project will start next month.", "o": ["find", "finds", "found", "will find"], "a": 1}, {"q": "If everyone ______ together, we will make a difference.", "o": ["have worked", "worked", "work", "works"], "a": 3}, {"q": "If I ______ you, I would apply for that grant.", "o": ["am", "was", "were", "will be"], "a": 2}, {"q": "If you ______ metal, it expands.", "o": ["heat", "heats", "heated", "will heat"], "a": 0}, {"q": "If the council had more funds, it ______ the scheme.", "o": ["will extend", "would extend", "extends", "extended"], "a": 1}, {"q": "If the deadline ______, applications will not be accepted.", "o": ["pass", "passes", "passed", "will pass"], "a": 1}, {"q": "According to the passage, if the average temperature rises ______.", "o": ["polar ice melts", "sea levels fall", "emissions decrease", "cities gain land"], "a": 0}, {"q": "What would happen if the Greenland ice sheets disappeared?", "o": ["Temperatures would fall.", "Sea levels would rise by about seven metres.", "Emissions would stop.", "Bangkok would gain land."], "a": 1}, {"q": "The word **\"Others\"** in paragraph 3 refers to ______.", "o": ["governments", "cities", "researchers", "effects"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All scientists are hopeful.", "Some researchers believe faster action could avoid the worst effects.", "Sea levels have already risen seven metres.", "The rate of emissions has stopped."], "a": 1}]}, {"id": 21, "month": "11", "title": "Câu Điều Kiện Loại 3, Hỗn Hợp Và Unless", "theme": "Project failures", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Loại 3** = giả định trái với **quá khứ** — việc đã xảy ra rồi, không sửa được.\n> **Hỗn hợp** = điều kiện ở **quá khứ**, kết quả ở **hiện tại**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Loại | Điều kiện | Kết quả | Ví dụ |\n|---|---|---|---|\n| **3** | Quá khứ | Quá khứ | *If they **had checked** the wiring, the fire **wouldn't have started**.* |\n| **Hỗn hợp** | Quá khứ | Hiện tại | *If they **had checked** it last year, the system **would be** safe now.* |\n\n### 📌 `unless` = `if … not`\n\nSau `unless` dùng câu **khẳng định** — **không** thêm `not` nữa.\n\n*You **won't** pass **unless** you **work** hard.* = *…**if** you **don't** work hard.*\n\n❌ *Unless you don't register…* → ✅ *Unless you **register**…*\n\n**Cụm tương đương `if`:** `as long as` · `provided that` · `on condition that` · `in case`"}, {"h": "③ CẤU TRÚC", "md": "| Loại | Công thức | Ví dụ |\n|---|---|---|\n| **3** | If + S + **had** + V3, S + **would have** + V3 | *If we **had applied** earlier, we **would have got** the grant.* |\n| **3** bị động | If + S + had been + V3, … | *If the form **had been signed**, it **would have been accepted**.* |\n| **Hỗn hợp** | If + S + had + V3, S + **would** + V | *If she **had taken** the job, she **would be** in Da Nang now.* |\n| **Unless** | Unless + S + V, S + will + V | *Unless you **register**, you **will lose** your place.* |\n| **As long as** | As long as + S + V(s/es), S + will + V | *As long as it **rains**, the drill **will be** postponed.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 WHY THE BRIDGE PROJECT FAILED\n\n> The riverside bridge was planned in 2016 and abandoned three years later. Engineers now agree that if the soil survey had been carried out properly, the problems would have been discovered at the start.\n>\n> Instead, work began without a full report. If the council had delayed the project by six months, it would have saved almost forty billion dong. Unless a proper survey is completed, no new design can be approved.\n>\n> The site is still empty today. If the original plan had gone ahead, residents would now have a direct route to the city centre, and the daily journey would be twenty minutes shorter.\n\n*(106 từ)*\n\n\n\n**1.** According to the passage, what was the main mistake?\n\n**2.** What would have happened if the council had delayed the project?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "carry out a survey", "p": "v phr", "e": "to do a study to collect information", "v": ""}, {"t": "go ahead", "p": "phr v", "e": "to begin or continue as planned", "v": ""}, {"t": "be abandoned", "p": "v phr", "e": "to be stopped before being finished", "v": ""}, {"t": "stem from", "p": "phr v", "e": "to be caused by something", "v": ""}, {"t": "result in", "p": "phr v", "e": "to cause a particular situation", "v": ""}], "quiz": [{"q": "If the engineers ______ the line, the fault ______.", "o": ["tested / wouldn't appear", "had tested / wouldn't have appeared", "test / won't appear", "had tested / wouldn't appear"], "a": 1}, {"q": "Unless you ______ the instructions, the machine will stop.", "o": ["don't follow", "follow", "didn't follow", "won't follow"], "a": 1}, {"q": "If she ______ the offer last year, she ______ in Singapore now.", "o": ["accepted / would work", "had accepted / would be working", "accepts / will work", "had accepted / would have worked"], "a": 1}, {"q": "We ______ a refund if we ______ the receipt.", "o": ["would get / hadn't lost", "would have got / hadn't lost", "will get / don't lose", "got / didn't lose"], "a": 1}, {"q": "You may keep the equipment ______ you return it by June.", "o": ["unless", "provided that", "although", "in spite of"], "a": 1}, {"q": "If the form ______ on time, it ______.", "o": ["was signed / would be accepted", "had been signed / would have been accepted", "signed / would accept", "is signed / will accept"], "a": 1}, {"q": "According to the passage, what was the main mistake?", "o": ["The bridge was built too quickly.", "The soil survey was not carried out properly.", "The council spent too little money.", "Residents opposed the project."], "a": 1}, {"q": "What would have happened if the council had delayed the project?", "o": ["It would have saved a large sum of money.", "The bridge would have been finished.", "The survey would have been cancelled.", "Residents would have moved away."], "a": 0}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the project", "the council", "the report", "the survey"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The bridge was completed in 2019.", "The site remains empty.", "A new design has been approved.", "The journey is now twenty minutes shorter."], "a": 1}]}, {"id": 22, "month": "11", "title": "Mệnh Đề Quan Hệ", "theme": "ASEAN and Viet Nam", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Mệnh đề quan hệ** bổ nghĩa cho danh từ đứng trước, giúp gộp hai câu thành một.\n\nĐây là cấu trúc khiến câu trong bài đọc dài ra — nắm được thì đọc nhanh hơn hẳn."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Đại từ | Thay cho | Ví dụ |\n|---|---|---|\n| **who** | người | *the staff **who** attended the drill* |\n| **which** | vật | *the equipment **which** was inspected* |\n| **that** | cả người và vật *(không dùng sau dấu phẩy)* | *the report **that** we submitted* |\n| **whose** | sở hữu | *the company **whose** policy changed* |\n| **where** | nơi chốn | *the site **where** the cables were laid* |\n| **when** | thời gian | *the year **when** the scheme began* |\n\n### Mệnh đề xác định và không xác định\n\n| Loại | Dấu phẩy | Ý nghĩa | Ví dụ |\n|---|---|---|---|\n| **Xác định** | không | Bỏ đi thì câu mất nghĩa | *Students **who register early** get a discount.* |\n| **Không xác định** | có | Chỉ bổ sung thông tin | *Marsh County, **which lies in the north**, has poor broadband.* |\n\n⚠️ Sau dấu phẩy **cấm dùng `that`**.\n\n### 📌 `which` thay cho CẢ MỆNH ĐỀ\n\n*Speeds improved markedly, **which** encouraged neighbouring counties to follow.*\n→ `which` ở đây không trỏ về danh từ nào, mà trỏ về **toàn bộ việc** \"tốc độ cải thiện\"."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Chủ ngữ | N + who/which/that + **V** | *the council **which approves** the plan* |\n| Tân ngữ | N + who(m)/which/that + **S + V** | *the plan **which the council approved*** |\n| Sở hữu | N + **whose** + N | *the firm **whose bid** won* |\n| Nơi chốn | N + **where** + S + V | *the hall **where the drill took place*** |\n| Giới từ + which | N + giới từ + **which** + S + V | *the issue **about which** they argued* |\n\n📌 Sau `everything / anything / all / something` → bắt buộc dùng **`that`**."}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 ASEAN AT FIFTY-FIVE\n\n> ASEAN, which was founded in 1967, now includes ten member states whose combined population exceeds 670 million.\n>\n> The organisation, which meets several times a year, has no single parliament. Decisions are made by consensus, a method that requires every member to agree. Critics say this is the reason why progress is often slow.\n>\n> Viet Nam, which joined in 1995, has hosted the annual summit three times. The 2020 summit, which took place online because of the pandemic, was the first in the organisation's history to be held entirely by video, which many members later described as a success.\n\n*(101 từ)*\n\n\n\n**1.** According to the passage, ASEAN ______.\n\n**2.** Why do critics say progress is often slow?\n\n**3.** The last **\"which\"** in the passage refers to ______.\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "consist of", "p": "phr v", "e": "to be formed from particular parts", "v": ""}, {"t": "be made up of", "p": "v phr", "e": "to be formed from several parts", "v": ""}, {"t": "play a role in", "p": "v phr", "e": "to have an effect on a situation", "v": ""}, {"t": "reach an agreement", "p": "v phr", "e": "to decide something together", "v": ""}, {"t": "member state", "p": "n phr", "e": "a country that belongs to an organisation", "v": ""}], "quiz": [{"q": "The volunteers ______ signed up early will start in May.", "o": ["which", "who", "whose", "where"], "a": 1}, {"q": "The report, ______ was published last week, contains new data.", "o": ["that", "which", "who", "where"], "a": 1}, {"q": "The firm ______ bid was lowest won the contract.", "o": ["which", "who", "whose", "when"], "a": 2}, {"q": "This is the district ______ the cables were laid.", "o": ["which", "that", "where", "when"], "a": 2}, {"q": "Everything ______ you need is in the handbook.", "o": ["who", "that", "whose", "where"], "a": 1}, {"q": "Speeds improved markedly, ______ encouraged other counties to follow.", "o": ["that", "which", "what", "who"], "a": 1}, {"q": "According to the passage, ASEAN ______.", "o": ["was founded in 1995", "has ten member states", "has a single parliament", "meets once every five years"], "a": 1}, {"q": "Why do critics say progress is often slow?", "o": ["Because there are too many members", "Because decisions require everyone to agree", "Because meetings are held online", "Because Viet Nam joined late"], "a": 1}, {"q": "The last **\"which\"** in the passage refers to ______.", "o": ["the pandemic", "the 2020 summit being held entirely by video", "the organisation's history", "the annual summit"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Viet Nam has hosted the summit three times.", "The 2020 summit was cancelled.", "ASEAN has more than twenty members.", "Decisions are made by majority vote."], "a": 0}]}, {"id": 23, "month": "11", "title": "Rút Gọn Mệnh Đề Quan Hệ", "theme": "Life stories", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Rút gọn** = bỏ đại từ quan hệ và động từ `be`, giữ lại phần còn lại.\n\nĐây là lý do câu trong bài đọc trông \"lạ\" — nhận ra được thì đọc nhanh hơn nhiều."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Mệnh đề gốc | Rút gọn thành | Khi nào |\n|---|---|---|\n| who/which + **V-ing** | **V-ing** | Chủ động |\n| who/which + **be + V3** | **V3** | Bị động |\n| who/which + **be + tính từ/giới từ** | bỏ hẳn `be` | Trạng thái |\n| who/which + be + **the first/only… to V** | **to V** | Sau số thứ tự, so sánh nhất |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Đầy đủ | Rút gọn |\n|---|---|---|\n| Chủ động | the staff **who attend** the drill | the staff **attending** the drill |\n| Bị động | the bins **which were installed** last week | the bins **installed** last week |\n| Tính từ | the students **who are responsible** for waste | the students **responsible** for waste |\n| Giới từ | the file **which is on the desk** | the file **on the desk** |\n| To V | he was the first **who arrived** | he was the first **to arrive** |\n\n🔑 **Cách phân biệt V-ing và V3:** hỏi *chủ ngữ tự làm hay bị làm?*\nTự làm → **V-ing** · Bị làm → **V3**"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE TEACHER WHO NEVER RETIRED\n\n> Born in a small village in Quang Nam in 1931, Nguyen Thi Lan was the first person in her family to finish secondary school.\n>\n> She began teaching in 1952 and continued for sixty years. Students taught by her in the 1960s still visit her today. Asked why she never retired, she replied simply that she had nothing else she wanted to do.\n>\n> The classroom built beside her house is still used every Sunday. Children living nearby come for free lessons, and former students returning from the city often teach alongside her. A documentary made about her life won a national prize in 2019.\n\n*(105 từ)*\n\n\n\n**1.** According to the passage, Nguyen Thi Lan ______.\n\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be known for", "p": "adj phr", "e": "to be famous because of something", "v": ""}, {"t": "devote oneself to", "p": "v phr", "e": "to give all your time and effort to something", "v": ""}, {"t": "look up to", "p": "phr v", "e": "to admire and respect someone", "v": ""}, {"t": "carry on", "p": "phr v", "e": "to continue doing something", "v": ""}, {"t": "leave a legacy", "p": "v phr", "e": "to leave something important behind", "v": ""}], "quiz": [{"q": "Skills ______ practised tend to erode.", "o": ["seldom practising", "seldom practised", "to seldom practise", "seldom practise"], "a": 1}, {"q": "Households ______ to reduce waste should attend the workshop.", "o": ["wished", "wishing", "to wish", "wish"], "a": 1}, {"q": "The section of river ______ for hydroelectric generation is now closed.", "o": ["using", "used", "to use", "use"], "a": 1}, {"q": "He was the first researcher ______ this hidden cost.", "o": ["identifying", "identified", "to identify", "identify"], "a": 2}, {"q": "The employees ______ night shifts receive an allowance.", "o": ["worked", "working", "to work", "work"], "a": 1}, {"q": "The report ______ to this email needs review.", "o": ["attaching", "attached", "to attach", "attach"], "a": 1}, {"q": "According to the passage, Nguyen Thi Lan ______.", "o": ["was born in the city", "was the first in her family to finish secondary school", "retired in 1952", "never taught in a classroom"], "a": 1}, {"q": "How long did she teach?", "o": ["Twenty years", "Forty years", "Sixty years", "Eighty years"], "a": 2}, {"q": "The word **\"her\"** in paragraph 3 refers to ______.", "o": ["a student", "Nguyen Thi Lan", "a child", "a documentary"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The classroom is no longer used.", "Former students sometimes teach with her.", "She charges for the Sunday lessons.", "The documentary was made in 1931."], "a": 1}]}, {"id": 24, "month": "11", "title": "To V Và V-Ing", "theme": "The generation gap", "blocks": [{"h": "① NGỮ PHÁP", "md": "Sau một động từ, động từ thứ hai phải chia ở dạng `to V` hoặc `V-ing`. **Không có quy tắc logic — phải thuộc danh sách.** Bù lại, đây là loại câu dễ ăn điểm vì chỉ cần nhớ."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Nhóm | Động từ | Ví dụ |\n|---|---|---|\n| **+ to V** | want · decide · hope · plan · agree · promise · refuse · offer · aim · manage · fail · afford · expect · learn | *We **aim to promote** safe habits.* |\n| **+ V-ing** | enjoy · avoid · finish · suggest · consider · mind · practise · deny · recommend · involve · risk · keep | *The scheme **involves sorting** waste.* |\n| **Sau giới từ** | luôn **V-ing** | *interested **in joining*** · *after **being informed*** |\n| **Đổi nghĩa** | remember · forget · stop · try | xem bảng dưới |\n\n### 📌 Bốn động từ đổi nghĩa\n\n| Động từ | + to V | + V-ing |\n|---|---|---|\n| **remember** | nhớ **sẽ** làm | nhớ **đã** làm |\n| **forget** | quên **chưa** làm | quên **đã** làm |\n| **stop** | dừng lại **để** làm | dừng **việc đang** làm |\n| **try** | cố gắng làm | thử làm xem sao |\n\n⚠️ `used to + V` (từng làm) ≠ `be used to + V-ing` (đã quen với việc gì)"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| S + V + **to V** | *They **decided to extend** the scheme.* |\n| S + V + **V-ing** | *We **recommend using** the north gate.* |\n| S + V + O + **to V** | *The council **asked residents to sort** waste.* |\n| giới từ + **V-ing** | *responsible **for managing** the budget* |\n| **to V** chỉ mục đích | *We hold drills **to improve** safety.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 TALKING ACROSS GENERATIONS\n\n> Many teenagers complain that their parents refuse to listen. Many parents say the same about their children.\n>\n> Psychologists suggest starting with small things. They recommend choosing a time when nobody is tired, and avoiding difficult topics at meals. Parents who manage to ask questions without judging usually learn far more than those who begin by giving advice.\n>\n> Teenagers can help too. Experts advise them to explain rather than defend, and to remember that their parents grew up in a very different world. Families who keep talking, even about ordinary things, tend to find the difficult conversations easier later.\n\n*(100 từ)*\n\n\n\n**1.** According to the passage, psychologists suggest ______.\n\n**2.** What do parents who ask questions without judging usually do?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "get along with", "p": "phr v", "e": "to have a friendly relationship with someone", "v": ""}, {"t": "look down on", "p": "phr v", "e": "to think you are better than someone", "v": ""}, {"t": "take after", "p": "phr v", "e": "to look or behave like an older relative", "v": ""}, {"t": "generation gap", "p": "n phr", "e": "the difference in attitudes between age groups", "v": ""}, {"t": "give advice", "p": "v phr", "e": "to tell someone what you think they should do", "v": ""}], "quiz": [{"q": "The council agreed ______ the scheme.", "o": ["extend", "to extend", "extending", "extended"], "a": 1}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2}, {"q": "She is responsible for ______ the budget.", "o": ["manage", "to manage", "managing", "managed"], "a": 2}, {"q": "He stopped ______ the machine because it was overheating.", "o": ["to use", "using", "use", "used"], "a": 1}, {"q": "Please remember ______ the door when you leave.", "o": ["lock", "to lock", "locking", "locked"], "a": 1}, {"q": "Would you mind ______ outside?", "o": ["wait", "to wait", "waiting", "waited"], "a": 2}, {"q": "According to the passage, psychologists suggest ______.", "o": ["avoiding all difficult topics forever", "starting with small things", "talking only at meals", "giving advice immediately"], "a": 1}, {"q": "What do parents who ask questions without judging usually do?", "o": ["They learn more than those who give advice.", "They stop talking to their children.", "They agree with everything.", "They avoid all conversation."], "a": 0}, {"q": "The word **\"them\"** in paragraph 3 refers to ______.", "o": ["experts", "parents", "teenagers", "families"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only teenagers need to change.", "Families who keep talking find difficult conversations easier.", "Meals are the best time for difficult topics.", "Psychologists advise parents to give more advice."], "a": 1}]}, {"id": 25, "month": "11", "title": "Động Từ Khuyết Thiếu Và Modal Perfect", "theme": "Inventions", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Động từ khuyết thiếu** thể hiện **thái độ người nói**: bắt buộc, khuyên, cho phép, phỏng đoán.\n> **`Modal + have + V3`** dùng để nói về **quá khứ**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Modal | Nghĩa | Ví dụ |\n|---|---|---|\n| **must** | bắt buộc (người nói áp đặt) | *All forms **must** be signed.* |\n| **have to** | bắt buộc (do quy định, hoàn cảnh) | *We **have to** wear helmets here.* |\n| **should / ought to** | nên, khuyên | *Applications **should** be submitted early.* |\n| **can / may** | có thể, được phép | *Items **can** be exchanged in five days.* |\n| **might / may** | phỏng đoán không chắc | *The syllabus **may** change.* |\n| **mustn't** | **cấm** | *The funding **mustn't** be used for equipment.* |\n| **needn't** | **không cần** | *You **needn't** bring a laptop.* |\n\n⚠️ **Phân biệt:** `mustn't` = cấm · `needn't` = không bắt buộc. Hai nghĩa hoàn toàn khác nhau.\n\n### 📌 Modal perfect — nói về quá khứ\n\n| Cấu trúc | Nghĩa |\n|---|---|\n| **must have + V3** | chắc hẳn đã (suy đoán chắc chắn) |\n| **can't have + V3** | chắc hẳn không |\n| **should have + V3** | lẽ ra nên (nhưng đã không làm) |\n| **needn't have + V3** | lẽ ra không cần (nhưng đã làm) |\n| **might/may have + V3** | có lẽ đã |"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| S + modal + V | *You **should register** online.* |\n| S + modal + **be + V3** | *Helmets **must be worn**.* |\n| S + modal + **have + V3** | *They **must have forgotten** the deadline.* |\n| S + modal + **have been + V3** | *The form **should have been signed**.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE INVENTION THAT ALMOST WASN'T\n\n> In 1968, an engineer at an American company created a glue that would not stick properly. His employers decided that it must have been a failure and shelved the project.\n>\n> Five years later, a colleague realised that the weak glue might be useful. He argued that the company should have tested it on paper rather than on industrial materials.\n>\n> The result was the sticky note, which can now be found in almost every office in the world. Looking back, the company admits that it needn't have waited five years: the idea had been sitting in a drawer all along.\n\n*(101 từ)*\n\n\n\n**1.** According to the passage, why was the glue shelved?\n\n**2.** What did the colleague argue?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "come up with", "p": "phr v", "e": "to think of an idea or a plan", "v": ""}, {"t": "by accident", "p": "prep phr", "e": "not planned or intended", "v": ""}, {"t": "put to use", "p": "v phr", "e": "to start using something for a purpose", "v": ""}, {"t": "shelve a project", "p": "v phr", "e": "to stop working on a plan for a time", "v": ""}, {"t": "turn out", "p": "phr v", "e": "to happen in a particular way in the end", "v": ""}], "quiz": [{"q": "You ______ bring your own laptop; we provide them.", "o": ["mustn't", "needn't", "can't", "shouldn't"], "a": 1}, {"q": "Visitors ______ enter the laboratory without a pass.", "o": ["needn't", "mustn't", "don't have to", "may"], "a": 1}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1}, {"q": "We ______ so early; the hall was empty.", "o": ["needn't book", "needn't have booked", "mustn't book", "shouldn't book"], "a": 1}, {"q": "The form ______ by a supervisor. *(lẽ ra nên, nhưng đã không)*", "o": ["should sign", "should be signed", "should have signed", "should have been signed"], "a": 3}, {"q": "He ______ the train — he's usually punctual.", "o": ["must miss", "can't have missed", "needn't miss", "should miss"], "a": 1}, {"q": "According to the passage, why was the glue shelved?", "o": ["It was too expensive.", "The employers thought it was a failure.", "It stuck too strongly.", "Nobody had tested it."], "a": 1}, {"q": "What did the colleague argue?", "o": ["That the glue should be thrown away", "That it should have been tested on paper", "That the project should be sold", "That the glue was dangerous"], "a": 1}, {"q": "The word **\"it\"** in the last sentence refers to ______.", "o": ["the drawer", "the idea", "the company", "the sticky note"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The invention was recognised immediately.", "The company waited five years unnecessarily.", "The glue was very strong.", "The engineer left the company in 1968."], "a": 1}]}, {"id": 26, "month": "11", "title": "Mạo Từ Và Danh Từ Đếm Được/Không Đếm Được", "theme": "Urbanisation", "blocks": [{"h": "① NGỮ PHÁP", "md": "> Mạo từ `a / an / the / Ø` cho biết danh từ **xác định hay không xác định**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Dùng | Khi nào | Ví dụ |\n|---|---|---|\n| **a / an** | Đếm được số ít, nhắc lần đầu | *a golden opportunity* · `an` trước **âm** nguyên âm |\n| **the** | Đã nhắc trước · duy nhất · có cụm xác định · so sánh nhất · thứ tự | *the best candidate* · *the cost **of preserving the river*** |\n| **Ø** | Không đếm được · số nhiều nói chung · mùa, bữa ăn, môn học | *Ø **information*** · *Ø **students** should register* |\n\n🔴 **Quy tắc `a` hay `an` theo ÂM, không theo CHỮ CÁI:**\n- *an hour* (`h` câm, âm đầu /aʊ/) · *an MBA* (/em/) · *an IT assistant* (/aɪ/)\n- *a university* (/juː/ — âm phụ âm) · *a one-year contract* (/wʌn/) · *a European city* (/jʊə/)\n\n### 📌 Danh từ không đếm được hay ra trong đề\n\n`information · advice · equipment · furniture · knowledge · research · progress · evidence · news · work · money · luggage · traffic · weather`\n\n→ Không thêm `-s`, không dùng `a/an`.\n\n| Đếm được | Không đếm được |\n|---|---|\n| many · a few · few · a number of | much · a little · little · a great deal of |\n| *many applicants* | *much evidence* |"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| a/an + N đếm được số ít | *such **an** opportunity* |\n| the + N xác định | ***The** installation of new bins* |\n| Ø + N không đếm được | *We need Ø **information**.* |\n| much / a little + N không đếm | *There isn't **much evidence**.* |\n| many / a few + N số nhiều | *Only **a few applicants** were shortlisted.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A CITY OF TEN MILLION\n\n> By 2030, the population of Ho Chi Minh City is expected to reach ten million. Much of this growth comes from people moving in from the countryside in search of work.\n>\n> The pressure on housing is severe. A recent study found that a large amount of new construction is aimed at high-income buyers, while only a few projects serve ordinary families. The research also showed that traffic has become the biggest daily complaint.\n>\n> The council has announced a plan to build three new districts on the eastern edge of the city. Whether this will be enough remains an open question.\n\n*(103 từ)*\n\n\n\n**1.** According to the passage, most of the city's growth comes from ______.\n\n**2.** What did the recent study find?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "put pressure on", "p": "v phr", "e": "to create difficulty for a system or person", "v": ""}, {"t": "move in / move out", "p": "phr v", "e": "to start / stop living in a place", "v": ""}, {"t": "in search of", "p": "prep phr", "e": "looking for something", "v": ""}, {"t": "a large amount of", "p": "quant phr", "e": "a lot of something uncountable", "v": ""}, {"t": "high-income", "p": "adj", "e": "earning a lot of money", "v": ""}], "quiz": [{"q": "She gave me some useful ______ about the course.", "o": ["advices", "advice", "an advice", "the advices"], "a": 1}, {"q": "He has been working here for ______ hour.", "o": ["a", "an", "the", "Ø"], "a": 1}, {"q": "They are looking for ______ IT assistant.", "o": ["a", "an", "the", "Ø"], "a": 1}, {"q": "There isn't ______ evidence to support that claim.", "o": ["many", "a few", "much", "several"], "a": 2}, {"q": "She is ______ best candidate we have interviewed.", "o": ["a", "an", "the", "Ø"], "a": 2}, {"q": "They offer ______ one-year contract.", "o": ["a", "an", "the", "Ø"], "a": 0}, {"q": "According to the passage, most of the city's growth comes from ______.", "o": ["births in the city", "people moving in from the countryside", "foreign workers", "new districts"], "a": 1}, {"q": "What did the recent study find?", "o": ["Most new construction targets high-income buyers.", "Housing pressure has disappeared.", "Traffic is no longer a problem.", "Ordinary families own most new homes."], "a": 0}, {"q": "The word **\"this\"** in the last sentence refers to ______.", "o": ["the traffic", "the population", "the plan to build three new districts", "the study"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The plan will certainly solve the problem.", "Traffic is the biggest daily complaint.", "Only a few people move in from the countryside.", "The population will fall by 2030."], "a": 1}]}, {"id": 27, "month": "11", "title": "Tổng Ôn Tháng 11", "theme": "Ôn tập toàn tháng", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng ôn.** Không có kiến thức mới."}, {"h": "① BẢNG TỔNG HỢP THÁNG 11", "md": "| Nhóm | Điểm cốt lõi |\n|---|---|\n| **Bị động** | Giữ nguyên thì ở `be`, động từ chính về **V3**. Modal + **be** + V3. |\n| **Bị động đặc biệt** | `It is said that…` · `S is said to V` · `have/get + O + V3` |\n| **Word form** | Đuôi từ quyết định từ loại. Nhìn từ đứng **trước** chỗ trống. |\n| **Điều kiện** | Nhìn **vế chính**: `will` → loại 1 · `would` → loại 2 · `would have` → loại 3 |\n| **Unless** | = `if…not` → sau `unless` dùng **khẳng định** |\n| **Mệnh đề quan hệ** | who (người) · which (vật) · whose (sở hữu) · where (nơi) · that (không sau dấu phẩy) |\n| **Rút gọn** | Chủ động → **V-ing** · Bị động → **V3** · Sau `the first/only` → **to V** |\n| **To V / V-ing** | Thuộc danh sách. Sau giới từ luôn **V-ing**. |\n| **Modal perfect** | `must have` (chắc đã) · `should have` (lẽ ra nên) · `needn't have` (lẽ ra không cần) |\n| **Mạo từ** | `a/an` theo **âm**. Không đếm được → `much`, không `a/an`. |"}, {"h": "② QUY TRÌNH 4 BƯỚC GIẢI CÂU ĐIỀN TỪ", "md": "**Bước 1 — Nhìn 4 phương án để biết câu hỏi hỏi gì:**\n\n| 4 phương án trông như thế nào | Đang hỏi | Kỹ thuật |\n|---|---|---|\n| Cùng gốc, khác đuôi (-tion/-ive/-ly) | **Từ loại** | Buổi 19 |\n| Các dạng của cùng 1 động từ | **Thì & thể** | Buổi 14–15 |\n| Cùng từ loại, nghĩa gần nhau | **Collocation** | Tháng 12 |\n| 4 từ nối khác nhau | **Liên kết ý** | Tháng 12 |\n\n**Bước 2 — Nếu là thì & thể:** xác định chủ động hay bị động trước, rồi mới chọn thì.\n**Bước 3 — Nếu là từ loại:** nhìn từ đứng ngay trước chỗ trống.\n**Bước 4 — Đọc lại cả câu** với đáp án đã chọn."}, {"h": "④ TỪ VỰNG & ĐỌC", "md": "### 📖 THE COST OF A CLEAN CITY\n\n> Ten years ago, the streets of this district were regularly criticised for the amount of rubbish left on them. If the council had acted earlier, the problem would never have reached that scale.\n>\n> A programme launched in 2019 changed the picture. Bins, which are now emptied twice a day, were installed on every corner. Residents wishing to report a full bin can use a free app, and complaints must be answered within twenty-four hours.\n>\n> The improvement has been considerable. Cleanliness scores, measured monthly by an independent team, have risen by forty per cent. Officials admit, however, that the programme needn't have cost so much: much of the early spending went on equipment that was never put to use.\n\n*(120 từ)*\n\n\n\n**1.** According to the passage, what was the problem ten years ago?\n\n\n\n**4.** What do officials admit?\n\n**5.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be criticised for", "p": "v phr", "e": "to be judged badly because of something", "v": ""}, {"t": "reach a scale", "p": "v phr", "e": "to grow to a particular size", "v": ""}, {"t": "put to use", "p": "v phr", "e": "to start using something for a purpose", "v": ""}, {"t": "be measured by", "p": "v phr", "e": "to be judged or counted by someone", "v": ""}, {"t": "go on (money)", "p": "phr v", "e": "to be spent on something", "v": ""}], "quiz": [{"q": "Warning signs ______ at every exit next month.", "o": ["install", "installed", "will be installed", "installing"], "a": 2}, {"q": "Your ______ is essential for success.", "o": ["cooperate", "cooperation", "cooperative", "cooperatively"], "a": 1}, {"q": "If everyone ______ together, we will make a difference.", "o": ["work", "works", "worked", "will work"], "a": 1}, {"q": "The report, ______ was published last week, contains new data.", "o": ["that", "which", "who", "where"], "a": 1}, {"q": "Skills seldom ______ tend to erode.", "o": ["practising", "practised", "to practise", "practise"], "a": 1}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1}, {"q": "There isn't ______ evidence to support that claim.", "o": ["many", "a few", "much", "several"], "a": 2}, {"q": "According to the passage, what was the problem ten years ago?", "o": ["There were too many bins.", "Rubbish was left on the streets.", "The council acted too quickly.", "Residents refused to use the app."], "a": 1}, {"q": "How often are the bins emptied now?", "o": ["Once a week", "Twice a day", "Every twenty-four hours", "Once a month"], "a": 1}]}, {"id": 28, "month": "12", "title": "Collocation I: Động Từ + Danh Từ", "theme": "Community projects", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Collocation** = những từ **đi với nhau theo thói quen**, không theo logic.\n\n`raise awareness` đúng, `lift awareness` sai — dù `raise` và `lift` cùng nghĩa \"nâng\". Không có quy tắc, chỉ có thói quen của người bản ngữ."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong bài điền từ, khi **4 phương án cùng từ loại và nghĩa gần nhau** → chắc chắn đang hỏi collocation, không hỏi ngữ pháp.\n\nCả bốn đều là danh từ, nghĩa gần nhau. Nhưng chỉ `raise awareness` là cụm chuẩn."}, {"h": "③ CẤU TRÚC — BẢNG 40 CỤM HAY RA NHẤT", "md": "| Động từ | Danh từ đi kèm |\n|---|---|\n| **raise** | awareness · concern · funds · standards · a question |\n| **make** | a difference · progress · a decision · an effort · a contribution |\n| **take** | part (in) · action · place · responsibility · measures · advantage (of) |\n| **pay** | attention (to) · a visit · a fine |\n| **do** | research · damage · business · homework · a favour |\n| **meet** | a deadline · requirements · demand · expectations · a target |\n| **reach** | an agreement · a conclusion · a target · a decision |\n| **promote** | habits · awareness · growth · understanding |\n| **reduce** | waste · costs · emissions · risk |\n| **provide** | support · information · training · access |\n| **carry out** | research · a survey · an inspection · repairs |\n| **play** | a role · a part |\n\n📌 **Bốn cụm phải thuộc lòng** — mỗi danh từ đi với một động từ riêng:\n`raise awareness` · `pay attention` · `place emphasis` · `focus on`"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A LIBRARY BUILT BY VOLUNTEERS\n\n> Five years ago, a group of residents in a small commune decided to make a difference. They raised funds by selling home-made food at the weekend market.\n>\n> Within eight months, they had collected enough money to buy 2,000 books. Local carpenters offered to do the work for free, and by the end of the year the shelves were ready.\n>\n> The library now provides free access to books for more than three hundred children. The commune has since taken measures to keep it open every afternoon, and two neighbouring communes have carried out similar projects.\n\n*(103 từ)*\n\n\n\n**1.** How did the residents raise money?\n\n**2.** What did local carpenters do?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "raise funds", "p": "v phr", "e": "to collect money for a particular purpose", "v": ""}, {"t": "make a difference", "p": "v phr", "e": "to have an important effect", "v": ""}, {"t": "take measures", "p": "v phr", "e": "to take official action to deal with something", "v": ""}, {"t": "provide access to", "p": "v phr", "e": "to make something available to people", "v": ""}, {"t": "carry out a project", "p": "v phr", "e": "to do a planned piece of work", "v": ""}], "quiz": [{"q": "The primary goal is to raise staff ______ of common hazards.", "o": ["focus", "awareness", "emphasis", "attention"], "a": 1}, {"q": "Every employee is invited to take ______ in this project.", "o": ["place", "part", "role", "share"], "a": 1}, {"q": "We aim to ______ safe habits through daily practice.", "o": ["produce", "provide", "protect", "promote"], "a": 3}, {"q": "Small individual efforts will ______ a real difference.", "o": ["do", "take", "make", "give"], "a": 2}, {"q": "Researchers will ______ out a survey next month.", "o": ["take", "carry", "make", "bring"], "a": 1}, {"q": "The team managed to ______ the deadline despite delays.", "o": ["reach", "meet", "catch", "take"], "a": 1}, {"q": "How did the residents raise money?", "o": ["By asking the government", "By selling home-made food at the market", "By charging for library cards", "By selling old books"], "a": 1}, {"q": "What did local carpenters do?", "o": ["They donated books.", "They made the shelves for free.", "They designed the building.", "They collected the money."], "a": 1}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the commune", "the library", "the money", "the project"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The project took five months.", "Two other communes have done something similar.", "Children must pay to borrow books.", "The carpenters were paid."], "a": 1}]}, {"id": 29, "month": "12", "title": "Collocation Ii: Cụm Giới Từ", "theme": "Cities of the future", "blocks": [{"h": "① NGỮ PHÁP", "md": "Giới từ đi sau danh từ, tính từ và động từ theo **thói quen cố định**. Sai giới từ là lỗi mất điểm rất phổ biến vì học viên dịch từ tiếng Việt."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong đề, câu hỏi giới từ xuất hiện khi **4 phương án là 4 giới từ khác nhau**, hoặc khi chỗ trống nằm ngay sau một tính từ quen thuộc."}, {"h": "③ CẤU TRÚC", "md": "### A. Tính từ + giới từ\n\n| for | of | to | in | with | at | about |\n|---|---|---|---|---|---|---|\n| responsible · essential · suitable · famous · eligible | aware · capable · typical · full · afraid | similar · due · accustomed · harmful · comparable | interested · involved · successful · confident | familiar · satisfied · associated · consistent | good · surprised · skilled | concerned · worried · enthusiastic |\n\n### B. Danh từ + giới từ\n\n| Cụm | Nghĩa |\n|---|---|\n| **a lack of** | sự thiếu |\n| **an increase / decrease in** | sự tăng/giảm về |\n| **a solution to** | giải pháp cho |\n| **the reason for** | lý do cho |\n| **an impact / effect on** | tác động lên |\n| **access to** | quyền tiếp cận |\n| **demand for** | nhu cầu về |\n| **a rise in** | sự tăng về |\n\n### C. Động từ + giới từ\n\n| Cụm | Nghĩa |\n|---|---|\n| **depend / rely on** | phụ thuộc vào |\n| **apply for** | nộp đơn xin |\n| **result in / lead to** | dẫn đến |\n| **result from** | bắt nguồn từ |\n| **contribute to** | góp phần vào |\n| **consist of** | bao gồm |\n| **benefit from** | hưởng lợi từ |\n| **comply with** | tuân thủ |\n\n⚠️ **Cặp dễ nhầm:** `result in` (dẫn đến) ≠ `result from` (bắt nguồn từ)."}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE FIFTEEN-MINUTE CITY\n\n> Planners in several European cities are interested in an idea known as the \"fifteen-minute city\". The aim is simple: every resident should have access to schools, shops and clinics within fifteen minutes on foot or by bicycle.\n>\n> Supporters argue that this reduces demand for cars and leads to cleaner air. Cities that rely on long commutes, they say, suffer from both congestion and poor health.\n>\n> Critics are less confident. They point out that the plan depends on a high density of housing, which is not typical of many suburbs. The solution to that problem, however, is not yet clear.\n\n*(104 từ)*\n\n\n\n**1.** According to the passage, in a fifteen-minute city residents should ______.\n\n**2.** What do supporters argue?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "have access to", "p": "v phr", "e": "to be able to use or reach something", "v": ""}, {"t": "demand for", "p": "n phr", "e": "the need that people have for something", "v": ""}, {"t": "rely on", "p": "phr v", "e": "to depend on someone or something", "v": ""}, {"t": "suffer from", "p": "phr v", "e": "to be badly affected by something", "v": ""}, {"t": "a solution to", "p": "n phr", "e": "a way of dealing with a problem", "v": ""}], "quiz": [{"q": "A stable internet connection is essential ______ all online sessions.", "o": ["to", "in", "for", "with"], "a": 2}, {"q": "Residents were not aware ______ the new policy.", "o": ["of", "for", "in", "about"], "a": 0}, {"q": "There has been a sharp increase ______ complaints.", "o": ["of", "in", "for", "to"], "a": 1}, {"q": "Poor maintenance resulted ______ a major failure.", "o": ["from", "in", "of", "to"], "a": 1}, {"q": "The failure resulted ______ poor planning.", "o": ["in", "from", "of", "to"], "a": 1}, {"q": "All staff must comply ______ the safety rules.", "o": ["to", "for", "with", "on"], "a": 2}, {"q": "According to the passage, in a fifteen-minute city residents should ______.", "o": ["travel for fifteen minutes by car", "reach basic services within fifteen minutes on foot or by bicycle", "live fifteen minutes from the city centre", "work only fifteen minutes a day"], "a": 1}, {"q": "What do supporters argue?", "o": ["The idea reduces demand for cars.", "The idea increases commuting.", "The idea is too expensive.", "The idea works only in suburbs."], "a": 0}, {"q": "The word **\"They\"** in paragraph 3 refers to ______.", "o": ["supporters", "cities", "critics", "planners"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Critics say the plan depends on high housing density.", "The solution has already been found.", "Suburbs are typically very dense.", "All planners support the idea."], "a": 0}]}, {"id": 30, "month": "12", "title": "Phrasal Verb I", "theme": "Workplace", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Phrasal verb** = động từ + tiểu từ. Nghĩa thường **không đoán được** từ các thành phần.\n\n`get out of` không phải \"lấy ra khỏi\" mà là \"thoát khỏi\"."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong đề điền từ, phrasal verb thường được hỏi bằng cách **cho sẵn tiểu từ và hỏi động từ**:\n*teach students how to ___ out of the building* → cho sẵn `out of`, hỏi động từ → `get`"}, {"h": "③ CẤU TRÚC — 15 PHRASAL VERB NHÓM 1", "md": "| Phrasal verb | Nghĩa | Ví dụ |\n|---|---|---|\n| **get out of** | thoát khỏi | *get out of the building* |\n| **carry out** | thực hiện | *carry out a survey* |\n| **set up** | thiết lập | *set up a committee* |\n| **take on** | đảm nhận | *take on responsibility* |\n| **put off** | hoãn | *put off the meeting* |\n| **call off** | huỷ | *call off the drill* |\n| **turn down** | từ chối | *turn down an offer* |\n| **bring about** | gây ra | *bring about change* |\n| **cut down on** | cắt giảm | *cut down on waste* |\n| **look into** | điều tra | *look into the complaint* |\n| **come up with** | nghĩ ra | *come up with a solution* |\n| **run out of** | hết | *run out of funding* |\n| **give up** | từ bỏ | *give up smoking* |\n| **deal with** | xử lý | *deal with a problem* |\n| **point out** | chỉ ra | *point out an error* |\n\n⚠️ **Cặp dễ nhầm:** `put off` = hoãn lại · `call off` = huỷ hẳn."}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE FOUR-DAY WEEK TRIAL\n\n> Last year, a software company in Da Nang set up a trial of the four-day working week. Managers had put off the idea for years, worried that output would fall.\n>\n> The trial did not run smoothly at first. Two teams ran out of time on major projects, and one client threatened to turn down the next contract. Managers had to deal with several complaints in the first month.\n>\n> By the end of the trial, however, the results were clear. Staff took on the same workload in fewer hours, and nobody gave up the arrangement when offered the choice. The company now plans to carry out a longer study.\n\n*(112 từ)*\n\n\n\n**1.** Why had managers put off the idea?\n\n**2.** What happened in the first month?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "set up", "p": "phr v", "e": "to create or start something", "v": ""}, {"t": "put off", "p": "phr v", "e": "to delay something to a later time", "v": ""}, {"t": "run out of", "p": "phr v", "e": "to have no more of something left", "v": ""}, {"t": "take on", "p": "phr v", "e": "to accept work or responsibility", "v": ""}, {"t": "deal with", "p": "phr v", "e": "to take action to solve a problem", "v": ""}], "quiz": [{"q": "Short drills teach employees how to ______ out of the building calmly.", "o": ["check", "get", "sort", "fill"], "a": 1}, {"q": "The council ______ off the event because of the storm.", "o": ["put", "called", "took", "gave"], "a": 1}, {"q": "We must ______ down on single-use plastics.", "o": ["cut", "put", "take", "turn"], "a": 0}, {"q": "The committee will ______ into the complaint.", "o": ["come", "look", "run", "set"], "a": 1}, {"q": "She ______ on the role of team leader last month.", "o": ["took", "put", "gave", "came"], "a": 0}, {"q": "The team ______ up with three possible solutions.", "o": ["set", "came", "took", "ran"], "a": 1}, {"q": "Why had managers put off the idea?", "o": ["They had no staff.", "They worried that output would fall.", "Clients had refused it.", "It was too expensive."], "a": 1}, {"q": "What happened in the first month?", "o": ["Everything ran smoothly.", "Managers had to deal with several complaints.", "All clients cancelled their contracts.", "Staff gave up the arrangement."], "a": 1}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the workload", "the choice", "the arrangement", "the study"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Staff completed the same workload in fewer hours.", "Output fell sharply.", "The company has ended the scheme.", "Every team ran out of time."], "a": 0}]}, {"id": 31, "month": "12", "title": "Phrasal Verb Ii", "theme": "Energy transition", "blocks": [{"h": "① NGỮ PHÁP", "md": "Nhóm phrasal verb thứ hai, tập trung vào những cụm xuất hiện trong **văn bản học thuật và báo cáo** — hay gặp ở bài đọc hơn là bài điền từ."}, {"h": "② CẤU TRÚC — 15 PHRASAL VERB NHÓM 2", "md": "| Phrasal verb | Nghĩa | Ví dụ |\n|---|---|---|\n| **account for** | chiếm tỉ lệ / giải thích | *accounts for 40% of costs* |\n| **result in** | dẫn đến | *resulted in higher costs* |\n| **stem from** | bắt nguồn từ | *stems from poor planning* |\n| **rule out** | loại trừ | *rule out that option* |\n| **phase out** | loại bỏ dần | *phase out coal plants* |\n| **scale up / back** | mở rộng / thu hẹp | *scale back the scheme* |\n| **build on** | phát triển từ | *build on earlier research* |\n| **draw on** | dựa vào | *draw on local knowledge* |\n| **hand in** | nộp | *hand in the form* |\n| **fill in / out** | điền | *fill in the application* |\n| **sign up (for)** | đăng ký | *sign up for the workshop* |\n| **turn out** | hoá ra | *turned out to be effective* |\n| **make up for** | bù đắp | *make up for the loss* |\n| **put up with** | chịu đựng | *put up with the noise* |\n| **keep up with** | theo kịp | *keep up with demand* |\n\n⚠️ **Ba cặp dễ nhầm:**\n- `keep up with` (theo kịp) ≠ `put up with` (chịu đựng)\n- `result in` (dẫn đến) ≠ `stem from` (bắt nguồn từ)\n- `phase out` (loại bỏ dần) ≠ `rule out` (loại trừ một khả năng)"}, {"h": "④ TỪ VỰNG & ĐỌC", "md": "### 📖 THE SLOW END OF COAL\n\n> Coal still accounts for about a third of the world's electricity. Several governments have promised to phase it out, but progress has not kept up with the targets they set.\n>\n> Part of the problem stems from cost. Building new solar and wind capacity is cheap, but the grids that carry the power are old. Upgrading them would result in very large bills, and few governments want to explain that to voters.\n>\n> Experts do not rule out a faster transition. They argue that if countries drew on existing technology instead of waiting for new inventions, the change could scale up within a decade. Communities near old coal plants, meanwhile, must put up with poor air quality for years to come.\n\n*(124 từ)*\n\n\n\n**1.** According to the passage, coal ______.\n\n**2.** What is part of the problem?\n\n\n**4.** What do experts argue?"}], "vocab": [{"t": "account for", "p": "phr v", "e": "to form a particular amount of something", "v": ""}, {"t": "phase out", "p": "phr v", "e": "to stop using something gradually", "v": ""}, {"t": "stem from", "p": "phr v", "e": "to be caused by something", "v": ""}, {"t": "keep up with", "p": "phr v", "e": "to move or change at the same speed", "v": ""}, {"t": "put up with", "p": "phr v", "e": "to accept something unpleasant without complaining", "v": ""}], "quiz": [{"q": "Residents have to ______ up with the constant hum of turbines.", "o": ["keep", "put", "make", "take"], "a": 1}, {"q": "Transport ______ for nearly a third of national emissions.", "o": ["counts", "accounts", "makes", "stands"], "a": 1}, {"q": "The government plans to ______ out coal by 2040.", "o": ["rule", "phase", "build", "hand"], "a": 1}, {"q": "The delay ______ from a shortage of materials.", "o": ["resulted", "stemmed", "accounted", "ruled"], "a": 1}, {"q": "Supply cannot ______ up with rising demand.", "o": ["put", "keep", "make", "draw"], "a": 1}, {"q": "The trial ______ out to be far more effective than expected.", "o": ["came", "turned", "ran", "filled"], "a": 1}, {"q": "According to the passage, coal ______.", "o": ["has already been phased out", "accounts for about a third of world electricity", "is the cheapest form of power", "produces no air pollution"], "a": 1}, {"q": "What is part of the problem?", "o": ["The cost of upgrading old grids", "A shortage of solar panels", "Opposition from experts", "A lack of new inventions"], "a": 0}, {"q": "The word **\"them\"** in paragraph 2 refers to ______.", "o": ["governments", "bills", "the grids", "voters"], "a": 2}, {"q": "What do experts argue?", "o": ["That a faster transition is impossible", "That countries should wait for new inventions", "That drawing on existing technology could speed up the change", "That coal plants improve air quality"], "a": 2}]}, {"id": 32, "month": "12", "title": "Từ Gần Nghĩa Dễ Nhầm", "theme": "Green living", "blocks": [{"h": "① NGỮ PHÁP", "md": "Khi 4 phương án **cùng từ loại và nghĩa gần nhau**, đề đang kiểm tra **sắc thái nghĩa** hoặc **collocation**, không kiểm tra ngữ pháp."}, {"h": "② CÁCH SỬ DỤNG — QUY TRÌNH", "md": "1. **Loại theo collocation trước** — từ nào không đi được với từ bên cạnh thì loại ngay.\n2. **Loại theo sắc thái** — từ nào quá mạnh hoặc quá nhẹ so với mạch văn.\n3. **Loại theo đối tượng** — từ dùng cho người hay cho vật."}, {"h": "③ CẤU TRÚC — BẢNG NHÓM TỪ DỄ NHẦM", "md": "| Nhóm | Phân biệt |\n|---|---|\n| **focus / awareness / emphasis / attention** | focus **on** · raise **awareness** · place **emphasis on** · pay **attention to** |\n| **produce / provide / protect / promote** | produce = sản xuất **vật** · provide = cung cấp · protect = bảo vệ · promote = thúc đẩy **thói quen, ý tưởng** |\n| **effect / affect** | **effect** = danh từ (tác động) · **affect** = động từ (ảnh hưởng đến) |\n| **rise / raise** | **rise** không có tân ngữ (*prices rise*) · **raise** có tân ngữ (*raise awareness*) |\n| **economic / economical** | **economic** = thuộc kinh tế · **economical** = tiết kiệm |\n| **considerable / considerate** | **considerable** = đáng kể · **considerate** = chu đáo |\n| **efficient / effective** | **efficient** = ít lãng phí · **effective** = đạt kết quả |\n| **amount / number** | **amount of** + không đếm được · **number of** + đếm được |\n| **among / between** | **between** 2 đối tượng · **among** từ 3 trở lên |\n| **fewer / less** | **fewer** + đếm được · **less** + không đếm được |\n| **remain / stay / keep** | remain = vẫn ở trạng thái (trang trọng) · keep + O + adj |\n| **notice / notify** | notice = nhận thấy · notify = thông báo cho ai |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 LIVING WITH LESS\n\n> A considerable number of young Vietnamese families are now choosing smaller homes. The change stems less from money than from a shift in attitudes.\n>\n> Smaller flats are more economical to heat and cool, and they produce fewer emissions. They also affect daily life in ways that are harder to measure: residents report that they buy less, throw away less, and spend more time outside.\n>\n> Not everyone is convinced. Critics point out that a small amount of space can raise stress in families with children. The effect, they argue, depends greatly on design rather than on size alone.\n\n*(101 từ)*\n\n\n\n**1.** According to the passage, why are families choosing smaller homes?\n\n**2.** What do residents of smaller flats report?\n\n\n**4.** What do critics argue?"}], "vocab": [{"t": "a shift in attitudes", "p": "n phr", "e": "a change in the way people think", "v": ""}, {"t": "be economical", "p": "adj phr", "e": "using money or fuel without waste", "v": ""}, {"t": "throw away", "p": "phr v", "e": "to get rid of something you do not want", "v": ""}, {"t": "raise stress", "p": "v phr", "e": "to make a situation more stressful", "v": ""}, {"t": "depend on", "p": "phr v", "e": "to be affected by something else", "v": ""}], "quiz": [{"q": "The new system had a positive ______ on productivity.", "o": ["effect", "affect", "effective", "affected"], "a": 0}, {"q": "Prices have ______ by 12% this year.", "o": ["raised", "risen", "rose", "raising"], "a": 1}, {"q": "This is an ______ way to heat the building.", "o": ["economic", "economical", "economically", "economy"], "a": 1}, {"q": "We aim to ______ sustainable habits through daily activities.", "o": ["produce", "provide", "protect", "promote"], "a": 3}, {"q": "A large ______ of applicants were shortlisted.", "o": ["amount", "number", "many", "few"], "a": 1}, {"q": "There are ______ complaints this quarter than last.", "o": ["less", "fewer", "little", "few"], "a": 1}, {"q": "According to the passage, why are families choosing smaller homes?", "o": ["Mainly because of money", "Mainly because of a shift in attitudes", "Because the government requires it", "Because large homes are unavailable"], "a": 1}, {"q": "What do residents of smaller flats report?", "o": ["They buy more things.", "They spend less time outside.", "They buy less and throw away less.", "They pay more for heating."], "a": 2}, {"q": "The word **\"They\"** at the start of paragraph 2's second sentence refers to ______.", "o": ["families", "smaller flats", "emissions", "residents"], "a": 1}, {"q": "What do critics argue?", "o": ["That small homes always raise stress", "That the effect depends greatly on design", "That size is the only factor", "That smaller homes cost more"], "a": 1}]}, {"id": 33, "month": "12", "title": "Liên Từ Và Từ Nối", "theme": "Wind power debate", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Từ nối** cho biết **quan hệ giữa hai ý**.\n\nĐây là chìa khoá của cả ba dạng: điền từ, sắp xếp câu và điền mệnh đề. Nhận ra từ nối là nhận ra mạch lập luận."}, {"h": "② CÁCH SỬ DỤNG — PHÂN THEO QUAN HỆ Ý", "md": "| Quan hệ | Từ nối | Ví dụ |\n|---|---|---|\n| **Tương phản** | however · nevertheless · in contrast · on the other hand · yet | *Speeds improved. **However**, costs rose.* |\n| **Tương phản trong câu** | although / though / even though + **mệnh đề** · despite / in spite of + **N/V-ing** · but | ***Although** it rained*, the drill went ahead. |\n| **Nguyên nhân** | because / since / as + mệnh đề · because of / due to + N | *cancelled **because of** the storm* |\n| **Kết quả** | therefore · consequently · as a result · thus · hence | *Costs rose. **Consequently**, the scheme was cut.* |\n| **Bổ sung** | moreover · furthermore · in addition · additionally · besides | *The pay is good. **Moreover**, training is provided.* |\n| **Mục đích** | so that · in order to · so as to | *We hold drills **so that** staff know the exits.* |\n\n🔴 **Bẫy số một của mọi đề:** `although` đi với **mệnh đề**, `despite` đi với **danh từ hoặc V-ing**.\n\n| ✅ Đúng | ❌ Sai |\n|---|---|\n| Although **the weather was bad**, … | Despite ~~the weather was bad~~ |\n| Despite **the bad weather**, … | Although ~~the bad weather~~ |\n| Despite **being late**, … | |"}, {"h": "④ TỪ VỰNG & ĐỌC", "md": "### 📖 THE WIND POWER DEBATE\n\n> Wind power has been promoted as a clean and economically viable substitute for fossil fuels. With the infrastructure in place, operational costs are substantially lower than those of coal or gas facilities.\n>\n> Nevertheless, the argument for transitioning is not entirely convincing when the implications for nearby residents are taken into account. Although turbines produce no emissions, inhabitants of coastal regions report that the low hum of the constant rotation impairs their sleep quality.\n>\n> Progress on a country's renewable targets therefore necessitates balancing each proposed initiative against the burdens imposed upon local populations. Despite these difficulties, most governments continue to expand wind capacity.\n\n*(104 từ)*\n\n\n\n**1.** According to the passage, wind turbines ______.\n\n**2.** What do coastal residents report?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "take into account", "p": "v phr", "e": "to consider something when making a decision", "v": ""}, {"t": "balance A against B", "p": "v phr", "e": "to compare two things when deciding", "v": ""}, {"t": "impose a burden on", "p": "v phr", "e": "to create a difficulty for someone", "v": ""}, {"t": "a viable substitute", "p": "n phr", "e": "a replacement that can work well", "v": ""}, {"t": "expand capacity", "p": "v phr", "e": "to increase how much can be produced", "v": ""}], "quiz": [{"q": "______ the low cost, many residents objected to the wind farm.", "o": ["Although", "Despite", "Because", "However"], "a": 1}, {"q": "______ the cost was low, many residents objected.", "o": ["Although", "Despite", "Because of", "However"], "a": 0}, {"q": "The session was cancelled ______ the storm.", "o": ["because", "because of", "although", "therefore"], "a": 1}, {"q": "Speeds improved. ______, more households signed up.", "o": ["Although", "Despite", "Consequently", "Because"], "a": 2}, {"q": "The pay is good. ______, training is provided.", "o": ["However", "Moreover", "Although", "Because"], "a": 1}, {"q": "We label the bins ______ staff can sort waste correctly.", "o": ["so that", "despite", "although", "because of"], "a": 0}, {"q": "According to the passage, wind turbines ______.", "o": ["cost more to operate than coal plants", "cost less to operate once installed", "produce more emissions than gas", "require no infrastructure"], "a": 1}, {"q": "What do coastal residents report?", "o": ["That turbines produce emissions", "That the constant hum affects their sleep", "That they receive compensation", "That they prefer coal facilities"], "a": 1}, {"q": "The word **\"Nevertheless\"** in paragraph 2 is closest in meaning to ______.", "o": ["Therefore", "However", "Moreover", "Because"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Wind power has no drawbacks.", "Most governments continue to expand wind capacity.", "All residents oppose wind farms.", "Operational costs are higher than for gas."], "a": 1}]}, {"id": 34, "month": "12", "title": "So Sánh Hơn, Nhất Và So Sánh Kép", "theme": "Job advertisements", "blocks": [{"h": "① NGỮ PHÁP", "md": "Ba dạng so sánh, và một dạng đặc biệt hay ra trong quảng cáo tuyển dụng."}, {"h": "② CẤU TRÚC", "md": "### A. So sánh bằng và so sánh hơn\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Bằng | as + adj/adv + as | *Speeds are **as fast as** in the city.* |\n| Không bằng | not as/so + adj + as | *It is **not as expensive as** we feared.* |\n| Hơn (từ ngắn) | adj + **-er** + than | *cheap**er than** coal* |\n| Hơn (từ dài) | **more** + adj + than | ***more effective than** the old system* |\n| Nhất (từ ngắn) | the + adj + **-est** | *the cheap**est** option* |\n| Nhất (từ dài) | the **most** + adj | *the **most experienced** member* |\n\n**Bất quy tắc:** good → better → the best · bad → worse → the worst · far → further → the furthest · little → less → the least · many/much → more → the most\n\n### B. So sánh kép — *càng… càng…*\n\n| Công thức | Ví dụ |\n|---|---|\n| **The + so sánh hơn + S + V, the + so sánh hơn + S + V** | ***The better** your understanding of STEM, **the more likely** you are to be selected.* |\n| | ***The sooner** you register, **the better** your chance.* |\n| | ***The more** you practise, **the faster** you improve.* |\n\n### C. Cấu trúc tăng tiến\n\n| Công thức | Ví dụ |\n|---|---|\n| so sánh hơn + **and** + so sánh hơn | *Prices are getting **higher and higher**.* |\n| **more and more** + adj | ***More and more** households are recycling.* |\n\n### D. Bội số\n\n| Công thức | Ví dụ |\n|---|---|\n| **twice / three times + as + adj + as** | *Output is **twice as high as** last year.* |\n| **far / much / a lot + so sánh hơn** | ***far more** than expected* |"}, {"h": "④ TỪ VỰNG & ĐỌC", "md": "### 📖 SUMMER PART-TIME JOBS\n\n> Techworld Magazine is delighted to announce two IT assistant vacancies up for grabs this summer. The better your understanding of STEM, the more likely you are to be selected.\n>\n> Successful applicants will get plenty of hands-on experience, good pay, and access to the local STEM community. Additionally, we offer flexible working hours and remote options for those living far away. Neither position requires previous experience, as new recruits are provided with in-service training.\n>\n> Applications should be submitted by 30 June. Never before has there been such a golden opportunity to kick-start your career in STEM. The sooner you apply, the better your chances.\n\n*(107 từ)*\n\n\n\n**1.** According to the advertisement, applicants with a better understanding of STEM ______.\n\n**2.** What is offered to those living far away?\n\n\n**4.** Which of the following is TRUE according to the advertisement?"}], "vocab": [{"t": "up for grabs", "p": "idiom", "e": "available for anyone who wants it", "v": ""}, {"t": "hands-on experience", "p": "n phr", "e": "practical experience of doing something", "v": ""}, {"t": "in-service training", "p": "n phr", "e": "training given while you are working", "v": ""}, {"t": "a golden opportunity", "p": "n phr", "e": "a very good chance that may not come again", "v": ""}, {"t": "kick-start a career", "p": "v phr", "e": "to make a career begin quickly", "v": ""}], "quiz": [{"q": "The better your understanding of STEM, ______ likely you are to be selected.", "o": ["the more", "most", "more", "the most"], "a": 0}, {"q": "She is ______ experienced member of the team.", "o": ["a more", "the more", "the most", "most"], "a": 2}, {"q": "Wind power is ______ to operate than coal.", "o": ["cheap", "cheaper", "the cheapest", "more cheap"], "a": 1}, {"q": "The sooner you register, ______ your chance of a place.", "o": ["better", "the better", "the best", "best"], "a": 1}, {"q": "Output this year is ______ as high as last year.", "o": ["two times", "twice", "double", "twofold"], "a": 1}, {"q": "______ households are choosing solar panels.", "o": ["More and more", "The more", "Most and most", "More than more"], "a": 0}, {"q": "According to the advertisement, applicants with a better understanding of STEM ______.", "o": ["will be paid more", "are more likely to be selected", "must have previous experience", "will work longer hours"], "a": 1}, {"q": "What is offered to those living far away?", "o": ["Free accommodation", "Flexible hours and remote options", "A higher salary", "Transport costs"], "a": 1}, {"q": "The phrase **\"up for grabs\"** is closest in meaning to ______.", "o": ["difficult to obtain", "available to be taken", "already filled", "under review"], "a": 1}, {"q": "Which of the following is TRUE according to the advertisement?", "o": ["Previous experience is required.", "Training is provided to new recruits.", "Applications close in July.", "Only local candidates may apply."], "a": 1}]}, {"id": 35, "month": "12", "title": "Cấu Trúc Câu: Đơn, Ghép Và Phức", "theme": "Reading long sentences", "blocks": [{"h": "Mở đầu", "md": "> **Buổi kỹ năng.** Mục tiêu: bóc được một câu dài 40–50 từ thành mệnh đề chính và mệnh đề phụ. Đây là kỹ năng quyết định khi vào bài đọc tháng 1."}, {"h": "① NGỮ PHÁP", "md": "| Loại câu | Cấu tạo | Ví dụ |\n|---|---|---|\n| **Câu đơn** | 1 mệnh đề độc lập | *The council approved the plan.* |\n| **Câu ghép** | 2 mệnh đề độc lập nối bằng `and, but, or, so, yet` | *The council approved the plan, **but** residents objected.* |\n| **Câu phức** | 1 mệnh đề chính + 1 mệnh đề phụ | ***Although** residents objected*, the council approved the plan. |\n| **Câu phức hợp** | Ghép + phức | *Although residents objected, the council approved the plan, **and** work began in May.* |"}, {"h": "② CÁCH SỬ DỤNG — BA BƯỚC BÓC CÂU DÀI", "md": "**Bước 1 — Tìm động từ chia.** Mỗi mệnh đề có đúng một động từ chia. Đếm động từ chia = đếm mệnh đề.\n\n**Bước 2 — Tìm từ nối đầu mỗi mệnh đề phụ:**\n`although · because · when · while · if · that · which · who · after · before · since · unless`\n\n**Bước 3 — Xoá tạm mọi mệnh đề phụ.** Phần còn lại chính là **mệnh đề chính** — ý cốt lõi của câu."}, {"h": "③ VÍ DỤ — bóc một câu dài", "md": "> *Although the council, **which** owned no part of the site, had been warned repeatedly, work began without a full survey, **and** the problems **that** followed cost the district almost forty billion dong.*\n\n| Bước | Kết quả |\n|---|---|\n| Động từ chia | owned ·
