ous</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">-ing / -ed</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">interest<strong>ing</strong> (gây ra) / interest<strong>ed</strong> (cảm thấy)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Trạng từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">-ly</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quickly · significantly · effectively</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Đuôi <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">-ly</code> nhưng là TÍNH TỪ:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">friendly · lovely · likely · costly · timely · elderly</code></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Cặp <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">-ing / -ed</code>:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><strong>-ing</strong> = vật/việc <strong>gây ra</strong> cảm giác: <em>The lecture was <strong>boring</strong>.</em></li><li><strong>-ed</strong> = người <strong>cảm thấy</strong>: <em>The audience was <strong>bored</strong>.</em></li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 BROADBAND COMES TO MARSH COUNTY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">For years, the isolated villages of Marsh County struggled with unreliable copper cables that could not handle increasing demand.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">In 2023, the council committed to laying fibre optic cables to every household. To minimise disruption, the cables were placed along existing verges, while community halls served as temporary installation hubs.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Initial results were impressive. Villagers reported speeds comparable to city standards, with significantly improved reliability. Consequently, two neighbouring counties have requested guidance on adopting the model. Residents are highly satisfied, although some elderly people say the new system is unnecessarily complicated.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(96 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, what was the problem before 2023?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> Why were the cables placed along existing verges?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be comparable to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be similar in size or quality to something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>minimise disruption</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to reduce the trouble caused by a change</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be satisfied with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be pleased with something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>handle demand</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to deal successfully with what people need</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>adopt a model</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start using a particular system</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The results were extremely ______.", "o": ["impress", "impression", "impressive", "impressively"], "a": 2}, {"q": "Speeds have improved ______ over the past year.", "o": ["significant", "significance", "significantly", "signify"], "a": 2}, {"q": "This is an ______ issue for the whole community.", "o": ["essence", "essential", "essentially", "essentials"], "a": 1}, {"q": "______, neighbouring counties requested guidance.", "o": ["Consequent", "Consequence", "Consequently", "Consequences"], "a": 2}, {"q": "She remained ______ throughout the negotiation.", "o": ["calm", "calmly", "calmness", "calming"], "a": 0}, {"q": "The audience found the lecture ______.", "o": ["bore", "boring", "bored", "boredom"], "a": 1}, {"q": "According to the passage, what was the problem before 2023?", "o": ["There were no community halls.", "The copper cables were unreliable.", "The villages had no electricity.", "Fibre optic cables were too fast."], "a": 1}, {"q": "Why were the cables placed along existing verges?", "o": ["To reduce the cost", "To minimise disruption", "To reach the community halls", "To improve the speed"], "a": 1}, {"q": "The word **\"Consequently\"** in paragraph 3 is closest in meaning to ______.", "o": ["However", "As a result", "Similarly", "Although"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Everyone is completely satisfied.", "Some elderly residents find the system complicated.", "No other county is interested.", "Speeds are slower than in cities."], "a": 1}]}, {"id": 19, "month": "11", "title": "Kỹ Thuật \"Nhìn Chỗ Trống Đoán Từ Loại\"", "theme": "The world of work", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> The world of work</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi tổng hợp.</strong> Kỹ thuật này cho phép làm đúng câu điền từ <strong>ngay cả khi không biết nghĩa của từ</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Tổng hợp buổi 17 và 18 thành <strong>một quy trình 3 bước</strong> áp dụng máy móc.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG — QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1 — Che 4 phương án lại.</strong> Chỉ nhìn chỗ trống và 3 từ trước, 3 từ sau.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Xác định từ loại cần điền:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ đứng ngay TRƯỚC chỗ trống</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cần điền</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a / an / the / my / your / students&#x27;</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Danh từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the <strong>installation</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tính từ (essential, primary, public)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Danh từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>public <strong>awareness</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giới từ (of, in, for, with, about)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Danh từ / V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>aware <strong>of pollution</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be / seem / remain / become</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tính từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>is <strong>essential</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">very / quite / extremely / highly</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tính từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>highly <strong>reliable</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Động từ thường</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Trạng từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>improved <strong>significantly</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đầu câu + có dấu phẩy sau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Trạng từ liên kết</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Consequently</strong>, …</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Modal (will, must, can, should) / to</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Động từ nguyên thể</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>should <strong>consider</strong></em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3 — Mở phương án, loại theo đuôi từ.</strong> Thường loại được 3/4 ngay.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ SƠ ĐỒ RA QUYẾT ĐỊNH</h4><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">Chỗ trống đứng ở đâu?\n├─ Sau mạo từ / sở hữu / tính từ  → DANH TỪ   (-tion, -ment, -ness, -ity, -ance)\n├─ Trước danh từ                  → TÍNH TỪ   (-ful, -ive, -able, -al, -ous)\n├─ Sau to be / linking verb       → TÍNH TỪ\n├─ Sau động từ thường             → TRẠNG TỪ  (-ly)\n├─ Đầu câu + dấu phẩy             → TRẠNG TỪ LIÊN KẾT\n└─ Sau modal / to                 → ĐỘNG TỪ NGUYÊN THỂ</pre><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ Kỹ thuật này giải quyết khoảng <strong>85%</strong> câu hỏi từ loại. Phần còn lại cần biết collocation — học ở tháng 12.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 CHOOSING A FIRST JOB</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Career advisers say that the first job is rarely the most important decision a graduate makes. What matters more is the development of skills that transfer between industries.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Employers frequently report that technical knowledge can be taught quickly, while habits such as reliability and clear communication take far longer to build. A graduate who works efficiently in a small company may therefore gain more than one who joins a famous firm and does routine tasks.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Consequently, advisers recommend asking one simple question at an interview: what will I actually do in the first six months? The honesty of the answer is often revealing.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(104 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to career advisers, the first job ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do employers say takes longer to build?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> What do advisers recommend asking at an interview?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>apply for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to ask formally for a job or a place</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>transferable skills</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">abilities that are useful in many different jobs</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>gain experience</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to get knowledge from doing something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>routine tasks</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">ordinary work that is done regularly</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>stand out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be much better or more noticeable than others</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The ______ of the campaign exceeded expectations.", "o": ["succeed", "success", "successful", "successfully"], "a": 1}, {"q": "Waste must be sorted ______ before collection.", "o": ["proper", "properly", "property", "proprietor"], "a": 1}, {"q": "This is an ______ effective way to reduce costs.", "o": ["extreme", "extremely", "extremity", "extremist"], "a": 1}, {"q": "Their ______ to the scheme was immediate.", "o": ["respond", "response", "responsive", "responsively"], "a": 1}, {"q": "The council should ______ the proposal carefully.", "o": ["consideration", "considerate", "consider", "considerably"], "a": 2}, {"q": "A ______ internet connection is required.", "o": ["stable", "stability", "stably", "stabilise"], "a": 0}, {"q": "According to career advisers, the first job ______.", "o": ["is the most important decision", "is rarely the most important decision", "should always be at a famous firm", "determines a graduate's whole career"], "a": 1}, {"q": "What do employers say takes longer to build?", "o": ["Technical knowledge", "Habits such as reliability and communication", "Company reputation", "Routine task skills"], "a": 1}, {"q": "The word **\"one\"** in paragraph 2 refers to ______.", "o": ["a company", "a task", "a graduate", "an employer"], "a": 2}, {"q": "What do advisers recommend asking at an interview?", "o": ["What the salary will be", "How famous the company is", "What the work will actually involve", "How many people work there"], "a": 2}]}, {"id": 20, "month": "11", "title": "Câu Điều Kiện Loại 0, 1, 2", "theme": "Global warming", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Global warming</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Câu điều kiện nói về quan hệ <strong>nếu — thì</strong>. Ba loại đầu khác nhau ở <strong>mức độ có thật</strong>:</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Loại 0</strong> = luôn đúng (chân lý, quy luật).\n<strong>Loại 1</strong> = có thật, có thể xảy ra ở tương lai.\n<strong>Loại 2</strong> = không có thật ở hiện tại (giả định trái sự thật).</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dùng khi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dấu hiệu</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>0</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quy luật, hướng dẫn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thay <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">if</code> bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">when</code> vẫn đúng nghĩa</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Điều kiện thực tế trong tờ rơi, thông báo</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will</code></strong> ở vế chính</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giả định trái với hiện tại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">would</code></strong> ở vế chính; <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">were</code> với mọi chủ ngữ</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔴 <strong>Cách nhận biết nhanh nhất:</strong> nhìn <strong>vế chính</strong> trước. <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will</code> → loại 1 · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">would</code> → loại 2 · cả hai vế hiện tại đơn → loại 0</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>0</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + V(s/es), S + V(s/es)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If you <strong>heat</strong> ice, it <strong>melts</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + V(s/es), S + <strong>will</strong> + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If everyone <strong>works</strong> together, we <strong>will make</strong> a difference.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1</strong> biến thể</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + V(s/es), S + can/should/must + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If you <strong>need</strong> help, you <strong>can call</strong> us.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + V2/were, S + <strong>would</strong> + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If the council <strong>had</strong> more funds, it <strong>would extend</strong> the scheme.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2</strong> với be</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + <strong>were</strong> (mọi ngôi)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If I <strong>were</strong> you, I <strong>would apply</strong>.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 Vế <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">if</code> đứng sau thì <strong>bỏ dấu phẩy</strong>: <em>We will make a difference <strong>if</strong> everyone works together.</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 IF THE ICE MELTS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Scientists agree on one simple rule: if the average temperature rises, polar ice melts. That is not a prediction but a physical fact.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">What happens next is less certain. If the ice sheets of Greenland disappear completely, sea levels will rise by around seven metres. Cities such as Ho Chi Minh City and Bangkok will lose large areas of land.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Many researchers argue that if governments acted faster, the worst effects could still be avoided. Others are less hopeful. If the current rate of emissions continues, they say, the world will pass a dangerous threshold within thirty years.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(103 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, if the average temperature rises ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What would happen if the Greenland ice sheets disappeared?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cut emissions</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to reduce the gases released into the air</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>sea level</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the average height of the sea</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take action</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to do something to deal with a problem</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be at risk</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be in danger of harm or loss</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>contribute to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be one of the causes of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "If the school ______ enough volunteers, the project will start next month.", "o": ["find", "finds", "found", "will find"], "a": 1}, {"q": "If everyone ______ together, we will make a difference.", "o": ["have worked", "worked", "work", "works"], "a": 3}, {"q": "If I ______ you, I would apply for that grant.", "o": ["am", "was", "were", "will be"], "a": 2}, {"q": "If you ______ metal, it expands.", "o": ["heat", "heats", "heated", "will heat"], "a": 0}, {"q": "If the council had more funds, it ______ the scheme.", "o": ["will extend", "would extend", "extends", "extended"], "a": 1}, {"q": "If the deadline ______, applications will not be accepted.", "o": ["pass", "passes", "passed", "will pass"], "a": 1}, {"q": "According to the passage, if the average temperature rises ______.", "o": ["polar ice melts", "sea levels fall", "emissions decrease", "cities gain land"], "a": 0}, {"q": "What would happen if the Greenland ice sheets disappeared?", "o": ["Temperatures would fall.", "Sea levels would rise by about seven metres.", "Emissions would stop.", "Bangkok would gain land."], "a": 1}, {"q": "The word **\"Others\"** in paragraph 3 refers to ______.", "o": ["governments", "cities", "researchers", "effects"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All scientists are hopeful.", "Some researchers believe faster action could avoid the worst effects.", "Sea levels have already risen seven metres.", "The rate of emissions has stopped."], "a": 1}]}, {"id": 21, "month": "11", "title": "Câu Điều Kiện Loại 3, Hỗn Hợp Và Unless", "theme": "Project failures", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Project failures</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Loại 3</strong> = giả định trái với <strong>quá khứ</strong> — việc đã xảy ra rồi, không sửa được.\n<strong>Hỗn hợp</strong> = điều kiện ở <strong>quá khứ</strong>, kết quả ở <strong>hiện tại</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Điều kiện</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kết quả</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If they <strong>had checked</strong> the wiring, the fire <strong>wouldn&#x27;t have started</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hỗn hợp</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hiện tại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If they <strong>had checked</strong> it last year, the system <strong>would be</strong> safe now.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">unless</code> = <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">if … not</code></h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Sau <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">unless</code> dùng câu <strong>khẳng định</strong> — <strong>không</strong> thêm <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">not</code> nữa.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>You <strong>won&#x27;t</strong> pass <strong>unless</strong> you <strong>work</strong> hard.</em> = <em>…<strong>if</strong> you <strong>don&#x27;t</strong> work hard.</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">❌ <em>Unless you don&#x27;t register…</em> → ✅ <em>Unless you <strong>register</strong>…</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Cụm tương đương <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">if</code>:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">as long as</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">provided that</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">on condition that</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">in case</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + <strong>had</strong> + V3, S + <strong>would have</strong> + V3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If we <strong>had applied</strong> earlier, we <strong>would have got</strong> the grant.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3</strong> bị động</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + had been + V3, …</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If the form <strong>had been signed</strong>, it <strong>would have been accepted</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hỗn hợp</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">If + S + had + V3, S + <strong>would</strong> + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>If she <strong>had taken</strong> the job, she <strong>would be</strong> in Da Nang now.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Unless</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Unless + S + V, S + will + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Unless you <strong>register</strong>, you <strong>will lose</strong> your place.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>As long as</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">As long as + S + V(s/es), S + will + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>As long as it <strong>rains</strong>, the drill <strong>will be</strong> postponed.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 WHY THE BRIDGE PROJECT FAILED</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">The riverside bridge was planned in 2016 and abandoned three years later. Engineers now agree that if the soil survey had been carried out properly, the problems would have been discovered at the start.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Instead, work began without a full report. If the council had delayed the project by six months, it would have saved almost forty billion dong. Unless a proper survey is completed, no new design can be approved.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The site is still empty today. If the original plan had gone ahead, residents would now have a direct route to the city centre, and the daily journey would be twenty minutes shorter.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(106 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, what was the main mistake?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What would have happened if the council had delayed the project?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry out a survey</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to do a study to collect information</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>go ahead</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to begin or continue as planned</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be abandoned</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be stopped before being finished</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>stem from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be caused by something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>result in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to cause a particular situation</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "If the engineers ______ the line, the fault ______.", "o": ["tested / wouldn't appear", "had tested / wouldn't have appeared", "test / won't appear", "had tested / wouldn't appear"], "a": 1}, {"q": "Unless you ______ the instructions, the machine will stop.", "o": ["don't follow", "follow", "didn't follow", "won't follow"], "a": 1}, {"q": "If she ______ the offer last year, she ______ in Singapore now.", "o": ["accepted / would work", "had accepted / would be working", "accepts / will work", "had accepted / would have worked"], "a": 1}, {"q": "We ______ a refund if we ______ the receipt.", "o": ["would get / hadn't lost", "would have got / hadn't lost", "will get / don't lose", "got / didn't lose"], "a": 1}, {"q": "You may keep the equipment ______ you return it by June.", "o": ["unless", "provided that", "although", "in spite of"], "a": 1}, {"q": "If the form ______ on time, it ______.", "o": ["was signed / would be accepted", "had been signed / would have been accepted", "signed / would accept", "is signed / will accept"], "a": 1}, {"q": "According to the passage, what was the main mistake?", "o": ["The bridge was built too quickly.", "The soil survey was not carried out properly.", "The council spent too little money.", "Residents opposed the project."], "a": 1}, {"q": "What would have happened if the council had delayed the project?", "o": ["It would have saved a large sum of money.", "The bridge would have been finished.", "The survey would have been cancelled.", "Residents would have moved away."], "a": 0}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the project", "the council", "the report", "the survey"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The bridge was completed in 2019.", "The site remains empty.", "A new design has been approved.", "The journey is now twenty minutes shorter."], "a": 1}]}, {"id": 22, "month": "11", "title": "Mệnh Đề Quan Hệ", "theme": "ASEAN and Viet Nam", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> ASEAN and Viet Nam</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Mệnh đề quan hệ</strong> bổ nghĩa cho danh từ đứng trước, giúp gộp hai câu thành một.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đây là cấu trúc khiến câu trong bài đọc dài ra — nắm được thì đọc nhanh hơn hẳn.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đại từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thay cho</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>who</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">người</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the staff <strong>who</strong> attended the drill</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>which</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">vật</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the equipment <strong>which</strong> was inspected</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>that</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">cả người và vật <em>(không dùng sau dấu phẩy)</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the report <strong>that</strong> we submitted</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>whose</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sở hữu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the company <strong>whose</strong> policy changed</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>where</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nơi chốn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the site <strong>where</strong> the cables were laid</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>when</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thời gian</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the year <strong>when</strong> the scheme began</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Mệnh đề xác định và không xác định</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dấu phẩy</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ý nghĩa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Xác định</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">không</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bỏ đi thì câu mất nghĩa</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Students <strong>who register early</strong> get a discount.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Không xác định</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chỉ bổ sung thông tin</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Marsh County, <strong>which lies in the north</strong>, has poor broadband.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ Sau dấu phẩy <strong>cấm dùng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">that</code></strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">which</code> thay cho CẢ MỆNH ĐỀ</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>Speeds improved markedly, <strong>which</strong> encouraged neighbouring counties to follow.</em> → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">which</code> ở đây không trỏ về danh từ nào, mà trỏ về <strong>toàn bộ việc</strong> &quot;tốc độ cải thiện&quot;.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chủ ngữ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + who/which/that + <strong>V</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the council <strong>which approves</strong> the plan</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tân ngữ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + who(m)/which/that + <strong>S + V</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the plan <strong>which the council approved</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Sở hữu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + <strong>whose</strong> + N</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the firm <strong>whose bid</strong> won</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nơi chốn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + <strong>where</strong> + S + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the hall <strong>where the drill took place</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giới từ + which</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">N + giới từ + <strong>which</strong> + S + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the issue <strong>about which</strong> they argued</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 Sau <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">everything / anything / all / something</code> → bắt buộc dùng <strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">that</code></strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 ASEAN AT FIFTY-FIVE</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">ASEAN, which was founded in 1967, now includes ten member states whose combined population exceeds 670 million.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The organisation, which meets several times a year, has no single parliament. Decisions are made by consensus, a method that requires every member to agree. Critics say this is the reason why progress is often slow.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Viet Nam, which joined in 1995, has hosted the annual summit three times. The 2020 summit, which took place online because of the pandemic, was the first in the organisation&#x27;s history to be held entirely by video, which many members later described as a success.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(101 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, ASEAN ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> Why do critics say progress is often slow?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>3.</strong> The last <strong>&quot;which&quot;</strong> in the passage refers to ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b borde xt-slate-700\">Chủ động</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the staff <strong>who attend</strong> the drill</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the staff <strong>attending</strong> the drill</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bị động</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the bins <strong>which were installed</strong> last week</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the bins <strong>installed</strong> last week</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tính từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the students <strong>who are responsible</strong> for waste</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the students <strong>responsible</strong> for waste</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giới từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the file <strong>which is on the desk</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the file <strong>on the desk</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">To V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">he was the first <strong>who arrived</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">he was the first <strong>to arrive</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔑 <strong>Cách phân biệt V-ing và V3:</strong> hỏi <em>chủ ngữ tự làm hay bị làm?</em> Tự làm → <strong>V-ing</strong> · Bị làm → <strong>V3</strong></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE TEACHER WHO NEVER RETIRED</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Born in a small village in Quang Nam in 1931, Nguyen Thi Lan was the first person in her family to finish secondary school.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">She began teaching in 1952 and continued for sixty years. Students taught by her in the 1960s still visit her today. Asked why she never retired, she replied simply that she had nothing else she wanted to do.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The classroom built beside her house is still used every Sunday. Children living nearby come for free lessons, and former students returning from the city often teach alongside her. A documentary made about her life won a national prize in 2019.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(105 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, Nguyen Thi Lan ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be known for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be famous because of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>devote oneself to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to give all your time and effort to something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>look up to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to admire and respect someone</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to continue doing something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>leave a legacy</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to leave something important behind</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Skills ______ practised tend to erode.", "o": ["seldom practising", "seldom practised", "to seldom practise", "seldom practise"], "a": 1}, {"q": "Households ______ to reduce waste should attend the workshop.", "o": ["wished", "wishing", "to wish", "wish"], "a": 1}, {"q": "The section of river ______ for hydroelectric generation is now closed.", "o": ["using", "used", "to use", "use"], "a": 1}, {"q": "He was the first researcher ______ this hidden cost.", "o": ["identifying", "identified", "to identify", "identify"], "a": 2}, {"q": "The employees ______ night shifts receive an allowance.", "o": ["worked", "working", "to work", "work"], "a": 1}, {"q": "The report ______ to this email needs review.", "o": ["attaching", "attached", "to attach", "attach"], "a": 1}, {"q": "According to the passage, Nguyen Thi Lan ______.", "o": ["was born in the city", "was the first in her family to finish secondary school", "retired in 1952", "never taught in a classroom"], "a": 1}, {"q": "How long did she teach?", "o": ["Twenty years", "Forty years", "Sixty years", "Eighty years"], "a": 2}, {"q": "The word **\"her\"** in paragraph 3 refers to ______.", "o": ["a student", "Nguyen Thi Lan", "a child", "a documentary"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The classroom is no longer used.", "Former students sometimes teach with her.", "She charges for the Sunday lessons.", "The documentary was made in 1931."], "a": 1}]}, {"id": 24, "month": "11", "title": "To V Và V-Ing", "theme": "The generation gap", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> The generation gap</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Sau một động từ, động từ thứ hai phải chia ở dạng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">to V</code> hoặc <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">V-ing</code>. <strong>Không có quy tắc logic — phải thuộc danh sách.</strong> Bù lại, đây là loại câu dễ ăn điểm vì chỉ cần nhớ.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nhóm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Động từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>+ to V</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">want · decide · hope · plan · agree · promise · refuse · offer · aim · manage · fail · afford · expect · learn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We <strong>aim to promote</strong> safe habits.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>+ V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">enjoy · avoid · finish · suggest · consider · mind · practise · deny · recommend · involve · risk · keep</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The scheme <strong>involves sorting</strong> waste.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Sau giới từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">luôn <strong>V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>interested <strong>in joining</strong></em> · <em>after <strong>being informed</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đổi nghĩa</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">remember · forget · stop · try</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">xem bảng dưới</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Bốn động từ đổi nghĩa</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Động từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">+ to V</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">+ V-ing</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>remember</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nhớ <strong>sẽ</strong> làm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nhớ <strong>đã</strong> làm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>forget</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quên <strong>chưa</strong> làm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quên <strong>đã</strong> làm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>stop</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dừng lại <strong>để</strong> làm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dừng <strong>việc đang</strong> làm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>try</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">cố gắng làm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thử làm xem sao</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">used to + V</code> (từng làm) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be used to + V-ing</code> (đã quen với việc gì)</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + V + <strong>to V</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>decided to extend</strong> the scheme.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + V + <strong>V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We <strong>recommend using</strong> the north gate.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + V + O + <strong>to V</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The council <strong>asked residents to sort</strong> waste.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">giới từ + <strong>V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>responsible <strong>for managing</strong> the budget</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>to V</strong> chỉ mục đích</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We hold drills <strong>to improve</strong> safety.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 TALKING ACROSS GENERATIONS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Many teenagers complain that their parents refuse to listen. Many parents say the same about their children.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Psychologists suggest starting with small things. They recommend choosing a time when nobody is tired, and avoiding difficult topics at meals. Parents who manage to ask questions without judging usually learn far more than those who begin by giving advice.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Teenagers can help too. Experts advise them to explain rather than defend, and to remember that their parents grew up in a very different world. Families who keep talking, even about ordinary things, tend to find the difficult conversations easier later.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(100 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, psychologists suggest ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do parents who ask questions without judging usually do?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th
