<script>
const LESSONS_RAW =
[{"id": 1, "month": "10", "title": "Thì Hiện Tại Đơn", "theme": "Family life", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại đơn** dùng cho những việc **luôn đúng**: thói quen lặp lại, sự thật hiển nhiên, lịch trình cố định.\n\n```\nHiện tại đơn:   ═══════════════════════════════\n                quá khứ ───── bây giờ ───── tương lai\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Thói quen lặp lại** | *Marsha **goes** to dance lessons every Saturday.* |\n| **Sự thật, chân lý** | *Water **boils** at 100 degrees Celsius.* |\n| **Lịch trình cố định** | *The library **opens** at 8 a.m.* |\n| **Tình trạng lâu dài** | *My father **works** at a hospital.* |\n\n### Dấu hiệu nhận biết\n\n| Nhóm | Từ khoá |\n|---|---|\n| Trạng từ tần suất | always · usually · often · sometimes · rarely · seldom · never |\n| Cụm chỉ tần suất | every day/week/month · each Monday · once a week · twice a month |\n| Khác | generally · normally · in general |\n\n### Vị trí trạng từ tần suất\n\n| Quy tắc | Ví dụ |\n|---|---|\n| **Trước** động từ thường | *I **often** play football.* |\n| **Sau** động từ `be` | *I am **often** late.* |\n\n❌ *She usually is late.* → ✅ *She **is usually** late.*"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + V / V(s·es) | *They **play** football. · He **plays** football.* |\n| Phủ định | S + do/does not + V | *She **doesn't work** here.* |\n| Nghi vấn | Do/Does + S + V? | ***Does** Dan **work** at the cinema?* |\n\n**Chủ ngữ nào thêm -s?**\n\n| Chủ ngữ | Động từ |\n|---|---|\n| I · you · we · they · danh từ **số nhiều** | **không** thêm -s |\n| he · she · it · danh từ **số ít** | **thêm -s** |\n\n**Quy tắc thêm -s/-es:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `o, s, sh, ch, x` | thêm **-es** | go → go**es** · watch → watch**es** |\n| Kết thúc bằng **phụ âm + y** | đổi `y` → **-ies** | study → stud**ies** · carry → carr**ies** |\n| Kết thúc bằng **nguyên âm + y** | thêm **-s** | play → play**s** |\n| Còn lại | thêm **-s** | work → work**s** |\n\n⚠️ Bất quy tắc: `have → **has**` · `be → **is / am / are**`"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 HOUSEWORK IN THE FAMILY\n\n> In many families, parents do all the housework. They want their children to study and nothing else.\n>\n> But children who share the chores learn useful skills. They learn to use their time well. They also take responsibility for small jobs at home.\n>\n> These children usually get on with their brothers and sisters better, because everyone in the family helps.\n\n*(62 từ)*\n\n\n\n**1.** According to the passage, many parents ______.\n\n**2.** According to the passage, children who share the chores ______.\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "do the housework", "p": "v phr", "e": "to do the cleaning, washing and cooking in a home", "v": ""}, {"t": "share the chores", "p": "v phr", "e": "to divide household tasks between people who live together", "v": ""}, {"t": "take responsibility for", "p": "v phr", "e": "to accept that you are in charge of something", "v": ""}, {"t": "get on with (sb)", "p": "phr v", "e": "to have a good relationship with someone", "v": ""}, {"t": "look after", "p": "phr v", "e": "to take care of someone or something", "v": ""}], "quiz": [{"q": "The recycling centre ______ six days a week.", "o": ["operate", "operates", "operating", "to operate"], "a": 1}, {"q": "My sister and I ______ to school together every morning.", "o": ["walks", "walking", "walk", "walked"], "a": 2}, {"q": "Water ______ at 100 degrees Celsius.", "o": ["boil", "boils", "boiling", "to boil"], "a": 1}, {"q": "She ______ her homework before dinner.", "o": ["usually does", "does usually", "usually do", "do usually"], "a": 0}, {"q": "My brother ______ at the weekend.", "o": ["don't study", "doesn't study", "doesn't studies", "not study"], "a": 1}, {"q": "______ your father work at a hospital?", "o": ["Do", "Does", "Is", "Are"], "a": 1}, {"q": "According to the passage, many parents ______.", "o": ["ask their children to do the housework", "want their children only to study", "have no time for the housework", "teach their children useful skills"], "a": 1}, {"q": "According to the passage, children who share the chores ______.", "o": ["always get better marks", "spend less time with their family", "learn to use their time well", "do all the housework alone"], "a": 2}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["parents", "children", "skills", "jobs"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only children do the housework in these families.", "Children who help at home get on better with their siblings.", "Parents never do the housework.", "Housework makes children study less."], "a": 1}]}, {"id": 2, "month": "10", "title": "Thì Hiện Tại Tiếp Diễn", "theme": "For a better community", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại tiếp diễn** dùng cho việc **đang xảy ra ngay lúc nói**, hoặc việc chỉ diễn ra **trong một giai đoạn tạm thời**.\n\n```\nHiện tại tiếp diễn:  ──────────●──────────\n                              ↑\n                        (chỉ lúc này)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Đang xảy ra lúc nói** | *Jan **is watching** a DVD upstairs.* |\n| **Giai đoạn tạm thời** | *She **is working** at the museum until June.* |\n| **Xu hướng đang thay đổi** | *More students **are choosing** online courses.* |\n| **Thói quen gây khó chịu** (với *always*) | *He **is always losing** his keys!* |\n\n### Dấu hiệu nhận biết\n\n`now · right now · at the moment · at present · currently · today · this week · these days · Look! · Listen!`\n\n### ⚠️ Động từ trạng thái — KHÔNG chia tiếp diễn\n\nNhóm động từ mô tả **trạng thái** (cảm xúc, suy nghĩ, sở hữu), không mô tả hành động:\n\n```\nappear · be · believe · belong to · hate · have · include · know · like\nlove · need · prefer · see · seem · taste · think · understand · want\n```\n\n❌ *I am knowing the answer.* → ✅ *I **know** the answer.*\n\n**Ngoại lệ:** `be`, `have`, `think` **được** chia tiếp diễn khi mô tả **hành động thật sự**:\n\n| Trạng thái | Hành động |\n|---|---|\n| *What **do you think** about his song?* (ý kiến) | *I**'m thinking** about the match.* (đang nghĩ) |\n| *She **has** two brothers.* (sở hữu) | *She**'s having** lunch.* (đang ăn) |\n| *He **is** very kind.* (bản chất) | *He**'s being** rude today.* (đang cư xử) |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + am/is/are + V-ing | *She **is working** at the museum.* |\n| Phủ định | S + am/is/are not + V-ing | *They **aren't coming** today.* |\n| Nghi vấn | Am/Is/Are + S + V-ing? | ***Are** they **testing** the equipment?* |\n\n**Quy tắc thêm -ing:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `e` câm | bỏ `e` | make → mak**ing** · write → writ**ing** |\n| 1 nguyên âm + 1 phụ âm (từ 1 âm tiết) | gấp đôi phụ âm | run → ru**nn**ing · sit → si**tt**ing |\n| Kết thúc bằng `ie` | đổi thành `y` | lie → l**y**ing · die → d**y**ing |\n| Còn lại | thêm **-ing** | study → study**ing** · play → play**ing** |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A CLEAN-UP DAY\n\n> This month, our school is running a clean-up project. Every Saturday, students are collecting rubbish along the river near the market.\n>\n> At the moment, about sixty students are taking part. They are working in small groups, and each group looks after one part of the river bank.\n>\n> The local council is helping too. It is providing gloves and bags, and it is planning to build two new bins next month.\n\n*(75 từ)*\n\n\n\n**1.** What are the students doing this month?\n\n**2.** According to the passage, the local council ______.\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "take part in", "p": "v phr", "e": "to be involved in an activity with other people", "v": ""}, {"t": "clean up", "p": "phr v", "e": "to make a place tidy by removing rubbish", "v": ""}, {"t": "collect rubbish", "p": "v phr", "e": "to gather waste and take it away", "v": ""}, {"t": "work in groups", "p": "v phr", "e": "to do a task together with several people", "v": ""}, {"t": "make a difference", "p": "v phr", "e": "to have an important effect on a situation", "v": ""}], "quiz": [{"q": "Listen! Someone ______ at the door.", "o": ["knocks", "knock", "is knocking", "knocked"], "a": 2}, {"q": "We ______ a pilot project this month.", "o": ["run", "runs", "are running", "is running"], "a": 2}, {"q": "I ______ what you mean, but I disagree.", "o": ["am understanding", "understand", "understands", "am understand"], "a": 1}, {"q": "My father ______ his keys on the table!", "o": ["always leaves", "is always leaving", "always leaving", "is always leave"], "a": 1}, {"q": "She ______ with her aunt until September.", "o": ["stays", "stay", "is staying", "staying"], "a": 2}, {"q": "______ the engineers ______ the bridge at the moment?", "o": ["Do / inspect", "Are / inspecting", "Is / inspecting", "Does / inspect"], "a": 1}, {"q": "What are the students doing this month?", "o": ["Building new bins", "Collecting rubbish by the river", "Selling things at the market", "Planning a new school project"], "a": 1}, {"q": "According to the passage, the local council ______.", "o": ["pays the students for their work", "provides equipment for the project", "collects the rubbish itself", "builds the river bank"], "a": 1}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the school", "the river", "the local council", "the project"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All students in the school take part.", "The students work alone.", "Each group is responsible for one area.", "The bins are already finished."], "a": 2}]}, {"id": 3, "month": "10", "title": "Đối Chiếu Hiện Tại Đơn Và Hiện Tại Tiếp Diễn", "theme": "A long and healthy life", "blocks": [{"h": "Mở đầu", "md": "> **Buổi đối chiếu.** Không học công thức mới — chỉ phân biệt hai thì đã học và luyện tập."}, {"h": "① NGỮ PHÁP", "md": "Hai thì cùng nói về hiện tại, khác nhau ở **tính chất thời gian**:\n\n> **Hiện tại đơn** = việc **luôn đúng** — đường thẳng kéo dài.\n> **Hiện tại tiếp diễn** = việc **đang xảy ra lúc này** — một chấm trên đường thẳng đó."}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **HIỆN TẠI ĐƠN** | **HIỆN TẠI TIẾP DIỄN** |\n|---|---|---|\n| **Dùng cho** | Thói quen · sự thật · lịch cố định | Đang xảy ra lúc nói · giai đoạn tạm thời |\n| **Dấu hiệu** | always · usually · often · every day · once a week | now · at the moment · currently · today · this week · Look! · Listen! |\n| **Ví dụ** | *She **works** at the museum.* (nghề nghiệp lâu dài) | *She **is working** at the museum until June.* (tạm thời) |\n| **Động từ trạng thái** | ✅ dùng được | ❌ không dùng |\n\n### Ba cặp câu dễ nhầm\n\n| Hiện tại đơn | Hiện tại tiếp diễn |\n|---|---|\n| *He **always leaves** his keys at home.* (thói quen bình thường) | *He **is always leaving** his keys at home!* (phàn nàn) |\n| *What **do you think** about it?* (ý kiến) | *I**'m thinking** about it.* (đang suy nghĩ) |\n| *The train **leaves** at 6.15.* (lịch tàu) | *I**'m leaving** at 6.15 tomorrow.* (kế hoạch cá nhân) |"}, {"h": "③ HOÀ HỢP CHỦ NGỮ — ĐỘNG TỪ", "md": "Những chủ ngữ sau **trông như số nhiều nhưng thực chất là số ít**:\n\n| Chủ ngữ | Động từ | Ví dụ |\n|---|---|---|\n| everyone · everybody · someone · nobody | **số ít** | *Everyone **needs** a break.* |\n| each / every + danh từ | **số ít** | *Every student **takes** part.* |\n| each of / one of / neither of + N số nhiều | **số ít** | *Each of the bins **has** a colour code.* |\n| N + of + N → theo **danh từ đầu** | tuỳ | *The **quality** of these materials **is** poor.* |\n| a number of + N | **số nhiều** | *A number of staff **have** resigned.* |\n| the number of + N | **số ít** | *The number of applicants **has** risen.* |\n| Danh từ không đếm được (information, equipment, advice) | **số ít** | *The equipment **needs** checking.* |\n\n⚠️ **Bẫy chính:** cụm `of + danh từ số nhiều` xen giữa khiến người học chia nhầm theo danh từ đó.\n❌ *Each of the proposals **were** reviewed.* → ✅ *Each of the proposals **was** reviewed.*"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 STAYING HEALTHY\n\n> Most doctors say that a healthy life does not need expensive equipment. Walking thirty minutes a day is enough for many people.\n>\n> These days, more Vietnamese families are taking up simple sports. In many parks, groups of older people are doing morning exercises together, and young people are cycling to work instead of driving.\n>\n> Doctors also warn about food. They believe that people eat too much sugar and too little fruit. Cutting down on sweet drinks is one of the easiest ways to keep fit.\n\n*(88 từ)*\n\n\n\n**1.** According to the passage, a healthy life ______.\n\n**2.** What are many Vietnamese families doing these days?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "keep fit", "p": "v phr", "e": "to stay strong and healthy", "v": ""}, {"t": "take up (a sport)", "p": "phr v", "e": "to start doing an activity regularly", "v": ""}, {"t": "cut down on", "p": "phr v", "e": "to use or do less of something", "v": ""}, {"t": "be good for", "p": "adj phr", "e": "to have a positive effect on someone", "v": ""}, {"t": "do exercise", "p": "v phr", "e": "to move your body to stay healthy", "v": ""}], "quiz": [{"q": "Each of the departments ______ its own budget.", "o": ["have", "has", "are having", "having"], "a": 1}, {"q": "The quality of these materials ______ disappointing.", "o": ["is", "are", "were", "being"], "a": 0}, {"q": "My father ______ his glasses somewhere!", "o": ["always puts", "is always putting", "always putting", "always put"], "a": 1}, {"q": "Everyone in the two classes ______ the new timetable.", "o": ["like", "likes", "are liking", "liking"], "a": 1}, {"q": "She ______ at the hospital these days, but she ______ at a clinic normally.", "o": ["works / works", "is working / works", "works / is working", "is working / is working"], "a": 1}, {"q": "The number of students ______ every year.", "o": ["rise", "rises", "are rising", "rising"], "a": 1}, {"q": "According to the passage, a healthy life ______.", "o": ["requires expensive equipment", "can start with simple walking", "is only possible for young people", "depends on morning exercises"], "a": 1}, {"q": "What are many Vietnamese families doing these days?", "o": ["Buying sports equipment", "Taking up simple sports", "Moving to live near parks", "Stopping all sweet drinks"], "a": 1}, {"q": "The word **\"They\"** in paragraph 3 refers to ______.", "o": ["families", "young people", "doctors", "sweet drinks"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Everyone must walk thirty minutes a day.", "Cycling to work is becoming more common.", "Doctors never mention food.", "Sugar is the only health problem."], "a": 1}]}, {"id": 4, "month": "10", "title": "Thì Quá Khứ Đơn", "theme": "Inventions", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ đơn** dùng cho việc **đã xảy ra và kết thúc hẳn** tại một thời điểm trong quá khứ.\n\n```\nQuá khứ đơn:   ────●────────────────────\n                   ↑          bây giờ\n              (xong hẳn rồi)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc xong hẳn trong quá khứ** | *They **installed** the bins last Monday.* |\n| **Chuỗi việc nối tiếp nhau** | *He **opened** the door, **took** his bag and **left**.* |\n| **Thói quen trong quá khứ** (nay không còn) | *I **walked** to school every day when I was ten.* |\n\n### Dấu hiệu nhận biết\n\n`yesterday · last week/month/year · in 2020 · two days ago · then · when I was young`\n\n### 📌 Cấu trúc `used to`\n\nDùng cho **thói quen hoặc trạng thái trong quá khứ, nay không còn nữa**.\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + **used to** + V | *I **used to** walk to school.* |\n| Phủ định | S + **didn't use to** + V | *She **didn't use to** like coffee.* |\n| Nghi vấn | Did + S + **use to** + V? | ***Did** you **use to** live here?* |\n\n⚠️ Phân biệt: `used to + V` (từng làm) ≠ `be used to + V-ing` (đã quen với việc gì)."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + V2/V-ed | *They **installed** the bins.* |\n| Phủ định | S + did not + V | *The plan **didn't include** rural areas.* |\n| Nghi vấn | Did + S + V? | ***Did** the council **approve** it?* |\n\n**Quy tắc thêm -ed:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `e` | thêm **-d** | live → live**d** |\n| Phụ âm + `y` | đổi `y` → **-ied** | study → stud**ied** |\n| 1 nguyên âm + 1 phụ âm (1 âm tiết) | gấp đôi phụ âm | stop → sto**pp**ed |\n| Còn lại | thêm **-ed** | work → work**ed** |\n\n**20 động từ bất quy tắc phải thuộc:**\n\n| Nguyên thể | Quá khứ | Nguyên thể | Quá khứ |\n|---|---|---|---|\n| be | was / were | lead | led |\n| begin | began | leave | left |\n| build | built | make | made |\n| buy | bought | rise | rose |\n| come | came | see | saw |\n| do | did | send | sent |\n| find | found | take | took |\n| give | gave | teach | taught |\n| go | went | think | thought |\n| hold | held | write | wrote |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE STORY OF THE BICYCLE\n\n> The first bicycle appeared in Germany in 1817. It had no pedals, so riders pushed it with their feet. People called it the \"running machine\".\n>\n> In 1861, a French inventor added pedals to the front wheel. The new machine became popular very quickly, but it was heavy and uncomfortable.\n>\n> The modern bicycle arrived in the 1880s. It had two wheels of the same size and a chain. This design worked so well that people still use it today.\n\n*(85 từ)*\n\n\n\n**1.** According to the passage, the first bicycle ______.\n\n**2.** What happened in 1861?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "come up with", "p": "phr v", "e": "to think of an idea or a plan", "v": ""}, {"t": "carry out", "p": "phr v", "e": "to do a task or piece of research", "v": ""}, {"t": "make progress", "p": "v phr", "e": "to improve or move forward", "v": ""}, {"t": "be based on", "p": "v phr", "e": "to use something as the main idea", "v": ""}, {"t": "put into practice", "p": "v phr", "e": "to start using an idea in a real situation", "v": ""}], "quiz": [{"q": "The company ______ its safety policy last March.", "o": ["updates", "updated", "is updating", "update"], "a": 1}, {"q": "She ______ to work by bus when she was a student.", "o": ["use to go", "used to go", "used to going", "uses to go"], "a": 1}, {"q": "______ the council approve the plan yesterday?", "o": ["Do", "Does", "Did", "Was"], "a": 2}, {"q": "They ______ the contract two weeks ago.", "o": ["sign", "signs", "signed", "have signed"], "a": 2}, {"q": "He ______ the report on time.", "o": ["didn't finished", "didn't finish", "doesn't finish", "not finished"], "a": 1}, {"q": "The engineers ______ the problem in 2021.", "o": ["find", "found", "finded", "finds"], "a": 1}, {"q": "According to the passage, the first bicycle ______.", "o": ["had pedals on the front wheel", "was pushed by the rider's feet", "appeared in France", "had two wheels of the same size"], "a": 1}, {"q": "What happened in 1861?", "o": ["The first bicycle appeared.", "Pedals were added to the front wheel.", "The chain was invented.", "The modern bicycle arrived."], "a": 1}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the 1880s", "the chain", "the modern bicycle", "the design"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The 1861 machine was light and comfortable.", "The modern design is still in use.", "Germans invented the chain.", "The running machine had pedals."], "a": 1}]}, {"id": 5, "month": "10", "title": "Thì Quá Khứ Tiếp Diễn", "theme": "Music", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ tiếp diễn** dùng cho việc **đang diễn ra tại một thời điểm trong quá khứ**.\n\n```\nQuá khứ tiếp diễn:  ──── ═══════ ────────\n                         ↑\n                    (lúc 8 giờ tối qua)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Đang diễn ra tại một mốc quá khứ** | *At 8 p.m. yesterday, I **was watching** the news.* |\n| **Hai việc song song** | *While she **was cooking**, he **was cleaning**.* |\n| **Làm nền cho việc khác cắt ngang** | *I **was walking** home when it started to rain.* |\n| **Bối cảnh trong truyện kể** | *The sun **was shining** and birds **were singing**.* |\n\n### Dấu hiệu nhận biết\n\n`at 8 p.m. yesterday · at that time · while · as · all morning · this time last week`"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + was/were + V-ing | *They **were repairing** the road.* |\n| Phủ định | S + was/were not + V-ing | *She **wasn't working** then.* |\n| Nghi vấn | Was/Were + S + V-ing? | ***Were** they **testing** the system?* |\n\n**Chọn `was` hay `were`?**\n\n| Chủ ngữ | Động từ |\n|---|---|\n| I · he · she · it · danh từ số ít | **was** |\n| you · we · they · danh từ số nhiều | **were** |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A NIGHT AT THE CONCERT\n\n> Last Saturday evening, my sister and I went to a concert at the city theatre. When we arrived, the orchestra was already tuning its instruments and people were finding their seats.\n>\n> While the first piece was playing, a young violinist suddenly stood up and performed alone. The audience was listening in complete silence. Nobody moved.\n>\n> At nine o'clock, we were still sitting in our seats, although the concert had two more hours to go. It was one of the best evenings of the year.\n\n*(89 từ)*\n\n\n\n**1.** What was happening when the writer arrived?\n\n**2.** According to the passage, the audience ______.\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be fond of", "p": "adj phr", "e": "to like someone or something very much", "v": ""}, {"t": "take an interest in", "p": "v phr", "e": "to want to know more about something", "v": ""}, {"t": "perform live", "p": "v phr", "e": "to play music in front of an audience", "v": ""}, {"t": "in complete silence", "p": "prep phr", "e": "with no noise at all", "v": ""}, {"t": "look forward to", "p": "phr v", "e": "to feel happy about something that will happen", "v": ""}], "quiz": [{"q": "At 3 p.m. yesterday, I ______ for the results.", "o": ["wait", "waited", "was waiting", "were waiting"], "a": 2}, {"q": "While the engineers ______ the line, it started to rain.", "o": ["test", "tested", "was testing", "were testing"], "a": 3}, {"q": "She ______ at that time, so she missed the call.", "o": ["drives", "drove", "was driving", "were driving"], "a": 2}, {"q": "They ______ the equipment all morning.", "o": ["check", "checked", "was checking", "were checking"], "a": 3}, {"q": "______ you ______ when I called?", "o": ["Did / work", "Were / working", "Was / working", "Do / work"], "a": 1}, {"q": "This time last week, we ______ in Hue.", "o": ["stay", "stayed", "was staying", "were staying"], "a": 3}, {"q": "What was happening when the writer arrived?", "o": ["The concert had finished.", "The orchestra was tuning its instruments.", "A violinist was playing alone.", "People were leaving the theatre."], "a": 1}, {"q": "According to the passage, the audience ______.", "o": ["talked during the performance", "left before nine o'clock", "listened without making any noise", "asked the violinist to stop"], "a": 2}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the theatre", "nine o'clock", "the concert", "the evening"], "a": 3}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The concert ended at nine o'clock.", "The writer went to the concert alone.", "The writer enjoyed the evening.", "The violinist played with the orchestra."], "a": 2}]}, {"id": 6, "month": "10", "title": "Đối Chiếu Quá Khứ Đơn Và Quá Khứ Tiếp Diễn", "theme": "Humans and the environment", "blocks": [{"h": "Mở đầu", "md": "> **Buổi đối chiếu.** Trọng tâm: cặp `when` và `while`."}, {"h": "① NGỮ PHÁP", "md": "> **Quá khứ tiếp diễn** là **nền** — việc dài, đang diễn ra.\n> **Quá khứ đơn** là việc **cắt ngang** nền đó — việc ngắn, xảy ra một lần.\n\n```\nQuá khứ tiếp diễn:  ═══════════════\nQuá khứ đơn:              ●\n                    \"I was walking home when it started to rain.\"\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **QUÁ KHỨ ĐƠN** | **QUÁ KHỨ TIẾP DIỄN** |\n|---|---|---|\n| **Dùng cho** | Việc xong hẳn · chuỗi việc nối tiếp | Việc đang diễn ra tại mốc quá khứ · hai việc song song |\n| **Dấu hiệu** | yesterday · last week · in 2020 · ago · then | while · at 8 p.m. yesterday · at that time · all morning |\n\n### 📌 Quy tắc `when` và `while`\n\n| Từ nối | Đi với thì | Ví dụ |\n|---|---|---|\n| **while** + việc **dài** | quá khứ tiếp diễn | ***While** they **were laying** cables…* |\n| **when** + việc **ngắn** | quá khứ đơn | *…**when** the storm **hit**.* |\n\n**Ba mẫu câu chuẩn:**\n\n| Mẫu | Ví dụ |\n|---|---|\n| Việc dài bị cắt ngang | *I **was walking** home **when** it **started** to rain.* |\n| Hai việc song song | ***While** she **was cooking**, he **was cleaning**.* |\n| Hai việc nối tiếp | ***When** he **arrived**, she **left**.* |\n\n⚠️ So sánh hai câu này — nghĩa khác hẳn nhau:\n- *When I arrived, she **was cooking**.* → cô ấy đã nấu từ trước, tôi đến giữa chừng.\n- *When I arrived, she **cooked**.* → tôi đến rồi cô ấy mới bắt đầu nấu."}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| S + was/were V-ing **when** S + V2 | *They **were surveying** **when** the equipment **broke down**.* |\n| **While** + S + was/were V-ing, S + V2 | ***While** we **were waiting**, the manager **called**.* |\n| **While** + S + was/were V-ing, S + was/were V-ing | ***While** he **was writing**, she **was reviewing**.* |\n| **When** + S + V2, S + V2 | ***When** the alarm **rang**, everyone **left**.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE DAY THE RIVER CHANGED\n\n> For years, factories along the Red River were releasing waste water directly into the river. Fish were disappearing, and local families were losing their main source of food.\n>\n> In 2019, while the city council was preparing a new development plan, a group of students carried out a simple survey. They tested the water at twelve points and published the results online.\n>\n> The report spread quickly. Within three months, the council closed two factories and introduced strict rules. Today, fishermen say that the fish are slowly coming back.\n\n*(94 từ)*\n\n\n\n**1.** According to the passage, what were the factories doing for years?\n\n**2.** What did the students do in 2019?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "release waste", "p": "v phr", "e": "to let harmful material go into the air or water", "v": ""}, {"t": "carry out a survey", "p": "v phr", "e": "to do a study to collect information", "v": ""}, {"t": "be responsible for", "p": "adj phr", "e": "to be the cause of something", "v": ""}, {"t": "introduce rules", "p": "v phr", "e": "to start using new regulations", "v": ""}, {"t": "cut down (trees)", "p": "phr v", "e": "to make a tree fall to the ground", "v": ""}], "quiz": [{"q": "I ______ home when it started to rain.", "o": ["walk", "walked", "was walking", "were walking"], "a": 2}, {"q": "While the contractors ______ the cables, the community hall ______ as a temporary office.", "o": ["laid / served", "were laying / was serving", "laid / was serving", "were laying / served"], "a": 3}, {"q": "When the manager ______, everyone ______ hard.", "o": ["arrived / was working", "was arriving / worked", "arrived / worked", "was arriving / was working"], "a": 0}, {"q": "______ she was cooking, the phone rang.", "o": ["When", "While", "Then", "During"], "a": 1}, {"q": "He ______ the door, ______ his coat and ______ out.", "o": ["opened / took / went", "was opening / taking / going", "opened / was taking / went", "opening / took / went"], "a": 0}, {"q": "At 8 p.m. yesterday, the team ______ the final connections.", "o": ["tested", "was testing", "were testing", "test"], "a": 1}, {"q": "According to the passage, what were the factories doing for years?", "o": ["Closing down slowly", "Releasing waste water into the river", "Testing the water quality", "Helping local families"], "a": 1}, {"q": "What did the students do in 2019?", "o": ["They closed two factories.", "They wrote a development plan.", "They tested the water and published the results.", "They asked fishermen for help."], "a": 2}, {"q": "The word **\"They\"** in paragraph 2 refers to ______.", "o": ["factories", "the council", "students", "families"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The council acted within three months.", "All the factories were closed.", "The fish have completely returned.", "The students worked for the council."], "a": 0}]}, {"id": 7, "month": "10", "title": "Thì Hiện Tại Hoàn Thành", "theme": "Cities of the future", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại hoàn thành** dùng cho việc xảy ra trong quá khứ nhưng **còn nối với hiện tại** — hoặc còn kéo dài, hoặc kết quả còn tồn tại.\n\n```\nHiện tại hoàn thành:  ●═══════════════►\n                      ↑              ↑\n                 bắt đầu trong    còn đến\n                   quá khứ         bây giờ\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc kéo dài đến hiện tại** | *We **have lived** here since 2019.* |\n| **Kết quả còn tồn tại** | *Speeds **have improved** significantly.* |\n| **Kinh nghiệm** (không rõ thời điểm) | *I **have never seen** such a result.* |\n| **Việc vừa mới xảy ra** | *She **has just finished** the report.* |\n\n### Dấu hiệu nhận biết\n\n| Từ khoá | Vị trí |\n|---|---|\n| **since** + mốc thời gian | since 2019 · since March |\n| **for** + khoảng thời gian | for ten years · for six months |\n| **already · just · never · ever** | giữa `have` và V3 |\n| **yet** | cuối câu phủ định và nghi vấn |\n| **so far · up to now · recently · over the past…** | đầu hoặc cuối câu |\n\n### 📌 Hiện tại hoàn thành tiếp diễn\n\nDùng khi nhấn **quá trình kéo dài**, không nhấn kết quả:\n\n*They **have been working** here since June.* (nhấn: làm suốt từ tháng 6)\n*They **have worked** on three projects.* (nhấn: kết quả — ba dự án)"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + have/has + V3 | *The council **has laid** 20 km of cable.* |\n| Phủ định | S + have/has not + V3 | *She **hasn't finished** the report yet.* |\n| Nghi vấn | Have/Has + S + V3? | ***Have** you **ever visited** a solar plant?* |\n| HTHT tiếp diễn | S + have/has been + V-ing | *They **have been waiting** for an hour.* |\n\n**20 động từ bất quy tắc (dạng V3):**\n\n| Nguyên thể | V3 | Nguyên thể | V3 |\n|---|---|---|---|\n| be | been | lead | led |\n| begin | begun | leave | left |\n| build | built | make | made |\n| buy | bought | rise | risen |\n| come | come | see | seen |\n| do | done | send | sent |\n| find | found | take | taken |\n| give | given | teach | taught |\n| go | gone | think | thought |\n| hold | held | write | written |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 SMART CITIES\n\n> Over the past ten years, several Asian cities have introduced \"smart\" systems to manage daily life. Singapore has installed sensors that count traffic and adjust the lights automatically.\n>\n> Seoul has taken a different path. The city has built a free public wifi network covering almost every street, and residents have used it to report problems such as broken pavements.\n>\n> These systems have not solved every problem. Critics say that they have created new concerns about privacy, because sensors collect a large amount of personal data. So far, no city has found a perfect balance.\n\n*(96 từ)*\n\n\n\n**1.** According to the passage, Singapore ______.\n\n**2.** How do Seoul residents use the wifi network?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "keep up with", "p": "phr v", "e": "to move or change at the same speed as something", "v": ""}, {"t": "rely on", "p": "phr v", "e": "to depend on someone or something", "v": ""}, {"t": "deal with", "p": "phr v", "e": "to take action to solve a problem", "v": ""}, {"t": "a large amount of", "p": "quant phr", "e": "a lot of something that cannot be counted", "v": ""}, {"t": "in the long run", "p": "prep phr", "e": "over a long period of time in the future", "v": ""}], "quiz": [{"q": "We ______ in this building since 2019.", "o": ["work", "worked", "have worked", "are working"], "a": 2}, {"q": "She ______ the report yet.", "o": ["doesn't finish", "didn't finish", "hasn't finished", "isn't finishing"], "a": 2}, {"q": "Broadband reliability ______ considerably over the past five years.", "o": ["improves", "improved", "has improved", "is improving"], "a": 2}, {"q": "I ______ never ______ such an impressive result.", "o": ["have / seen", "have / saw", "did / see", "am / seeing"], "a": 0}, {"q": "The scheme ______ for six months so far.", "o": ["runs", "ran", "has run", "is running"], "a": 2}, {"q": "______ you ever ______ to Singapore?", "o": ["Did / go", "Have / been", "Are / going", "Do / go"], "a": 1}, {"q": "According to the passage, Singapore ______.", "o": ["has built a free wifi network", "has installed sensors to manage traffic", "has solved its privacy problems", "has stopped collecting data"], "a": 1}, {"q": "How do Seoul residents use the wifi network?", "o": ["To watch films", "To pay for transport", "To report problems in the city", "To count traffic"], "a": 2}, {"q": "The word **\"they\"** in paragraph 3 refers to ______.", "o": ["critics", "residents", "these systems", "cities"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Smart systems have solved all urban problems.", "No city has achieved a perfect balance so far.", "Seoul has installed traffic sensors.", "Privacy concerns have disappeared."], "a": 1}]}, {"id": 8, "month": "10", "title": "Đối Chiếu Hiện Tại Hoàn Thành Và Quá Khứ Đơn", "theme": "Life stories", "blocks": [{"h": "Mở đầu", "md": "> **Buổi đối chiếu quan trọng nhất tháng.** Đây là câu hỏi ra nhiều nhất trong phần điền từ của đề thi."}, {"h": "① NGỮ PHÁP", "md": "> **Quá khứ đơn** = việc **cắt đứt** với hiện tại — đã xong, có mốc thời gian rõ.\n> **Hiện tại hoàn thành** = việc **còn nối** với hiện tại — còn kéo dài, hoặc kết quả còn đó.\n\n```\nQuá khứ đơn:          ●──────────────  (xong, không liên quan bây giờ)\nHiện tại hoàn thành:  ●══════════════► (còn nối tới bây giờ)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **QUÁ KHỨ ĐƠN** | **HIỆN TẠI HOÀN THÀNH** |\n|---|---|---|\n| **Dùng cho** | Việc xong hẳn, có mốc quá khứ | Việc kéo dài đến nay · kết quả còn tồn tại · kinh nghiệm |\n| **Dấu hiệu** | yesterday · last week · in 2020 · ago · when I was young | since · for · already · yet · just · ever · never · so far · up to now |\n| **Ví dụ** | *I **finished** the report **yesterday**.* | *I **have finished** the report.* (nên giờ rảnh) |\n\n### 🔴 QUY TẮC VÀNG\n\n> **Câu đã có mốc thời gian quá khứ cụ thể** (`yesterday`, `last week`, `in 2020`, `ago`) → **CẤM** dùng hiện tại hoàn thành. Bắt buộc quá khứ đơn.\n\n❌ *I **have finished** the report yesterday.*\n✅ *I **finished** the report yesterday.*\n\n### Ba cặp câu đối chiếu\n\n| Quá khứ đơn | Hiện tại hoàn thành |\n|---|---|\n| *She **lived** in Hue for six years.* (giờ không còn ở đó) | *She **has lived** in Hue for six years.* (vẫn đang ở) |\n| ***Did** you **see** the film?* (buổi chiếu đã qua) | ***Have** you **seen** the film?* (bất cứ lúc nào đến giờ) |\n| *He **worked** here in 2020.* (xong) | *He **has worked** here since 2020.* (vẫn làm) |\n\n### 📌 Phân biệt `since` và `for`\n\n| Từ | Đi với | Ví dụ |\n|---|---|---|\n| **since** | **mốc** thời gian | since 2019 · since March · since I was ten |\n| **for** | **khoảng** thời gian | for ten years · for six months · for a week |"}, {"h": "③ CẤU TRÚC", "md": "| Thì | Công thức | Ví dụ |\n|---|---|---|\n| Quá khứ đơn | S + V2/V-ed | *They **installed** the bins last week.* |\n| Hiện tại hoàn thành | S + have/has + V3 | *They **have installed** 200 bins so far.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A LIFE IN SCIENCE\n\n> Marie Curie was born in Poland in 1867. She moved to Paris in 1891 because Polish universities did not accept women at that time.\n>\n> In 1903, she won the Nobel Prize in Physics, and eight years later she won a second Nobel Prize in Chemistry. No woman had done this before.\n>\n> Since her death in 1934, her work has influenced generations of scientists. Her notebooks are still too dangerous to touch, and researchers have kept them in lead boxes for almost ninety years.\n\n*(88 từ)*\n\n\n\n**1.** Why did Marie Curie move to Paris?\n\n**2.** According to the passage, Marie Curie ______.\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be born in", "p": "v phr", "e": "to come into the world in a place or year", "v": ""}, {"t": "grow up", "p": "phr v", "e": "to develop from a child into an adult", "v": ""}, {"t": "devote oneself to", "p": "v phr", "e": "to give all your time and effort to something", "v": ""}, {"t": "be known for", "p": "adj phr", "e": "to be famous because of something", "v": ""}, {"t": "achieve success", "p": "v phr", "e": "to reach something important that you wanted", "v": ""}], "quiz": [{"q": "The company ______ its safety policy last March.", "o": ["updates", "updated", "has updated", "is updating"], "a": 1}, {"q": "We ______ in this building since 2019.", "o": ["work", "worked", "have worked", "are working"], "a": 2}, {"q": "She ______ in Hue for six years before she moved to Da Nang.", "o": ["lives", "lived", "has lived", "is living"], "a": 1}, {"q": "Costs ______ sharply in 2021, but they ______ steady since then.", "o": ["rose / remained", "have risen / remained", "rose / have remained", "have risen / have remained"], "a": 2}, {"q": "______ you ______ the new manager yet?", "o": ["Did / meet", "Have / met", "Do / meet", "Are / meeting"], "a": 1}, {"q": "He ______ three emails this morning. *(vẫn còn là buổi sáng)*", "o": ["writes", "wrote", "has written", "is writing"], "a": 2}, {"q": "Why did Marie Curie move to Paris?", "o": ["She won a prize there.", "Polish universities did not accept women.", "Her family lived there.", "She wanted to study chemistry only."], "a": 1}, {"q": "According to the passage, Marie Curie ______.", "o": ["won two Nobel Prizes", "was the first person to win a Nobel Prize", "stopped working after 1903", "was born in France"], "a": 0}, {"q": "The word **\"them\"** in paragraph 3 refers to ______.", "o": ["scientists", "generations", "her notebooks", "lead boxes"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Her notebooks are safe to touch now.", "Her work has influenced later scientists.", "She won both prizes in the same year.", "She returned to Poland in 1934."], "a": 1}]}, {"id": 9, "month": "10", "title": "Thì Quá Khứ Hoàn Thành", "theme": "Urbanisation", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ hoàn thành** dùng cho việc xảy ra **trước một việc quá khứ khác**.\n\n```\nQuá khứ hoàn thành:  ●────►\nQuá khứ đơn:                ●────────  bây giờ\n                     việc 1    việc 2\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc xảy ra trước một việc quá khứ khác** | *By the time we arrived, the hall **had been** cleaned.* |\n| **Nguyên nhân của việc quá khứ** | *He was tired because he **had worked** all night.* |\n| **Sau `before`, `after`, `by the time`** | *She **had left** before I called.* |\n\n### Dấu hiệu nhận biết\n\n`by the time · before · after · by + mốc quá khứ (by 2020) · already · never…before · when`\n\n### 📌 Ba mẫu câu chuẩn\n\n| Mẫu | Ví dụ |\n|---|---|\n| By the time + QKĐ, S + **had** V3 | *By the time the survey started, half the households **had signed** up.* |\n| Before + QKĐ, S + **had** V3 | *Before the new bins arrived, the school **had used** old containers.* |\n| S + **had** V3 + before/when + QKĐ | *She **had finished** the report before the meeting began.* |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + had + V3 | *The scheme **had started** before I joined.* |\n| Phủ định | S + had not + V3 | *He **hadn't applied** before the deadline.* |\n| Nghi vấn | Had + S + V3? | ***Had** they **left** when you arrived?* |\n\n⚠️ `had` dùng cho **mọi chủ ngữ** — không đổi theo ngôi."}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 A CITY THAT GREW TOO FAST\n\n> By 1990, the population of the city had doubled in only fifteen years. Thousands of families had moved in from the countryside, but the council had not built enough housing.\n>\n> When the new mayor took office in 1992, she found that the water system had not changed since the 1950s. Many districts had never received a regular supply.\n>\n> Over the next ten years, the council built two reservoirs and repaired the old pipes. By 2005, almost every household had gained access to clean water, although traffic remained a serious problem.\n\n*(95 từ)*\n\n\n\n**1.** What had happened by 1990?\n\n**2.** According to the passage, in 1992 the water system ______.\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "move in / move out", "p": "phr v", "e": "to start / stop living in a place", "v": ""}, {"t": "gain access to", "p": "v phr", "e": "to become able to use something", "v": ""}, {"t": "put pressure on", "p": "v phr", "e": "to create difficulty for a system or person", "v": ""}, {"t": "set up", "p": "phr v", "e": "to create or start something", "v": ""}, {"t": "run out of", "p": "phr v", "e": "to have no more of something left", "v": ""}], "quiz": [{"q": "When I arrived, the meeting ______ already ______.", "o": ["has / begun", "had / begun", "was / beginning", "did / begin"], "a": 1}, {"q": "He ______ for the grant three times before he succeeded.", "o": ["applies", "applied", "has applied", "had applied"], "a": 3}, {"q": "Before the new bins arrived, the school ______ ordinary containers.", "o": ["uses", "used", "has used", "had used"], "a": 3}, {"q": "By 2021, the company ______ three new branches.", "o": ["opens", "opened", "has opened", "had opened"], "a": 3}, {"q": "She ______ in Hanoi for six years before she moved.", "o": ["lives", "lived", "has lived", "had lived"], "a": 3}, {"q": "They were tired because they ______ all night.", "o": ["work", "worked", "have worked", "had worked"], "a": 3}, {"q": "What had happened by 1990?", "o": ["The council had built enough housing.", "The population had doubled.", "The water system had been replaced.", "The new mayor had taken office."], "a": 1}, {"q": "According to the passage, in 1992 the water system ______.", "o": ["was completely new", "had not changed since the 1950s", "served every district", "had just been repaired"], "a": 1}, {"q": "The word **\"she\"** in paragraph 2 refers to ______.", "o": ["a family member", "the new mayor", "a resident", "the council"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Traffic was solved by 2005.", "Most households had clean water by 2005.", "The council built three reservoirs.", "Nobody moved in from the countryside."], "a": 1}]}, {"id": 10, "month": "10", "title": "Tương Lai: Will Và Be Going To", "theme": "The world of work", "blocks": [{"h": "① NGỮ PHÁP", "md": "Hai cách nói về tương lai, khác nhau ở **mức độ đã quyết định**:\n\n> **`will`** = quyết định **ngay lúc nói**, dự đoán, lời hứa, **thông báo chính thức**.\n> **`be going to`** = dự định **đã có sẵn từ trước**, hoặc dự đoán **có bằng chứng nhìn thấy**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **will + V** | **be going to + V** |\n|---|---|---|\n| **Dùng cho** | Quyết định tức thì · dự đoán chủ quan · lời hứa · **tờ rơi, thông báo** | Dự định có sẵn · dự đoán có bằng chứng |\n| **Dấu hiệu** | tomorrow · next week · soon · in the future · I think/believe/hope · probably | already decided · Look at…! |\n| **Ví dụ** | *The bag is heavy — I **will help** you.* | *I **am going to apply** for that grant.* |\n| | *I think prices **will rise**.* | *Look at those clouds — it **is going to rain**.* |\n\n### 📌 Hiện tại tiếp diễn chỉ tương lai\n\nDùng cho **lịch hẹn đã sắp xếp cụ thể** (có giờ, có địa điểm):\n*I **am meeting** the supervisor at 3 p.m. tomorrow.*\n\n### 💡 Mẹo cho đề thi\n\nTrong **tờ rơi, thông báo, quảng cáo** — thể loại chiếm phần lớn dạng điền từ — gần như luôn dùng **`will`** hoặc **`will be + V3`** (bị động tương lai)."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Will khẳng định | S + will + V | *Applicants **will get** a certificate.* |\n| Will phủ định | S + won't + V | *The centre **won't open** on holidays.* |\n| Will nghi vấn | Will + S + V? | ***Will** the drill **take** long?* |\n| Be going to | S + am/is/are going to + V | *We **are going to launch** the campaign.* |\n| HTTD chỉ tương lai | S + am/is/are + V-ing + thời gian | *She **is presenting** at 10 a.m. tomorrow.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 SUMMER JOBS FOR STUDENTS\n\n> Techworld Magazine is pleased to announce two part-time positions for undergraduates this summer. Successful applicants will work three days a week and will receive a certificate at the end.\n>\n> We are going to hold interviews in the first week of June. Candidates who reach the final round will meet the editor in person.\n>\n> No previous experience is required, as we are going to provide full training. Applications should be submitted by 30 May. We think this is going to be an excellent opportunity for students who want to start a career in technology.\n\n*(97 từ)*\n\n\n\n**1.** According to the passage, successful applicants ______.\n\n**2.** When will the interviews take place?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "apply for", "p": "phr v", "e": "to ask formally for a job or a place", "v": ""}, {"t": "be suitable for", "p": "adj phr", "e": "to be right for a particular purpose or person", "v": ""}, {"t": "hands-on experience", "p": "n phr", "e": "practical experience of doing something yourself", "v": ""}, {"t": "full training", "p": "n phr", "e": "complete instruction in how to do a job", "v": ""}, {"t": "start a career", "p": "v phr", "e": "to begin working in a particular profession", "v": ""}], "quiz": [{"q": "A: The phone's ringing. B: I ______ answer it.", "o": ["will", "am going to", "am", "would"], "a": 0}, {"q": "She has bought the tickets — she ______ visit Da Nang next week.", "o": ["will", "is going to", "would", "was going to"], "a": 1}, {"q": "I think the council ______ approve the budget.", "o": ["will", "is going to", "would", "going to"], "a": 0}, {"q": "Look at that crack — the wall ______ collapse.", "o": ["will", "is going to", "would", "is"], "a": 1}, {"q": "Successful applicants ______ plenty of hands-on experience.", "o": ["get", "will get", "are getting", "got"], "a": 1}, {"q": "I ______ the client at 11 a.m. tomorrow. *(lịch hẹn đã đặt)*", "o": ["meet", "will meet", "am meeting", "met"], "a": 2}, {"q": "According to the passage, successful applicants ______.", "o": ["will work five days a week", "will receive a certificate", "must have previous experience", "will be paid in June"], "a": 1}, {"q": "When will the interviews take place?", "o": ["In the first week of June", "On 30 May", "At the end of the summer", "Immediately after applying"], "a": 0}, {"q": "The word **\"we\"** in paragraph 3 refers to ______.", "o": ["the applicants", "the students", "the magazine", "the editors"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Applicants need experience in technology.", "Training will be provided by the magazine.", "Everyone will meet the editor.", "Applications close in June."], "a": 1}]}, {"id": 11, "month": "10", "title": "Tương Lai Tiếp Diễn Và Tương Lai Hoàn Thành", "theme": "Global warming", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Tương lai tiếp diễn** = việc **sẽ đang diễn ra** tại một thời điểm trong tương lai.\n> **Tương lai hoàn thành** = việc **sẽ hoàn tất trước** một mốc trong tương lai.\n\n```\n                bây giờ ──────────────── mốc tương lai ────\nTương lai hoàn thành:  ═══════════►│  (xong TRƯỚC mốc)\nTương lai tiếp diễn:              ═╪═  (đang diễn ra ĐÚNG lúc)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **TƯƠNG LAI TIẾP DIỄN** | **TƯƠNG LAI HOÀN THÀNH** |\n|---|---|---|\n| **Dùng cho** | Sẽ đang làm gì tại một mốc tương lai | Sẽ xong trước một mốc tương lai |\n| **Dấu hiệu** | at this time tomorrow · at 8 p.m. next Monday · this time next week | **by** + mốc (by 2030, by the end of…) · by the time + hiện tại đơn |\n| **Ví dụ** | *This time next week, we **will be working** in the new office.* | *By June, the team **will have completed** the survey.* |\n\n### 📌 Bẫy `by the time`\n\nSau `by the time` dùng **hiện tại đơn**, vế chính dùng **tương lai hoàn thành**:\n*By the time you **arrive**, we **will have finished** the briefing.*"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| TL tiếp diễn | S + will be + V-ing | *At 10 a.m. they **will be testing** the alarm.* |\n| TL tiếp diễn phủ định | S + won't be + V-ing | *We **won't be using** the old system.* |\n| TL hoàn thành | S + will have + V3 | *By 2030, the city **will have converted** its buses.* |\n| TL hoàn thành phủ định | S + won't have + V3 | *They **won't have finished** by Friday.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 TARGETS FOR 2030\n\n> By 2030, many countries will have replaced a large part of their coal capacity with wind and solar power. Some governments say that they will have closed every coal plant by that date.\n>\n> This time next year, engineers in three Asian countries will be testing a new type of floating solar panel. If the trials succeed, the panels will be installed on reservoirs, where they take up no farmland.\n>\n> Scientists warn, however, that targets alone will not reduce emissions. By the time these plans are complete, global demand for electricity will have risen by almost a third.\n\n*(100 từ)*\n\n\n\n**1.** According to the passage, by 2030 many countries ______.\n\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "cut emissions", "p": "v phr", "e": "to reduce the gases released into the air", "v": ""}, {"t": "take up (space)", "p": "phr v", "e": "to fill or use an amount of space", "v": ""}, {"t": "phase out", "p": "phr v", "e": "to stop using something gradually", "v": ""}, {"t": "contribute to", "p": "phr v", "e": "to be one of the causes of something", "v": ""}, {"t": "meet a target", "p": "v phr", "e": "to achieve a goal that was set", "v": ""}], "quiz": [{"q": "By next Friday, we ______ the audit.", "o": ["complete", "will complete", "will have completed", "are completing"], "a": 2}, {"q": "This time next month, they ______ in the new building.", "o": ["live", "will live", "will be living", "will have lived"], "a": 2}, {"q": "By the time you read this, I ______ .", "o": ["leave", "will leave", "will be leaving", "will have left"], "a": 3}, {"q": "At 8 p.m. tonight, the team ______ the system.", "o": ["will still test", "will still be testing", "will have tested", "tests"], "a": 1}, {"q": "By 2028, emissions ______ by 40%.", "o": ["fall", "will fall", "will be falling", "will have fallen"], "a": 3}, {"q": "Don't call at 7 — I ______ home then.", "o": ["drive", "will drive", "will be driving", "will have driven"], "a": 2}, {"q": "According to the passage, by 2030 many countries ______.", "o": ["will have built more coal plants", "will have replaced much of their coal capacity", "will be testing solar panels", "will have reduced electricity demand"], "a": 1}, {"q": "Where will the new solar panels be installed?", "o": ["On farmland", "On reservoirs", "On coal plants", "On rooftops"], "a": 1}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["engineers", "countries", "the panels", "reservoirs"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Targets alone are enough to cut emissions.", "Electricity demand will fall by 2030.", "Scientists have some doubts about the plans.", "Every country will close its coal plants."], "a": 2}]}, {"id": 12, "month": "10", "title": "Tổng Ôn 8 Thì", "theme": "Green living", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng ôn.** Không có kiến thức mới — hệ thống hoá và luyện tập."}, {"h": "① BẢNG TỔNG HỢP 8 THÌ", "md": "| Thì | Công thức | Dấu hiệu chính | Ví dụ |\n|---|---|---|---|\n| **Hiện tại đơn** | S + V(s/es) | every · always · usually | *The centre **opens** at 8.* |\n| **Hiện tại tiếp diễn** | S + am/is/are + V-ing | now · at the moment · Look! | *They **are testing** it now.* |\n| **Quá khứ đơn** | S + V2/ed | yesterday · ago · in 2020 | *We **signed** it last week.* |\n| **Quá khứ tiếp diễn** | S + was/were + V-ing | while · at 8 p.m. yesterday | *He **was working** then.* |\n| **Hiện tại hoàn thành** | S + have/has + V3 | since · for · already · yet · so far | *Costs **have risen** since May.* |\n| **Quá khứ hoàn thành** | S + had + V3 | by the time · before + QKĐ | *It **had started** before I came.* |\n| **Tương lai đơn** | S + will + V | tomorrow · next · soon | *We **will announce** it Friday.* |\n| **Tương lai hoàn thành** | S + will have + V3 | by + mốc tương lai | *By June we **will have finished**.* |"}, {"h": "② QUY TRÌNH CHỌN THÌ — 3 BƯỚC", "md": "**Bước 1 — Việc xảy ra khi nào?** Quá khứ · hiện tại · tương lai.\n\n**Bước 2 — Việc đã xong hay đang diễn ra?**\n\n| | Xong hẳn | Đang diễn ra | Xong trước một mốc |\n|---|---|---|---|\n| Quá khứ | quá khứ đơn | quá khứ tiếp diễn | quá khứ hoàn thành |\n| Hiện tại | hiện tại đơn | hiện tại tiếp diễn | hiện tại hoàn thành |\n| Tương lai | tương lai đơn | tương lai tiếp diễn | tương lai hoàn thành |\n\n**Bước 3 — Tìm dấu hiệu trong câu để xác nhận.** Nếu không có dấu hiệu, nhìn câu trước và câu sau."}, {"h": "③ BỐN CẶP DỄ NHẦM — BẢNG KIỂM", "md": "| Cặp | Phân biệt bằng |\n|---|---|\n| HTĐ ↔ HTTD | Có `now / at the moment / Look!` không? Động từ có phải trạng thái không? |\n| QKĐ ↔ QKTD | Có `while` không? Việc nào là nền, việc nào cắt ngang? |\n| QKĐ ↔ HTHT | 🔴 **Có mốc quá khứ cụ thể không?** Có → bắt buộc quá khứ đơn |\n| QKHT ↔ QKĐ | Có hai việc quá khứ không? Việc nào xảy ra trước? |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 LIVING WITH LESS PLASTIC\n\n> Ten years ago, few Vietnamese households thought about plastic waste. Most families used plastic bags for every purchase, and nobody had asked where the bags went afterwards.\n>\n> Since 2020, the picture has changed. Many supermarkets have replaced plastic bags with paper ones, and a growing number of shoppers are bringing their own containers.\n>\n> The change is not complete. Researchers estimate that the country still produces almost two million tonnes of plastic waste every year. By 2030, however, the government hopes that it will have reduced this figure by a third.\n\n*(98 từ)*\n\n\n\n**1.** According to the passage, ten years ago most families ______.\n\n**2.** What has changed since 2020?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "cut down on", "p": "phr v", "e": "to use less of something", "v": ""}, {"t": "replace A with B", "p": "v phr", "e": "to start using B instead of A", "v": ""}, {"t": "raise awareness of", "p": "v phr", "e": "to make people know about a problem", "v": ""}, {"t": "reduce waste", "p": "v phr", "e": "to produce less rubbish", "v": ""}, {"t": "be aware of", "p": "adj phr", "e": "to know that something exists", "v": ""}], "quiz": [{"q": "The council ______ the scheme since 2024.", "o": ["runs", "ran", "has run", "had run"], "a": 2}, {"q": "While the engineers ______ the line, a fault appeared.", "o": ["test", "tested", "were testing", "have tested"], "a": 2}, {"q": "By 2030, the city ______ all its buses.", "o": ["converts", "will convert", "is converting", "will have converted"], "a": 3}, {"q": "Each of the departments ______ its own budget.", "o": ["have", "has", "are having", "having"], "a": 1}, {"q": "I ______ the report yesterday.", "o": ["finish", "finished", "have finished", "had finished"], "a": 1}, {"q": "At this time next week, we ______ the conference.", "o": ["attend", "attended", "will be attending", "will have attended"], "a": 2}, {"q": "According to the passage, ten years ago most families ______.", "o": ["brought their own containers", "used plastic bags without thinking about waste", "asked where plastic bags went", "refused plastic bags at supermarkets"], "a": 1}, {"q": "What has changed since 2020?", "o": ["Plastic waste has disappeared.", "Many supermarkets have replaced plastic bags.", "The government has banned all plastic.", "Shoppers have stopped using containers."], "a": 1}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the figure", "the country", "the government", "plastic waste"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Plastic waste is no longer a problem.", "The change is still incomplete.", "The government has already met its target.", "No supermarket uses paper bags."], "a": 1}]}, {"id": 13, "month": "10", "title": "Luyện Tổng Hợp", "theme": "Ôn tập toàn tháng", "blocks": [{"h": "Mở đầu", "md": "> **Buổi luyện.** Không có phần lý thuyết — làm bài và chữa."}, {"h": "① KHỞI ĐỘNG — 8 THÌ TRONG 8 CÂU", "md": "*Mỗi câu một thì khác nhau. Gọi tên thì sau khi chọn.*"}, {"h": "② LUYỆN DẠNG ĐIỀN TỪ — BÀI 1", "md": "> **COMMUNITY GARDEN PROJECT**\n>\n> The Neighbourhood Association **(1)______** the launch of our community garden this spring. Before this year, the site **(2)______** empty for over a decade. At the moment, volunteers **(3)______** the soil and building raised beds. Since March, more than fifty families **(4)______** to take part. By the end of the summer, we **(5)______** enough vegetables to supply the whole street. Each of the members **(6)______** one small plot."}, {"h": "③ LUYỆN DẠNG ĐIỀN TỪ — BÀI 2", "md": "> **EVENING COURSE: BASIC CODING**\n>\n> City Learning Centre **(1)______** an eight-week evening course this winter. The course **(2)______** by the same instructor since 2021. Each participant **(3)______** a printed workbook on the first day. At the moment, we **(4)______** the materials, so minor changes are possible. By the time the course starts, we **(5)______** all the handouts. Places are limited, so early registration **(6)______** recommended."}, {"h": "④ LUYỆN ĐỌC HIỂU", "md": "### 📖 THE RETURN OF THE TRAM\n\n> Several European cities have reopened tram networks that they closed in the 1960s. Trams are cheaper to operate than underground lines, and they carry more passengers than buses.\n>\n> Planners who once dismissed trams as old-fashioned now regard them as a practical answer to traffic. In Bordeaux, passenger numbers have risen by 40% since the first line reopened.\n>\n> The main objection concerns disruption. When engineers were laying the new track, they closed several streets for months, and businesses along those streets reported sharp falls in trade. Cities that managed the process well paid compensation during construction. By 2030, planners expect that at least ten more cities will have started similar projects.\n\n*(112 từ)*\n\n**1.** According to the passage, trams ______.\n\n**2.** What happened in Bordeaux?\n\n\n**4.** What was the main problem during construction?\n\n**5.** Which of the following is TRUE according to the passage?\n\n**6.** What do planners expect by 2030?"}], "vocab": [], "quiz": [{"q": "The library ______ at 8 a.m. every day.", "o": ["open", "opens", "is opening", "opened"], "a": 1}, {"q": "Look! It ______ outside.", "o": ["rains", "rained", "is raining", "has rained"], "a": 2}, {"q": "We ______ the contract last Tuesday.", "o": ["sign", "signed", "have signed", "had signed"], "a": 1}, {"q": "At 9 p.m. yesterday, she ______ her report.", "o": ["writes", "wrote", "was writing", "has written"], "a": 2}, {"q": "The council ______ four projects since January.", "o": ["approves", "approved", "has approved", "had approved"], "a": 2}, {"q": "By the time we arrived, the meeting ______ .", "o": ["ends", "ended", "has ended", "had ended"], "a": 3}, {"q": "The results ______ on Friday.", "o": ["announce", "announced", "will be announced", "have announced"], "a": 2}, {"q": "By June, the team ______ the survey.", "o": ["completes", "completed", "will complete", "will have completed"], "a": 3}, {"q": "According to the passage, trams ______.", "o": ["cost more to operate than underground lines", "carry fewer passengers than buses", "are cheaper to run than underground lines", "were never used before the 1960s"], "a": 2}, {"q": "What happened in Bordeaux?", "o": ["The tram network was closed.", "Passenger numbers increased by 40%.", "Businesses refused compensation.", "Ten new lines opened."], "a": 1}]}, {"id": 14, "month": "11", "title": "Câu Bị Động Cơ Bản", "theme": "Humans and the environment", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Câu bị động** dùng khi muốn **nhấn mạnh đối tượng chịu tác động**, hoặc khi **không cần, không biết ai làm**.\n\nTờ rơi, thông báo và văn bản học thuật dùng bị động rất nhiều — đó là lý do đề thi hỏi liên tục.\n\n```\nChủ động:  They install warning signs.\nBị động:   Warning signs are installed.\n```"}, {"h": "② CÁCH SỬ DỤNG — BA CÂU HỎI NHẬN DIỆN", "md": "| Câu hỏi | Nếu trả lời là… | Kết luận |\n|---|---|---|\n| **1.** Chủ ngữ là người hay vật? | Vật (signs, bins, results, forms) | Nghi ngờ bị động |\n| **2.** Chủ ngữ có **tự làm** được việc đó không? | Không — biển báo không tự lắp | → Bị động |\n| **3.** Sau chỗ trống có **tân ngữ** không? | Không có | → Bị động |\n\n📌 Dấu hiệu chắc chắn nhất: có cụm **`by + người/tổ chức`** phía sau."}, {"h": "③ CẤU TRÚC", "md": "**Công thức tổng quát:** giữ nguyên thì ở động từ `be`, động từ chính **luôn về V3**.\n\n| Thì | Bị động | Ví dụ |\n|---|---|---|\n| Hiện tại đơn | **am/is/are + V3** | *Reports **are sent** every Monday.* |\n| Hiện tại tiếp diễn | **am/is/are being + V3** | *The line **is being tested** now.* |\n| Quá khứ đơn | **was/were + V3** | *The bins **were installed** last week.* |\n| Quá khứ tiếp diễn | **was/were being + V3** | *The road **was being repaired**.* |\n| Hiện tại hoàn thành | **have/has been + V3** | *The policy **has been approved**.* |\n| Quá khứ hoàn thành | **had been + V3** | *The hall **had been cleaned**.* |\n| Tương lai đơn | **will be + V3** | *Signs **will be installed** next month.* |\n| Tương lai hoàn thành | **will have been + V3** | *All forms **will have been processed**.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 WHERE DOES OUR RUBBISH GO?\n\n> Every day, around ten thousand tonnes of household waste are collected in our city. The waste is taken to three sorting centres outside the ring road.\n>\n> At the centres, paper, glass and metal are separated by hand and by machine. These materials are then sold to factories, where they are turned into new products.\n>\n> The rest is buried in landfill sites. Last year, almost sixty per cent of the city's waste was buried in this way. A new plan was announced in March, and by 2030 that figure will have been reduced to thirty per cent.\n\n*(105 từ)*\n\n\n\n\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be made of", "p": "v phr", "e": "to be produced from a particular material", "v": ""}, {"t": "be used for", "p": "v phr", "e": "to have a particular purpose", "v": ""}, {"t": "be turned into", "p": "v phr", "e": "to be changed into something different", "v": ""}, {"t": "sorting centre", "p": "n phr", "e": "a place where waste is separated into types", "v": ""}, {"t": "landfill site", "p": "n phr", "e": "a place where rubbish is buried in the ground", "v": ""}], "quiz": [{"q": "The reports ______ to the manager every Monday.", "o": ["send", "sends", "are sent", "sending"], "a": 2}, {"q": "These bins ______ last week.", "o": ["installed", "were installed", "have installed", "installing"], "a": 1}, {"q": "The equipment ______ at the moment.", "o": ["checks", "is checking", "is being checked", "checked"], "a": 2}, {"q": "The new policy ______ by the board already.", "o": ["approved", "has approved", "has been approved", "is approving"], "a": 2}, {"q": "Plastic waste ______ by volunteers every weekend.", "o": ["removes", "is removed", "is removing", "removed"], "a": 1}, {"q": "By the time we arrived, the hall ______ already ______.", "o": ["has / cleaned", "had / been cleaned", "was / cleaning", "had / cleaned"], "a": 1}, {"q": "According to the passage, where is the waste taken first?", "o": ["To landfill sites", "To three sorting centres", "To factories", "To the ring road"], "a": 1}, {"q": "How are paper, glass and metal separated?", "o": ["Only by machine", "Only by hand", "By hand and by machine", "By the factories"], "a": 2}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["factories", "these materials", "the centres", "new products"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All the city's waste is recycled.", "Most of the waste was buried last year.", "The new plan was announced in 2030.", "No materials are sold to factories."], "a": 1}]}, {"id": 15, "month": "11", "title": "Bị Động Với Modal Và Tương Lai", "theme": "Workplace safety", "blocks": [{"h": "① NGỮ PHÁP", "md": "Khi câu có `must / should / can / may / have to / be going to`, công thức bị động **không đổi thì** — chỉ chèn `be` vào giữa.\n\n> **modal + be + V3**"}, {"h": "② CÁCH SỬ DỤNG", "md": "Dạng này ra rất nhiều trong tờ rơi, vì tờ rơi = **quy định + kế hoạch**:\n\n| Nội dung | Cấu trúc | Ví dụ |\n|---|---|---|\n| Quy định bắt buộc | `must be + V3` | *Helmets **must be worn**.* |\n| Bắt buộc do quy định | `have to be + V3` | *Receipts **have to be shown**.* |\n| Khuyến nghị | `should be + V3` · `ought to be + V3` | *Forms **should be submitted** early.* |\n| Cho phép, khả năng | `can be + V3` · `may be + V3` | *Items **can be exchanged**.* |\n| Cấm | `must not be + V3` · `cannot be + V3` | *The funding **must not be used** for equipment.* |\n| Kế hoạch | `will be + V3` · `is going to be + V3` | *Cables **are going to be laid** next week.* |\n\n⚠️ **Tuyệt đối không tồn tại:** ~~must been~~ · ~~should been~~ · ~~will been~~ · ~~can been~~"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| must / should / can / may / might + **be + V3** | *Helmets **must be worn** at all times.* |\n| have to / has to / had to + **be + V3** | *Your receipt **has to be shown** at the counter.* |\n| ought to + **be + V3** | *The fee **ought to be paid** in advance.* |\n| be going to + **be + V3** | *Cables **are going to be laid** next week.* |\n| will + **be + V3** | *Seats **will be offered** to the waiting list.* |\n| must not / cannot + **be + V3** | *Photographs **cannot be taken** here.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 SAFETY RULES AT THE WAREHOUSE\n\n> All visitors must be signed in at reception before entering the warehouse. Hard hats and safety shoes must be worn in every area except the office.\n>\n> Forklift trucks may only be operated by trained staff. If a machine is faulty, it should be reported immediately and must not be used until an engineer has checked it.\n>\n> Emergency exits must be kept clear at all times. Next month, new floor markings are going to be painted around each exit, and a short training session will be held for every department.\n\n*(97 từ)*\n\n\n\n**1.** According to the passage, visitors ______.\n\n**2.** What should happen if a machine is faulty?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be required to", "p": "v phr", "e": "to have to do something because of a rule", "v": ""}, {"t": "be allowed to", "p": "v phr", "e": "to have permission to do something", "v": ""}, {"t": "keep (sth) clear", "p": "v phr", "e": "to make sure nothing blocks a space", "v": ""}, {"t": "report a fault", "p": "v phr", "e": "to tell someone that something is broken", "v": ""}, {"t": "comply with", "p": "phr v", "e": "to obey a rule or an order", "v": ""}], "quiz": [{"q": "Damaged goods ______ within seven days.", "o": ["can exchange", "can be exchanged", "can being exchanged", "can been exchanged"], "a": 1}, {"q": "The form ______ before the deadline.", "o": ["must sign", "must be signed", "must signing", "must been signed"], "a": 1}, {"q": "This equipment ______ by untrained staff.", "o": ["should not use", "should not be used", "should not using", "should not been used"], "a": 1}, {"q": "The grant ______ for fieldwork only.", "o": ["is going to use", "is going to be used", "is going to using", "going to be used"], "a": 1}, {"q": "Cables ______ along existing verges to minimise disruption.", "o": ["may place", "may be placed", "may placing", "may been placed"], "a": 1}, {"q": "The mid-term report ______ by 15 December.", "o": ["ought to submit", "ought to be submitted", "ought submitting", "ought been submitted"], "a": 1}, {"q": "According to the passage, visitors ______.", "o": ["can enter the warehouse directly", "must be signed in at reception", "do not need safety shoes", "must operate the forklift trucks"], "a": 1}, {"q": "What should happen if a machine is faulty?", "o": ["It should be repaired by any worker.", "It should be reported and not used.", "It should be moved to the office.", "It should be used only by visitors."], "a": 1}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the report", "the engineer", "a faulty machine", "the warehouse"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Hard hats are required in the office.", "New floor markings will be painted next month.", "Anyone may operate a forklift truck.", "Emergency exits may be blocked temporarily."], "a": 1}]}, {"id": 16, "month": "11", "title": "Bị Động Đặc Biệt Và Thể Sai Khiến", "theme": "A multicultural world", "blocks": [{"h": "① NGỮ PHÁP", "md": "Ba cấu trúc nâng cao, dùng khi **không rõ hoặc không cần nêu chủ thể**:\n\n> **`It is said that…`** — ý kiến chung, không rõ ai nói.\n> **`S + is said to V`** — cùng nghĩa, đưa chủ ngữ lên trước.\n> **`have / get + something + V3`** — thuê người khác làm việc gì."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Cấu trúc | Dùng khi | Ví dụ |\n|---|---|---|\n| `It is said/believed/thought that + mệnh đề` | Ý kiến chung | *It is assumed that the owner is rich.* |\n| `S + is said/believed to + V` | Cùng nghĩa, đảo chủ ngữ lên trước | *The owner is assumed to be rich.* |\n| `S + is said to have + V3` | Việc xảy ra **trước** | *He is believed to have applied twice.* |\n| `have/get + O + V3` | Thuê người làm | *We had the signs installed.* |\n| `being + V3` sau giới từ | Bị động dạng V-ing | *After being informed, he appealed.* |\n\n⚠️ **Phân biệt:**\n- *We **had the equipment checked**.* → ta thuê người kiểm tra.\n- *The equipment **was checked**.* → thiết bị được kiểm tra, không nói ai làm."}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| It + is/was + said/believed/thought/assumed/reported + that + S + V | *It is reported that speeds have improved.* |\n| S + is/was + said/believed + **to V** *(cùng thời)* | *Speeds are reported to be improving.* |\n| S + is/was + said + **to have + V3** *(việc trước)* | *He is believed to have left.* |\n| S + **have/has/had** + O + **V3** | *They had the office redecorated.* |\n| S + **get** + O + **V3** | *She got her report proofread.* |\n| giới từ + **being + V3** | *After being notified, they confirmed.* |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 THE ORIGINS OF TET\n\n> Tet is believed to have been celebrated in Viet Nam for more than two thousand years. It is said that the festival began as a way of marking the start of the farming year.\n>\n> In the weeks before Tet, houses are cleaned from top to bottom. Many families have their homes repainted, and older relatives get their photographs framed for the family altar.\n>\n> The festival is thought to be the most important event in the Vietnamese calendar. Although some traditions have changed, the central idea has not: Tet is a time when families are brought together.\n\n*(101 từ)*\n\n\n\n**1.** According to the passage, Tet is believed to have started ______.\n\n**2.** What do many families do before Tet?\n\n\n**4.** Which of the following is TRUE according to the passage?"}], "vocab": [{"t": "be brought together", "p": "v phr", "e": "to be united in one place", "v": ""}, {"t": "take place", "p": "v phr", "e": "to happen", "v": ""}, {"t": "date back to", "p": "phr v", "e": "to have existed since a particular time", "v": ""}, {"t": "hand down", "p": "phr v", "e": "to pass something to younger people", "v": ""}, {"t": "be thought to be", "p": "v phr", "e": "to be considered by people to be", "v": ""}], "quiz": [{"q": "______ that wealth is often invisible.", "o": ["It says", "It is said", "It said", "Is said"], "a": 1}, {"q": "The scheme ______ to be highly effective.", "o": ["believes", "is believed", "is believing", "believed"], "a": 1}, {"q": "He ______ to have completed the course last year.", "o": ["reports", "is reported", "is reporting", "reported"], "a": 1}, {"q": "We ______ the equipment ______ by a specialist.", "o": ["had / check", "had / checked", "have / check", "had / checking"], "a": 1}, {"q": "She got her report ______ before the deadline.", "o": ["proofread", "proofreading", "to proofread", "proofreads"], "a": 0}, {"q": "After ______ of the decision, he appealed immediately.", "o": ["informing", "being informed", "informed", "to inform"], "a": 1}, {"q": "According to the passage, Tet is believed to have started ______.", "o": ["two hundred years ago", "as a way of marking the farming year", "in another country", "as a religious ceremony only"], "a": 1}, {"q": "What do many families do before Tet?", "o": ["They move to a new house.", "They have their homes repainted.", "They stop cleaning.", "They sell their photographs."], "a": 1}, {"q": "The word **\"It\"** in paragraph 1 refers to ______.", "o": ["Viet Nam", "the farming year", "Tet", "the calendar"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["No tradition has changed.", "Tet brings families together.", "Tet is the least important festival.", "Houses are cleaned after Tet."], "a": 1}]}, {"id": 17, "month": "11", "title": "Word Form I: Hậu Tố Danh Từ", "theme": "Green living", "blocks": [{"h": "① NGỮ PHÁP", "md": "> Trong tiếng Anh, **đuôi từ quyết định từ loại**. Nhìn đuôi là biết loại — **không cần biết nghĩa**.\n\nĐây là kỹ thuật ăn điểm không cần vốn từ, đặc biệt quan trọng khi vốn từ còn mỏng."}, {"h": "② CÁCH SỬ DỤNG", "md": "Chỗ trống cần **danh từ** khi đứng sau:\n\n| Vị trí | Ví dụ |\n|---|---|\n| Mạo từ `a / an / the` | *the **installation** of new bins* |\n| Tính từ sở hữu `my / your / his / their` | *Your **cooperation** is essential.* |\n| Sở hữu cách `students'` | *students' **knowledge** of pollution* |\n| Tính từ | *public **awareness*** · *primary **goal*** |\n| Giới từ `of / in / for / with / about` | *a lack **of evidence*** |\n| Làm chủ ngữ của câu | ***Registration** is recommended.* |"}, {"h": "③ CẤU TRÚC — BẢNG HẬU TỐ DANH TỪ", "md": "| Hậu tố | Ví dụ | Ghi chú |\n|---|---|---|\n| **-tion / -sion** | pollution · decision · cooperation · installation | phổ biến nhất |\n| **-ment** | development · equipment · government · improvement | từ động từ |\n| **-ness** | awareness · happiness · weakness · illness | từ tính từ |\n| **-ity / -ty** | ability · safety · responsibility · community | từ tính từ |\n| **-ance / -ence** | importance · difference · performance · confidence | |\n| **-er / -or / -ist** | employer · supervisor · scientist | chỉ **người làm** |\n| **-ee** | employee · trainee · interviewee | chỉ **người chịu tác động** |\n| **-ship / -hood** | leadership · membership · childhood | trạng thái |\n| **-al** | proposal · arrival · refusal · approval | ⚠️ cũng là đuôi tính từ — xem vị trí |"}, {"h": "⑤ TỪ VỰNG & ĐỌC", "md": "### 📖 SMALL CHANGES, BIG RESULTS\n\n> The improvement of air quality in our district did not come from one big decision. It came from a collection of small ones.\n>\n> First, the council raised public awareness of the problem through a simple leaflet. Then the installation of twenty new bins made recycling easier, and the introduction of a free bicycle scheme reduced short car journeys.\n>\n> The difference after two years is measurable. Pollution levels have fallen by eighteen per cent. According to one environmental scientist, the success of the programme lies in its simplicity: no expensive equipment was needed, only the cooperation of ordinary residents.\n\n*(104 từ)*\n\n\n\n**1.** According to the passage, the improvement came from ______.\n\n**2.** What did the council do first?"}], "vocab": [{"t": "raise awareness of", "p": "v phr", "e": "to make people know about a problem", "v": ""}, {"t": "a lack of", "p": "n phr", "e": "a situation in which there is not enough of something", "v": ""}, {"t": "an increase in", "p": "n phr", "e": "a rise in the amount or number of something", "v": ""}, {"t": "the impact on", "p": "n phr", "e": "the effect that something has on a situation", "v": ""}, {"t": "reduce waste", "p": "v phr", "e"
