class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Several European cities have reopened tram networks that they closed in the 1960s. Trams are cheaper to operate than underground lines, and they carry more passengers than buses.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Planners who once dismissed trams as old-fashioned now regard them as a practical answer to traffic. In Bordeaux, passenger numbers have risen by 40% since the first line reopened.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The main objection concerns disruption. When engineers were laying the new track, they closed several streets for months, and businesses along those streets reported sharp falls in trade. Cities that managed the process well paid compensation during construction. By 2030, planners expect that at least ten more cities will have started similar projects.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(112 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, trams ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What happened in Bordeaux?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> What was the main problem during construction?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>5.</strong> Which of the following is TRUE according to the passage?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>6.</strong> What do planners expect by 2030?</p>", "quiz": [{"q": "The library ______ at 8 a.m. every day.", "o": ["open", "opens", "is opening", "opened"], "a": 1}, {"q": "Look! It ______ outside.", "o": ["rains", "rained", "is raining", "has rained"], "a": 2}, {"q": "We ______ the contract last Tuesday.", "o": ["sign", "signed", "have signed", "had signed"], "a": 1}, {"q": nt-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG — BA CÂU HỎI NHẬN DIỆN</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu hỏi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nếu trả lời là…</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kết luận</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1.</strong> Chủ ngữ là người hay vật?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Vật (signs, bins, results, forms)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nghi ngờ bị động</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2.</strong> Chủ ngữ có <strong>tự làm</strong> được việc đó không?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Không — biển báo không tự lắp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">→ Bị động</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3.</strong> Sau chỗ trống có <strong>tân ngữ</strong> không?</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Không có</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">→ Bị động</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 Dấu hiệu chắc chắn nhất: có cụm <strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">by + người/tổ chức</code></strong> phía sau.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Công thức tổng quát:</strong> giữ nguyên thì ở động từ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be</code>, động từ chính <strong>luôn về V3</strong>.</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thì</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bị động</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hiện tại đơn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>am/is/are + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Reports <strong>are sent</strong> every Monday.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hiện tại tiếp diễn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>am/is/are being + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The line <strong>is being tested</strong> now.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ đơn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>was/were + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The bins <strong>were installed</strong> last week.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ tiếp diễn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>was/were being + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The road <strong>was being repaired</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hiện tại hoàn thành</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>have/has been + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The policy <strong>has been approved</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quá khứ hoàn thành</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>had been + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The hall <strong>had been cleaned</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tương lai đơn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>will be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Signs <strong>will be installed</strong> next month.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tương lai hoàn thành</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>will have been + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>All forms <strong>will have been processed</strong>.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 WHERE DOES OUR RUBBISH GO?</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Every day, around ten thousand tonnes of household waste are collected in our city. The waste is taken to three sorting centres outside the ring road.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">At the centres, paper, glass and metal are separated by hand and by machine. These materials are then sold to factories, where they are turned into new products.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The rest is buried in landfill sites. Last year, almost sixty per cent of the city&#x27;s waste was buried in this way. A new plan was announced in March, and by 2030 that figure will have been reduced to thirty per cent.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(105 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be made of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be produced from a particular material</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be used for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have a particular purpose</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be turned into</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be changed into something different</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>sorting centre</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a place where waste is separated into types</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>landfill site</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a place where rubbish is buried in the ground</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The reports ______ to the manager every Monday.", "o": ["send", "sends", "are sent", "sending"], "a": 2}, {"q": "These bins ______ last week.", "o": ["installed", "were installed", "have installed", "installing"], "a": 1}, {"q": "The equipment ______ at the moment.", "o": ["checks", "is checking", "is being checked", "checked"], "a": 2}, {"q": "The new policy ______ by the board already.", "o": ["approved", "has approved", "has been approved", "is approving"], "a": 2}, {"q": "Plastic waste ______ by volunteers every weekend.", "o": ["removes", "is removed", "is removing", "removed"], "a": 1}, {"q": "By the time we arrived, the hall ______ already ______.", "o": ["has / cleaned", "had / been cleaned", "was / cleaning", "had / cleaned"], "a": 1}, {"q": "According to the passage, where is the waste taken first?", "o": ["To landfill sites", "To three sorting centres", "To factories", "To the ring road"], "a": 1}, {"q": "How are paper, glass and metal separated?", "o": ["Only by machine", "Only by hand", "By hand and by machine", "By the factories"], "a": 2}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["factories", "these materials", "the centres", "new products"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All the city's waste is recycled.", "Most of the waste was buried last year.", "The new plan was announced in 2030.", "No materials are sold to factories."], "a": 1}]}, {"id": 15, "month": "11", "title": "Bị Động Với Modal Và Tương Lai", "theme": "Workplace safety", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Workplace safety</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Khi câu có <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">must / should / can / may / have to / be going to</code>, công thức bị động <strong>không đổi thì</strong> — chỉ chèn <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">be</code> vào giữa.</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>modal + be + V3</strong></p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Dạng này ra rất nhiều trong tờ rơi, vì tờ rơi = <strong>quy định + kế hoạch</strong>:</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nội dung</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cấu trúc</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quy định bắt buộc</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">must be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Helmets <strong>must be worn</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bắt buộc do quy định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have to be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Receipts <strong>have to be shown</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khuyến nghị</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">should be + V3</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">ought to be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Forms <strong>should be submitted</strong> early.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cho phép, khả năng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">can be + V3</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">may be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Items <strong>can be exchanged</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cấm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">must not be + V3</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">cannot be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The funding <strong>must not be used</strong> for equipment.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kế hoạch</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will be + V3</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">is going to be + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Cables <strong>are going to be laid</strong> next week.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Tuyệt đối không tồn tại:</strong> ~~must been~~ · ~~should been~~ · ~~will been~~ · ~~can been~~</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">must / should / can / may / might + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Helmets <strong>must be worn</strong> at all times.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">have to / has to / had to + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Your receipt <strong>has to be shown</strong> at the counter.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">ought to + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The fee <strong>ought to be paid</strong> in advance.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">be going to + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Cables <strong>are going to be laid</strong> next week.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">will + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Seats <strong>will be offered</strong> to the waiting list.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">must not / cannot + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Photographs <strong>cannot be taken</strong> here.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 SAFETY RULES AT THE WAREHOUSE</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">All visitors must be signed in at reception before entering the warehouse. Hard hats and safety shoes must be worn in every area except the office.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Forklift trucks may only be operated by trained staff. If a machine is faulty, it should be reported immediately and must not be used until an engineer has checked it.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Emergency exits must be kept clear at all times. Next month, new floor markings are going to be painted around each exit, and a short training session will be held for every department.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(97 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, visitors ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What should happen if a machine is faulty?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be required to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have to do something because of a rule</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be allowed to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have permission to do something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>keep (sth) clear</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to make sure nothing blocks a space</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>report a fault</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to tell someone that something is broken</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>comply with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to obey a rule or an order</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Damaged goods ______ within seven days.", "o": ["can exchange", "can be exchanged", "can being exchanged", "can been exchanged"], "a": 1}, {"q": "The form ______ before the deadline.", "o": ["must sign", "must be signed", "must signing", "must been signed"], "a": 1}, {"q": "This equipment ______ by untrained staff.", "o": ["should not use", "should not be used", "should not using", "should not been used"], "a": 1}, {"q": "The grant ______ for fieldwork only.", "o": ["is going to use", "is going to be used", "is going to using", "going to be used"], "a": 1}, {"q": "Cables ______ along existing verges to minimise disruption.", "o": ["may place", "may be placed", "may placing", "may been placed"], "a": 1}, {"q": "The mid-term report ______ by 15 December.", "o": ["ought to submit", "ought to be submitted", "ought submitting", "ought been submitted"], "a": 1}, {"q": "According to the passage, visitors ______.", "o": ["can enter the warehouse directly", "must be signed in at reception", "do not need safety shoes", "must operate the forklift trucks"], "a": 1}, {"q": "What should happen if a machine is faulty?", "o": ["It should be repaired by any worker.", "It should be reported and not used.", "It should be moved to the office.", "It should be used only by visitors."], "a": 1}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the report", "the engineer", "a faulty machine", "the warehouse"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Hard hats are required in the office.", "New floor markings will be painted next month.", "Anyone may operate a forklift truck.", "Emergency exits may be blocked temporarily."], "a": 1}]}, {"id": 16, "month": "11", "title": "Bị Động Đặc Biệt Và Thể Sai Khiến", "theme": "A multicultural world", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> A multicultural world</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Ba cấu trúc nâng cao, dùng khi <strong>không rõ hoặc không cần nêu chủ thể</strong>:</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">It is said that…</code></strong> — ý kiến chung, không rõ ai nói.\n<strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">S + is said to V</code></strong> — cùng nghĩa, đưa chủ ngữ lên trước.\n<strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have / get + something + V3</code></strong> — thuê người khác làm việc gì.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cấu trúc</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dùng khi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">It is said/believed/thought that + mệnh đề</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Ý kiến chung</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>It is assumed that the owner is rich.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">S + is said/believed to + V</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cùng nghĩa, đảo chủ ngữ lên trước</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The owner is assumed to be rich.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">S + is said to have + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Việc xảy ra <strong>trước</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He is believed to have applied twice.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">have/get + O + V3</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thuê người làm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We had the signs installed.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">being + V3</code> sau giới từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bị động dạng V-ing</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>After being informed, he appealed.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Phân biệt:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><em>We <strong>had the equipment checked</strong>.</em> → ta thuê người kiểm tra.</li><li><em>The equipment <strong>was checked</strong>.</em> → thiết bị được kiểm tra, không nói ai làm.</li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">It + is/was + said/believed/thought/assumed/reported + that + S + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>It is reported that speeds have improved.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + is/was + said/believed + <strong>to V</strong> <em>(cùng thời)</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Speeds are reported to be improving.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + is/was + said + <strong>to have + V3</strong> <em>(việc trước)</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>He is believed to have left.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + <strong>have/has/had</strong> + O + <strong>V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They had the office redecorated.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + <strong>get</strong> + O + <strong>V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>She got her report proofread.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">giới từ + <strong>being + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>After being notified, they confirmed.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE ORIGINS OF TET</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Tet is believed to have been celebrated in Viet Nam for more than two thousand years. It is said that the festival began as a way of marking the start of the farming year.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">In the weeks before Tet, houses are cleaned from top to bottom. Many families have their homes repainted, and older relatives get their photographs framed for the family altar.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The festival is thought to be the most important event in the Vietnamese calendar. Although some traditions have changed, the central idea has not: Tet is a time when families are brought together.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(101 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, Tet is believed to have started ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do many families do before Tet?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be brought together</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be united in one place</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take place</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to happen</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>date back to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have existed since a particular time</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>hand down</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to pass something to younger people</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be thought to be</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be considered by people to be</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "______ that wealth is often invisible.", "o": ["It says", "It is said", "It said", "Is said"], "a": 1}, {"q": "The scheme ______ to be highly effective.", "o": ["believes", "is believed", "is believing", "believed"], "a": 1}, {"q": "He ______ to have completed the course last year.", "o": ["reports", "is reported", "is reporting", "reported"], "a": 1}, {"q": "We ______ the equipment ______ by a specialist.", "o": ["had / check", "had / checked", "have / check", "had / checking"], "a": 1}, {"q": "She got her report ______ before the deadline.", "o": ["proofread", "proofreading", "to proofread", "proofreads"], "a": 0}, {"q": "After ______ of the decision, he appealed immediately.", "o": ["informing", "being informed", "informed", "to inform"], "a": 1}, {"q": "According to the passage, Tet is believed to have started ______.", "o": ["two hundred years ago", "as a way of marking the farming year", "in another country", "as a religious ceremony only"], "a": 1}, {"q": "What do many families do before Tet?", "o": ["They move to a new house.", "They have their homes repainted.", "They stop cleaning.", "They sell their photographs."], "a": 1}, {"q": "The word **\"It\"** in paragraph 1 refers to ______.", "o": ["Viet Nam", "the farming year", "Tet", "the calendar"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["No tradition has changed.", "Tet brings families together.", "Tet is the least important festival.", "Houses are cleaned after Tet."], "a": 1}]}, {"id": 17, "month": "11", "title": "Word Form I: Hậu Tố Danh Từ", "theme": "Green living", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Green living</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Trong tiếng Anh, <strong>đuôi từ quyết định từ loại</strong>. Nhìn đuôi là biết loại — <strong>không cần biết nghĩa</strong>.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đây là kỹ thuật ăn điểm không cần vốn từ, đặc biệt quan trọng khi vốn từ còn mỏng.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Chỗ trống cần <strong>danh từ</strong> khi đứng sau:</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Vị trí</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Mạo từ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">a / an / the</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the <strong>installation</strong> of new bins</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tính từ sở hữu <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">my / your / his / their</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Your <strong>cooperation</strong> is essential.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Sở hữu cách <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">students&#x27;</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>students&#x27; <strong>knowledge</strong> of pollution</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tính từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>public <strong>awareness</strong></em> · <em>primary <strong>goal</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giới từ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">of / in / for / with / about</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>a lack <strong>of evidence</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Làm chủ ngữ của câu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Registration</strong> is recommended.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC — BẢNG HẬU TỐ DANH TỪ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Hậu tố</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ghi chú</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-tion / -sion</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">pollution · decision · cooperation · installation</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phổ biến nhất</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ment</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">development · equipment · government · improvement</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ động từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ness</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">awareness · happiness · weakness · illness</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ tính từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ity / -ty</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">ability · safety · responsibility · community</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ tính từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ance / -ence</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">importance · difference · performance · confidence</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-er / -or / -ist</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">employer · supervisor · scientist</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chỉ <strong>người làm</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ee</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">employee · trainee · interviewee</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chỉ <strong>người chịu tác động</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-ship / -hood</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">leadership · membership · childhood</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">trạng thái</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>-al</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">proposal · arrival · refusal · approval</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">⚠️ cũng là đuôi tính từ — xem vị trí</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 SMALL CHANGES, BIG RESULTS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">The improvement of air quality in our district did not come from one big decision. It came from a collection of small ones.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">First, the council raised public awareness of the problem through a simple leaflet. Then the installation of twenty new bins made recycling easier, and the introduction of a free bicycle scheme reduced short car journeys.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The difference after two years is measurable. Pollution levels have fallen by eighteen per cent. According to one environmental scientist, the success of the programme lies in its simplicity: no expensive equipment was needed, only the cooperation of ordinary residents.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(104 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, the improvement came from ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What did the council do first?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\"
