ext-slate-700\">the difference in attitudes between age groups</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>give advice</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to tell someone what you think they should do</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The council agreed ______ the scheme.", "o": ["extend", "to extend", "extending", "extended"], "a": 1}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2}, {"q": "She is responsible for ______ the budget.", "o": ["manage", "to manage", "managing", "managed"], "a": 2}, {"q": "He stopped ______ the machine because it was overheating.", "o": ["to use", "using", "use", "used"], "a": 1}, {"q": "Please remember ______ the door when you leave.", "o": ["lock", "to lock", "locking", "locked"], "a": 1}, {"q": "Would you mind ______ outside?", "o": ["wait", "to wait", "waiting", "waited"], "a": 2}, {"q": "According to the passage, psychologists suggest ______.", "o": ["avoiding all difficult topics forever", "starting with small things", "talking only at meals", "giving advice immediately"], "a": 1}, {"q": "What do parents who ask questions without judging usually do?", "o": ["They learn more than those who give advice.", "They stop talking to their children.", "They agree with everything.", "They avoid all conversation."], "a": 0}, {"q": "The word **\"them\"** in paragraph 3 refers to ______.", "o": ["experts", "parents", "teenagers", "families"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only teenagers need to change.", "Families who keep talking find difficult conversations easier.", "Meals are the best time for difficult topics.", "Psychologists advise parents to give more advice."], "a": 1}]}, {"id": 25, "month": "11", "title": "Động Từ Khuyết Thiếu Và Modal Perfect", "theme": "Inventions", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Inventions</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Động từ khuyết thiếu</strong> thể hiện <strong>thái độ người nói</strong>: bắt buộc, khuyên, cho phép, phỏng đoán.\n<strong><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Modal + have + V3</code></strong> dùng để nói về <strong>quá khứ</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Modal</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>must</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bắt buộc (người nói áp đặt)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>All forms <strong>must</strong> be signed.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>have to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bắt buộc (do quy định, hoàn cảnh)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We <strong>have to</strong> wear helmets here.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>should / ought to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nên, khuyên</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Applications <strong>should</strong> be submitted early.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>can / may</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có thể, được phép</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Items <strong>can</strong> be exchanged in five days.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>might / may</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phỏng đoán không chắc</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The syllabus <strong>may</strong> change.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>mustn&#x27;t</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cấm</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The funding <strong>mustn&#x27;t</strong> be used for equipment.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>needn&#x27;t</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>không cần</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>You <strong>needn&#x27;t</strong> bring a laptop.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Phân biệt:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">mustn&#x27;t</code> = cấm · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">needn&#x27;t</code> = không bắt buộc. Hai nghĩa hoàn toàn khác nhau.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Modal perfect — nói về quá khứ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cấu trúc</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>must have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chắc hẳn đã (suy đoán chắc chắn)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>can&#x27;t have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chắc hẳn không</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>should have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lẽ ra nên (nhưng đã không làm)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>needn&#x27;t have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lẽ ra không cần (nhưng đã làm)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>might/may have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có lẽ đã</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Công thức</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + modal + V</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>You <strong>should register</strong> online.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + modal + <strong>be + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Helmets <strong>must be worn</strong>.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + modal + <strong>have + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>They <strong>must have forgotten</strong> the deadline.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">S + modal + <strong>have been + V3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The form <strong>should have been signed</strong>.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE INVENTION THAT ALMOST WASN&#x27;T</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">In 1968, an engineer at an American company created a glue that would not stick properly. His employers decided that it must have been a failure and shelved the project.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Five years later, a colleague realised that the weak glue might be useful. He argued that the company should have tested it on paper rather than on industrial materials.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The result was the sticky note, which can now be found in almost every office in the world. Looking back, the company admits that it needn&#x27;t have waited five years: the idea had been sitting in a drawer all along.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(101 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, why was the glue shelved?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What did the colleague argue?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>come up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to think of an idea or a plan</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>by accident</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">prep phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">not planned or intended</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put to use</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start using something for a purpose</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>shelve a project</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to stop working on a plan for a time</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>turn out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to happen in a particular way in the end</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "You ______ bring your own laptop; we provide them.", "o": ["mustn't", "needn't", "can't", "shouldn't"], "a": 1}, {"q": "Visitors ______ enter the laboratory without a pass.", "o": ["needn't", "mustn't", "don't have to", "may"], "a": 1}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1}, {"q": "We ______ so early; the hall was empty.", "o": ["needn't book", "needn't have booked", "mustn't book", "shouldn't book"], "a": 1}, {"q": "The form ______ by a supervisor. *(lẽ ra nên, nhưng đã không)*", "o": ["should sign", "should be signed", "should have signed", "should have been signed"], "a": 3}, {"q": "He ______ the train — he's usually punctual.", "o": ["must miss", "can't have missed", "needn't miss", "should miss"], "a": 1}, {"q": "According to the passage, why was the glue shelved?", "o": ["It was too expensive.", "The employers thought it was a failure.", "It stuck too strongly.", "Nobody had tested it."], "a": 1}, {"q": "What did the colleague argue?", "o": ["That the glue should be thrown away", "That it should have been tested on paper", "That the project should be sold", "That the glue was dangerous"], "a": 1}, {"q": "The word **\"it\"** in the last sentence refers to ______.", "o": ["the drawer", "the idea", "the company", "the sticky note"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The invention was recognised immediately.", "The company waited five years unnecessarily.", "The glue was very strong.", "The engineer left the company in 1968."], "a": 1}]}, {"id": 26, "month": "11", "title": "Mạo Từ Và Danh Từ Đếm Được/Không Đếm Được", "theme": "Urbanisation", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Urbanisation</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Mạo từ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">a / an / the / Ø</code> cho biết danh từ <strong>xác định hay không xác định</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dùng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Khi nào</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a / an</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đếm được số ít, nhắc lần đầu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>a golden opportunity</em> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">an</code> trước <strong>âm</strong> nguyên âm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>the</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đã nhắc trước · duy nhất · có cụm xác định · so sánh nhất · thứ tự</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the best candidate</em> · <em>the cost <strong>of preserving the river</strong></em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Ø</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Không đếm được · số nhiều nói chung · mùa, bữa ăn, môn học</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Ø <strong>information</strong></em> · <em>Ø <strong>students</strong> should register</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔴 <strong>Quy tắc <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">a</code> hay <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">an</code> theo ÂM, không theo CHỮ CÁI:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><em>an hour</em> (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">h</code> câm, âm đầu /aʊ/) · <em>an MBA</em> (/em/) · <em>an IT assistant</e -slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put pressure on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to create difficulty for a system or person</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>move in / move out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start / stop living in a place</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>in search of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">prep phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">looking for something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a large amount of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quant phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a lot of something uncountable</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 ali er-b border-slate-100 text-slate-700\"><strong>Word form</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đuôi từ quyết định từ loại. Nhìn từ đứng <strong>trước</strong> chỗ trống.</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Điều kiện</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nhìn <strong>vế chính</strong>: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">will</code> → loại 1 · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">would</code> → loại 2 · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">would have</code> → loại 3</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Unless</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">= <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">if…not</code> → sau <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">unless</code> dùng <strong>khẳng định</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Mệnh đề quan hệ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">who (người) · which (vật) · whose (sở hữu) · where (nơi) · that (không sau dấu phẩy)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Rút gọn</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chủ động → <strong>V-ing</strong> · Bị động → <strong>V3</strong> · Sau <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">the first/only</code> → <strong>to V</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>To V / V-ing</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thuộc danh sách. Sau giới từ luôn <strong>V-ing</strong>.</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Modal perfect</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">must have</code> (chắc đã) · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">should have</code> (lẽ ra nên) · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">needn&#x27;t have</code> (lẽ ra không cần)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Mạo từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">a/an</code> theo <strong>âm</strong>. Không đếm được → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">much</code>, không <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">a/an</code>.</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 4 BƯỚC GIẢI CÂU ĐIỀN TỪ</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1 — Nhìn 4 phương án để biết câu hỏi hỏi gì:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">4 phương án trông như thế nào</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đang hỏi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kỹ thuật</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cùng gốc, khác đuôi (-tion/-ive/-ly)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Từ loại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 19</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Các dạng của cùng 1 động từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thì &amp; thể</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 14–15</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cùng từ loại, nghĩa gần nhau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Collocation</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tháng 12</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4 từ nối khác nhau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Liên kết ý</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tháng 12</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Nếu là thì &amp; thể:</strong> xác định chủ động hay bị động trước, rồi mới chọn thì. <strong>Bước 3 — Nếu là từ loại:</strong> nhìn từ đứng ngay trước chỗ trống. <strong>Bước 4 — Đọc lại cả câu</strong> với đáp án đã chọn.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE COST OF A CLEAN CITY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Ten years ago, the streets of this district were regularly criticised for the amount of rubbish left on them. If the council had acted earlier, the problem would never have reached that scale.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">A programme launched in 2019 changed the picture. Bins, which are now emptied twice a day, were installed on every corner. Residents wishing to report a full bin can use a free app, and complaints must be answered within twenty-four hours.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The improvement has been considerable. Cleanliness scores, measured monthly by an independent team, have risen by forty per cent. Officials admit, however, that the programme needn&#x27;t have cost so much: much of the early spending went on equipment that was never put to use.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(120 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, what was the problem ten years ago?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> What do officials admit?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>5.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be criticised for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be judged badly because of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>reach a scale</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to grow to a particular size</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put to use</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to start using something for a purpose</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be measured by</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be judged or counted by someone</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>go on (money)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be spent on something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Warning signs ______ at every exit next month.", "o": ["install", "installed", "will be installed", "installing"], "a": 2}, {"q": "Your ______ is essential for success.", "o": ["cooperate", "cooperation", "cooperative", "cooperatively"], "a": 1}, {"q": "If everyone ______ together, we will make a difference.", "o": ["work", "works", "worked", "will work"], "a": 1}, {"q": "The report, ______ was published last week, contains new data.", "o": ["that", "which", "who", "where"], "a": 1}, {"q": "Skills seldom ______ tend to erode.", "o": ["practising", "practised", "to practise", "practise"], "a": 1}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1}, {"q": "There isn't ______ evidence to support that claim.", "o": ["many", "a few", "much", "several"], "a": 2}, {"q": "According to the passage, what was the problem ten years ago?", "o": ["There were too many bins.", "Rubbish was left on the streets.", "The council acted too quickly.", "Residents refused to use the app."], "a": 1}, {"q": "How often are the bins emptied now?", "o": ["Once a week", "Twice a day", "Every twenty-four hours", "Once a month"], "a": 1}]}, {"id": 28, "month": "12", "title": "Collocation I: Động Từ + Danh Từ", "theme": "Community projects", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Community projects</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Collocation</strong> = những từ <strong>đi với nhau theo thói quen</strong>, không theo logic.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">raise awareness</code> đúng, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">lift awareness</code> sai — dù <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">raise</code> và <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">lift</code> cùng nghĩa &quot;nâng&quot;. Không có quy tắc, chỉ có thói quen của người bản ngữ.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Trong bài điền từ, khi <strong>4 phương án cùng từ loại và nghĩa gần nhau</strong> → chắc chắn đang hỏi collocation, không hỏi ngữ pháp.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Cả bốn đều là danh từ, nghĩa gần nhau. Nhưng chỉ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">raise awareness</code> là cụm chuẩn.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC — BẢNG 40 CỤM HAY RA NHẤT</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Động từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Danh từ đi kèm</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>raise</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">awareness · concern · funds · standards · a question</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>make</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a difference · progress · a decision · an effort · a contribution</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">part (in) · action · place · responsibility · measures · advantage (of)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>pay</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">attention (to) · a visit · a fine</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>do</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">research · damage · business · homework · a favour</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>meet</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a deadline · requirements · demand · expectations · a target</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>reach</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">an agreement · a conclusion · a target · a decision</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>promote</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">habits · awareness · growth · understanding</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>reduce</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">waste · costs · emissions · risk</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>provide</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">support · information · training · access</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">research · a survey · an inspection · repairs</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>play</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a role · a part</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 <strong>Bốn cụm phải thuộc lòng</strong> — mỗi danh từ đi với một động từ riêng: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">raise awareness</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">pay attention</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">place emphasis</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">focus on</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 A LIBRARY BUILT BY VOLUNTEERS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Five years ago, a group of residents in a small commune decided to make a difference. They raised funds by selling home-made food at the weekend market.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Within eight months, they had collected enough money to buy 2,000 books. Local carpenters offered to do the work for free, and by the end of the year the shelves were ready.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The library now provides free access to books for more than three hundred children. The commune has since taken measures to keep it open every afternoon, and two neighbouring communes have carried out similar projects.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(103 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> How did the residents raise money?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What did local carpenters do?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-  raise money?", "o": ["By asking the government", "By selling home-made food at the market", "By charging for library cards", "By selling old books"], "a": 1}, {"q": "What did local carpenters do?", "o": ["They donated books.", "They made the shelves for free.", "They designed the building.", "They collected the money."], "a": 1}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the commune", "the library", "the money", "the project"], "a": 1}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The project took five months.", "Two other communes have done something similar.", "Children must pay to borrow books.", "The carpenters were paid."], "a": 1}]}, {"id": 29, "month": "12", "title": "Collocation Ii: Cụm Giới Từ", "theme": "Cities of the future", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Cities of the future</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Giới từ đi sau danh từ, tính từ và động từ theo <strong>thói quen cố định</strong>. Sai giới từ là lỗi mất điểm rất phổ biến vì học viên dịch từ tiếng Việt.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Trong đề, câu hỏi giới từ xuất hiện khi <strong>4 phương án là 4 giới từ khác nhau</strong>, hoặc khi chỗ trống nằm ngay sau một tính từ quen thuộc.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">A. Tính từ + giới từ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">for</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 bord
