op border-b border-slate-100 text-slate-700\"><strong>a lack of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sự thiếu</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>an increase / decrease in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sự tăng/giảm về</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a solution to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">giải pháp cho</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>the reason for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lý do cho</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>an impact / effect on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">tác động lên</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>access to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quyền tiếp cận</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>demand for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nhu cầu về</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a rise in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sự tăng về</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">C. Động từ + giới từ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>depend / rely on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phụ thuộc vào</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>apply for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nộp đơn xin</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>result in / lead to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dẫn đến</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>result from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bắt nguồn từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>contribute to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">góp phần vào</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>consist of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bao gồm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>benefit from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">hưởng lợi từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>comply with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">tuân thủ</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Cặp dễ nhầm:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">result in</code> (dẫn đến) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">result from</code> (bắt nguồn từ).</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE FIFTEEN-MINUTE CITY</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Planners in several European cities are interested in an idea known as the &quot;fifteen-minute city&quot;. The aim is simple: every resident should have access to schools, shops and clinics within fifteen minutes on foot or by bicycle.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Supporters argue that this reduces demand for cars and leads to cleaner air. Cities that rely on long commutes, they say, suffer from both congestion and poor health.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Critics are less confident. They point out that the plan depends on a high density of housing, which is not typical of many suburbs. The solution to that problem, however, is not yet clear.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(104 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, in a fifteen-minute city residents should ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do supporters argue?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>have access to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be able to use or reach something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>demand for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the need that people have for something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>rely on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to depend on someone or something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>suffer from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be badly affected by something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a solution to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a way of dealing with a problem</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "A stable internet connection is essential ______ all online sessions.", "o": ["to", "in", "for", "with"], "a": 2}, {"q": "Residents were not aware ______ the new policy.", "o": ["of", "for", "in", "about"], "a": 0}, {"q": "There has been a sharp increase ______ complaints.", "o": ["of", "in", "for", "to"], "a": 1}, {"q": "Poor maintenance resulted ______ a major failure.", "o": ["from", "in", "of", "to"], "a": 1}, {"q": "The failure resulted ______ poor planning.", "o": ["in", "from", "of", "to"], "a": 1}, {"q": "All staff must comply ______ the safety rules.", "o": ["to", "for", "with", "on"], "a": 2}, {"q": "According to the passage, in a fifteen-minute city residents should ______.", "o": ["travel for fifteen minutes by car", "reach basic services within fifteen minutes on foot or by bicycle", "live fifteen minutes from the city centre", "work only fifteen minutes a day"], "a": 1}, {"q": "What do supporters argue?", "o": ["The idea reduces demand for cars.", "The idea increases commuting.", "The idea is too expensive.", "The idea works only in suburbs."], "a": 0}, {"q": "The word **\"They\"** in paragraph 3 refers to ______.", "o": ["supporters", "cities", "critics", "planners"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Critics say the plan depends on high housing density.", "The solution has already been found.", "Suburbs are typically very dense.", "All planners support the idea."], "a": 0}]}, {"id": 30, "month": "12", "title": "Phrasal Verb I", "theme": "Workplace", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Workplace</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Phrasal verb</strong> = động từ + tiểu từ. Nghĩa thường <strong>không đoán được</strong> từ các thành phần.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">get out of</code> không phải &quot;lấy ra khỏi&quot; mà là &quot;thoát khỏi&quot;.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Trong đề điền từ, phrasal verb thường được hỏi bằng cách <strong>cho sẵn tiểu từ và hỏi động từ</strong>: <em>teach students how to ___ out of the building</em> → cho sẵn <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">out of</code>, hỏi động từ → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">get</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC — 15 PHRASAL VERB NHÓM 1</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phrasal verb</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>get out of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thoát khỏi</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>get out of the building</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>carry out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thực hiện</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>carry out a survey</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>set up</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">thiết lập</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>set up a committee</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đảm nhận</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>take on responsibility</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put off</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">hoãn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>put off the meeting</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>call off</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">huỷ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>call off the drill</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>turn down</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ chối</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>turn down an offer</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>bring about</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">gây ra</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>bring about change</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cut down on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">cắt giảm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>cut down on waste</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>look into</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">điều tra</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>look into the complaint</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>come up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nghĩ ra</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>come up with a solution</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>run out of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">hết</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>run out of funding</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>give up</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ bỏ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>give up smoking</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>deal with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">xử lý</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>deal with a problem</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>point out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chỉ ra</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>point out an error</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Cặp dễ nhầm:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">put off</code> = hoãn lại · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">call off</code> = huỷ hẳn.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE FOUR-DAY WEEK TRIAL</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Last year, a software company in Da Nang set up a trial of the four-day working week. Managers had put off the idea for years, worried that output would fall.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The trial did not run smoothly at first. Two teams ran out of time on major projects, and one client threatened to turn down the next contract. Managers had to deal with several complaints in the first month.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">By the end of the trial, however, the results were clear. Staff took on the same workload in fewer hours, and nobody gave up the arrangement when offered the choice. The company now plans to carry out a longer study.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(112 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> Why had managers put off the idea?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What happened in the first month?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>set up</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to create or start something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put off</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to delay something to a later time</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>run out of</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have no more of something left</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>take on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to accept work or responsibility</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>deal with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to take action to solve a problem</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Short drills teach employees how to ______ out of the building calmly.", "o": ["check", "get", "sort", "fill"], "a": 1}, {"q": "The council ______ off the event because of the storm.", "o": ["put", "called", "took", "gave"], "a": 1}, {"q": "We must ______ down on single-use plastics.", "o": ["cut", "put", "take", "turn"], "a": 0}, {"q": "The committee will ______ into the complaint.", "o": ["come", "look", "run", "set"], "a": 1}, {"q": "She ______ on the role of team leader last month.", "o": ["took", "put", "gave", "came"], "a": 0}, {"q": "The team ______ up with three possible solutions.", "o": ["set", "came", "took", "ran"], "a": 1}, {"q": "Why had managers put off the idea?", "o": ["They had no staff.", "They worried that output would fall.", "Clients had refused it.", "It was too expensive."], "a": 1}, {"q": "What happened in the first month?", "o": ["Everything ran smoothly.", "Managers had to deal with several complaints.", "All clients cancelled their contracts.", "Staff gave up the arrangement."], "a": 1}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the workload", "the choice", "the arrangement", "the study"], "a": 2}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Staff completed the same workload in fewer hours.", "Output fell sharply.", "The company has ended the scheme.", "Every team ran out of time."], "a": 0}]}, {"id": 31, "month": "12", "title": "Phrasal Verb Ii", "theme": "Energy transition", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Energy transition</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Nhóm phrasal verb thứ hai, tập trung vào những cụm xuất hiện trong <strong>văn bản học thuật và báo cáo</strong> — hay gặp ở bài đọc hơn là bài điền từ.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CẤU TRÚC — 15 PHRASAL VERB NHÓM 2</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phrasal verb</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>account for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chiếm tỉ lệ / giải thích</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>accounts for 40% of costs</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>result in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dẫn đến</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>resulted in higher costs</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>stem from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bắt nguồn từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>stems from poor planning</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>rule out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">loại trừ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>rule out that option</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>phase out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">loại bỏ dần</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>phase out coal plants</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>scale up / back</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">mở rộng / thu hẹp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>scale back the scheme</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>build on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phát triển từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>build on earlier research</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>draw on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dựa vào</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>draw on local knowledge</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>hand in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nộp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>hand in the form</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>fill in / out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">điền</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>fill in the application</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>sign up (for)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đăng ký</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>sign up for the workshop</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>turn out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">hoá ra</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>turned out to be effective</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>make up for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bù đắp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>make up for the loss</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chịu đựng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>put up with the noise</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>keep up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">theo kịp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>keep up with demand</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Ba cặp dễ nhầm:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">keep up with</code> (theo kịp) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">put up with</code> (chịu đựng)</li><li><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">result in</code> (dẫn đến) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">stem from</code> (bắt nguồn từ)</li><li><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">phase out</code> (loại bỏ dần) ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">rule out</code> (loại trừ một khả năng)</li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE SLOW END OF COAL</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Coal still accounts for about a third of the world&#x27;s electricity. Several governments have promised to phase it out, but progress has not kept up with the targets they set.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Part of the problem stems from cost. Building new solar and wind capacity is cheap, but the grids that carry the power are old. Upgrading them would result in very large bills, and few governments want to explain that to voters.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Experts do not rule out a faster transition. They argue that if countries drew on existing technology instead of waiting for new inventions, the change could scale up within a decade. Communities near old coal plants, meanwhile, must put up with poor air quality for years to come.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(124 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, coal ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What is part of the problem?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> What do experts argue?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>account for</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to form a particular amount of something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>phase out</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to stop using something gradually</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>stem from</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be caused by something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>keep up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to move or change at the same speed</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>put up with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to accept something unpleasant without complaining</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Residents have to ______ up with the constant hum of turbines.", "o": ["keep", "put", "make", "take"], "a": 1}, {"q": "Transport ______ for nearly a third of national emissions.", "o": ["counts", "accounts", "makes", "stands"], "a": 1}, {"q": "The government plans to ______ out coal by 2040.", "o": ["rule", "phase", "build", "hand"], "a": 1}, {"q": "The delay ______ from a shortage of materials.", "o": ["resulted", "stemmed", "accounted", "ruled"], "a": 1}, {"q": "Supply cannot ______ up with rising demand.", "o": ["put", "keep", "make", "draw"], "a": 1}, {"q": "The trial ______ out to be far more effective than expected.", "o": ["came", "turned", "ran", "filled"], "a": 1}, {"q": "According to the passage, coal ______.", "o": ["has already been phased out", "accounts for about a third of world electricity", "is the cheapest form of power", "produces no air pollution"], "a": 1}, {"q": "What is part of the problem?", "o": ["The cost of upgrading old grids", "A shortage of solar panels", "Opposition from experts", "A lack of new inventions"], "a": 0}, {"q": "The word **\"them\"** in paragraph 2 refers to ______.", "o": ["governments", "bills", "the grids", "voters"], "a": 2}, {"q": "What do experts argue?", "o": ["That a faster transition is impossible", "That countries should wait for new inventions", "That drawing on existing technology could speed up the change", "That coal plants improve air quality"], "a": 2}]}, {"id": 32, "month": "12", "title": "Từ Gần Nghĩa Dễ Nhầm", "theme": "Green living", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Green living</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Khi 4 phương án <strong>cùng từ loại và nghĩa gần nhau</strong>, đề đang kiểm tra <strong>sắc thái nghĩa</strong> hoặc <strong>collocation</strong>, không kiểm tra ngữ pháp.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG — QUY TRÌNH</h4><ol class=\"list-decimal pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><strong>Loại theo collocation trước</strong> — từ nào không đi được với từ bên cạnh thì loại ngay.</li><li><strong>Loại theo sắc thái</strong> — từ nào quá mạnh hoặc quá nhẹ so với mạch văn.</li><li><strong>Loại theo đối tượng</strong> — từ dùng cho người hay cho vật.</li></ol><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ CẤU TRÚC — BẢNG NHÓM TỪ DỄ NHẦM</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nhóm</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phân biệt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>focus / awareness / emphasis / attention</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">focus <strong>on</strong> · raise <strong>awareness</strong> · place <strong>emphasis on</strong> · pay <strong>attention to</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>produce / provide / protect / promote</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">produce = sản xuất <strong>vật</strong> · provide = cung cấp · protect = bảo vệ · promote = thúc đẩy <strong>thói quen, ý tưởng</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>effect / affect</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>effect</strong> = danh từ (tác động) · <strong>affect</strong> = động từ (ảnh hưởng đến)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>rise / raise</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>rise</strong> không có tân ngữ (<em>prices rise</em>) · <strong>raise</strong> có tân ngữ (<em>raise awareness</em>)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>economic / economical</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>economic</strong> = thuộc kinh tế · <strong>economical</strong> = tiết kiệm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>considerable / considerate</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>considerable</strong> = đáng kể · <strong>considerate</strong> = chu đáo</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>efficient / effective</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>efficient</strong> = ít lãng phí · <strong>effective</strong> = đạt kết quả</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>amount / number</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>amount of</strong> + không đếm được · <strong>number of</strong> + đếm được</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>among / between</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>between</strong> 2 đối tượng · <strong>among</strong> từ 3 trở lên</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>fewer / less</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>fewer</strong> + đếm được · <strong>less</strong> + không đếm được</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>remain / stay / keep</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">remain = vẫn ở trạng thái (trang trọng) · keep + O + adj</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>notice / notify</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">notice = nhận thấy · notify = thông báo cho ai</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 LIVING WITH LESS</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">A considerable number of young Vietnamese families are now choosing smaller homes. The change stems less from money than from a shift in attitudes.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Smaller flats are more economical to heat and cool, and they produce fewer emissions. They also affect daily life in ways that are harder to measure: residents report that they buy less, throw away less, and spend more time outside.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Not everyone is convinced. Critics point out that a small amount of space can raise stress in families with children. The effect, they argue, depends greatly on design rather than on size alone.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(101 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, why are families choosing smaller homes?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do residents of smaller flats report?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> What do critics argue?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a shift in attitudes</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a change in the way people think</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be economical</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">using money or fuel without waste</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>throw away</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to get rid of something you do not want</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>raise stress</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to make a situation more stressful</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>depend on</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be affected by something else</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The new system had a positive ______ on productivity.", "o": ["effect", "affect", "effective", "affected"], "a": 0}, {"q": "Prices have ______ by 12% this year.", "o": ["raised", "risen", "rose", "raising"], "a": 1}, {"q": "This is an ______ way to heat the building.", "o": ["economic", "economical", "economically", "economy"], "a": 1}, {"q": "We aim to ______ sustainable habits through daily activities.", "o": ["produce", "provide", "protect", "promote"], "a": 3}, {"q": "A large ______ of applicants were shortlisted.", "o": ["amount", "number", "many", "few"], "a": 1}, {"q": "There are ______ complaints this quarter than last.", "o": ["less", "fewer", "little", "few"], "a": 1}, {"q": "According to the passage, why are families choosing smaller homes?", "o": ["Mainly because of money", "Mainly because of a shift in attitudes", "Because the government requires it", "Because large homes are unavailable"], "a": 1}, {"q": "What do residents of smaller flats report?", "o": ["They buy more things.", "They spend less time outside.", "They buy less and throw away less.", "They pay more for heating."], "a": 2}, {"q": "The word **\"They\"** at the start of paragraph 2's second sentence refers to ______.", "o": ["families", "smaller flats", "emissions", "residents"], "a": 1}, {"q": "What do critics argue?", "o": ["That small homes always raise stress", "That the effect depends greatly on design", "That size is the only factor", "That smaller homes cost more"], "a": 1}]}, {"id": 33, "month": "12", "title": "Liên Từ Và Từ Nối", "theme": "Wind power debate", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Wind power debate</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Từ nối</strong> cho biết <strong>quan hệ giữa hai ý</strong>.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đây là chìa khoá của cả ba dạng: điền từ, sắp xếp câu và điền mệnh đề. Nhận ra từ nối là nhận ra mạch lập luận.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG — PHÂN THEO QUAN HỆ Ý</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Quan hệ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ nối</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tương phản</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">however · nevertheless · in contrast · on the other hand · yet</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Speeds improved. <strong>However</strong>, costs rose.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tương phản trong câu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">although / though / even though + <strong>mệnh đề</strong> · despite / in spite of + <strong>N/V-ing</strong> · but</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Although</strong> it rained</em>, the drill went ahead.</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Nguyên nhân</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">because / since / as + mệnh đề · because of / due to + N</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>cancelled <strong>because of</strong> the storm</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Kết quả</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">therefore · consequently · as a result · thus · hence</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Costs rose. <strong>Consequently</strong>, the scheme was cut.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Bổ sung</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">moreover · furthermore · in addition · additionally · besides</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The pay is good. <strong>Moreover</strong>, training is provided.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Mục đích</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">so that · in order to · so as to</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>We hold drills <strong>so that</strong> staff know the exits.</em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔴 <strong>Bẫy số một của mọi đề:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">although</code> đi với <strong>mệnh đề</strong>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">despite</code> đi với <strong>danh từ hoặc V-ing</strong>.</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">✅ Đúng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">❌ Sai</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Although <strong>the weather was bad</strong>, …</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Despite ~~the weather was bad~~</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Despite <strong>the bad weather</strong>, …</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Although ~~the bad weather~~</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Despite <strong>being late</strong>, …</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE WIND POWER DEBATE</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Wind power has been promoted as a clean and economically viable substitute for fossil fuels. With the infrastructure in place, operational costs are substantially lower than those of coal or gas facilities.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Nevertheless, the argument for transitioning is not entirely convincing when the implications for nearby residents are taken into account. Although turbines produce no emissions, inhabitants of coastal regions report that the low hum of the constant rotation impairs their sleep quality.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Progress on a country&#x27;s renewable targets therefore necessitates balancing each proposed initiative against the burdens imposed upon local populations. Despite these difficulties, most governments continue to expand wind capacity.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(104 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, wind turbines ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do coastal residents report?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Which of the following is TRUE according to the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\" ld"], "a": 1}, {"q": "______ households are choosing solar panels.", "o": ["More and more", "The more", "Most and most", "More than more"], "a": 0}, {"q": "According to the advertisement, applicants with a better understanding of STEM ______.", "o": ["will be paid more", "are more likely to be selected", "must have previous experience", "will work longer hours"], "a": 1}, {"q": "What is offered to those living far away?", "o": ["Free accommodation", "Flexible hours and remote options", "A higher salary", "Transport costs"], "a": 1}, {"q": "The phrase **\"up for grabs\"** is closest in meaning to ______.", "o": ["difficult to obtain", "available to be taken", "already filled", "under review"], "a": 1}, {"q": "Which of the following is TRUE according to the advertisement?", "o": ["Previous experience is required.", "Training is provided to new recruits.", "Applications close in July.", "Only local candidates may apply."], "a": 1}]}, {"id": 35, "month": "12", "title": "Cấu Trúc Câu: Đơn, Ghép Và Phức", "theme": "Reading long sentences", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Reading long sentences</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi kỹ năng.</strong> Mục tiêu: bóc được một câu dài 40–50 từ thành mệnh đề chính và mệnh đề phụ. Đây là kỹ năng quyết định khi vào bài đọc tháng 1.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại câu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cấu tạo</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Câu đơn</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1 mệnh đề độc lập</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The council approved the plan.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Câu ghép</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2 mệnh đề độc lập nối bằng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">and, but, or, so, yet</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>The council approved the plan, <strong>but</strong> residents objected.</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Câu phức</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1 mệnh đề chính + 1 mệnh đề phụ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>Although</strong> residents objected</em>, the council approved the plan.</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Câu phức hợp</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Ghép + phức</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Although residents objected, the council approved the plan, <strong>and</strong> work began in May.</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG — BA BƯỚC BÓC CÂU DÀI</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1 — Tìm động từ chia.</strong> Mỗi mệnh đề có đúng một động từ chia. Đếm động từ chia = đếm mệnh đề.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Tìm từ nối đầu mỗi mệnh đề phụ:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">although · because · when · while · if · that · which · who · after · before · since · unless</code></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3 — Xoá tạm mọi mệnh đề phụ.</strong> Phần còn lại chính là <strong>mệnh đề chính</strong> — ý cốt lõi của câu.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ VÍ DỤ — bóc một câu dài</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>Although the council, <strong>which</strong> owned no part of the site, had been warned repeatedly, work began without a full survey, <strong>and</strong> the problems <strong>that</strong> followed cost the district almost forty billion dong.</em></p></blockquote><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bước</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kết quả</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Động từ chia</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">owned · had been warned · began · followed · cost → <strong>5 mệnh đề</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Từ nối</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Although · which · and · that</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Xoá mệnh đề phụ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">~~Although…warned~~ · ~~which owned no part of the site~~ · ~~that followed~~</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Mệnh đề chính còn lại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong><em>work began without a full survey, and the problems cost the district almost forty billion dong.</strong></em></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ Ý cốt lõi: <strong>công việc bắt đầu mà không khảo sát, và hậu quả tốn 40 tỉ đồng.</strong></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ TỪ VỰNG &amp; ĐỌC</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 WHY LONG SENTENCES ARE NOT THE PROBLEM</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Students often say that the sentences in examination texts are too long. In fact, length itself is rarely the difficulty; what causes trouble is the number of ideas packed into one sentence.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">A sentence that contains three clauses, each introduced by a different linking word, demands that the reader hold several ideas in mind at once. Readers who have learned to separate the main clause from the rest, however, find that even a fifty-word sentence becomes manageable.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The technique, which takes only a few weeks to learn, is simple: find the verbs, mark the linking words, and remove the subordinate clauses. What remains is the writer&#x27;s central claim.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(116 từ)</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> According to the passage, what causes difficulty?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> What do readers who separate the main clause find?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Sổ từ vựng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>main clause</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the part of a sentence that can stand alone</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>subordinate clause</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a clause that depends on the main clause</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>linking word</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a word that joins ideas together</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>hold in mind</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to keep something in your memory while thinking</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>central claim</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the most important point a writer makes</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "According to the passage, what causes difficulty?", "o": ["The length of sentences", "The number of ideas in one sentence", "Unfamiliar vocabulary", "The speed of reading"], "a": 1}, {"q": "What do readers who separate the main clause find?", "o": ["That long sentences become manageable", "That reading takes longer", "That linking words are unnecessary", "That they must read twice"], "a": 0}, {"q": "The word **\"which\"** in paragraph 3 refers to ______.", "o": ["the main clause", "the technique", "the claim", "the sentence"], "a": 1}, {"q": "According to the passage, what remains after removing subordinate clauses?", "o": ["The linking words", "The verbs", "The writer's central claim", "The vocabulary"], "a": 2}]}, {"id": 36, "month": "12", "title": "Quy Trình 4 Bước Giải Bài Điền Từ", "theme": "", "html": "<blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi tổng hợp.</strong> Hệ thống hoá mọi thứ đã học thành một quy trình cố định cho <strong>12 câu, 3,0 điểm</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Dạng điền từ có 12 câu chia thành 2 bài leaflet hoặc quảng cáo. Mọi câu hỏi đều rơi vào <strong>một trong bốn loại</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 4 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1 — Đọc lướt toàn bài 30 giây.</strong> Chỉ để biết: văn bản nói về cái gì, và <strong>thời gian chủ đạo</strong> (đã xảy ra / đang xảy ra / sắp xảy ra). Không dừng ở chỗ trống.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Nhìn 4 phương án để phân loại câu hỏi:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">4 phương án trông như thế nào</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đang hỏi gì</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kỹ thuật</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cùng gốc, khác đuôi (-tion/-ive/-ly)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Từ loại</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 19</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Các dạng của cùng một động từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thì &amp; thể</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 14–15</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cùng từ loại, nghĩa gần nhau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Collocation</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 28, 32</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4 từ nối khác nhau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Liên kết ý</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Buổi 33</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3 — Giải theo kỹ thuật tương ứng:</strong></p><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">TỪ LOẠI      → nhìn từ đứng ngay TRƯỚC chỗ trống\nTHÌ &amp; THỂ    → (a) chủ động hay bị động? (b) thì nào?\nCOLLOCATION  → từ nào đi được với từ bên cạn
