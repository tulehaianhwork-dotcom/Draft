er-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Which of the following is NOT mentioned as a benefit?", "o": ["Savings on office space", "Lower commuting costs", "More flexible hours", "Higher salaries for remote workers"], "a": 3}, {"q": "According to the passage, all of the following are drawbacks EXCEPT ______.", "o": ["weaker informal learning for junior staff", "greater difficulty assessing performance", "reduced office space costs", "resentment of monitoring software"], "a": 2}, {"q": "Which is NOT implied about junior staff?", "o": ["They benefit less from informal learning remotely.", "They previously learned by overhearing colleagues.", "They are affected differently from senior staff.", "They prefer working from the office."], "a": 3}, {"q": "Which of the following is NOT true of the current pattern?", "o": ["It is hybrid rather than fully remote.", "Most large employers require two or three office days.", "It satisfies everyone completely.", "It has proved durable."], "a": 2}, {"q": "Which of the following is NOT mentioned in the passage?", "o": ["Monitoring software", "An economic downturn", "Government regulation of remote work", "Savings on office space"], "a": 2}]}, {"id": 49, "month": "1", "title": "Dạng 6: Chèn Câu Vào Đoạn", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>Where in paragraph N does the following sentence best fit?</em> — với bốn vị trí <strong>[I] [II] [III] [IV]</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② BA MANH MỐI</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Manh mối</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cách dùng</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1. Đại từ và từ chỉ định trong câu cần chèn</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">this</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">these</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">such</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">the + N</code> → phải có danh từ tương ứng ở câu <strong>ngay trước</strong> vị trí chèn</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2. Từ nối trong câu cần chèn</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">however</code> → trước đó là ý đối lập · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">therefore</code> → trước đó là nguyên nhân</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3. Mạch chủ đề</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Câu chèn vào giữa hai câu phải <strong>nối liền</strong> ý của chúng</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔑 <strong>Cách kiểm tra chắc chắn nhất:</strong> đọc to <strong>ba câu liền nhau</strong> (câu trước – câu chèn – câu sau). Nghe liền mạch → đúng.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Đọc kỹ câu cần chèn, <strong>gạch chân mọi đại từ và từ nối</strong>. <strong>Bước 2</strong> — Thử từng vị trí, đọc ba câu liền nhau. <strong>Bước 3</strong> — Loại vị trí nào làm <strong>đứt mạch đại từ</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Chèn câu: <em>&quot;<strong>Such hidden costs</strong> only come to light when one stops to think about the roles nature itself is quietly playing.&quot;</em></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Manh mối 1: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Such hidden costs</code> → trước đó <strong>phải có</strong> ví dụ về chi phí ẩn.</li><li>Đoạn liệt kê: phá rừng làm nông → mất carbon; chuyển dòng sông → mất chức năng cũ; bỏ đất hoang → mất thu nhập.</li><li>Vị trí đúng: <strong>sau khi đã nêu đủ các ví dụ</strong>, không phải giữa chừng.</li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>exceed a waiting list</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be longer than expected</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>at scale</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">prep phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">in large amounts or numbers</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>meet demand</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to provide enough for what people want</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>remain doubtful</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to continue to be uncertain</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a mismatch</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a situation where two things do not fit</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "This arrangement spreads the cost over a decade and transfers maintenance risk to the supplier.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 3}, {"q": "Such conversions are cheap and quick, but the plots they create are small.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 2}, {"q": "This pattern held true even among applicants on the lowest incomes.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 1}, {"q": "The scale of the mismatch has led several councils to consider limiting plot sizes instead.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 3}]}, {"id": 50, "month": "1", "title": "Dạng 7: Paraphrase Câu Gạch Chân", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>Which of the following best paraphrases the underlined sentence in paragraph N?</em></p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đáp án đúng phải giữ <strong>đủ và đúng ba thứ</strong>: chủ thể · quan hệ logic · mức độ.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Phân tích câu gốc thành ba phần:</p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Chủ thể là ai, cái gì?</li><li>Quan hệ logic là gì? (nguyên nhân · đối lập · so sánh · điều kiện)</li><li>Mức độ mạnh hay nhẹ? (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">less in X than in Y</code> ≠ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">not in X at all</code>)</li></ul><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2</strong> — Kiểm tra từng phương án theo ba phần đó.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3</strong> — Loại theo bốn kiểu sai:</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kiểu sai</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đảo chủ thể</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bài nói A ảnh hưởng B, phương án nói B ảnh hưởng A</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đảo quan hệ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">less X than Y</code> → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">more X than Y</code></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đổi mức độ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">rarely</code> → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">never</code> · <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">less</code> → <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">not at all</code></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Thêm thông tin</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thêm ý bài không có</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG PHÂN TÍCH <em>(vẽ ra nháp)</em></h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"></th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu gốc</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án đang xét</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chủ thể</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quan hệ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Mức độ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>The reason, according to the researchers, lies <strong>less in the technology itself than in what each method asks of the brain</strong>.</em></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Chủ thể: lý do khác biệt về kết quả học tập</li><li>Quan hệ: <strong>so sánh</strong> — ít nằm ở A, nhiều hơn ở B</li><li>Mức độ: <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">less… than</code> = <strong>không phủ nhận hoàn toàn</strong> A</li></ul><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đánh giá</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>A. What explains the difference is the mental work each method demands, rather than the technology</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✅ Giữ đúng cả ba</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">B. The difference is attributable to modern technology <strong>instead of</strong> the mental work</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Đảo quan hệ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">C. The modern device, <strong>along with</strong> the mental requirements, is responsible</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Đổi quan hệ thành &quot;cả hai&quot;</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D. Regardless of the method, the effects exhibit <strong>little difference</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Đảo hoàn toàn</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>headline measure</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the main figure used to judge something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>without regard to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">prep phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">not considering something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be worth having</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be valuable enough to want</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>assign a weighting</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to decide how important each part is</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>shape decisions</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to influence what people decide</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Câu gốc: *The failure stemmed less from a lack of funding than from poor coordination.*", "o": ["Poor coordination contributed more to the failure than insufficient funding did.", "A lack of funding was the sole cause of the failure.", "Poor coordination was caused by insufficient funding.", "Neither funding nor coordination played any role in the failure."], "a": 0}, {"q": "Câu gốc: *Convenience does not remove labour; it relocates it.*", "o": ["Labour disappears when convenience increases.", "Convenience shifts labour elsewhere rather than eliminating it.", "Convenience creates more labour than it removes.", "Labour and convenience are unrelated concepts."], "a": 1}, {"q": "Câu gốc: *Although the scheme rarely exceeded its budget, it seldom delivered on time.*", "o": ["The scheme was usually on budget but usually late.", "The scheme was always over budget and always late.", "The scheme was never over budget and always punctual.", "Budget overruns caused the delays."], "a": 0}, {"q": "Which best paraphrases the first underlined sentence?", "o": ["GDP figures are frequently calculated incorrectly.", "The problem with GDP is that it measures all activity regardless of its value.", "GDP should be replaced because it is inaccurate.", "Activity that is worth having is never counted in GDP."], "a": 1}, {"q": "Which best paraphrases the second underlined sentence?", "o": ["Critics reject the whole concept of well-being indices.", "Critics object mainly to how the components are weighted, not to the concept itself.", "Critics believe the weightings are the only accurate element.", "Critics argue that well-being cannot be measured at all."], "a": 1}]}, {"id": 51, "month": "1", "title": "Dạng 8: Ý Chính, Tiêu Đề Và Kỹ Thuật Loại Trừ", "theme": "", "html": "<blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi quan trọng thứ hai của tháng.</strong> Ba câu hỏi cùng bản chất, và có <strong>một quy tắc duy nhất</strong> giải quyết được phần lớn.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① BA CÂU HỎI CÙNG BẢN CHẤT</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu hỏi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phạm vi</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Which best summarises paragraph N?</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">ý chính <strong>một đoạn</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>What can be inferred from the passage?</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">suy luận từ <strong>toàn bài</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Which would be the best title?</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bao quát <strong>toàn bài</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Cả ba đều <strong>không có đáp án nằm nguyên trong bài</strong> — phải tổng hợp.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② KỸ THUẬT LOẠI TRỪ</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">🔴 Quy tắc số 1 — Gạch bỏ phương án chứa từ tuyệt đối</h4><pre class=\"bg-slate-900 text-slate-100 text-[12px] rounded-xl p-3 overflow-x-auto\">all · always · never · no · only · every · none · entirely · must · cannot</pre><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Lý do:</strong> đề THPT trích từ báo học thuật, vốn viết giọng <strong>trung lập, cân nhắc hai chiều</strong>. Một phương án khẳng định tuyệt đối gần như luôn sai.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Quy tắc số 2 — Phân biệt ý chính với ví dụ</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Phương án lấy <strong>đúng từ ngữ trong bài</strong> thường là <strong>ví dụ minh hoạ</strong>, không phải luận điểm.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Quy tắc số 3 — Tiêu đề phải bao quát cả bài</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Loại phương án chỉ đúng <strong>một đoạn</strong>, và loại phương án <strong>quá rộng</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG KIỂM 4 BƯỚC</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bước</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thao tác</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Gạch bỏ mọi phương án có từ tuyệt đối</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Gạch bỏ phương án chỉ đúng <strong>một đoạn</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Gạch bỏ phương án <strong>rộng hơn</strong> nội dung bài</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Phương án còn lại — kiểm tra bằng bốn câu tóm ý (buổi 42)</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU — mổ xẻ ba câu</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Câu ý chính đoạn 4:</strong></p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"></th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Loại vì</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✅</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">A. Convenience should be judged by the use made of the time it frees</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khớp tóm ý đoạn 4</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">B. Convenience is harmful and ought to be strictly limited</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cực đoan — bài nói <em>&quot;None of this amounts to an argument for abolishing convenience&quot;</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">C. Saving time is <strong>always</strong> worthwhile</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Từ tuyệt đối</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D. Rest and study are the <strong>only</strong> proper uses</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Từ tuyệt đối</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Câu suy luận:</strong> ✅ <em>Customers who spend saved time on extra work gain little</em> · ❌ <em>Convenience offers <strong>no</strong> benefit</em> (từ tuyệt đối + trái ý bài)</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Câu tiêu đề:</strong> ✅ <em>Convenience: Counting the Hidden Bill</em> (bao quát cả bài) · ❌ <em>Delivery Platforms: An Economic Miracle</em> (chỉ đúng 1 đoạn) · ❌ <strong><em>The End</strong> of Everyday Skills</em> (cực đoan) · ❌ <em>Urban Life: A Race Against Time</em> (quá rộng)</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>hold accountable</strong></td><td class=\"px-3 p 3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>narrow one&#x27;s teaching</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to teach fewer topics than before</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Loại các phương án chứa từ tuyệt đối — phương án còn lại là:", "o": ["The policy always succeeds in rural areas.", "The policy works better in some contexts than others.", "No region has benefited from the policy.", "Every council has adopted the approach."], "a": 1}, {"q": "Loại các phương án chứa từ tuyệt đối — phương án còn lại là:", "o": ["Technology entirely replaces human judgement.", "Technology can support but not replace judgement.", "Human judgement is never reliable.", "Only technology produces accurate results."], "a": 1}, {"q": "Loại các phương án chứa từ tuyệt đối — phương án còn lại là:", "o": ["Cycling schemes must be free to succeed.", "Cycling schemes tend to work where infrastructure exists.", "All cyclists prefer dedicated lanes.", "No city has achieved full adoption."], "a": 1}, {"q": "Which best summarises paragraph 2?", "o": ["Targets always cause harm to public services.", "Measuring something changes what organisations prioritise, sometimes distorting behaviour.", "Hospitals and schools are the only institutions affected by targets.", "Exam results are a poor measure of teaching quality."], "a": 1}, {"q": "What can be inferred from the passage?", "o": ["Targets should be removed from all public services.", "Targets are more useful when accompanied by measures of their side effects.", "Waiting times are the only meaningful hospital measure.", "Public services cannot be held accountable."], "a": 1}, {"q": "According to paragraph 4, the alter shop owners have since reported that more people walk and cycle into the centre, and that sales have risen slightly. <strong>The objection, it turned out, rested less on evidence than on an assumption about how customers arrive.</strong></p><p class=\"mb-2 last:mb-0 leading-relaxed\">Several other European cities are now studying the results. <strong>[IV]</strong> By 2028, planners expect that at least twenty more will have introduced similar limits, though a few have ruled out the idea entirely, citing the cost of new signage.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(240 từ)</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Câu hỏi</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> According to paragraph 2, air quality improved because ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>5.</strong> Which of the following is NOT mentioned in the passage?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>6.</strong> Where does the following sentence best fit? <em>Residents had complained for years about traffic on residential streets.</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>7.</strong> Which best paraphrases the underlined sentence in paragraph 3?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>8.</strong> Which would be the best title for the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">🔹 Sau khi làm — tự phân tích</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b borde
