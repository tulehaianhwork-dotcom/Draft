></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">6 — chèn câu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">6</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">7 — paraphrase</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">7</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">8 — tiêu đề</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">8</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "The word **plummeted** in paragraph 2 is closest in meaning to ______.", "o": ["risen sharply", "fallen sharply", "remained stable", "been measured"], "a": 1}, {"q": "The word **plummeted** in paragraph 2 is OPPOSITE in meaning to ______.", "o": ["dropped", "soared", "declined", "shifted"], "a": 1}, {"q": "The word **that** in paragraph 2 refers to ______.", "o": ["the change", "the city", "the number of serious accidents", "the ring road"], "a": 2}, {"q": "According to paragraph 2, air quality improved because ______.", "o": ["fewer cars entered the city", "cars produce fewer emissions at lower speeds", "accidents fell by half", "the ring road was closed"], "a": 1}, {"q": "Which of the following is NOT mentioned in the passage?", "o": ["The cost of new signage", "Shop owners' reports on sales", "Government funding for the scheme", "The speed limit inside the ring road"], "a": 2}, {"q": "Residents had complained for years about traffic on residential streets.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 0}, {"q": "Which best paraphrases the underlined sentence in paragraph 3?", "o": ["The businesses' objection was based more on a belief about customer behaviour than on data.", "The businesses had strong evidence that customers would stop coming.", "Customers proved that the businesses were entirely correct.", "Businesses and customers agreed on how people travel."], "a": 0}, {"q": "Which would be the best title for the passage?", "o": ["Dutch Cities: A Model for Europe", "Slower Streets: A Change That Paid Off", "The End of the Motor Car", "How to Reduce Air Pollution"], "a": 1}]}, {"id": 53, "month": "1", "title": "Trộn 8 Dạng: Bài 2", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 THE QUIET COST OF NOTETAKING</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">For decades, students have been convinced that academic success depends largely on meticulous notetaking. <strong>[I]</strong> What has changed in recent years is not the importance of the practice but the tools used to perform it. The keyboard has subtly supplanted the pen, and with it, the nature of how information is recorded during a lecture has shifted unbeknownst to students.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">Researchers in cognitive psychology have begun to examine what this change has cost learners. In a series of comparative studies, students taking notes by hand consistently outperformed <strong>those</strong> using laptops on questions that demanded conceptual understanding, even when both groups had access to the same material. <strong>[II]</strong> <strong>The reason, according to the researchers, lies less in the technology itself than in what each method asks of the brain.</strong> Typing rewards speed; handwriting forces selection.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">The act of writing by hand is slower, and that slowness appears to be its hidden virtue. Unable to capture every word, students are obliged to listen, decide what matters and condense ideas into their own phrasing. This continuous filtering, referred to as encoding by psychologists, turns out to be <strong>instrumental</strong> in aiding long-term recall. <strong>[III]</strong></p><p class=\"mb-2 last:mb-0 leading-relaxed\">It would be misleading, of course, to claim that handwriting is inherently superior or that all keyboards undermine learning. Hard-working typists can summarise, while <strong>indolent</strong> writers can drift. <strong>[IV]</strong> What the research highlights is not a conclusion about devices but a question about effort: which tool, in a given context, asks more of the learner?</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>(260 từ)</em></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">Câu hỏi</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1.</strong> In paragraph 1, the writer is ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>3.</strong> Which of the following best paraphrases the underlined sentence in paragraph 2?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>6.</strong> Which of the following statements would the writer NOT agree with?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>7.</strong> Where does the following sentence best fit? <em>One lecturer summarised the contrast after reviewing her students&#x27; work: the laptops had produced transcripts, while the notebooks had produced understanding.</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>9.</strong> Which would be the best title for the passage?</p>", "quiz": [{"q": "In paragraph 1, the writer is ______.", "o": ["challenging a long-held assumption about academic success", "introducing a recent change in the way students take notes", "questioning the significance of notetaking in education", "promoting the use of technology in recording lectures"], "a": 1}, {"q": "The word **those** in paragraph 2 refers to ______.", "o": ["students", "researchers", "studies", "notes"], "a": 0}, {"q": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["What explains the difference in student performance is the mental work that each method of notetaking demands, rather than the technology.", "The difference in student performance is attributable to the modern technology instead of the mental work that each method requires.", "The modern device, along with the mental requirements of each method, is responsible for the difference.", "Regardless of the method, the effects on the brain exhibit little difference."], "a": 0}, {"q": "The word **instrumental** in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["specific", "trivial", "central", "dramatic"], "a": 1}, {"q": "The word **indolent** in paragraph 4 is closest in meaning to ______.", "o": ["active", "serious", "lazy", "careful"], "a": 2}, {"q": "Which of the following statements would the writer NOT agree with?", "o": ["Handwritten and typed notes led to varied degrees of conceptual understanding.", "The slow speed of writing by hand turns out to be an advantage over typing.", "Handwriting is inherently superior to typing in every situation.", "Students are largely unaware of the change in notetaking methods."], "a": 2}, {"q": "One lecturer summarised the contrast after reviewing her students' work: the laptops had produced transcripts, while the notebooks had produced understanding.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 2}, {"q": "In which paragraph does the writer warn against an overgeneralisation?", "o": ["Paragraph 1", "Paragraph 2", "Paragraph 3", "Paragraph 4"], "a": 3}, {"q": "Which would be the best title for the passage?", "o": ["Laptops: The Enemy of Learning", "Notetaking: Why the Tool Changes the Thinking", "A History of the Written Word", "Cognitive Psychology Explained"], "a": 1}]}, {"id": 54, "month": "1", "title": "Phân Bổ Thời Gian Và Kỹ Thuật Bỏ Câu", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① PHÂN BỔ THỜI GIAN CHUẨN — phải thuộc lòng</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phần</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Số câu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thời gian</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tốc độ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D1 — Điền mệnh đề</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>7 phút</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1,4 phút/câu</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D2 — Sắp xếp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>5 phút</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1 phút/câu</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D3 — Điền từ (2 bài)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>12 phút</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1 phút/câu</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>D4 — Đọc hiểu (2 bài)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>18</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>26 phút</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1,4 phút/câu</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tổng</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>40</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>50 phút</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">⚠️ <strong>Tổng đúng 50 phút, không có thời gian dư.</strong> Đây là lý do kỹ năng bỏ câu là bắt buộc.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② KỸ THUẬT BỎ CÂU — quy tắc 90 giây</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Quá <strong>90 giây</strong> ở một câu → đánh dấu ✗ vào lề, chọn bừa một phương án, <strong>chuyển sang câu tiếp</strong>. <strong>Bước 2</strong> — Làm hết bài rồi quay lại các câu đã đánh dấu. <strong>Bước 3</strong> — Nếu hết giờ, các câu đó đã có đáp án sẵn — không bị bỏ trắng.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 <strong>Những câu nên bỏ trước:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Câu ý chính, suy luận, tiêu đề của <strong>bài đọc thứ hai</strong> (thường khó nhất)</li><li>Câu điền mệnh đề mà cả bốn phương án đều dài và giống nhau</li></ul><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 <strong>Những câu không bao giờ nên bỏ:</strong></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Tham chiếu đại từ · từ vựng trong ngữ cảnh · NOT/EXCEPT</li></ul><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ Ba dạng này luôn giải được bằng quy trình, chỉ tốn thời gian chứ không cần may mắn.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ THỨ TỰ LÀM BÀI ĐỀ XUẤT</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thứ tự</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phần</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Lý do</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D3 — Điền từ (12 câu)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Ăn chắc nhất, làm lúc đầu óc còn tỉnh</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D2 — Sắp xếp (5 câu)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nhanh, có quy trình rõ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D4 — Đọc hiểu (18 câu)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chiếm nhiều thời gian nhất</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D1 — Điền mệnh đề (5 câu)</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khó nhất, để cuối</td></tr></tbody></table></div>", "quiz": []}, {"id": 55, "month": "1", "title": "Luyện Phần Đọc Đầy Đủ: 18 Câu", "theme": "", "html": "<blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi mô phỏng.</strong> Hai bài đọc, 18 câu, bấm giờ <strong>26 phút</strong> — đúng như đề thật.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 BÀI 1 — ENVIRONMENTAL SERVICES <em>(10 câu)</em></h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">Environmental services, even when they arise without any human labour, are by no means cost-free. Every cost should be understood in terms of opportunity cost. For environmental services, the opportunity cost amounts to the net gain <strong>relinquished</strong> because the resources are no longer available for their second-best application. Whenever a resource has alternative uses, it cannot legitimately be deemed free.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">For instance, a section of river might serve as a site used for either white-water canoeing or hydroelectric generation. Constructing a dam to produce electricity would flood the rapids, so this makes white-water canoeing here out of the question. The opportunity cost of preserving the river for canoeing equals the net benefit of the electricity that would otherwise have been produced. By the same token, the opportunity cost of erecting the dam involves everything the river in its natural state would have provided — leisure activities, wildlife, scenic beauty, and whatever worth future generations might attach to experiencing the rapids.</p><p class=\"mb-2 last:mb-0 leading-relaxed\">This understanding carries considerable weight for planning development. <strong>[I]</strong> Numerous decisions initially appearing to be cost-free moves in favour of growth prove, when examined carefully, to be against something else. <strong>[II]</strong> Clearing a forest to make way for crops is hardly without cost; it is paid for through losses in carbon storage, biological diversity, and all the functions the forest once performed unnoticed. <strong>[III]</strong> Channelling a river for irrigation has its price — namely, whatever the river was doing before its course was altered. <strong>[IV]</strong></p><p class=\"mb-2 last:mb-0 leading-relaxed\">From this perspective, economic development can never be reduced to whether a project delivers a positive return. Rather, what must be asked is whether that return outweighs the value of sacrifices this — by pricing scarce environmental services, or obliging those in charge to consider both sides — are not against development. What <strong>they</strong> demand is that development should be worth its true cost. The danger lies not in counting too much, but in counting too little.</p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2.</strong> According to paragraph 1, the costs of environmental services are ______.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>3.</strong> Which of the following is NOT implied in paragraph 2?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>4.</strong> Where in paragraph 3 does the following sentence best fit? <em>Such hidden costs only come to light when one stops to think about the roles nature itself is quietly playing.</em></p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>5.</strong> Which of the following best summarises paragraph 3?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>7.</strong> What conclusion can be drawn from paragraph 4?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>8.</strong> Which of the following is true according to the passage?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>9.</strong> Which of the following can be inferred from the passage?</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>10.</strong> Which of the following would be the best title for the passage?</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📖 BÀI 2 — dùng lại bài <strong>THE QUIET COST OF NOTETAKING</strong> (buổi 53), 8 câu đầu</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📊 BẢNG GHI KẾT QUẢ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"></th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bài 1</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bài 2</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tổng</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Số câu đúng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/10</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/8</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/18</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thời gian</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___ phút</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___ phút</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___ phút</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Ngưỡng:</strong> ≥ 12/18 và ≤ 26 phút.</p>", "quiz": [{"q": "The word **relinquished** in paragraph 1 is closest in meaning to ______.", "o": ["filled up", "given up", "made up", "ended up"], "a": 1}, {"q": "According to paragraph 1, the costs of environmental services are ______.", "o": ["included in the market value of natural resources", "determined by financial investment in natural resources", "minimal because these services are nearly labour-free", "existent even in the absence of human involvement"], "a": 3}, {"q": "Which of the following is NOT implied in paragraph 2?", "o": ["The intrinsic value of the river is not confined to generating hydroelectricity only.", "Intangible benefits also constitute the opportunity cost of the dam construction.", "It is impossible to exploit one stretch of river for both hydroelectric generation and white-water canoeing.", "The strains on the ecosystem imposed by recreational activities and power generation are similar."], "a": 3}, {"q": "Such hidden costs only come to light when one stops to think about the roles nature itself is quietly playing.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 3}, {"q": "Which of the following best summarises paragraph 3?", "o": ["Untouched and cultivated lands both produce benefits in the long term.", "Ecological preservation exerts negligible influence on economic development.", "Apparently harmless developments actually come at an underlying price.", "Economic benefits should never take precedence over forest and river preservation."], "a": 2}, {"q": "The word **they** in paragraph 4 refers to ______.", "o": ["sides", "sacrifices", "services", "policies"], "a": 3}, {"q": "What conclusion can be drawn from paragraph 4?", "o": ["Both excessive caution and complete ignorance regarding environmental costs cause permanent damage.", "Initiatives are required by law to deduct the hidden costs before claiming to have a positive return.", "Putting a price on environmental services is aimed at slowing down economic projects.", "Due consideration for opportunity costs is crucial for the genuine success of development."], "a": 3}, {"q": "Which of the following is true according to the passage?", "o": ["The positive return of every economic development must be worth what is sacrificed.", "Cost-free resources can be put to alternative uses as long as this is legally permitted.", "Assigning a specific price tag to a resource is a prerequisite for calculating opportunity costs.", "Keeping land intact is free of opportunity cost as there is no resource consumption."], "a": 0}, {"q": "Which of the following can be inferred from the passage?", "o": ["The value of preserved environmental services far outweighs the benefits of industrial development.", "Projects are mandated to make up for the economic losses in return for environmental preservation.", "The scale of economic development inevitably suffers from strict regulations on environmental services.", "Decisions that overlook environmental opportunity costs risk overestimating the net gains they produce."], "a": 3}, {"q": "Which of the following would be the best title for the passage?", "o": ["Sustainable Development: A Pipe Dream", "Development: Factoring in Sacrifices", "Environment: A Tower of Strength", "Natural Preservation: Ushering in a New Era"], "a": 1}]}, {"id": 56, "month": "1", "title": "Tổng Ôn Và Bàn Giao Sang Tháng 2", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① BẢNG TỔNG HỢP 8 DẠNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Quy trình cốt lõi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bẫy chính</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1. Closest in meaning</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Che phương án → tự nghĩ từ thay thế → thay ngược vào câu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đúng từ điển, sai ngữ cảnh</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2. OPPOSITE</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Khoanh chữ OPPOSITE → loại phương án đồng nghĩa</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Luôn có một phương án đồng nghĩa</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3. Tham chiếu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Quay lại vị trí trong bài → khớp số → thay vào đọc lại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chọn danh từ gần nhất mà không khớp số</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>4. Chi tiết</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Định vị đoạn → đối chiếu từng phương án</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Nói quá · đảo chiều · ghép sai</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>5. NOT/EXCEPT</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bảng đối chiếu ✓/✗ bốn dòng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chọn theo cảm tính</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>6. Chèn câu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Gạch chân đại từ và từ nối trong câu chèn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bỏ qua manh mối <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">this/such/these</code></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>7. Paraphrase</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Ba phần: chủ thể · quan hệ · mức độ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đảo quan hệ · đổi mức độ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>8. Ý chính, tiêu đề</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">🔴 Gạch bỏ phương án có từ tuyệt đối</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chọn phương án cực đoan</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② RÀ SOÁT SỔ LỖI BỐN THÁNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tháng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ba lỗi lặp nhiều nhất</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Buổi gốc cần ôn</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">10</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">11</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG TIẾN BỘ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dạng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đầu vào (T9)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">KT T10</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">KT T11</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">KT T12</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">KT T1</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Mục tiêu</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D1 — Điền mệnh đề</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1/5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3/5</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D2 — Sắp xếp</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2/4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4/5</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D3 — Điền từ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1/6</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">11/12</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D4 — Đọc hiểu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2/9</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/6</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/6</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">—</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">___/18</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">14/18</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ BỐN ĐIỀU KIỆN SẴN SÀNG LUYỆN ĐỀ</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">#</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Điều kiện</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kiểm chứng</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đạt?</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đã chạm cả bốn dạng đề</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D1 ✓ buổi 41 · D2 ✓ buổi 39–40 · D3 ✓ buổi 36–38 · D4 ✓ buổi 42–55</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">12 câu điền từ trong 12 phút, đúng ≥ 9</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Bài thử buổi 56</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Sổ lỗi ghi liên tục từ tháng 12</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Giáo viên kiểm sổ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thuộc bảng phân bổ thời gian 7/5/12/26</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hỏi miệng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑤ NHỊP HỌC TỪ THÁNG 2</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Buổi</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nội dung</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Buổi 1</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Làm đề full 40 câu / 50 phút, bấm giờ nghiêm, không tra từ</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Buổi 2</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chữa đề — học viên tự giải thích từng câu sai <strong>trước</strong> khi giáo viên nói</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Buổi 3</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Luyện chuyên sâu dạng sai nhiều nhất của đề đó</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ BA ĐIỀU CẦN BIẾT TRƯỚC KHI VÀO THÁNG 2</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>1. Đề đầu tiên gần như chắc chắn dưới 5,5 điểm</strong> — kể cả khi đã học xong toàn bộ bốn dạng. Nguyên nhân là <strong>tốc độ</strong>, không phải kiến thức. Đây là hiện tượng bình thường và đã được dự liệu từ đầu lộ trình.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>2. Từ tháng 2, Sổ lỗi là công cụ chính.</strong> Mỗi câu sai ghi đúng một dòng. Lỗi lặp từ ba lần → quay lại buổi gốc trong giáo trình này.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>3. Không còn kiến thức mới.</strong> Mọi thứ cần biết đã nằm trong 56 buổi vừa qua. Từ đây là việc ghép lại và chạy đua với đồng hồ.</p>", "quiz": []}];

const MONTHS=[{k:"10",label:"Tháng 10",sub:"Hệ thống 8 thì"},{k:"11",label:"Tháng 11",sub:"Bị động · Từ loại · Điều kiện"},{k:"12",label:"Tháng 12",sub:"Từ vựng & dạng bài"},{k:"1",label:"Tháng 1",sub:"Đọc hiểu"}];
const ACCOUNTS={hocvien2:{password:"hocvien2",role:"student",name:"Học viên"},admin:{password:"admin",role:"admin",name:"Quản trị viên"}};
const LS=k=>"thptqg_"+k;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(LS(k))||JSON.stringify(d))}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(LS(k),JSON.stringify(v))}catch(e){}};

let user=load("user",null);
let overrides=load("overrides",{});       // {id:{title,html,quiz}}
let resources=load("resources",{});       // {id:{audio,docs,slide,note}}
let globalRes=load("globalres",{audio:"",docs:"",slide:"",note:""});
let progress=load("progress",{});         // {user:{done:[],scores:{}}}
let current=null, monthFilter="ALL", search="";

const LESSONS=LESSONS_RAW.map(l=>{const o=overrides[l.id]||{};return{...l,...o}});
const byId=id=>LESSONS.find(l=>l.id===id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=()=>{const u=user?user.username:"guest";progress[u]=progress[u]||{done:[],scores:{}};return progress[u]};

/* ---------- LOGIN ---------- */
document.getElementById("loginForm").onsubmit=e=>{
  e.preventDefault();
  const u=loginUsername.value.trim().toLowerCase(),p=loginPass.value;
  const a=ACCOUNTS[u];
  if(!a||a.password!==p){loginError.classList.remove("hidden");loginError.querySelector("span").textContent="Tên đăng nhập hoặc mật khẩu không đúng.";loginPass.value="";return;}
  user={username:u,role:a.role,name:a.name};save("user",user);loginError.classList.add("hidden");
  loginModal.classList.add("hidden");initSession();
};
logoutBtn.onclick=()=>{user=null;localStorage.removeItem(LS("user"));adminModal.classList.add("hidden");loginModal.classList.remove("hidden")};

function initSession(){
  userNameDisplay.textContent=user.name;
  userRoleDisplay.textContent=user.role==="admin"?"Quản trị viên":"Tài khoản học viên";
  userAvatar.textContent=user.name.charAt(0).toUpperCase();
  adminBtn.classList.toggle("hidden",user.role!=="admin");
  renderFilters();renderList();renderProgress();
  openLesson(P().done.length?Math.min(56,P().done.length+1):1);
}

/* ---------- SIDEBAR ---------- */
function renderFilters(){
  monthFilters.innerHTML=[{k:"ALL",label:"Tất cả"}].concat(MONTHS).map(m=>
    `<button data-m="${m.k}" class="mfilter text-[11px] px-2.5 py-1 rounded-lg font-medium ${monthFilter===m.k?'bg-brand-600 text-white':'bg-white/10 text-slate-300 hover:bg-white/20'}">${m.label}</button>`).join("");
  monthFilters.querySelectorAll(".mfilter").forEach(b=>b.onclick=()=>{monthFilter=b.dataset.m;renderFilters();renderList()});
}
function renderList(){
  const done=P().done;
  const items=LESSONS.filter(l=>(monthFilter==="ALL"||l.month===monthFilter)&&(!search||(("buổi "+l.id+" "+l.title+" "+(l.theme||"")).toLowerCase().includes(search))));
  let html="",lastMonth=null;
  items.forEach(l=>{
    if(l.month!==lastMonth){lastMonth=l.month;const m=MONTHS.find(x=>x.k===l.month);
      html+=`<div class="px-2 pt-3 pb-1"><p class="text-[10px] uppercase tracking-wider font-bold text-slate-500">${m.label}</p><p class="text-[11px] text-slate-600">${m.sub}</p></div>`}
    const d=done.includes(l.id),act=current===l.id;
    const sc=P().scores[l.id];
    html+=`<button data-id="${l.id}" class="lrow w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 ${act?'bg-brand-600 text-white':'hover:bg-white/10'}">
      <span class="w-7 h-7 shrink-0 rounded-lg text-[11px] font-bold flex items-center justify-center ${d?'bg-emerald-500 text-white':act?'bg-white/20':'bg-white/10 text-slate-300'}">${d?'<i class="fa-solid fa-check"></i>':l.id}</span>
      <span class="min-w-0 flex-1"><span class="block text-[13px] font-semibold truncate ${act?'text-white':'text-slate-100'}">${esc(l.title)}</span>
      <span class="block text-[11px] truncate ${act?'text-brand-100':'text-slate-400'}">${l.theme?esc(l.theme):'Buổi '+l.id}${sc!=null?' · '+sc+'/'+(l.quiz.length||0):''}</span></span></button>`;
  });
  lessonsList.innerHTML=html||`<p class="text-center text-slate-500 text-[13px] py-8">Không tìm thấy buổi học</p>`;
  lessonsList.querySelectorAll(".lrow").forEach(b=>b.onclick=()=>{openLesson(+b.dataset.id);if(innerWidth<1024)closeSidebar()});
}
function renderProgress(){const d=P().done.length;progressText.textContent=d+"/"+LESSONS.length;progressBar.style.width=(d/LESSONS.length*100)+"%"}
searchInput.oninput=e=>{search=e.target.value.toLowerCase().trim();renderList()};
const openSidebar=()=>{sidebar.classList.remove("-translate-x-full");mobileOverlay.classList.remove("hidden")};
const closeSidebar=()=>{sidebar.classList.add("-translate-x-full");mobileOverlay.classList.add("hidden")};
toggleMenuBtn.onclick=openSidebar;mobileOverlay.onclick=closeSidebar;

/* ---------- LESSON ---------- */
function openLesson(id){
  current=id;const l=byId(id);if(!l)return;
  const m=MONTHS.find(x=>x.k===l.month);
  hdrMonth.textContent=m.label+" · Buổi "+l.id;hdrTitle.textContent=l.title;
  renderList();renderLesson("kt");
  document.querySelector("main").scrollTo({top:0});
}
function renderLesson(tab){
  const l=byId(current);const done=P().done.includes(l.id);const r=Object.assign({},globalRes,resources[l.id]||{});
  const tabBtn=(k,icon,label)=>`<button data-tab="${k}" class="ltab flex-1 sm:flex-none px-4 py-2.5 text-[13px] font-semibold rounded-xl ${tab===k?'bg-brand-600 text-white shadow':'bg-white text-slate-600 hover:bg-slate-50'}"><i class="fa-solid ${icon} mr-1.5"></i>${label}</button>`;
  let body="";
  if(tab==="kt"){
    body=`<article class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 fade-in">${l.html}</article>`;
  }else if(tab==="quiz"){
    body=l.quiz.length?quizHTML(l):`<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500 text-sm">Buổi này là buổi tổng ôn / thực hành, không có quiz trắc nghiệm.</div>`;
  }else{
    const link=(icon,label,url,desc)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener" class="flex items-center gap-3 bg-white border border-slate-200 hover:border-brand-400 hover:bg-brand-50/40 rounded-2xl p-4 transition"><span class="w-11 h-11 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-lg"><i class="fa-solid ${icon}"></i></span><span class="min-w-0"><span class="block font-semibold text-[14px] text-slate-900">${label}</span><span class="block text-[12px] text-slate-500 truncate">${desc}</span></span><i class="fa-solid fa-arrow-up-right-from-square ml-auto text-slate-400 text-xs"></i></a>`
      :`<div class="flex items-center gap-3 bg-slate-50 border border-dashed border-slate-300 rounded-2xl p-4"><span class="w-11 h-11 rounded-xl bg-slate-200 text-slate-400 flex items-center justify-center text-lg"><i class="fa-solid ${icon}"></i></span><span><span class="block font-semibold text-[14px] text-slate-500">${label}</span><span class="block text-[12px] text-slate-400">Chưa có link — quản trị viên thêm trong Bảng quản trị</span></span></div>`;
    body=`<div class="space-y-3 fade-in">
      ${link("fa-headphones","File nghe",r.audio,"Audio buổi học")}
      ${link("fa-file-lines","Tài liệu (docs)",r.docs,"Bản mềm giáo trình / bài tập")}
      ${link("fa-display","Slide bài giảng",r.slide,"Slide trình chiếu trên lớp")}
      ${r.note?`<div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-[13px] text-amber-900"><i class="fa-solid fa-note-sticky mr-1.5"></i>${esc(r.note)}</div>`:""}
    </div>`;
  }
  content.innerHTML=`
    <div class="mb-4 flex flex-wrap items-center gap-2">
      <span class="text-[11px] font-bold uppercase tracking-wider text-brand-700 bg-brand-100 px-2.5 py-1 rounded-lg">Buổi ${l.id}</span>
      ${l.theme?`<span class="text-[11px] font-medium text-slate-600 bg-slate-200 px-2.5 py-1 rounded-lg">Chủ đề: ${esc(l.theme)}</span>`:""}
      ${done?`<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-lg"><i class="fa-solid fa-check mr-1"></i>Đã hoàn thành</span>`:""}
    </div>
    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-4">${esc(l.title)}</h1>
    <div class="flex gap-2 mb-4 sticky top-[60px] z-10 bg-slate-100/90 backdrop-blur py-2 -mx-1 px-1 rounded-xl">
      ${tabBtn("kt","fa-book-open","Kiến thức")}${tabBtn("quiz","fa-list-check","Quiz "+(l.quiz.length?l.quiz.length+" câu":""))}${tabBtn("res","fa-folder-open","Tài liệu lớp")}
    </div>
    ${body}
    <div class="mt-6 flex items-center justify-between gap-2">
      <button id="prevBtn" class="text-[13px] font-semibold px-4 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 ${l.id===1?'opacity-40 pointer-events-none':''}"><i class="fa-solid fa-arrow-left mr-1.5"></i>Buổi trước</button>
      <button id="doneBtn" class="text-[13px] font-semibold px-4 py-2.5 rounded-xl ${done?'bg-emerald-600 text-white':'bg-slate-900 text-white hover:bg-slate-800'}"><i class="fa-solid fa-circle-check mr-1.5"></i>${done?"Đã hoàn thành":"Đánh dấu hoàn thành"}</button>
      <button id="nextBtn" class="text-[13px] font-semibold px-4 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 ${l.id===56?'opacity-40 pointer-events-none':''}">Buổi sau<i class="fa-solid fa-arrow-right ml-1.5"></i></button>
    </div>`;
  content.querySelectorAll(".ltab").forEach(b=>b.onclick=()=>renderLesson(b.dataset.tab));
  prevBtn.onclick=()=>openLesson(l.id-1);nextBtn.onclick=()=>openLesson(l.id+1);
  doneBtn.onclick=()=>toggleDone(l.id);
  if(tab==="quiz"&&l.quiz.length)bindQuiz(l);
}
function toggleDone(id){const p=P();const i=p.done.indexOf(id);if(i>=0)p.done.splice(i,1);else p.done.push(id);save("progress",progress);renderProgress();renderList();renderLesson("kt")}
completeBtn.onclick=()=>current&&toggleDone(current);

/* ---------- QUIZ ---------- */
let answers={};
function quizHTML(l){
  answers={};
  return `<div class="fade-in space-y-3" id="quizWrap">
    <div class="bg-white rounded-2xl border border-slate-200 p-4 flex items-center gap-3">
      <span class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center"><i class="fa-solid fa-list-check"></i></span>
      <div class="flex-1"><p class="font-semibold text-[14px]">Quiz ${l.quiz.length} câu</p><p class="text-[12px] text-slate-500">Chọn đáp án rồi bấm “Nộp bài” để xem kết quả và giải thích vị trí sai.</p></div>
    </div>
    ${l.quiz.map((q,i)=>`<div class="bg-white rounded-2xl border border-slate-200 p-4" data-q="${i}">
      <p class="font-semibold text-[14px] text-slate-900 mb-3"><span class="text-brand-600">${i+1}.</span> ${esc(q.q)}</p>
      <div class="grid sm:grid-cols-2 gap-2">
        ${q.o.map((o,j)=>`<button class="qopt text-left text-[13px] px-3 py-2.5 rounded-xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50/50 transition" data-q="${i}" data-o="${j}">
          <span class="inline-flex w-5 h-5 mr-2 rounded-md bg-slate-100 text-[11px] font-bold items-center justify-center">${"ABCD"[j]}</span>${esc(o)}</button>`).join("")}
      </div></div>`).join("")}
    <div class="flex items-center gap-3 sticky bottom-3">
      <button id="submitQuiz" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl py-3 shadow-lg">Nộp bài</button>
      <button id="resetQuiz" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold">Làm lại</button>
    </div>
    <div id="quizResult"></div></div>`;
}
function bindQuiz(l){
  content.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q;answers[q]=+b.dataset.o;
    content.querySelectorAll(`.qopt[data-q="${q}"]`).forEach(x=>x.className="qopt text-left text-[13px] px-3 py-2.5 rounded-xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50/50 transition");
    b.className="qopt text-left text-[13px] px-3 py-2.5 rounded-xl border-2 border-brand-500 bg-brand-50 font-medium transition";
  });
  submitQuiz.onclick=()=>{
    let sc=0;
    l.quiz.forEach((q,i)=>{
      const ok=answers[i]===q.a;if(ok)sc++;
      content.querySelectorAll(`.qopt[data-q="${i}"]`).forEach(x=>{
        const j=+x.dataset.o;x.classList.remove("border-brand-500","bg-brand-50","border-2");
        if(j===q.a)x.className="qopt text-left text-[13px] px-3 py-2.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-medium";
        else if(j===answers[i])x.className="qopt text-left text-[13px] px-3 py-2.5 rounded-xl border-2 border-red-400 bg-red-50";
        x.style.pointerEvents="none";
      });
    });
    const p=P();p.scores[l.id]=sc;if(!p.done.includes(l.id)&&sc>=Math.ceil(l.quiz.length*0.7))p.done.push(l.id);
    save("progress",progress);renderProgress();renderList();
    const pct=Math.round(sc/l.quiz.length*100);
    quizResult.innerHTML=`<div class="rounded-2xl p-5 text-center ${pct>=70?'bg-emerald-50 border border-emerald-200':'bg-amber-50 border border-amber-200'}">
      <p class="text-3xl font-extrabold ${pct>=70?'text-emerald-700':'text-amber-700'}">${sc}/${l.quiz.length}</p>
      <p class="text-[13px] mt-1 ${pct>=70?'text-emerald-700':'text-amber-700'}">${pct>=70?"Tốt! Ghi lại các câu sai vào Sổ lỗi rồi sang buổi tiếp theo.":"Chưa đạt 70% — xem lại phần Kiến thức rồi làm lại."}</p></div>`;
    quizResult.scrollIntoView({behavior:"smooth",block:"center"});
  };
  resetQuiz.onclick=()=>renderLesson("quiz");
}

/* ---------- ADMIN ---------- */
let adminTab="res",editId=1;
adminBtn.onclick=()=>{adminModal.classList.remove("hidden");renderAdmin()};
closeAdmin.onclick=()=>adminModal.classList.add("hidden");
document.querySelectorAll(".atab").forEach(b=>b.onclick=()=>{
  adminTab=b.dataset.atab;
  document.querySelectorAll(".atab").forEach(x=>x.className="atab px-4 py-2.5 text-[13px] font-semibold border-b-2 "+(x.dataset.atab===adminTab?"border-brand-600 text-brand-700":"border-transparent text-slate-500"));
  renderAdmin();
});
const inp=(id,label,val,ph)=>`<label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">${label}</span>
  <input id="${id}" value="${esc(val||"")}" placeholder="${ph||"https://..."}" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] focus:outline-none focus:border-brand-500"></label>`;
function renderAdmin(){
  if(adminTab==="res"){
    adminBody.innerHTML=`<div class="space-y-5">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-1">Link dùng chung cho cả khoá</p>
        <p class="text-[12px] text-slate-500 mb-4">Áp dụng cho mọi buổi chưa có link riêng (ví dụ: 1 folder Drive chung).</p>
        <div class="grid sm:grid-cols-3 gap-3">${inp("gAudio","File nghe (audio)",globalRes.audio)}${inp("gDocs","Tài liệu (docs)",globalRes.docs)}${inp("gSlide","Slide bài giảng",globalRes.slide)}</div>
        <div class="mt-3">${inp("gNote","Ghi chú hiển thị cho học viên",globalRes.note,"VD: Mật khẩu mở file là 2027")}</div>
        <button id="saveGlobal" class="mt-4 bg-brand-600 hover:bg-brand-700 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Lưu link chung</button>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-3">Link riêng từng buổi</p>
        <select id="resLesson" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[13px] mb-4">${LESSONS.map(l=>`<option value="${l.id}" ${l.id===editId?"selected":""}>Buổi ${l.id} — ${esc(l.title)}</option>`).join("")}</select>
        <div id="resFields"></div>
      </div></div>`;
    saveGlobal.onclick=()=>{globalRes={audio:gAudio.value.trim(),docs:gDocs.value.trim(),slide:gSlide.value.trim(),note:gNote.value.trim()};save("globalres",globalRes);toast("Đã lưu link chung");if(current)renderLesson("res")};
    const fields=()=>{const r=resources[editId]||{};
      resFields.innerHTML=`<div class="grid sm:grid-cols-3 gap-3">${inp("rAudio","File nghe (audio)",r.audio)}${inp("rDocs","Tài liệu (docs)",r.docs)}${inp("rSlide","Slide bài giảng",r.slide)}</div>
      <div class="mt-3">${inp("rNote","Ghi chú cho buổi này",r.note,"VD: nghe track 3 trước khi vào lớp")}</div>
      <div class="flex gap-2 mt-4"><button id="saveRes" class="bg-brand-600 hover:bg-brand-700 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Lưu link buổi ${editId}</button>
      <button id="clearRes" class="bg-white border border-slate-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Xoá link buổi này</button></div>`;
      saveRes.onclick=()=>{resources[editId]={audio:rAudio.value.trim(),docs:rDocs.value.trim(),slide:rSlide.value.trim(),note:rNote.value.trim()};save("resources",resources);toast("Đã lưu link buổi "+editId);if(current)renderLesson("res")};
      clearRes.onclick=()=>{delete resources[editId];save("resources",resources);fields();toast("Đã xoá")};
    };
    resLesson.onchange=e=>{editId=+e.target.value;fields()};fields();
  }
  else if(adminTab==="edit"){
    const l=byId(editId);
    adminBody.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
      <select id="editLesson" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[13px]">${LESSONS.map(x=>`<option value="${x.id}" ${x.id===editId?"selected":""}>Buổi ${x.id} — ${esc(x.title)}</option>`).join("")}</select>
      ${inp("eTitle","Tên buổi học",l.title,"")}
      ${inp("eTheme","Chủ đề từ vựng",l.theme,"")}
      <label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">Nội dung kiến thức (HTML)</span>
        <textarea id="eHtml" rows="12" class="w-full font-mono text-[12px] bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-brand-500">${esc(l.html)}</textarea></label>
      <label class="block"><span class="block text-[12px] font-semibold text-slate-600 mb-1">Quiz (JSON — q: câu hỏi, o: 4 đáp án, a: chỉ số đáp án đúng 0–3)</span>
        <textarea id="eQuiz" rows="8" class="w-full font-mono text-[12px] bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-brand-500">${esc(JSON.stringify(l.quiz,null,1))}</textarea></label>
      <div class="flex gap-2"><button id="saveEdit" class="bg-brand-600 hover:bg-brand-700 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Lưu thay đổi</button>
      <button id="revertEdit" class="bg-white border border-slate-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Khôi phục bản gốc</button></div></div>`;
    editLesson.onchange=e=>{editId=+e.target.value;renderAdmin()};
    saveEdit.onclick=()=>{
      let q;try{q=JSON.parse(eQuiz.value)}catch(err){return toast("Quiz JSON không hợp lệ",true)}
      overrides[editId]={title:eTitle.value.trim(),theme:eTheme.value.trim(),html:eHtml.value,quiz:q};
      save("overrides",overrides);Object.assign(byId(editId),overrides[editId]);
      renderList();if(current===editId)renderLesson("kt");toast("Đã lưu buổi "+editId);
    };
    revertEdit.onclick=()=>{delete overrides[editId];save("overrides",overrides);
      const o=LESSONS_RAW.find(x=>x.id===editId);Object.assign(byId(editId),o);renderAdmin();renderList();if(current===editId)renderLesson("kt");toast("Đã khôi phục")};
  }
  else{
    const rows=Object.entries(progress).map(([u,p])=>`<tr class="border-b border-slate-100"><td class="px-3 py-2 font-medium">${esc(u)}</td><td class="px-3 py-2">${p.done.length}/56</td><td class="px-3 py-2">${Object.keys(p.scores||{}).length} bài quiz</td></tr>`).join("");
    adminBody.innerHTML=`<div class="space-y-5">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-3">Tiến độ học viên</p>
        <table class="w-full text-[13px]"><thead class="bg-slate-50"><tr><th class="text-left px-3 py-2">Tài khoản</th><th class="text-left px-3 py-2">Hoàn thành</th><th class="text-left px-3 py-2">Quiz đã làm</th></tr></thead><tbody>${rows||'<tr><td class="px-3 py-3 text-slate-500" colspan="3">Chưa có dữ liệu</td></tr>'}</tbody></table>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <p class="font-bold text-[14px] mb-1">Sao lưu & khôi phục</p>
        <p class="text-[12px] text-slate-500 mb-3">Dữ liệu lưu trên trình duyệt này. Xuất file để chuyển sang máy khác.</p>
        <div class="flex flex-wrap gap-2">
          <button id="expBtn" class="bg-slate-900 text-white text-[13px] font-semibold rounded-xl px-4 py-2.5">Xuất file sao lưu</button>
          <label class="bg-white border border-slate-200 text-[13px] font-semibold rounded-xl px-4 py-2.5 cursor-pointer">Nhập file sao lưu<input id="impFile" type="file" accept="application/json" class="hidden"></label>
          <button id="resetBtn" class="bg-red-50 text-red-600 border border-red-200 text-[13px] font-semibold rounded-xl px-4 py-2.5">Xoá toàn bộ tiến độ</button>
        </div></div></div>`;
    expBtn.onclick=()=>{const blob=new Blob([JSON.stringify({overrides,resources,globalRes,progress},null,1)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="thptqg-backup.json";a.click()};
    impFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);overrides=d.overrides||{};resources=d.resources||{};globalRes=d.globalRes||globalRes;progress=d.progress||{};
        save("overrides",overrides);save("resources",resources);save("globalres",globalRes);save("progress",progress);location.reload()}catch(err){toast("File không hợp lệ",true)}};r.readAsText(f)};
    resetBtn.onclick=()=>{if(confirm("Xoá toàn bộ tiến độ học?")){progress={};save("progress",progress);renderProgress();renderList();renderAdmin()}};
  }
}
function toast(msg,err){
  const t=document.createElement("div");
  t.className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-[13px] font-semibold shadow-lg "+(err?"bg-red-600 text-white":"bg-slate-900 text-white");
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}

/* ---------- BOOT ---------- */
if(user&&ACCOUNTS[user.username]){loginModal.classList.add("hidden");initSession()}
</script>
</body>
