<script>
const LESSONS_RAW =
[{"id": 1, "month": "10", "title": "Thì Hiện Tại Đơn", "theme": "Family life", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại đơn** dùng cho những việc **luôn đúng**: thói quen lặp lại, sự thật hiển nhiên, lịch trình cố định.\n\n```\nHiện tại đơn:   ═══════════════════════════════\n                quá khứ ───── bây giờ ───── tương lai\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Thói quen lặp lại** | *Marsha **goes** to dance lessons every Saturday.* |\n| **Sự thật, chân lý** | *Water **boils** at 100 degrees Celsius.* |\n| **Lịch trình cố định** | *The library **opens** at 8 a.m.* |\n| **Tình trạng lâu dài** | *My father **works** at a hospital.* |\n\n### Dấu hiệu nhận biết\n\n| Nhóm | Từ khoá |\n|---|---|\n| Trạng từ tần suất | always · usually · often · sometimes · rarely · seldom · never |\n| Cụm chỉ tần suất | every day/week/month · each Monday · once a week · twice a month |\n| Khác | generally · normally · in general |\n\n### Vị trí trạng từ tần suất\n\n| Quy tắc | Ví dụ |\n|---|---|\n| **Trước** động từ thường | *I **often** play football.* |\n| **Sau** động từ `be` | *I am **often** late.* |\n\n❌ *She usually is late.* → ✅ *She **is usually** late.*"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + V / V(s·es) | *They **play** football. · He **plays** football.* |\n| Phủ định | S + do/does not + V | *She **doesn't work** here.* |\n| Nghi vấn | Do/Does + S + V? | ***Does** Dan **work** at the cinema?* |\n\n**Chủ ngữ nào thêm -s?**\n\n| Chủ ngữ | Động từ |\n|---|---|\n| I · you · we · they · danh từ **số nhiều** | **không** thêm -s |\n| he · she · it · danh từ **số ít** | **thêm -s** |\n\n**Quy tắc thêm -s/-es:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `o, s, sh, ch, x` | thêm **-es** | go → go**es** · watch → watch**es** |\n| Kết thúc bằng **phụ âm + y** | đổi `y` → **-ies** | study → stud**ies** · carry → carr**ies** |\n| Kết thúc bằng **nguyên âm + y** | thêm **-s** | play → play**s** |\n| Còn lại | thêm **-s** | work → work**s** |\n\n⚠️ Bất quy tắc: `have → **has**` · `be → **is / am / are**`"}], "vocab": [{"t": "do the housework", "p": "v phr", "e": "to do the cleaning, washing and cooking in a home", "v": ""}, {"t": "share the chores", "p": "v phr", "e": "to divide household tasks between people who live together", "v": ""}, {"t": "take responsibility for", "p": "v phr", "e": "to accept that you are in charge of something", "v": ""}, {"t": "get on with (sb)", "p": "phr v", "e": "to have a good relationship with someone", "v": ""}, {"t": "look after", "p": "phr v", "e": "to take care of someone or something", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The recycling centre ______ six days a week.", "o": ["operate", "operates", "operating", "to operate"], "a": 1, "e": "six days a week → lịch cố định; The centre số ít → thêm -s"}, {"q": "My sister and I ______ to school together every morning.", "o": ["walks", "walking", "walk", "walked"], "a": 2, "e": "🔴 My sister and I = we → số nhiều → không thêm -s"}, {"q": "Water ______ at 100 degrees Celsius.", "o": ["boil", "boils", "boiling", "to boil"], "a": 1, "e": "Chân lý khoa học; Water số ít"}, {"q": "She ______ her homework before dinner.", "o": ["usually does", "does usually", "usually do", "do usually"], "a": 0, "e": "Trạng từ tần suất đứng trước động từ thường; She → does"}, {"q": "My brother ______ at the weekend.", "o": ["don't study", "doesn't study", "doesn't studies", "not study"], "a": 1, "e": "Sau doesn't là động từ nguyên thể → loại C"}, {"q": "______ your father work at a hospital?", "o": ["Do", "Does", "Is", "Are"], "a": 1, "e": "your father số ít → Does; động từ chính là work nên không dùng Is"}]}, {"t": "Đọc hiểu", "p": "**📖 HOUSEWORK IN THE FAMILY**\n\n> In many families, parents do all the housework. They want their children to study and nothing else.\n>\n> But children who share the chores learn useful skills. They learn to use their time well. They also take responsibility for small jobs at home.\n>\n> These children usually get on with their brothers and sisters better, because everyone in the family helps.", "items": [{"q": "According to the passage, many parents ______.", "o": ["ask their children to do the housework", "want their children only to study", "have no time for the housework", "teach their children useful skills"], "a": 1, "e": "They want their children to study and nothing else"}, {"q": "According to the passage, children who share the chores ______.", "o": ["always get better marks", "spend less time with their family", "learn to use their time well", "do all the housework alone"], "a": 2, "e": "They learn to use their time well. A chứa always — từ tuyệt đối"}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["parents", "children", "skills", "jobs"], "a": 1, "e": "they trỏ về children who share the chores ở câu trước"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only children do the housework in these families.", "Children who help at home get on better with their siblings.", "Parents never do the housework.", "Housework makes children study less."], "a": 1, "e": "A chứa Only, C chứa never — đều là từ tuyệt đối"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **CITY LIBRARY — READER NOTICE**\n>\n> The City Library **(1)______** from 7.30 a.m. to 6 p.m. on weekdays. It **(2)______** on Sundays and public holidays. Our staff **(3)______** new books every Monday morning. We **(4)______** ask readers to return books on time. Each study room **(5)______** twelve seats. If you need help, our librarians **(6)______** at the front desk all day.", "items": [{"q": "Chỗ trống (1)", "o": ["open", "opens", "opening", "to open"], "a": 1, "e": "Giờ mở cửa cố định; The City Library số ít"}, {"q": "Chỗ trống (2)", "o": ["don't close", "doesn't close", "not close", "doesn't closes"], "a": 1, "e": "It số ít → doesn't; sau đó là nguyên thể → loại D"}, {"q": "Chỗ trống (3)", "o": ["add", "adds", "adding", "to add"], "a": 1, "e": "Our staff hiểu là tập thể → số ít"}, {"q": "Chỗ trống (4)", "o": ["always", "are always", "always are", "do always"], "a": 0, "e": "⭐ always đứng trước động từ thường ask. Học viên hay chọn B vì quen be + always"}, {"q": "Chỗ trống (5)", "o": ["have", "has", "having", "to have"], "a": 1, "e": "Each study room số ít"}, {"q": "Chỗ trống (6)", "o": ["is", "are", "be", "being"], "a": 1, "e": "our librarians số nhiều"}]}]}, {"id": 2, "month": "10", "title": "Thì Hiện Tại Tiếp Diễn", "theme": "For a better community", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại tiếp diễn** dùng cho việc **đang xảy ra ngay lúc nói**, hoặc việc chỉ diễn ra **trong một giai đoạn tạm thời**.\n\n```\nHiện tại tiếp diễn:  ──────────●──────────\n                              ↑\n                        (chỉ lúc này)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Đang xảy ra lúc nói** | *Jan **is watching** a DVD upstairs.* |\n| **Giai đoạn tạm thời** | *She **is working** at the museum until June.* |\n| **Xu hướng đang thay đổi** | *More students **are choosing** online courses.* |\n| **Thói quen gây khó chịu** (với *always*) | *He **is always losing** his keys!* |\n\n### Dấu hiệu nhận biết\n\n`now · right now · at the moment · at present · currently · today · this week · these days · Look! · Listen!`\n\n### ⚠️ Động từ trạng thái — KHÔNG chia tiếp diễn\n\nNhóm động từ mô tả **trạng thái** (cảm xúc, suy nghĩ, sở hữu), không mô tả hành động:\n\n```\nappear · be · believe · belong to · hate · have · include · know · like\nlove · need · prefer · see · seem · taste · think · understand · want\n```\n\n❌ *I am knowing the answer.* → ✅ *I **know** the answer.*\n\n**Ngoại lệ:** `be`, `have`, `think` **được** chia tiếp diễn khi mô tả **hành động thật sự**:\n\n| Trạng thái | Hành động |\n|---|---|\n| *What **do you think** about his song?* (ý kiến) | *I**'m thinking** about the match.* (đang nghĩ) |\n| *She **has** two brothers.* (sở hữu) | *She**'s having** lunch.* (đang ăn) |\n| *He **is** very kind.* (bản chất) | *He**'s being** rude today.* (đang cư xử) |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + am/is/are + V-ing | *She **is working** at the museum.* |\n| Phủ định | S + am/is/are not + V-ing | *They **aren't coming** today.* |\n| Nghi vấn | Am/Is/Are + S + V-ing? | ***Are** they **testing** the equipment?* |\n\n**Quy tắc thêm -ing:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `e` câm | bỏ `e` | make → mak**ing** · write → writ**ing** |\n| 1 nguyên âm + 1 phụ âm (từ 1 âm tiết) | gấp đôi phụ âm | run → ru**nn**ing · sit → si**tt**ing |\n| Kết thúc bằng `ie` | đổi thành `y` | lie → l**y**ing · die → d**y**ing |\n| Còn lại | thêm **-ing** | study → study**ing** · play → play**ing** |"}], "vocab": [{"t": "take part in", "p": "v phr", "e": "to be involved in an activity with other people", "v": ""}, {"t": "clean up", "p": "phr v", "e": "to make a place tidy by removing rubbish", "v": ""}, {"t": "collect rubbish", "p": "v phr", "e": "to gather waste and take it away", "v": ""}, {"t": "work in groups", "p": "v phr", "e": "to do a task together with several people", "v": ""}, {"t": "make a difference", "p": "v phr", "e": "to have an important effect on a situation", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Listen! Someone ______ at the door.", "o": ["knocks", "knock", "is knocking", "knocked"], "a": 2, "e": "Listen! → đang xảy ra lúc nói"}, {"q": "We ______ a pilot project this month.", "o": ["run", "runs", "are running", "is running"], "a": 2, "e": "this month → tạm thời; We → are"}, {"q": "I ______ what you mean, but I disagree.", "o": ["am understanding", "understand", "understands", "am understand"], "a": 1, "e": "🔴 understand là động từ trạng thái, không chia tiếp diễn"}, {"q": "My father ______ his keys on the table!", "o": ["always leaves", "is always leaving", "always leaving", "is always leave"], "a": 1, "e": "🔴 always + tiếp diễn = phàn nàn; dấu chấm than là tín hiệu"}, {"q": "She ______ with her aunt until September.", "o": ["stays", "stay", "is staying", "staying"], "a": 2, "e": "until September → tạm thời"}, {"q": "______ the engineers ______ the bridge at the moment?", "o": ["Do / inspect", "Are / inspecting", "Is / inspecting", "Does / inspect"], "a": 1, "e": "at the moment; engineers số nhiều"}]}, {"t": "Đọc hiểu", "p": "**📖 A CLEAN-UP DAY**\n\n> This month, our school is running a clean-up project. Every Saturday, students are collecting rubbish along the river near the market.\n>\n> At the moment, about sixty students are taking part. They are working in small groups, and each group looks after one part of the river bank.\n>\n> The local council is helping too. It is providing gloves and bags, and it is planning to build two new bins next month.", "items": [{"q": "What are the students doing this month?", "o": ["Building new bins", "Collecting rubbish by the river", "Selling things at the market", "Planning a new school project"], "a": 1, "e": "students are collecting rubbish along the river"}, {"q": "According to the passage, the local council ______.", "o": ["pays the students for their work", "provides equipment for the project", "collects the rubbish itself", "builds the river bank"], "a": 1, "e": "It is providing gloves and bags"}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the school", "the river", "the local council", "the project"], "a": 2, "e": "It trỏ về the local council"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All students in the school take part.", "The students work alone.", "Each group is responsible for one area.", "The bins are already finished."], "a": 2, "e": "each group looks after one part. A chứa All"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **SCHOOL NOTICE — GREEN WEEK**\n>\n> This week, our school **(1)______** Green Week. At the moment, students **(2)______** posters for the main hall. The art club **(3)______** a large model of the river, and volunteers **(4)______** leaflets to every classroom. We **(5)______** that small actions can help. Teachers **(6)______** the events all week.", "items": [{"q": "Chỗ trống (1)", "o": ["holds", "hold", "is holding", "are holding"], "a": 2, "e": "This week → tạm thời; our school số ít"}, {"q": "Chỗ trống (2)", "o": ["design", "designs", "is designing", "are designing"], "a": 3, "e": "students số nhiều"}, {"q": "Chỗ trống (3)", "o": ["build", "is building", "are building", "builds"], "a": 1, "e": "The art club số ít"}, {"q": "Chỗ trống (4)", "o": ["give", "gives", "is giving", "are giving"], "a": 3, "e": "volunteers số nhiều"}, {"q": "Chỗ trống (5)", "o": ["are believing", "believe", "believes", "is believing"], "a": 1, "e": "🔴 believe là trạng thái; We không thêm -s"}, {"q": "Chỗ trống (6)", "o": ["is supporting", "are supporting", "supports", "support"], "a": 1, "e": "Teachers số nhiều"}]}]}, {"id": 3, "month": "10", "title": "Đối Chiếu Hiện Tại Đơn Và Hiện Tại Tiếp Diễn", "theme": "A long and healthy life", "blocks": [{"h": "Mở đầu", "md": "> **Buổi đối chiếu.** Không học công thức mới — chỉ phân biệt hai thì đã học và luyện tập."}, {"h": "① NGỮ PHÁP", "md": "Hai thì cùng nói về hiện tại, khác nhau ở **tính chất thời gian**:\n\n> **Hiện tại đơn** = việc **luôn đúng** — đường thẳng kéo dài.\n> **Hiện tại tiếp diễn** = việc **đang xảy ra lúc này** — một chấm trên đường thẳng đó."}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **HIỆN TẠI ĐƠN** | **HIỆN TẠI TIẾP DIỄN** |\n|---|---|---|\n| **Dùng cho** | Thói quen · sự thật · lịch cố định | Đang xảy ra lúc nói · giai đoạn tạm thời |\n| **Dấu hiệu** | always · usually · often · every day · once a week | now · at the moment · currently · today · this week · Look! · Listen! |\n| **Ví dụ** | *She **works** at the museum.* (nghề nghiệp lâu dài) | *She **is working** at the museum until June.* (tạm thời) |\n| **Động từ trạng thái** | ✅ dùng được | ❌ không dùng |\n\n### Ba cặp câu dễ nhầm\n\n| Hiện tại đơn | Hiện tại tiếp diễn |\n|---|---|\n| *He **always leaves** his keys at home.* (thói quen bình thường) | *He **is always leaving** his keys at home!* (phàn nàn) |\n| *What **do you think** about it?* (ý kiến) | *I**'m thinking** about it.* (đang suy nghĩ) |\n| *The train **leaves** at 6.15.* (lịch tàu) | *I**'m leaving** at 6.15 tomorrow.* (kế hoạch cá nhân) |"}, {"h": "③ HOÀ HỢP CHỦ NGỮ — ĐỘNG TỪ", "md": "Những chủ ngữ sau **trông như số nhiều nhưng thực chất là số ít**:\n\n| Chủ ngữ | Động từ | Ví dụ |\n|---|---|---|\n| everyone · everybody · someone · nobody | **số ít** | *Everyone **needs** a break.* |\n| each / every + danh từ | **số ít** | *Every student **takes** part.* |\n| each of / one of / neither of + N số nhiều | **số ít** | *Each of the bins **has** a colour code.* |\n| N + of + N → theo **danh từ đầu** | tuỳ | *The **quality** of these materials **is** poor.* |\n| a number of + N | **số nhiều** | *A number of staff **have** resigned.* |\n| the number of + N | **số ít** | *The number of applicants **has** risen.* |\n| Danh từ không đếm được (information, equipment, advice) | **số ít** | *The equipment **needs** checking.* |\n\n⚠️ **Bẫy chính:** cụm `of + danh từ số nhiều` xen giữa khiến người học chia nhầm theo danh từ đó.\n❌ *Each of the proposals **were** reviewed.* → ✅ *Each of the proposals **was** reviewed.*"}], "vocab": [{"t": "Dùng cho", "p": "Thói quen · sự thật · lịch cố định", "e": "Đang xảy ra lúc nói · giai đoạn tạm thời", "v": ""}, {"t": "Ví dụ", "p": "She works at the museum. (nghề nghiệp lâu dài)", "e": "She is working at the museum until June. (tạm thời)", "v": ""}, {"t": "keep fit", "p": "v phr", "e": "to stay strong and healthy", "v": ""}, {"t": "take up (a sport)", "p": "phr v", "e": "to start doing an activity regularly", "v": ""}, {"t": "cut down on", "p": "phr v", "e": "to use or do less of something", "v": ""}, {"t": "be good for", "p": "adj phr", "e": "to have a positive effect on someone", "v": ""}, {"t": "do exercise", "p": "v phr", "e": "to move your body to stay healthy", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Each of the departments ______ its own budget.", "o": ["have", "has", "are having", "having"], "a": 1, "e": "Each of → số ít"}, {"q": "The quality of these materials ______ disappointing.", "o": ["is", "are", "were", "being"], "a": 0, "e": "The quality — theo danh từ đầu, không theo materials"}, {"q": "My father ______ his glasses somewhere!", "o": ["always puts", "is always putting", "always putting", "always put"], "a": 1, "e": "always + tiếp diễn = phàn nàn"}, {"q": "Everyone in the two classes ______ the new timetable.", "o": ["like", "likes", "are liking", "liking"], "a": 1, "e": "🔴 Everyone → số ít, dù có in the two classes"}, {"q": "She ______ at the hospital these days, but she ______ at a clinic normally.", "o": ["works / works", "is working / works", "works / is working", "is working / is working"], "a": 1, "e": "these days → tiếp diễn / normally → hiện tại đơn"}, {"q": "The number of students ______ every year.", "o": ["rise", "rises", "are rising", "rising"], "a": 1, "e": "🔴 The number of → số ít"}]}, {"t": "Đọc hiểu", "p": "**📖 STAYING HEALTHY**\n\n> Most doctors say that a healthy life does not need expensive equipment. Walking thirty minutes a day is enough for many people.\n>\n> These days, more Vietnamese families are taking up simple sports. In many parks, groups of older people are doing morning exercises together, and young people are cycling to work instead of driving.\n>\n> Doctors also warn about food. They believe that people eat too much sugar and too little fruit. Cutting down on sweet drinks is one of the easiest ways to keep fit.", "items": [{"q": "According to the passage, a healthy life ______.", "o": ["requires expensive equipment", "can start with simple walking", "is only possible for young people", "depends on morning exercises"], "a": 1, "e": "Walking thirty minutes a day is enough"}, {"q": "What are many Vietnamese families doing these days?", "o": ["Buying sports equipment", "Taking up simple sports", "Moving to live near parks", "Stopping all sweet drinks"], "a": 1, "e": "more families are taking up simple sports"}, {"q": "The word **\"They\"** in paragraph 3 refers to ______.", "o": ["families", "young people", "doctors", "sweet drinks"], "a": 2, "e": "They trỏ về Doctors"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Everyone must walk thirty minutes a day.", "Cycling to work is becoming more common.", "Doctors never mention food.", "Sugar is the only health problem."], "a": 1, "e": "A chứa must, C chứa never, D chứa only"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **COMMUNITY SPORTS CENTRE**\n>\n> The Community Sports Centre **(1)______** at 6 a.m. every day. At the moment, we **(2)______** the swimming pool, so it is closed until May. Each of our trainers **(3)______** a national certificate. We **(4)______** that regular exercise helps everyone. This month, a number of members **(5)______** our new yoga class. Our staff **(6)______** always happy to help.", "items": [{"q": "Chỗ trống (1)", "o": ["open", "opens", "is opening", "are opening"], "a": 1, "e": "Lịch mở cửa; The Centre số ít"}, {"q": "Chỗ trống (2)", "o": ["repair", "repairs", "are repairing", "is repairing"], "a": 2, "e": "At the moment; we → are"}, {"q": "Chỗ trống (3)", "o": ["have", "has", "are having", "having"], "a": 1, "e": "Each of our trainers → số ít"}, {"q": "Chỗ trống (4)", "o": ["believe", "believes", "are believing", "is believing"], "a": 0, "e": "believe là trạng thái; We"}, {"q": "Chỗ trống (5)", "o": ["joins", "is joining", "are joining", "join"], "a": 2, "e": "🔴 A number of → số nhiều (khác The number of)"}, {"q": "Chỗ trống (6)", "o": ["is", "are", "being", "be"], "a": 1, "e": "Our staff ở đây chỉ nhiều người → are"}]}]}, {"id": 4, "month": "10", "title": "Thì Quá Khứ Đơn", "theme": "Inventions", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ đơn** dùng cho việc **đã xảy ra và kết thúc hẳn** tại một thời điểm trong quá khứ.\n\n```\nQuá khứ đơn:   ────●────────────────────\n                   ↑          bây giờ\n              (xong hẳn rồi)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc xong hẳn trong quá khứ** | *They **installed** the bins last Monday.* |\n| **Chuỗi việc nối tiếp nhau** | *He **opened** the door, **took** his bag and **left**.* |\n| **Thói quen trong quá khứ** (nay không còn) | *I **walked** to school every day when I was ten.* |\n\n### Dấu hiệu nhận biết\n\n`yesterday · last week/month/year · in 2020 · two days ago · then · when I was young`\n\n### 📌 Cấu trúc `used to`\n\nDùng cho **thói quen hoặc trạng thái trong quá khứ, nay không còn nữa**.\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + **used to** + V | *I **used to** walk to school.* |\n| Phủ định | S + **didn't use to** + V | *She **didn't use to** like coffee.* |\n| Nghi vấn | Did + S + **use to** + V? | ***Did** you **use to** live here?* |\n\n⚠️ Phân biệt: `used to + V` (từng làm) ≠ `be used to + V-ing` (đã quen với việc gì)."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + V2/V-ed | *They **installed** the bins.* |\n| Phủ định | S + did not + V | *The plan **didn't include** rural areas.* |\n| Nghi vấn | Did + S + V? | ***Did** the council **approve** it?* |\n\n**Quy tắc thêm -ed:**\n\n| Trường hợp | Cách thêm | Ví dụ |\n|---|---|---|\n| Kết thúc bằng `e` | thêm **-d** | live → live**d** |\n| Phụ âm + `y` | đổi `y` → **-ied** | study → stud**ied** |\n| 1 nguyên âm + 1 phụ âm (1 âm tiết) | gấp đôi phụ âm | stop → sto**pp**ed |\n| Còn lại | thêm **-ed** | work → work**ed** |\n\n**20 động từ bất quy tắc phải thuộc:**\n\n| Nguyên thể | Quá khứ | Nguyên thể | Quá khứ |\n|---|---|---|---|\n| be | was / were | lead | led |\n| begin | began | leave | left |\n| build | built | make | made |\n| buy | bought | rise | rose |\n| come | came | see | saw |\n| do | did | send | sent |\n| find | found | take | took |\n| give | gave | teach | taught |\n| go | went | think | thought |\n| hold | held | write | wrote |"}], "vocab": [{"t": "come up with", "p": "phr v", "e": "to think of an idea or a plan", "v": ""}, {"t": "carry out", "p": "phr v", "e": "to do a task or piece of research", "v": ""}, {"t": "make progress", "p": "v phr", "e": "to improve or move forward", "v": ""}, {"t": "be based on", "p": "v phr", "e": "to use something as the main idea", "v": ""}, {"t": "put into practice", "p": "v phr", "e": "to start using an idea in a real situation", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The company ______ its safety policy last March.", "o": ["updates", "updated", "is updating", "update"], "a": 1, "e": "last March → mốc quá khứ cụ thể"}, {"q": "She ______ to work by bus when she was a student.", "o": ["use to go", "used to go", "used to going", "uses to go"], "a": 1, "e": "used to + động từ nguyên thể"}, {"q": "______ the council approve the plan yesterday?", "o": ["Do", "Does", "Did", "Was"], "a": 2, "e": "Did + nguyên thể"}, {"q": "They ______ the contract two weeks ago.", "o": ["sign", "signs", "signed", "have signed"], "a": 2, "e": "two weeks ago"}, {"q": "He ______ the report on time.", "o": ["didn't finished", "didn't finish", "doesn't finish", "not finished"], "a": 1, "e": "didn't + nguyên thể → loại A"}, {"q": "The engineers ______ the problem in 2021.", "o": ["find", "found", "finded", "finds"], "a": 1, "e": "find → found, bất quy tắc"}]}, {"t": "Đọc hiểu", "p": "**📖 THE STORY OF THE BICYCLE**\n\n> The first bicycle appeared in Germany in 1817. It had no pedals, so riders pushed it with their feet. People called it the \"running machine\".\n>\n> In 1861, a French inventor added pedals to the front wheel. The new machine became popular very quickly, but it was heavy and uncomfortable.\n>\n> The modern bicycle arrived in the 1880s. It had two wheels of the same size and a chain. This design worked so well that people still use it today.", "items": [{"q": "According to the passage, the first bicycle ______.", "o": ["had pedals on the front wheel", "was pushed by the rider's feet", "appeared in France", "had two wheels of the same size"], "a": 1, "e": "riders pushed it with their feet"}, {"q": "What happened in 1861?", "o": ["The first bicycle appeared.", "Pedals were added to the front wheel.", "The chain was invented.", "The modern bicycle arrived."], "a": 1, "e": "a French inventor added pedals to the front wheel"}, {"q": "The word **\"It\"** in paragraph 3 refers to ______.", "o": ["the 1880s", "the chain", "the modern bicycle", "the design"], "a": 2, "e": "It trỏ về The modern bicycle"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The 1861 machine was light and comfortable.", "The modern design is still in use.", "Germans invented the chain.", "The running machine had pedals."], "a": 1, "e": "people still use it today"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **THE FIRST PRINTING PRESS**\n>\n> In the 1440s, a German inventor **(1)______** the first printing press in Europe. Before that, people **(2)______** copy books by hand, which took months. The new machine **(3)______** the cost of books very quickly. Within fifty years, printers **(4)______** thousands of books across Europe. Most people at that time **(5)______** read, but the press slowly changed this. Historians **(6)______** that it was one of the most important inventions in history.", "items": [{"q": "Chỗ trống (1)", "o": ["build", "builds", "built", "building"], "a": 2, "e": "In the 1440s"}, {"q": "Chỗ trống (2)", "o": ["use to", "used to", "are used to", "using to"], "a": 1, "e": "used to copy — thói quen cũ nay không còn"}, {"q": "Chỗ trống (3)", "o": ["reduce", "reduces", "reduced", "reducing"], "a": 2, "e": "Quá khứ đơn, chuỗi sự kiện"}, {"q": "Chỗ trống (4)", "o": ["produce", "produced", "produces", "producing"], "a": 1, "e": "Within fifty years — quá khứ"}, {"q": "Chỗ trống (5)", "o": ["can't", "don't", "couldn't", "didn't"], "a": 3, "e": "🔴 didn't read giữ mạch quá khứ đơn của cả đoạn"}, {"q": "Chỗ trống (6)", "o": ["agree", "agreed", "agrees", "agreeing"], "a": 0, "e": "Nhận định của sử gia hiện nay → hiện tại đơn"}]}]}, {"id": 5, "month": "10", "title": "Thì Quá Khứ Tiếp Diễn", "theme": "Music", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ tiếp diễn** dùng cho việc **đang diễn ra tại một thời điểm trong quá khứ**.\n\n```\nQuá khứ tiếp diễn:  ──── ═══════ ────────\n                         ↑\n                    (lúc 8 giờ tối qua)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Đang diễn ra tại một mốc quá khứ** | *At 8 p.m. yesterday, I **was watching** the news.* |\n| **Hai việc song song** | *While she **was cooking**, he **was cleaning**.* |\n| **Làm nền cho việc khác cắt ngang** | *I **was walking** home when it started to rain.* |\n| **Bối cảnh trong truyện kể** | *The sun **was shining** and birds **were singing**.* |\n\n### Dấu hiệu nhận biết\n\n`at 8 p.m. yesterday · at that time · while · as · all morning · this time last week`"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + was/were + V-ing | *They **were repairing** the road.* |\n| Phủ định | S + was/were not + V-ing | *She **wasn't working** then.* |\n| Nghi vấn | Was/Were + S + V-ing? | ***Were** they **testing** the system?* |\n\n**Chọn `was` hay `were`?**\n\n| Chủ ngữ | Động từ |\n|---|---|\n| I · he · she · it · danh từ số ít | **was** |\n| you · we · they · danh từ số nhiều | **were** |"}], "vocab": [{"t": "be fond of", "p": "adj phr", "e": "to like someone or something very much", "v": ""}, {"t": "take an interest in", "p": "v phr", "e": "to want to know more about something", "v": ""}, {"t": "perform live", p": "**📖 THE DAY THE RIVER CHANGED**\n\n> For years, factories along the Red River were releasing waste water directly into the river. Fish were disappearing, and local families were losing their main source of food.\n>\n> In 2019, while the city council was preparing a new development plan, a group of students carried out a simple survey. They tested the water at twelve points and published the results online.\n>\n> The report spread quickly. Within three months, the council closed two factories and introduced strict rules. Today, fishermen say that the fish are slowly coming back.", "items": [{"q": "According to the passage, what were the factories doing for years?", "o": ["Closing down slowly", "Releasing waste water into the river", "Testing the water quality", "Helping local families"], "a": 1, "e": "factories were releasing waste water directly into the river"}, {"q": "What did the students do in 2019?", "o": ["They closed two factories.", "They wrote a development plan.", "They tested the water and published the results.", "They asked fishermen for help."], "a": 2, "e": "They tested the water… and published the results"}, {"q": "The word **\"They\"** in paragraph 2 refers to ______.", "o": ["factories", "the council", "students", "families"], "a": 2, "e": "They trỏ về a group of students"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The council acted within three months.", "All the factories were closed.", "The fish have completely returned.", "The students worked for the council."], "a": 0, "e": "Within three months, the council closed two factories. B sai vì chỉ đóng hai, C sai vì cá mới quay lại slowly"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **A LUCKY DISCOVERY**\n>\n> In 1974, while some farmers **(1)______** a well in central China, they **(2)______** pieces of an old clay figure. They **(3)______** the local authorities immediately. When archaeologists **(4)______**, they realised that thousands of clay soldiers **(5)______** under the ground for over two thousand years. The discovery **(6)______** one of the most important of the century.", "items": [{"q": "Chỗ trống (1)", "o": ["dig", "dug", "were digging", "was digging"], "a": 2, "e": "Sau while → QKTD"}, {"q": "Chỗ trống (2)", "o": ["find", "found", "were finding", "was finding"], "a": 1, "e": "Việc ngắn cắt ngang"}, {"q": "Chỗ trống (3)", "o": ["contact", "contacted", "were contacting", "contacting"], "a": 1, "e": "QKĐ, chuỗi sự kiện"}, {"q": "Chỗ trống (4)", "o": ["arrive", "arrived", "were arriving", "was arriving"], "a": 1, "e": "When + QKĐ"}, {"q": "Chỗ trống (5)", "o": ["lie", "lay", "were lying", "was lying"], "a": 2, "e": "🔴 soldiers were lying — QKTD mô tả trạng thái kéo dài"}, {"q": "Chỗ trống (6)", "o": ["become", "became", "was becoming", "were becoming"], "a": 1, "e": "QKĐ, kể lại kết quả"}]}]}, {"id": 7, "month": "10", "title": "Thì Hiện Tại Hoàn Thành", "theme": "Cities of the future", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Hiện tại hoàn thành** dùng cho việc xảy ra trong quá khứ nhưng **còn nối với hiện tại** — hoặc còn kéo dài, hoặc kết quả còn tồn tại.\n\n```\nHiện tại hoàn thành:  ●═══════════════►\n                      ↑              ↑\n                 bắt đầu trong    còn đến\n                   quá khứ         bây giờ\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc kéo dài đến hiện tại** | *We **have lived** here since 2019.* |\n| **Kết quả còn tồn tại** | *Speeds **have improved** significantly.* |\n| **Kinh nghiệm** (không rõ thời điểm) | *I **have never seen** such a result.* |\n| **Việc vừa mới xảy ra** | *She **has just finished** the report.* |\n\n### Dấu hiệu nhận biết\n\n| Từ khoá | Vị trí |\n|---|---|\n| **since** + mốc thời gian | since 2019 · since March |\n| **for** + khoảng thời gian | for ten years · for six months |\n| **already · just · never · ever** | giữa `have` và V3 |\n| **yet** | cuối câu phủ định và nghi vấn |\n| **so far · up to now · recently · over the past…** | đầu hoặc cuối câu |\n\n### 📌 Hiện tại hoàn thành tiếp diễn\n\nDùng khi nhấn **quá trình kéo dài**, không nhấn kết quả:\n\n*They **have been working** here since June.* (nhấn: làm suốt từ tháng 6)\n*They **have worked** on three projects.* (nhấn: kết quả — ba dự án)"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + have/has + V3 | *The council **has laid** 20 km of cable.* |\n| Phủ định | S + have/has not + V3 | *She **hasn't finished** the report yet.* |\n| Nghi vấn | Have/Has + S + V3? | ***Have** you **ever visited** a solar plant?* |\n| HTHT tiếp diễn | S + have/has been + V-ing | *They **have been waiting** for an hour.* |\n\n**20 động từ bất quy tắc (dạng V3):**\n\n| Nguyên thể | V3 | Nguyên thể | V3 |\n|---|---|---|---|\n| be | been | lead | led |\n| begin | begun | leave | left |\n| build | built | make | made |\n| buy | bought | rise | risen |\n| come | come | see | seen |\n| do | done | send | sent |\n| find | found | take | taken |\n| give | given | teach | taught |\n| go | gone | think | thought |\n| hold | held | write | written |"}], "vocab": [{"t": "Việc vừa mới xảy ra", "p": "She has just finished the report.", "e": "### Dấu hiệu nhận biết", "v": "Từ khoá"}, {"t": "keep up with", "p": "phr v", "e": "to move or change at the same speed as something", "v": ""}, {"t": "rely on", "p": "phr v", "e": "to depend on someone or something", "v": ""}, {"t": "deal with", "p": "phr v", "e": "to take action to solve a problem", "v": ""}, {"t": "a large amount of", "p": "quant phr", "e": "a lot of something that cannot be counted", "v": ""}, {"t": "in the long run", "p": "prep phr", "e": "over a long period of time in the future", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "We ______ in this building since 2019.", "o": ["work", "worked", "have worked", "are working"], "a": 2, "e": "since 2019"}, {"q": "She ______ the report yet.", "o": ["doesn't finish", "didn't finish", "hasn't finished", "isn't finishing"], "a": 2, "e": "yet trong câu phủ định"}, {"q": "Broadband reliability ______ considerably over the past five years.", "o": ["improves", "improved", "has improved", "is improving"], "a": 2, "e": "over the past five years"}, {"q": "I ______ never ______ such an impressive result.", "o": ["have / seen", "have / saw", "did / see", "am / seeing"], "a": 0, "e": "never + kinh nghiệm"}, {"q": "The scheme ______ for six months so far.", "o": ["runs", "ran", "has run", "is running"], "a": 2, "e": "so far"}, {"q": "______ you ever ______ to Singapore?", "o": ["Did / go", "Have / been", "Are / going", "Do / go"], "a": 1, "e": "ever + been"}]}, {"t": "Đọc hiểu", "p": "**📖 SMART CITIES**\n\n> Over the past ten years, several Asian cities have introduced \"smart\" systems to manage daily life. Singapore has installed sensors that count traffic and adjust the lights automatically.\n>\n> Seoul has taken a different path. The city has built a free public wifi network covering almost every street, and residents have used it to report problems such as broken pavements.\n>\n> These systems have not solved every problem. Critics say that they have created new concerns about privacy, because sensors collect a large amount of personal data. So far, no city has found a perfect balance.", "items": [{"q": "According to the passage, Singapore ______.", "o": ["has built a free wifi network", "has installed sensors to manage traffic", "has solved its privacy problems", "has stopped collecting data"], "a": 1, "e": "Singapore has installed sensors that count traffic"}, {"q": "How do Seoul residents use the wifi network?", "o": ["To watch films", "To pay for transport", "To report problems in the city", "To count traffic"], "a": 2, "e": "residents have used it to report problems"}, {"q": "The word **\"they\"** in paragraph 3 refers to ______.", "o": ["critics", "residents", "these systems", "cities"], "a": 2, "e": "they trỏ về these systems"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Smart systems have solved all urban problems.", "No city has achieved a perfect balance so far.", "Seoul has installed traffic sensors.", "Privacy concerns have disappeared."], "a": 1, "e": "no city has found a perfect balance"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **CITY TRANSPORT UPDATE**\n>\n> Since 2023, the city **(1)______** more than forty electric buses. Passenger numbers **(2)______** by 18% over the past year. However, the council **(3)______** the new depot yet, so some buses are parked on the street. Residents **(4)______** about this several times. \"We **(5)______** here for twenty years and the traffic **(6)______** never been worse,\" one resident said.", "items": [{"q": "Chỗ trống (1)", "o": ["buys", "bought", "has bought", "have bought"], "a": 2, "e": "Since 2023; the city số ít"}, {"q": "Chỗ trống (2)", "o": ["rise", "rose", "has risen", "have risen"], "a": 3, "e": "Passenger numbers số nhiều"}, {"q": "Chỗ trống (3)", "o": ["doesn't finish", "didn't finish", "hasn't finished", "haven't finished"], "a": 2, "e": "yet; the council số ít"}, {"q": "Chỗ trống (4)", "o": ["complain", "complained", "has complained", "have complained"], "a": 3, "e": "Residents số nhiều"}, {"q": "Chỗ trống (5)", "o": ["live", "lived", "has lived", "have lived"], "a": 3, "e": "We → have"}, {"q": "Chỗ trống (6)", "o": ["has", "have", "is", "are"], "a": 0, "e": "the traffic số ít"}]}]}, {"id": 8, "month": "10", "title": "Đối Chiếu Hiện Tại Hoàn Thành Và Quá Khứ Đơn", "theme": "Life stories", "blocks": [{"h": "Mở đầu", "md": "> **Buổi đối chiếu quan trọng nhất tháng.** Đây là câu hỏi ra nhiều nhất trong phần điền từ của đề thi."}, {"h": "① NGỮ PHÁP", "md": "> **Quá khứ đơn** = việc **cắt đứt** với hiện tại — đã xong, có mốc thời gian rõ.\n> **Hiện tại hoàn thành** = việc **còn nối** với hiện tại — còn kéo dài, hoặc kết quả còn đó.\n\n```\nQuá khứ đơn:          ●──────────────  (xong, không liên quan bây giờ)\nHiện tại hoàn thành:  ●══════════════► (còn nối tới bây giờ)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **QUÁ KHỨ ĐƠN** | **HIỆN TẠI HOÀN THÀNH** |\n|---|---|---|\n| **Dùng cho** | Việc xong hẳn, có mốc quá khứ | Việc kéo dài đến nay · kết quả còn tồn tại · kinh nghiệm |\n| **Dấu hiệu** | yesterday · last week · in 2020 · ago · when I was young | since · for · already · yet · just · ever · never · so far · up to now |\n| **Ví dụ** | *I **finished** the report **yesterday**.* | *I **have finished** the report.* (nên giờ rảnh) |\n\n### 🔴 QUY TẮC VÀNG\n\n> **Câu đã có mốc thời gian quá khứ cụ thể** (`yesterday`, `last week`, `in 2020`, `ago`) → **CẤM** dùng hiện tại hoàn thành. Bắt buộc quá khứ đơn.\n\n❌ *I **have finished** the report yesterday.*\n✅ *I **finished** the report yesterday.*\n\n### Ba cặp câu đối chiếu\n\n| Quá khứ đơn | Hiện tại hoàn thành |\n|---|---|\n| *She **lived** in Hue for six years.* (giờ không còn ở đó) | *She **has lived** in Hue for six years.* (vẫn đang ở) |\n| ***Did** you **see** the film?* (buổi chiếu đã qua) | ***Have** you **seen** the film?* (bất cứ lúc nào đến giờ) |\n| *He **worked** here in 2020.* (xong) | *He **has worked** here since 2020.* (vẫn làm) |\n\n### 📌 Phân biệt `since` và `for`\n\n| Từ | Đi với | Ví dụ |\n|---|---|---|\n| **since** | **mốc** thời gian | since 2019 · since March · since I was ten |\n| **for** | **khoảng** thời gian | for ten years · for six months · for a week |"}, {"h": "③ CẤU TRÚC", "md": "| Thì | Công thức | Ví dụ |\n|---|---|---|\n| Quá khứ đơn | S + V2/V-ed | *They **installed** the bins last week.* |\n| Hiện tại hoàn thành | S + have/has + V3 | *They **have installed** 200 bins so far.* |"}], "vocab": [{"t": "Dùng cho", "p": "Việc xong hẳn, có mốc quá khứ", "e": "Việc kéo dài đến nay · kết quả còn tồn tại · kinh nghiệm", "v": ""}, {"t": "Ví dụ", "p": "I finished the report yesterday.", "e": "I have finished the report. (nên giờ rảnh)", "v": "### 🔴 QUY TẮC VÀNG\n\n> Câu đã có mốc thời gian quá khứ cụ thể (yesterday, last week, in 2020, ago) → CẤM dùng hiện tại hoàn thành. Bắt buộc quá khứ đơn.\n\n❌ I have finished the report yesterday.\n✅ I finished the report yesterday.\n\n### Ba cặp câu đối chiếu"}, {"t": "since", "p": "mốc thời gian", "e": "since 2019 · since March · since I was ten", "v": ""}, {"t": "be born in", "p": "v phr", "e": "to come into the world in a place or year", "v": ""}, {"t": "grow up", "p": "phr v", "e": "to develop from a child into an adult", "v": ""}, {"t": "devote oneself to", "p": "v phr", "e": "to give all your time and effort to something", "v": ""}, {"t": "be known for", "p": "adj phr", "e": "to be famous because of something", "v": ""}, {"t": "achieve success", "p": "v phr", "e": "to reach something important that you wanted", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The company ______ its safety policy last March.", "o": ["updates", "updated", "has updated", "is updating"], "a": 1, "e": "🔴 last March → quy tắc vàng, cấm hiện tại hoàn thành"}, {"q": "We ______ in this building since 2019.", "o": ["work", "worked", "have worked", "are working"], "a": 2, "e": "since 2019 → còn kéo dài đến nay"}, {"q": "She ______ in Hue for six years before she moved to Da Nang.", "o": ["lives", "lived", "has lived", "is living"], "a": 1, "e": "before she moved → việc đã chấm dứt"}, {"q": "Costs ______ sharply in 2021, but they ______ steady since then.", "o": ["rose / remained", "have risen / remained", "rose / have remained", "have risen / have remained"], "a": 2, "e": "in 2021 → QKĐ; since then → HTHT"}, {"q": "______ you ______ the new manager yet?", "o": ["Did / meet", "Have / met", "Do / meet", "Are / meeting"], "a": 1, "e": "yet"}, {"q": "He ______ three emails this morning. *(vẫn còn là buổi sáng)*", "o": ["writes", "wrote", "has written", "is writing"], "a": 2, "e": "this morning vẫn chưa kết thúc → HTHT"}]}, {"t": "Đọc hiểu", "p": "**📖 A LIFE IN SCIENCE**\n\n> Marie Curie was born in Poland in 1867. She moved to Paris in 1891 because Polish universities did not accept women at that time.\n>\n> In 1903, she won the Nobel Prize in Physics, and eight years later she won a second Nobel Prize in Chemistry. No woman had done this before.\n>\n> Since her death in 1934, her work has influenced generations of scientists. Her notebooks are still too dangerous to touch, and researchers have kept them in lead boxes for almost ninety years.", "items": [{"q": "Why did Marie Curie move to Paris?", "o": ["She won a prize there.", "Polish universities did not accept women.", "Her family lived there.", "She wanted to study chemistry only."], "a": 1, "e": "Polish universities did not accept women at that time"}, {"q": "According to the passage, Marie Curie ______.", "o": ["won two Nobel Prizes", "was the first person to win a Nobel Prize", "stopped working after 1903", "was born in France"], "a": 0, "e": "she won the Nobel Prize in Physics… a second Nobel Prize in Chemistry"}, {"q": "The word **\"them\"** in paragraph 3 refers to ______.", "o": ["scientists", "generations", "her notebooks", "lead boxes"], "a": 2, "e": "them trỏ về her notebooks"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Her notebooks are safe to touch now.", "Her work has influenced later scientists.", "She won both prizes in the same year.", "She returned to Poland in 1934."], "a": 1, "e": "her work has influenced generations of scientists"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **A SCHOOL'S GREEN RECORD**\n>\n> Our school **(1)______** its recycling programme in 2018. In the first year, students **(2)______** only two tonnes of paper. Since then, the figure **(3)______** every year, and we **(4)______** more than forty tonnes in total. Last March, the programme **(5)______** a provincial award. So far, no other school in the province **(6)______** a similar result.", "items": [{"q": "Chỗ trống (1)", "o": ["starts", "started", "has started", "is starting"], "a": 1, "e": "in 2018"}, {"q": "Chỗ trống (2)", "o": ["collect", "collected", "have collected", "has collected"], "a": 1, "e": "In the first year → mốc quá khứ"}, {"q": "Chỗ trống (3)", "o": ["rises", "rose", "has risen", "is rising"], "a": 2, "e": "Since then"}, {"q": "Chỗ trống (4)", "o": ["recycle", "recycled", "have recycled", "has recycled"], "a": 2, "e": "in total → kết quả đến nay; we → have"}, {"q": "Chỗ trống (5)", "o": ["wins", "won", "has won", "have won"], "a": 1, "e": "Last March"}, {"q": "Chỗ trống (6)", "o": ["achieves", "achieved", "has achieved", "have achieved"], "a": 2, "e": "So far; no other school số ít"}]}]}, {"id": 9, "month": "10", "title": "Thì Quá Khứ Hoàn Thành", "theme": "Urbanisation", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Quá khứ hoàn thành** dùng cho việc xảy ra **trước một việc quá khứ khác**.\n\n```\nQuá khứ hoàn thành:  ●────►\nQuá khứ đơn:                ●────────  bây giờ\n                     việc 1    việc 2\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| Trường hợp | Ví dụ |\n|---|---|\n| **Việc xảy ra trước một việc quá khứ khác** | *By the time we arrived, the hall **had been** cleaned.* |\n| **Nguyên nhân của việc quá khứ** | *He was tired because he **had worked** all night.* |\n| **Sau `before`, `after`, `by the time`** | *She **had left** before I called.* |\n\n### Dấu hiệu nhận biết\n\n`by the time · before · after · by + mốc quá khứ (by 2020) · already · never…before · when`\n\n### 📌 Ba mẫu câu chuẩn\n\n| Mẫu | Ví dụ |\n|---|---|\n| By the time + QKĐ, S + **had** V3 | *By the time the survey started, half the households **had signed** up.* |\n| Before + QKĐ, S + **had** V3 | *Before the new bins arrived, the school **had used** old containers.* |\n| S + **had** V3 + before/when + QKĐ | *She **had finished** the report before the meeting began.* |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Khẳng định | S + had + V3 | *The scheme **had started** before I joined.* |\n| Phủ định | S + had not + V3 | *He **hadn't applied** before the deadline.* |\n| Nghi vấn | Had + S + V3? | ***Had** they **left** when you arrived?* |\n\n⚠️ `had` dùng cho **mọi chủ ngữ** — không đổi theo ngôi."}], "vocab": [{"t": "Sau before, after, by the time", "p": "She had left before I called.", "e": "### Dấu hiệu nhận biết\n\nby the time · before · after · by + mốc quá khứ (by 2020) · already · never…before · when\n\n### 📌 Ba mẫu câu chuẩn", "v": "Mẫu"}, {"t": "move in / move out", "p": "phr v", "e": "to start / stop living in a place", "v": ""}, {"t": "gain access to", "p": "v phr", "e": "to become able to use something", "v": ""}, {"t": "put pressure on", "p": "v phr", "e": "to create difficulty for a system or person", "v": ""}, {"t": "set up", "p": "phr v", "e": "to create or start something", "v": ""}, {"t": "run out of", "p": "phr v", "e": "to have no more of something left", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "When I arrived, the meeting ______ already ______.", "o": ["has / begun", "had / begun", "was / beginning", "did / begin"], "a": 1, "e": "Việc begun xảy ra trước arrived"}, {"q": "He ______ for the grant three times before he succeeded.", "o": ["applies", "applied", "has applied", "had applied"], "a": 3, "e": "Trước he succeeded"}, {"q": "Before the new bins arrived, the school ______ ordinary containers.", "o": ["uses", "used", "has used", "had used"], "a": 3, "e": "Before + QKĐ → việc trước dùng QKHT"}, {"q": "By 2021, the company ______ three new branches.", "o": ["opens", "opened", "has opened", "had opened"], "a": 3, "e": "By 2021 → mốc quá khứ"}, {"q": "She ______ in Hanoi for six years before she moved.", "o": ["lives", "lived", "has lived", "had lived"], "a": 3, "e": "Trước she moved"}, {"q": "They were tired because they ______ all night.", "o": ["work", "worked", "have worked", "had worked"], "a": 3, "e": "Nguyên nhân xảy ra trước kết quả"}]}, {"t": "Đọc hiểu", "p": "**📖 A CITY THAT GREW TOO FAST**\n\n> By 1990, the population of the city had doubled in only fifteen years. Thousands of families had moved in from the countryside, but the council had not built enough housing.\n>\n> When the new mayor took office in 1992, she found that the water system had not changed since the 1950s. Many districts had never received a regular supply.\n>\n> Over the next ten years, the council built two reservoirs and repaired the old pipes. By 2005, almost every household had gained access to clean water, although traffic remained a serious problem.", "items": [{"q": "What had happened by 1990?", "o": ["The council had built enough housing.", "The population had doubled.", "The water system had been replaced.", "The new mayor had taken office."], "a": 1, "e": "the population of the city had doubled"}, {"q": "According to the passage, in 1992 the water system ______.", "o": ["was completely new", "had not changed since the 1950s", "served every district", "had just been repaired"], "a": 1, "e": "the water system had not changed since the 1950s"}, {"q": "The word **\"she\"** in paragraph 2 refers to ______.", "o": ["a family member", "the new mayor", "a resident", "the council"], "a": 1, "e": "she trỏ về the new mayor"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Traffic was solved by 2005.", "Most households had clean water by 2005.", "The council built three reservoirs.", "Nobody moved in from the countryside."], "a": 1, "e": "almost every household had gained access to clean water. A sai vì traffic vẫn là vấn đề"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **REPORT ON THE RIVERSIDE PROJECT**\n>\n> By the time the project began in 2018, the riverbank **(1)______** badly for years. Local residents **(2)______** several times, but the council **(3)______** any action. When engineers finally **(4)______** the site, they found that flooding **(5)______** the foundations of two buildings. The repairs **(6)______** eighteen months.", "items": [{"q": "Chỗ trống (1)", "o": ["erodes", "eroded", "has eroded", "had eroded"], "a": 3, "e": "By the time the project began"}, {"q": "Chỗ trống (2)", "o": ["complain", "complained", "had complained", "have complained"], "a": 2, "e": "Trước khi dự án bắt đầu"}, {"q": "Chỗ trống (3)", "o": ["didn't take", "hadn't taken", "hasn't taken", "doesn't take"], "a": 1, "e": "hadn't taken — cùng mốc với trên"}, {"q": "Chỗ trống (4)", "o": ["inspect", "inspected", "had inspected", "have inspected"], "a": 1, "e": "finally + việc chính → QKĐ"}, {"q": "Chỗ trống (5)", "o": ["damages", "damaged", "had damaged", "has damaged"], "a": 2, "e": "Việc xảy ra trước khi kỹ sư kiểm tra"}, {"q": "Chỗ trống (6)", "o": ["take", "took", "had taken", "have taken"], "a": 1, "e": "QKĐ — kết quả kể sau cùng"}]}]}, {"id": 10, "month": "10", "title": "Tương Lai: Will Và Be Going To", "theme": "The world of work", "blocks": [{"h": "① NGỮ PHÁP", "md": "Hai cách nói về tương lai, khác nhau ở **mức độ đã quyết định**:\n\n> **`will`** = quyết định **ngay lúc nói**, dự đoán, lời hứa, **thông báo chính thức**.\n> **`be going to`** = dự định **đã có sẵn từ trước**, hoặc dự đoán **có bằng chứng nhìn thấy**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **will + V** | **be going to + V** |\n|---|---|---|\n| **Dùng cho** | Quyết định tức thì · dự đoán chủ quan · lời hứa · **tờ rơi, thông báo** | Dự định có sẵn · dự đoán có bằng chứng |\n| **Dấu hiệu** | tomorrow · next week · soon · in the future · I think/believe/hope · probably | already decided · Look at…! |\n| **Ví dụ** | *The bag is heavy — I **will help** you.* | *I **am going to apply** for that grant.* |\n| | *I think prices **will rise**.* | *Look at those clouds — it **is going to rain**.* |\n\n### 📌 Hiện tại tiếp diễn chỉ tương lai\n\nDùng cho **lịch hẹn đã sắp xếp cụ thể** (có giờ, có địa điểm):\n*I **am meeting** the supervisor at 3 p.m. tomorrow.*\n\n### 💡 Mẹo cho đề thi\n\nTrong **tờ rơi, thông báo, quảng cáo** — thể loại chiếm phần lớn dạng điền từ — gần như luôn dùng **`will`** hoặc **`will be + V3`** (bị động tương lai)."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Will khẳng định | S + will + V | *Applicants **will get** a certificate.* |\n| Will phủ định | S + won't + V | *The centre **won't open** on holidays.* |\n| Will nghi vấn | Will + S + V? | ***Will** the drill **take** long?* |\n| Be going to | S + am/is/are going to + V | *We **are going to launch** the campaign.* |\n| HTTD chỉ tương lai | S + am/is/are + V-ing + thời gian | *She **is presenting** at 10 a.m. tomorrow.* |"}], "vocab": [{"t": "Dùng cho", "p": "Quyết định tức thì · dự đoán chủ quan · lời hứa · tờ rơi, thông báo", "e": "Dự định có sẵn · dự đoán có bằng chứng", "v": ""}, {"t": "Ví dụ", "p": "The bag is heavy — I will help you.", "e": "I am going to apply for that grant.", "v": ""}, {"t": "apply for", "p": "phr v", "e": "to ask formally for a job or a place", "v": ""}, {"t": "be suitable for", "p": "adj phr", "e": "to be right for a particular purpose or person", "v": ""}, {"t": "hands-on experience", "p": "n phr", "e": "practical experience of doing something yourself", "v": ""}, {"t": "full training", "p": "n phr", "e": "complete instruction in how to do a job", "v": ""}, {"t": "start a career", "p": "v phr", "e": "to begin working in a particular profession", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "A: The phone's ringing. B: I ______ answer it.", "o": ["will", "am going to", "am", "would"], "a": 0, "e": "Quyết định ngay lúc nghe chuông"}, {"q": "She has bought the tickets — she ______ visit Da Nang next week.", "o": ["will", "is going to", "would", "was going to"], "a": 1, "e": "has bought the tickets → kế hoạch đã có"}, {"q": "I think the council ______ approve the budget.", "o": ["will", "is going to", "would", "going to"], "a": 0, "e": "I think → dự đoán chủ quan"}, {"q": "Look at that crack — the wall ______ collapse.", "o": ["will", "is going to", "would", "is"], "a": 1, "e": "Vết nứt = bằng chứng nhìn thấy"}, {"q": "Successful applicants ______ plenty of hands-on experience.", "o": ["get", "will get", "are getting", "got"], "a": 1, "e": "Thông báo tuyển dụng → will"}, {"q": "I ______ the client at 11 a.m. tomorrow. *(lịch hẹn đã đặt)*", "o": ["meet", "will meet", "am meeting", "met"], "a": 2, "e": "Lịch hẹn cố định → hiện tại tiếp diễn"}]}, {"t": "Đọc hiểu", "p": "**📖 SUMMER JOBS FOR STUDENTS**\n\n> Techworld Magazine is pleased to announce two part-time positions for undergraduates this summer. Successful applicants will work three days a week and will receive a certificate at the end.\n>\n> We are going to hold interviews in the first week of June. Candidates who reach the final round will meet the editor in person.\n>\n> No previous experience is required, as we are going to provide full training. Applications should be submitted by 30 May. We think this is going to be an excellent opportunity for students who want to start a career in technology.", "items": [{"q": "According to the passage, successful applicants ______.", "o": ["will work five days a week", "will receive a certificate", "must have previous experience", "will be paid in June"], "a": 1, "e": "will receive a certificate at the end"}, {"q": "When will the interviews take place?", "o": ["In the first week of June", "On 30 May", "At the end of the summer", "Immediately after applying"], "a": 0, "e": "in the first week of June"}, {"q": "The word **\"we\"** in paragraph 3 refers to ______.", "o": ["the applicants", "the students", "the magazine", "the editors"], "a": 2, "e": "we trỏ về the magazine"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Applicants need experience in technology.", "Training will be provided by the magazine.", "Everyone will meet the editor.", "Applications close in June."], "a": 1, "e": "we are going to provide full training"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **VOLUNTEER PROGRAMME — AUTUMN INTAKE**\n>\n> Green City Foundation **(1)______** ten volunteer places this autumn. Volunteers **(2)______** practical training and a certificate. We **(3)______** hold an information session on 12 September — the room is already booked. Transport costs **(4)______** fully covered. We think this **(5)______** the largest intake in our history. Applications **(6)______** be submitted by 30 August.", "items": [{"q": "Chỗ trống (1)", "o": ["announces", "will announce", "announced", "is announcing"], "a": 1, "e": "Thông báo chính thức"}, {"q": "Chỗ trống (2)", "o": ["receive", "will receive", "received", "are receiving"], "a": 1, "e": "Volunteers nhận → chủ động"}, {"q": "Chỗ trống (3)", "o": ["will", "are going to", "would", "were going to"], "a": 1, "e": "the room is already booked → kế hoạch có sẵn"}, {"q": "Chỗ trống (4)", "o": ["will", "will be", "are going", "going to be"], "a": 1, "e": "Chi phí được chi trả → will be covered"}, {"q": "Chỗ trống (5)", "o": ["is", "was", "will be", "has been"], "a": 2, "e": "We think → dự đoán"}, {"q": "Chỗ trống (6)", "o": ["will", "should", "would", "should not"], "a": 1, "e": "🔴 Yêu cầu, không phải dự đoán → should"}]}]}, {"id": 11, "month": "10", "title": "Tương Lai Tiếp Diễn Và Tương Lai Hoàn Thành", "theme": "Global warming", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Tương lai tiếp diễn** = việc **sẽ đang diễn ra** tại một thời điểm trong tương lai.\n> **Tương lai hoàn thành** = việc **sẽ hoàn tất trước** một mốc trong tương lai.\n\n```\n                bây giờ ──────────────── mốc tương lai ────\nTương lai hoàn thành:  ═══════════►│  (xong TRƯỚC mốc)\nTương lai tiếp diễn:              ═╪═  (đang diễn ra ĐÚNG lúc)\n```"}, {"h": "② CÁCH SỬ DỤNG", "md": "| | **TƯƠNG LAI TIẾP DIỄN** | **TƯƠNG LAI HOÀN THÀNH** |\n|---|---|---|\n| **Dùng cho** | Sẽ đang làm gì tại một mốc tương lai | Sẽ xong trước một mốc tương lai |\n| **Dấu hiệu** | at this time tomorrow · at 8 p.m. next Monday · this time next week | **by** + mốc (by 2030, by the end of…) · by the time + hiện tại đơn |\n| **Ví dụ** | *This time next week, we **will be working** in the new office.* | *By June, the team **will have completed** the survey.* |\n\n### 📌 Bẫy `by the time`\n\nSau `by the time` dùng **hiện tại đơn**, vế chính dùng **tương lai hoàn thành**:\n*By the time you **arrive**, we **will have finished** the briefing.*"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| TL tiếp diễn | S + will be + V-ing | *At 10 a.m. they **will be testing** the alarm.* |\n| TL tiếp diễn phủ định | S + won't be + V-ing | *We **won't be using** the old system.* |\n| TL hoàn thành | S + will have + V3 | *By 2030, the city **will have converted** its buses.* |\n| TL hoàn thành phủ định | S + won't have + V3 | *They **won't have finished** by Friday.* |"}], "vocab": [{"t": "Dùng cho", "p": "Sẽ đang làm gì tại một mốc tương lai", "e": "Sẽ xong trước một mốc tương lai", "v": ""}, {"t": "cut emissions", "p": "v phr", "e": "to reduce the gases released into the air", "v": ""}, {"t": "take up (space)", "p": "phr v", "e": "to fill or use an amount of space", "v": ""}, {"t": "phase out", "p": "phr v", "e": "to stop using something gradually", "v": ""}, {"t": "contribute to", "p": "phr v", "e": "to be one of the causes of something", "v": ""}, {"t": "meet a target", "p": "v phr", "e": "to achieve a goal that was set", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "By next Friday, we ______ the audit.", "o": ["complete", "will complete", "will have completed", "are completing"], "a": 2, "e": "By next Friday → xong trước mốc"}, {"q": "This time next month, they ______ in the new building.", "o": ["live", "will live", "will be living", "will have lived"], "a": 2, "e": "This time next month → đang diễn ra"}, {"q": "By the time you read this, I ______ .", "o": ["leave", "will leave", "will be leaving", "will have left"], "a": 3, "e": "By the time"}, {"q": "At 8 p.m. tonight, the team ______ the system.", "o": ["will still test", "will still be testing", "will have tested", "tests"], "a": 1, "e": "At 8 p.m. + still → đang dở"}, {"q": "By 2028, emissions ______ by 40%.", "o": ["fall", "will fall", "will be falling", "will have fallen"], "a": 3, "e": "By 2028"}, {"q": "Don't call at 7 — I ______ home then.", "o": ["drive", "will drive", "will be driving", "will have driven"], "a": 2, "e": "then = đúng lúc 7 giờ"}]}, {"t": "Đọc hiểu", "p": "**📖 TARGETS FOR 2030**\n\n> By 2030, many countries will have replaced a large part of their coal capacity with wind and solar power. Some governments say that they will have closed every coal plant by that date.\n>\n> This time next year, engineers in three Asian countries will be testing a new type of floating solar panel. If the trials succeed, the panels will be installed on reservoirs, where they take up no farmland.\n>\n> Scientists warn, however, that targets alone will not reduce emissions. By the time these plans are complete, global demand for electricity will have risen by almost a third.", "items": [{"q": "According to the passage, by 2030 many countries ______.", "o": ["will have built more coal plants", "will have replaced much of their coal capacity", "will be testing solar panels", "will have reduced electricity demand"], "a": 1, "e": "will have replaced a large part of their coal capacity"}, {"q": "Where will the new solar panels be installed?", "o": ["On farmland", "On reservoirs", "On coal plants", "On rooftops"], "a": 1, "e": "the panels will be installed on reservoirs"}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["engineers", "countries", "the panels", "reservoirs"], "a": 2, "e": "they trỏ về the panels"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Targets alone are enough to cut emissions.", "Electricity demand will fall by 2030.", "Scientists have some doubts about the plans.", "Every country will close its coal plants."], "a": 2, "e": "Scientists warn… that targets alone will not reduce emissions"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **CITY ENERGY PLAN 2027–2032**\n>\n> By 2032, the city **(1)______** its entire bus fleet to electric power. At this time next year, engineers **(2)______** the first charging hubs in three districts. By the time the final phase begins, over 400 drivers **(3)______** retraining. We **(4)______** not **(4)______** the old depots after 2030. By the end of the programme, annual emissions **(5)______** by an estimated 40%, and residents **(6)______** cleaner air every day.", "items": [{"q": "Chỗ trống (1)", "o": ["converts", "will convert", "will be converting", "will have converted"], "a": 3, "e": "By 2032"}, {"q": "Chỗ trống (2)", "o": ["install", "will install", "will be installing", "will have installed"], "a": 2, "e": "At this time next year"}, {"q": "Chỗ trống (3)", "o": ["complete", "will complete", "will have completed", "are completing"], "a": 2, "e": "By the time … begins"}, {"q": "Chỗ trống (4)", "o": ["will / use", "will / be using", "would / use", "will / have use"], "a": 1, "e": "after 2030 + nhấn trạng thái đang dùng"}, {"q": "Chỗ trống (5)", "o": ["fall", "will fall", "will be falling", "will have fallen"], "a": 3, "e": "By the end of the programme"}, {"q": "Chỗ trống (6)", "o": ["enjoy", "will be enjoying", "will have enjoyed", "enjoyed"], "a": 1, "e": "every day → đang diễn ra"}]}]}, {"id": 12, "month": "10", "title": "Tổng Ôn 8 Thì", "theme": "Green living", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng ôn.** Không có kiến thức mới — hệ thống hoá và luyện tập."}, {"h": "① BẢNG TỔNG HỢP 8 THÌ", "md": "| Thì | Công thức | Dấu hiệu chính | Ví dụ |\n|---|---|---|---|\n| **Hiện tại đơn** | S + V(s/es) | every · always · usually | *The centre **opens** at 8.* |\n| **Hiện tại tiếp diễn** | S + am/is/are + V-ing | now · at the moment · Look! | *They **are testing** it now.* |\n| **Quá khứ đơn** | S + V2/ed | yesterday · ago · in 2020 | *We **signed** it last week.* |\n| **Quá khứ tiếp diễn** | S + was/were + V-ing | while · at 8 p.m. yesterday | *He .\n>\n> At the centres, paper, glass and metal are separated by hand and by machine. These materials are then sold to factories, where they are turned into new products.\n>\n> The rest is buried in landfill sites. Last year, almost sixty per cent of the city's waste was buried in this way. A new plan was announced in March, and by 2030 that figure will have been reduced to thirty per cent.", "items": [{"q": "According to the passage, where is the waste taken first?", "o": ["To landfill sites", "To three sorting centres", "To factories", "To the ring road"], "a": 1, "e": "The waste is taken to three sorting centres"}, {"q": "How are paper, glass and metal separated?", "o": ["Only by machine", "Only by hand", "By hand and by machine", "By the factories"], "a": 2, "e": "separated by hand and by machine"}, {"q": "The word **\"they\"** in paragraph 2 refers to ______.", "o": ["factories", "these materials", "the centres", "new products"], "a": 1, "e": "they trỏ về These materials"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All the city's waste is recycled.", "Most of the waste was buried last year.", "The new plan was announced in 2030.", "No materials are sold to factories."], "a": 1, "e": "almost sixty per cent… was buried"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **SAFE STEPS CAMPAIGN**\n>\n> The primary goal is to raise staff awareness of common hazards. To achieve this, warning signs **(1)______** at every staircase next month. Short drills **(2)______** every term since 2024. Currently, all fire extinguishers **(3)______** by an external contractor. Last year, over 200 employees **(4)______** in basic first aid. Before the campaign started, no formal records **(5)______**. All incidents **(6)______** to the HR Department immediately.", "items": [{"q": "Chỗ trống (1)", "o": ["install", "installed", "will be installed", "are installing"], "a": 2, "e": "next month + biển không tự lắp"}, {"q": "Chỗ trống (2)", "o": ["hold", "held", "have been held", "are holding"], "a": 2, "e": "since 2024 → HTHT bị động"}, {"q": "Chỗ trống (3)", "o": ["inspect", "are inspecting", "are being inspected", "inspected"], "a": 2, "e": "Currently + by an external contractor"}, {"q": "Chỗ trống (4)", "o": ["train", "trained", "were trained", "have trained"], "a": 2, "e": "Last year; nhân viên được đào tạo"}, {"q": "Chỗ trống (5)", "o": ["keep", "kept", "were kept", "had been kept"], "a": 3, "e": "Before … started → QKHT bị động"}, {"q": "Chỗ trống (6)", "o": ["must report", "must be reported", "must reporting", "reported"], "a": 1, "e": "must + be + V3"}]}]}, {"id": 15, "month": "11", "title": "Bị Động Với Modal Và Tương Lai", "theme": "Workplace safety", "blocks": [{"h": "① NGỮ PHÁP", "md": "Khi câu có `must / should / can / may / have to / be going to`, công thức bị động **không đổi thì** — chỉ chèn `be` vào giữa.\n\n> **modal + be + V3**"}, {"h": "② CÁCH SỬ DỤNG", "md": "Dạng này ra rất nhiều trong tờ rơi, vì tờ rơi = **quy định + kế hoạch**:\n\n| Nội dung | Cấu trúc | Ví dụ |\n|---|---|---|\n| Quy định bắt buộc | `must be + V3` | *Helmets **must be worn**.* |\n| Bắt buộc do quy định | `have to be + V3` | *Receipts **have to be shown**.* |\n| Khuyến nghị | `should be + V3` · `ought to be + V3` | *Forms **should be submitted** early.* |\n| Cho phép, khả năng | `can be + V3` · `may be + V3` | *Items **can be exchanged**.* |\n| Cấm | `must not be + V3` · `cannot be + V3` | *The funding **must not be used** for equipment.* |\n| Kế hoạch | `will be + V3` · `is going to be + V3` | *Cables **are going to be laid** next week.* |\n\n⚠️ **Tuyệt đối không tồn tại:** ~~must been~~ · ~~should been~~ · ~~will been~~ · ~~can been~~"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| must / should / can / may / might + **be + V3** | *Helmets **must be worn** at all times.* |\n| have to / has to / had to + **be + V3** | *Your receipt **has to be shown** at the counter.* |\n| ought to + **be + V3** | *The fee **ought to be paid** in advance.* |\n| be going to + **be + V3** | *Cables **are going to be laid** next week.* |\n| will + **be + V3** | *Seats **will be offered** to the waiting list.* |\n| must not / cannot + **be + V3** | *Photographs **cannot be taken** here.* |"}], "vocab": [{"t": "be required to", "p": "v phr", "e": "to have to do something because of a rule", "v": ""}, {"t": "be allowed to", "p": "v phr", "e": "to have permission to do something", "v": ""}, {"t": "keep (sth) clear", "p": "v phr", "e": "to make sure nothing blocks a space", "v": ""}, {"t": "report a fault", "p": "v phr", "e": "to tell someone that something is broken", "v": ""}, {"t": "comply with", "p": "phr v", "e": "to obey a rule or an order", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Damaged goods ______ within seven days.", "o": ["can exchange", "can be exchanged", "can being exchanged", "can been exchanged"], "a": 1, "e": "can + be + V3; hàng hoá được đổi"}, {"q": "The form ______ before the deadline.", "o": ["must sign", "must be signed", "must signing", "must been signed"], "a": 1, "e": "must + be + V3; không có must been"}, {"q": "This equipment ______ by untrained staff.", "o": ["should not use", "should not be used", "should not using", "should not been used"], "a": 1, "e": "Thiết bị bị sử dụng bởi người chưa đào tạo"}, {"q": "The grant ______ for fieldwork only.", "o": ["is going to use", "is going to be used", "is going to using", "going to be used"], "a": 1, "e": "be going to + be + V3"}, {"q": "Cables ______ along existing verges to minimise disruption.", "o": ["may place", "may be placed", "may placing", "may been placed"], "a": 1, "e": "may + be + V3; cáp được đặt"}, {"q": "The mid-term report ______ by 15 December.", "o": ["ought to submit", "ought to be submitted", "ought submitting", "ought been submitted"], "a": 1, "e": "ought to + be + V3"}]}, {"t": "Đọc hiểu", "p": "**📖 SAFETY RULES AT THE WAREHOUSE**\n\n> All visitors must be signed in at reception before entering the warehouse. Hard hats and safety shoes must be worn in every area except the office.\n>\n> Forklift trucks may only be operated by trained staff. If a machine is faulty, it should be reported immediately and must not be used until an engineer has checked it.\n>\n> Emergency exits must be kept clear at all times. Next month, new floor markings are going to be painted around each exit, and a short training session will be held for every department.", "items": [{"q": "According to the passage, visitors ______.", "o": ["can enter the warehouse directly", "must be signed in at reception", "do not need safety shoes", "must operate the forklift trucks"], "a": 1, "e": "All visitors must be signed in at reception"}, {"q": "What should happen if a machine is faulty?", "o": ["It should be repaired by any worker.", "It should be reported and not used.", "It should be moved to the office.", "It should be used only by visitors."], "a": 1, "e": "it should be reported immediately and must not be used"}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the report", "the engineer", "a faulty machine", "the warehouse"], "a": 2, "e": "it trỏ về a faulty machine"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Hard hats are required in the office.", "New floor markings will be painted next month.", "Anyone may operate a forklift truck.", "Emergency exits may be blocked temporarily."], "a": 1, "e": "new floor markings are going to be painted"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **EXCHANGE AND REFUND POLICY**\n>\n> Sold items **(1)______** within five days, but no refunds are given. Your original receipt **(2)______** at the counter. Faulty goods **(3)______** free of charge next week. Electrical items **(4)______** without their original packaging. Under our new policy, all claims **(5)______** in writing from January. Damaged packaging **(6)______** the value of your refund.", "items": [{"q": "Chỗ trống (1)", "o": ["can exchange", "can be exchanged", "can exchanging", "can been exchanged"], "a": 1, "e": "Hàng được đổi"}, {"q": "Chỗ trống (2)", "o": ["must show", "must be shown", "must showing", "must been shown"], "a": 1, "e": "Biên lai được xuất trình"}, {"q": "Chỗ trống (3)", "o": ["will replace", "will be replaced", "will replacing", "will been replaced"], "a": 1, "e": "next week + hàng được thay"}, {"q": "Chỗ trống (4)", "o": ["cannot return", "cannot be returned", "cannot returning", "cannot been returned"], "a": 1, "e": "Đồ điện bị từ chối trả lại"}, {"q": "Chỗ trống (5)", "o": ["are going to make", "are going to be made", "going to be made", "is going to be made"], "a": 1, "e": "from January; claims số nhiều → are"}, {"q": "Chỗ trống (6)", "o": ["may reduce", "may be reduced", "may reducing", "may been reduced"], "a": 1, "e": "Giá trị bị giảm"}]}]}, {"id": 16, "month": "11", "title": "Bị Động Đặc Biệt Và Thể Sai Khiến", "theme": "A multicultural world", "blocks": [{"h": "① NGỮ PHÁP", "md": "Ba cấu trúc nâng cao, dùng khi **không rõ hoặc không cần nêu chủ thể**:\n\n> **`It is said that…`** — ý kiến chung, không rõ ai nói.\n> **`S + is said to V`** — cùng nghĩa, đưa chủ ngữ lên trước.\n> **`have / get + something + V3`** — thuê người khác làm việc gì."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Cấu trúc | Dùng khi | Ví dụ |\n|---|---|---|\n| `It is said/believed/thought that + mệnh đề` | Ý kiến chung | *It is assumed that the owner is rich.* |\n| `S + is said/believed to + V` | Cùng nghĩa, đảo chủ ngữ lên trước | *The owner is assumed to be rich.* |\n| `S + is said to have + V3` | Việc xảy ra **trước** | *He is believed to have applied twice.* |\n| `have/get + O + V3` | Thuê người làm | *We had the signs installed.* |\n| `being + V3` sau giới từ | Bị động dạng V-ing | *After being informed, he appealed.* |\n\n⚠️ **Phân biệt:**\n- *We **had the equipment checked**.* → ta thuê người kiểm tra.\n- *The equipment **was checked**.* → thiết bị được kiểm tra, không nói ai làm."}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| It + is/was + said/believed/thought/assumed/reported + that + S + V | *It is reported that speeds have improved.* |\n| S + is/was + said/believed + **to V** *(cùng thời)* | *Speeds are reported to be improving.* |\n| S + is/was + said + **to have + V3** *(việc trước)* | *He is believed to have left.* |\n| S + **have/has/had** + O + **V3** | *They had the office redecorated.* |\n| S + **get** + O + **V3** | *She got her report proofread.* |\n| giới từ + **being + V3** | *After being notified, they confirmed.* |"}], "vocab": [{"t": "be brought together", "p": "v phr", "e": "to be united in one place", "v": ""}, {"t": "take place", "p": "v phr", "e": "to happen", "v": ""}, {"t": "date back to", "p": "phr v", "e": "to have existed since a particular time", "v": ""}, {"t": "hand down", "p": "phr v", "e": "to pass something to younger people", "v": ""}, {"t": "be thought to be", "p": "v phr", "e": "to be considered by people to be", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "______ that wealth is often invisible.", "o": ["It says", "It is said", "It said", "Is said"], "a": 1, "e": "Cấu trúc cố định It is said that…"}, {"q": "The scheme ______ to be highly effective.", "o": ["believes", "is believed", "is believing", "believed"], "a": 1, "e": "S + is believed + to V"}, {"q": "He ______ to have completed the course last year.", "o": ["reports", "is reported", "is reporting", "reported"], "a": 1, "e": "is reported to have + V3 — việc xảy ra trước"}, {"q": "We ______ the equipment ______ by a specialist.", "o": ["had / check", "had / checked", "have / check", "had / checking"], "a": 1, "e": "have + O + V3 — thuê người làm"}, {"q": "She got her report ______ before the deadline.", "o": ["proofread", "proofreading", "to proofread", "proofreads"], "a": 0, "e": "get + O + V3"}, {"q": "After ______ of the decision, he appealed immediately.", "o": ["informing", "being informed", "informed", "to inform"], "a": 1, "e": "Sau giới từ After + bị động → being + V3"}]}, {"t": "Đọc hiểu", "p": "**📖 THE ORIGINS OF TET**\n\n> Tet is believed to have been celebrated in Viet Nam for more than two thousand years. It is said that the festival began as a way of marking the start of the farming year.\n>\n> In the weeks before Tet, houses are cleaned from top to bottom. Many families have their homes repainted, and older relatives get their photographs framed for the family altar.\n>\n> The festival is thought to be the most important event in the Vietnamese calendar. Although some traditions have changed, the central idea has not: Tet is a time when families are brought together.", "items": [{"q": "According to the passage, Tet is believed to have started ______.", "o": ["two hundred years ago", "as a way of marking the farming year", "in another country", "as a religious ceremony only"], "a": 1, "e": "the festival began as a way of marking the start of the farming year"}, {"q": "What do many families do before Tet?", "o": ["They move to a new house.", "They have their homes repainted.", "They stop cleaning.", "They sell their photographs."], "a": 1, "e": "Many families have their homes repainted"}, {"q": "The word **\"It\"** in paragraph 1 refers to ______.", "o": ["Viet Nam", "the farming year", "Tet", "the calendar"], "a": 2, "e": "It trỏ về Tet"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["No tradition has changed.", "Tet brings families together.", "Tet is the least important festival.", "Houses are cleaned after Tet."], "a": 1, "e": "Tet is a time when families are brought together"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **A FESTIVAL WITH A LONG HISTORY**\n>\n> The Mid-Autumn Festival **(1)______** to date back more than a thousand years. **(2)______** that it began as a harvest celebration. Every September, families **(3)______** their lanterns repaired or repainted before the event. In some villages, the recipe for mooncakes **(4
