r", "in", "about"], "a": 0, "e": "aware of"}, {"q": "There has been a sharp increase ______ complaints.", "o": ["of", "in", "for", "to"], "a": 1, "e": "an increase in"}, {"q": "Poor maintenance resulted ______ a major failure.", "o": ["from", "in", "of", "to"], "a": 1, "e": "result in = dẫn đến"}, {"q": "The failure resulted ______ poor planning.", "o": ["in", "from", "of", "to"], "a": 1, "e": "🔴 result from = bắt nguồn từ"}, {"q": "All staff must comply ______ the safety rules.", "o": ["to", "for", "with", "on"], "a": 2, "e": "comply with"}]}, {"t": "Đọc hiểu", "p": "**📖 THE FIFTEEN-MINUTE CITY**\n\n> Planners in several European cities are interested in an idea known as the \"fifteen-minute city\". The aim is simple: every resident should have access to schools, shops and clinics within fifteen minutes on foot or by bicycle.\n>\n> Supporters argue that this reduces demand for cars and leads to cleaner air. Cities that rely on long commutes, they say, suffer from both congestion and poor health.\n>\n> Critics are less confident. They point out that the plan depends on a high density of housing, which is not typical of many suburbs. The solution to that problem, however, is not yet clear.", "items": [{"q": "According to the passage, in a fifteen-minute city residents should ______.", "o": ["travel for fifteen minutes by car", "reach basic services within fifteen minutes on foot or by bicycle", "live fifteen minutes from the city centre", "work only fifteen minutes a day"], "a": 1, "e": "within fifteen minutes on foot or by bicycle"}, {"q": "What do supporters argue?", "o": ["The idea reduces demand for cars.", "The idea increases commuting.", "The idea is too expensive.", "The idea works only in suburbs."], "a": 0, "e": "this reduces demand for cars"}, {"q": "The word **\"They\"** in paragraph 3 refers to ______.", "o": ["supporters", "cities", "critics", "planners"], "a": 2, "e": "They trỏ về Critics"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Critics say the plan depends on high housing density.", "The solution has already been found.", "Suburbs are typically very dense.", "All planners support the idea."], "a": 0, "e": "the plan depends on a high density of housing"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **BROADBAND PROJECT UPDATE**\n>\n> For years, residents relied **(1)______** copper cables that could not handle demand **(2)______** higher bandwidth. The council's solution **(3)______** the problem was to lay fibre optic lines. Villagers are now highly satisfied **(4)______** the service, and the upgrade has had a clear impact **(5)______** local businesses. Every household now has access **(6)______** a reliable connection.", "items": [{"q": "Chỗ trống (1)", "o": ["in", "on", "for", "to"], "a": 1, "e": "rely on"}, {"q": "Chỗ trống (2)", "o": ["in", "of", "for", "on"], "a": 2, "e": "demand for"}, {"q": "Chỗ trống (3)", "o": ["for", "to", "of", "with"], "a": 1, "e": "a solution to"}, {"q": "Chỗ trống (4)", "o": ["of", "for", "with", "to"], "a": 2, "e": "satisfied with"}, {"q": "Chỗ trống (5)", "o": ["in", "at", "on", "for"], "a": 2, "e": "impact on"}, {"q": "Chỗ trống (6)", "o": ["of", "for", "to", "with"], "a": 2, "e": "access to"}]}]}, {"id": 30, "month": "12", "title": "Phrasal Verb I", "theme": "Workplace", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Phrasal verb** = động từ + tiểu từ. Nghĩa thường **không đoán được** từ các thành phần.\n\n`get out of` không phải \"lấy ra khỏi\" mà là \"thoát khỏi\"."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong đề điền từ, phrasal verb thường được hỏi bằng cách **cho sẵn tiểu từ và hỏi động từ**:\n*teach students how to ___ out of the building* → cho sẵn `out of`, hỏi động từ → `get`"}, {"h": "③ CẤU TRÚC — 15 PHRASAL VERB NHÓM 1", "md": "| Phrasal verb | Nghĩa | Ví dụ |\n|---|---|---|\n| **get out of** | thoát khỏi | *get out of the building* |\n| **carry out** | thực hiện | *carry out a survey* |\n| **set up** | thiết lập | *set up a committee* |\n| **take on** | đảm nhận | *take on responsibility* |\n| **put off** | hoãn | *put off the meeting* |\n| **call off** | huỷ | *call off the drill* |\n| **turn down** | từ chối | *turn down an offer* |\n| **bring about** | gây ra | *bring about change* |\n| **cut down on** | cắt giảm | *cut down on waste* |\n| **look into** | điều tra | *look into the complaint* |\n| **come up with** | nghĩ ra | *come up with a solution* |\n| **run out of** | hết | *run out of funding* |\n| **give up** | từ bỏ | *give up smoking* |\n| **deal with** | xử lý | *deal with a problem* |\n| **point out** | chỉ ra | *point out an error* |\n\n⚠️ **Cặp dễ nhầm:** `put off` = hoãn lại · `call off` = huỷ hẳn."}], "vocab": [{"t": "get out of", "p": "thoát khỏi", "e": "get out of the building", "v": ""}, {"t": "set up", "p": "thiết lập", "e": "set up a committee", "v": ""}, {"t": "put off", "p": "hoãn", "e": "put off the meeting", "v": ""}, {"t": "turn down", "p": "từ chối", "e": "turn down an offer", "v": ""}, {"t": "cut down on", "p": "cắt giảm", "e": "cut down on waste", "v": ""}, {"t": "come up with", "p": "nghĩ ra", "e": "come up with a solution", "v": ""}, {"t": "give up", "p": "từ bỏ", "e": "give up smoking", "v": ""}, {"t": "run out of", "p": "phr v", "e": "to have no more of something left", "v": ""}, {"t": "take on", "p": "phr v", "e": "to accept work or responsibility", "v": ""}, {"t": "deal with", "p": "phr v", "e": "to take action to solve a problem", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Short drills teach employees how to ______ out of the building calmly.", "o": ["check", "get", "sort", "fill"], "a": 1, "e": "get out of = thoát khỏi"}, {"q": "The council ______ off the event because of the storm.", "o": ["put", "called", "took", "gave"], "a": 1, "e": "call off = huỷ"}, {"q": "We must ______ down on single-use plastics.", "o": ["cut", "put", "take", "turn"], "a": 0, "e": "cut down on = cắt giảm"}, {"q": "The committee will ______ into the complaint.", "o": ["come", "look", "run", "set"], "a": 1, "e": "look into = điều tra"}, {"q": "She ______ on the role of team leader last month.", "o": ["took", "put", "gave", "came"], "a": 0, "e": "take on = đảm nhận"}, {"q": "The team ______ up with three possible solutions.", "o": ["set", "came", "took", "ran"], "a": 1, "e": "come up with = nghĩ ra"}]}, {"t": "Đọc hiểu", "p": "**📖 THE FOUR-DAY WEEK TRIAL**\n\n> Last year, a software company in Da Nang set up a trial of the four-day working week. Managers had put off the idea for years, worried that output would fall.\n>\n> The trial did not run smoothly at first. Two teams ran out of time on major projects, and one client threatened to turn down the next contract. Managers had to deal with several complaints in the first month.\n>\n> By the end of the trial, however, the results were clear. Staff took on the same workload in fewer hours, and nobody gave up the arrangement when offered the choice. The company now plans to carry out a longer study.", "items": [{"q": "Why had managers put off the idea?", "o": ["They had no staff.", "They worried that output would fall.", "Clients had refused it.", "It was too expensive."], "a": 1, "e": "worried that output would fall"}, {"q": "What happened in the first month?", "o": ["Everything ran smoothly.", "Managers had to deal with several complaints.", "All clients cancelled their contracts.", "Staff gave up the arrangement."], "a": 1, "e": "Managers had to deal with several complaints"}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the workload", "the choice", "the arrangement", "the study"], "a": 2, "e": "it trỏ về the arrangement"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Staff completed the same workload in fewer hours.", "Output fell sharply.", "The company has ended the scheme.", "Every team ran out of time."], "a": 0, "e": "Staff took on the same workload in fewer hours"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **FIRE SAFETY DRILL**\n>\n> The annual drill teaches staff how to **(1)______** out of the building calmly. A working group has been **(2)______** up to review the procedures. If the alarm sounds, do not attempt to **(3)______** with the fire yourself. The drill will be **(4)______** off only in severe weather. Investigators will **(5)______** into any incident within 48 hours. Managers must not **(6)______** off safety training to a later date.", "items": [{"q": "Chỗ trống (1)", "o": ["check", "get", "fill", "catch"], "a": 1, "e": "get out of; check out chỉ dùng cho khách sạn"}, {"q": "Chỗ trống (2)", "o": ["set", "put", "taken", "brought"], "a": 0, "e": "set up a working group"}, {"q": "Chỗ trống (3)", "o": ["deal", "look", "point", "cut"], "a": 0, "e": "deal with the fire"}, {"q": "Chỗ trống (4)", "o": ["put", "called", "taken", "given"], "a": 1, "e": "🔴 call off = huỷ, khác put off = hoãn"}, {"q": "Chỗ trống (5)", "o": ["come", "run", "look", "get"], "a": 2, "e": "look into = điều tra"}, {"q": "Chỗ trống (6)", "o": ["call", "put", "take", "cut"], "a": 1, "e": "put off = hoãn sang ngày khác"}]}]}, {"id": 31, "month": "12", "title": "Phrasal Verb Ii", "theme": "Energy transition", "blocks": [{"h": "① NGỮ PHÁP", "md": "Nhóm phrasal verb thứ hai, tập trung vào những cụm xuất hiện trong **văn bản học thuật và báo cáo** — hay gặp ở bài đọc hơn là bài điền từ."}, {"h": "② CẤU TRÚC — 15 PHRASAL VERB NHÓM 2", "md": "| Phrasal verb | Nghĩa | Ví dụ |\n|---|---|---|\n| **account for** | chiếm tỉ lệ / giải thích | *accounts for 40% of costs* |\n| **result in** | dẫn đến | *resulted in higher costs* |\n| **stem from** | bắt nguồn từ | *stems from poor planning* |\n| **rule out** | loại trừ | *rule out that option* |\n| **phase out** | loại bỏ dần | *phase out coal plants* |\n| **scale up / back** | mở rộng / thu hẹp | *scale back the scheme* |\n| **build on** | phát triển từ | *build on earlier research* |\n| **draw on** | dựa vào | *draw on local knowledge* |\n| **hand in** | nộp | *hand in the form* |\n| **fill in / out** | điền | *fill in the application* |\n| **sign up (for)** | đăng ký | *sign up for the workshop* |\n| **turn out** | hoá ra | *turned out to be effective* |\n| **make up for** | bù đắp | *make up for the loss* |\n| **put up with** | chịu đựng | *put up with the noise* |\n| **keep up with** | theo kịp | *keep up with demand* |\n\n⚠️ **Ba cặp dễ nhầm:**\n- `keep up with` (theo kịp) ≠ `put up with` (chịu đựng)\n- `result in` (dẫn đến) ≠ `stem from` (bắt nguồn từ)\n- `phase out` (loại bỏ dần) ≠ `rule out` (loại trừ một khả năng)"}], "vocab": [{"t": "account for", "p": "chiếm tỉ lệ / giải thích", "e": "accounts for 40% of costs", "v": ""}, {"t": "stem from", "p": "bắt nguồn từ", "e": "stems from poor planning", "v": ""}, {"t": "phase out", "p": "loại bỏ dần", "e": "phase out coal plants", "v": ""}, {"t": "build on", "p": "phát triển từ", "e": "build on earlier research", "v": ""}, {"t": "hand in", "p": "nộp", "e": "hand in the form", "v": ""}, {"t": "sign up (for)", "p": "đăng ký", "e": "sign up for the workshop", "v": ""}, {"t": "make up for", "p": "bù đắp", "e": "make up for the loss", "v": ""}, {"t": "keep up with", "p": "phr v", "e": "to move or change at the same speed", "v": ""}, {"t": "put up with", "p": "phr v", "e": "to accept something unpleasant without complaining", "v": ""}], "groups": [{"t": "③ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Residents have to ______ up with the constant hum of turbines.", "o": ["keep", "put", "make", "take"], "a": 1, "e": "🔴 put up with = chịu đựng"}, {"q": "Transport ______ for nearly a third of national emissions.", "o": ["counts", "accounts", "makes", "stands"], "a": 1, "e": "account for = chiếm tỉ lệ"}, {"q": "The government plans to ______ out coal by 2040.", "o": ["rule", "phase", "build", "hand"], "a": 1, "e": "phase out = loại bỏ dần"}, {"q": "The delay ______ from a shortage of materials.", "o": ["resulted", "stemmed", "accounted", "ruled"], "a": 1, "e": "stem from = bắt nguồn từ"}, {"q": "Supply cannot ______ up with rising demand.", "o": ["put", "keep", "make", "draw"], "a": 1, "e": "keep up with = theo kịp"}, {"q": "The trial ______ out to be far more effective than expected.", "o": ["came", "turned", "ran", "filled"], "a": 1, "e": "turn out = hoá ra"}]}, {"t": "Đọc hiểu", "p": "**📖 THE SLOW END OF COAL**\n\n> Coal still accounts for about a third of the world's electricity. Several governments have promised to phase it out, but progress has not kept up with the targets they set.\n>\n> Part of the problem stems from cost. Building new solar and wind capacity is cheap, but the grids that carry the power are old. Upgrading them would result in very large bills, and few governments want to explain that to voters.\n>\n> Experts do not rule out a faster transition. They argue that if countries drew on existing technology instead of waiting for new inventions, the change could scale up within a decade. Communities near old coal plants, meanwhile, must put up with poor air quality for years to come.", "items": [{"q": "According to the passage, coal ______.", "o": ["has already been phased out", "accounts for about a third of world electricity", "is the cheapest form of power", "produces no air pollution"], "a": 1, "e": "Coal still accounts for about a third"}, {"q": "What is part of the problem?", "o": ["The cost of upgrading old grids", "A shortage of solar panels", "Opposition from experts", "A lack of new inventions"], "a": 0, "e": "Upgrading them would result in very large bills"}, {"q": "The word **\"them\"** in paragraph 2 refers to ______.", "o": ["governments", "bills", "the grids", "voters"], "a": 2, "e": "them trỏ về the grids"}, {"q": "What do experts argue?", "o": ["That a faster transition is impossible", "That countries should wait for new inventions", "That drawing on existing technology could speed up the change", "That coal plants improve air quality"], "a": 2, "e": "if countries drew on existing technology… the change could scale up"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **ENERGY TRANSITION REPORT**\n>\n> The government plans to **(1)______** out coal-fired plants by 2040. Renewable capacity has struggled to **(2)______** up with rising demand. Much of the shortfall **(3)______** from delays in grid upgrades. The latest strategy **(4)______** on research carried out in 2022. Communities near wind farms, however, must still **(5)______** up with continuous noise. Transport **(6)______** for another third of national emissions.", "items": [{"q": "Chỗ trống (1)", "o": ["rule", "phase", "build", "hand"], "a": 1, "e": "phase out"}, {"q": "Chỗ trống (2)", "o": ["put", "keep", "make", "draw"], "a": 1, "e": "keep up with"}, {"q": "Chỗ trống (3)", "o": ["results", "accounts", "stems", "rules"], "a": 2, "e": "stem from"}, {"q": "Chỗ trống (4)", "o": ["builds", "puts", "fills", "signs"], "a": 0, "e": "build on"}, {"q": "Chỗ trống (5)", "o": ["keep", "make", "put", "turn"], "a": 2, "e": "put up with"}, {"q": "Chỗ trống (6)", "o": ["counts", "accounts", "stands", "makes"], "a": 1, "e": "account for"}]}]}, {"id": 32, "month": "12", "title": "Từ Gần Nghĩa Dễ Nhầm", "theme": "Green living", "blocks": [{"h": "① NGỮ PHÁP", "md": "Khi 4 phương án **cùng từ loại và nghĩa gần nhau**, đề đang kiểm tra **sắc thái nghĩa** hoặc **collocation**, không kiểm tra ngữ pháp."}, {"h": "② CÁCH SỬ DỤNG — QUY TRÌNH", "md": "1. **Loại theo collocation trước** — từ nào không đi được với từ bên cạnh thì loại ngay.\n2. **Loại theo sắc thái** — từ nào quá mạnh hoặc quá nhẹ so với mạch văn.\n3. **Loại theo đối tượng** — từ dùng cho người hay cho vật."}, {"h": "③ CẤU TRÚC — BẢNG NHÓM TỪ DỄ NHẦM", "md": "| Nhóm | Phân biệt |\n|---|---|\n| **focus / awareness / emphasis / attention** | focus **on** · raise **awareness** · place **emphasis on** · pay **attention to** |\n| **produce / provide / protect / promote** | produce = sản xuất **vật** · provide = cung cấp · protect = bảo vệ · promote = thúc đẩy **thói quen, ý tưởng** |\n| **effect / affect** | **effect** = danh từ (tác động) · **affect** = động từ (ảnh hưởng đến) |\n| **rise / raise** | **rise** không có tân ngữ (*prices rise*) · **raise** có tân ngữ (*raise awareness*) |\n| **economic / economical** | **economic** = thuộc kinh tế · **economical** = tiết kiệm |\n| **considerable / considerate** | **considerable** = đáng kể · **considerate** = chu đáo |\n| **efficient / effective** | **efficient** = ít lãng phí · **effective** = đạt kết quả |\n| **amount / number** | **amount of** + không đếm được · **number of** + đếm được |\n| **among / between** | **between** 2 đối tượng · **among** từ 3 trở lên |\n| **fewer / less** | **fewer** + đếm được · **less** + không đếm được |\n| **remain / stay / keep** | remain = vẫn ở trạng thái (trang trọng) · keep + O + adj |\n| **notice / notify** | notice = nhận thấy · notify = thông báo cho ai |"}], "vocab": [{"t": "a shift in attitudes", "p": "n phr", "e": "a change in the way people think", "v": ""}, {"t": "be economical", "p": "adj phr", "e": "using money or fuel without waste", "v": ""}, {"t": "throw away", "p": "phr v", "e": "to get rid of something you do not want", "v": ""}, {"t": "raise stress", "p": "v phr", "e": "to make a situation more stressful", "v": ""}, {"t": "depend on", "p": "phr v", "e": "to be affected by something else", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The new system had a positive ______ on productivity.", "o": ["effect", "affect", "effective", "affected"], "a": 0, "e": "effect = danh từ (sau a positive)"}, {"q": "Prices have ______ by 12% this year.", "o": ["raised", "risen", "rose", "raising"], "a": 1, "e": "affect = động từ"}, {"q": "This is an ______ way to heat the building.", "o": ["economic", "economical", "economically", "economy"], "a": 1, "e": "risen — không có tân ngữ"}, {"q": "We aim to ______ sustainable habits through daily activities.", "o": ["produce", "provide", "protect", "promote"], "a": 1, "e": "economical = tiết kiệm"}, {"q": "A large ______ of applicants were shortlisted.", "o": ["amount", "number", "many", "few"], "a": 1, "e": "number of + đếm được"}, {"q": "There are ______ complaints this quarter than last.", "o": ["less", "fewer", "little", "few"], "a": 1, "e": "fewer + đếm được"}]}, {"t": "Đọc hiểu", "p": "**📖 LIVING WITH LESS**\n\n> A considerable number of young Vietnamese families are now choosing smaller homes. The change stems less from money than from a shift in attitudes.\n>\n> Smaller flats are more economical to heat and cool, and they produce fewer emissions. They also affect daily life in ways that are harder to measure: residents report that they buy less, throw away less, and spend more time outside.\n>\n> Not everyone is convinced. Critics point out that a small amount of space can raise stress in families with children. The effect, they argue, depends greatly on design rather than on size alone.", "items": [{"q": "According to the passage, why are families choosing smaller homes?", "o": ["Mainly because of money", "Mainly because of a shift in attitudes", "Because the government requires it", "Because large homes are unavailable"], "a": 1, "e": "stems less from money than from a shift in attitudes"}, {"q": "What do residents of smaller flats report?", "o": ["They buy more things.", "They spend less time outside.", "They buy less and throw away less.", "They pay more for heating."], "a": 2, "e": "they buy less, throw away less"}, {"q": "The word **\"They\"** at the start of paragraph 2's second sentence refers to ______.", "o": ["families", "smaller flats", "emissions", "residents"], "a": 1, "e": "They trỏ về Smaller flats"}, {"q": "What do critics argue?", "o": ["That small homes always raise stress", "That the effect depends greatly on design", "That size is the only factor", "That smaller homes cost more"], "a": 1, "e": "The effect depends greatly on design rather than on size alone"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **ANNUAL REVIEW**\n>\n> The scheme aims to **(1)______** sustainable habits across all departments. Last year the council **(2)______** standards for waste separation, and recycling rates have **(3)______** steadily since. The change has had a measurable **(4)______** on landfill volumes. A considerable **(5)______** of packaging is now recovered rather than discarded, and there are **(6)______** complaints than before.", "items": [{"q": "Chỗ trống (1)", "o": ["produce", "provide", "protect", "promote"], "a": 3, "e": "Thói quen → promote"}, {"q": "Chỗ trống (2)", "o": ["rose", "raised", "arisen", "rising"], "a": 1, "e": "Có tân ngữ standards → raise"}, {"q": "Chỗ trống (3)", "o": ["raised", "risen", "rose", "raising"], "a": 1, "e": "have risen — không tân ngữ"}, {"q": "Chỗ trống (4)", "o": ["affect", "effect", "effective", "affected"], "a": 1, "e": "Sau a measurable → danh từ"}, {"q": "Chỗ trống (5)", "o": ["number", "amount", "many", "few"], "a": 1, "e": "packaging không đếm được"}, {"q": "Chỗ trống (6)", "o": ["less", "fewer", "little", "few"], "a": 1, "e": "complaints đếm được"}]}]}, {"id": 33, "month": "12", "title": "Liên Từ Và Từ Nối", "theme": "Wind power debate", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Từ nối** cho biết **quan hệ giữa hai ý**.\n\nĐây là chìa khoá của cả ba dạng: điền từ, sắp xếp câu và điền mệnh đề. Nhận ra từ nối là nhận ra mạch lập luận."}, {"h": "② CÁCH SỬ DỤNG — PHÂN THEO QUAN HỆ Ý", "md": "| Quan hệ | Từ nối | Ví dụ |\n|---|---|---|\n| **Tương phản** | however · nevertheless · in contrast · on the other hand · yet | *Speeds improved. **However**, costs rose.* |\n| **Tương phản trong câu** | although / though / even though + **mệnh đề** · despite / in spite of + **N/V-ing** · but | ***Although** it rained*, the drill went ahead. |\n| **Nguyên nhân** | because / since / as + mệnh đề · because of / due to + N | *cancelled **because of** the storm* |\n| **Kết quả** | therefore · consequently · as a result · thus · hence | *Costs rose. **Consequently**, the scheme was cut.* |\n| **Bổ sung** | moreover · furthermore · in addition · additionally · besides | *The pay is good. **Moreover**, training is provided.* |\n| **Mục đích** | so that · in order to · so as to | *We hold drills **so that** staff know the exits.* |\n\n🔴 **Bẫy số một của mọi đề:** `although` đi với **mệnh đề**, `despite` đi với **danh từ hoặc V-ing**.\n\n| ✅ Đúng | ❌ Sai |\n|---|---|\n| Although **the weather was bad**, … | Despite ~~the weather was bad~~ |\n| Despite **the bad weather**, … | Although ~~the bad weather~~ |\n| Despite **being late**, … | |"}], "vocab": [{"t": "Tương phản", "p": "however · nevertheless · in contrast · on the other hand · yet", "e": "Speeds improved. However, costs rose.", "v": ""}, {"t": "Nguyên nhân", "p": "because / since / as + mệnh đề · because of / due to + N", "e": "cancelled because of the storm", "v": ""}, {"t": "Bổ sung", "p": "moreover · furthermore · in addition · additionally · besides", "e": "The pay is good. Moreover, training is provided.", "v": ""}, {"t": "take into account", "p": "v phr", "e": "to consider something when making a decision", "v": ""}, {"t": "balance A against B", "p": "v phr", "e": "to compare two things when deciding", "v": ""}, {"t": "impose a burden on", "p": "v phr", "e": "to create a difficulty for someone", "v": ""}, {"t": "a viable substitute", "p": "n phr", "e": "a replacement that can work well", "v": ""}, {"t": "expand capacity", "p": "v phr", "e": "to increase how much can be produced", "v": ""}], "groups": [{"t": "③ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "______ the low cost, many residents objected to the wind farm.", "o": ["Although", "Despite", "Because", "However"], "a": 1, "e": "Theo sau là danh từ the low cost"}, {"q": "______ the cost was low, many residents objected.", "o": ["Although", "Despite", "Because of", "However"], "a": 0, "e": "Theo sau là mệnh đề the cost was low"}, {"q": "The session was cancelled ______ the storm.", "o": ["because", "because of", "although", "therefore"], "a": 1, "e": "because of + danh từ"}, {"q": "Speeds improved. ______, more households signed up.", "o": ["Although", "Despite", "Consequently", "Because"], "a": 2, "e": "Quan hệ kết quả"}, {"q": "The pay is good. ______, training is provided.", "o": ["However", "Moreover", "Although", "Because"], "a": 1, "e": "Bổ sung thông tin"}, {"q": "We label the bins ______ staff can sort waste correctly.", "o": ["so that", "despite", "although", "because of"], "a": 0, "e": "Mục đích"}]}, {"t": "Đọc hiểu", "p": "**📖 THE WIND POWER DEBATE**\n\n> Wind power has been promoted as a clean and economically viable substitute for fossil fuels. With the infrastructure in place, operational costs are substantially lower than those of coal or gas facilities.\n>\n> Nevertheless, the argument for transitioning is not entirely convincing when the implications for nearby residents are taken into account. Although turbines produce no emissions, inhabitants of coastal regions report that the low hum of the constant rotation impairs their sleep quality.\n>\n> Progress on a country's renewable targets therefore necessitates balancing each proposed initiative against the burdens imposed upon local populations. Despite these difficulties, most governments continue to expand wind capacity.", "items": [{"q": "According to the passage, wind turbines ______.", "o": ["cost more to operate than coal plants", "cost less to operate once installed", "produce more emissions than gas", "require no infrastructure"], "a": 1, "e": "operational costs are substantially lower"}, {"q": "What do coastal residents report?", "o": ["That turbines produce emissions", "That the constant hum affects their sleep", "That they receive compensation", "That they prefer coal facilities"], "a": 1, "e": "the low hum… impairs their sleep quality"}, {"q": "The word **\"Nevertheless\"** in paragraph 2 is closest in meaning to ______.", "o": ["Therefore", "However", "Moreover", "Because"], "a": 1, "e": "Nevertheless = However"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Wind power has no drawbacks.", "Most governments continue to expand wind capacity.", "All residents oppose wind farms.", "Operational costs are higher than for gas."], "a": 1, "e": "most governments continue to expand wind capacity"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **WIND POWER BRIEFING**\n>\n> Wind power has been promoted as a clean substitute for fossil fuels. **(1)______**, the argument is not entirely convincing when local impacts are considered. **(2)______** the low operational costs, residents near large facilities report disturbed sleep. **(3)______** turbines run continuously, the constant hum affects nearby households. Councils must therefore balance each initiative **(4)______** the burdens imposed on local populations. **(5)______**, public consultation is now required before approval. The policy was changed **(6)______** complaints from three coastal districts.", "items": [{"q": "Chỗ trống (1)", "o": ["Moreover", "Nevertheless", "Therefore", "Because"], "a": 1, "e": "Đảo chiều lập luận"}, {"q": "Chỗ trống (2)", "o": ["Although", "Despite", "Because", "However"], "a": 1, "e": "Theo sau là danh từ"}, {"q": "Chỗ trống (3)", "o": ["Despite", "Because of", "Because", "In spite of"], "a": 2, "e": "Theo sau là mệnh đề"}, {"q": "Chỗ trống (4)", "o": ["against", "despite", "although", "therefore"], "a": 0, "e": "🔴 Collocation cố định balance A against B"}, {"q": "Chỗ trống (5)", "o": ["However", "Because", "Consequently", "Although"], "a": 2, "e": "Kết quả của lập luận"}, {"q": "Chỗ trống (6)", "o": ["because", "because of", "although", "so that"], "a": 1, "e": "because of + danh từ"}]}]}, {"id": 34, "month": "12", "title": "So Sánh Hơn, Nhất Và So Sánh Kép", "theme": "Job advertisements", "blocks": [{"h": "① NGỮ PHÁP", "md": "Ba dạng so sánh, và một dạng đặc biệt hay ra trong quảng cáo tuyển dụng."}, {"h": "② CẤU TRÚC", "md": "### A. So sánh bằng và so sánh hơn\n\n| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Bằng | as + adj/adv + as | *Speeds are **as fast as** in the city.* |\n| Không bằng | not as/so + adj + as | *It is **not as expensive as** we feared.* |\n| Hơn (từ ngắn) | adj + **-er** + than | *cheap**er than** coal* |\n| Hơn (từ dài) | **more** + adj + than | ***more effective than** the old system* |\n| Nhất (từ ngắn) | the + adj + **-est** | *the cheap**est** option* |\n| Nhất (từ dài) | the **most** + adj | *the **most experienced** member* |\n\n**Bất quy tắc:** good → better → the best · bad → worse → the worst · far → further → the furthest · little → less → the least · many/much → more → the most\n\n### B. So sánh kép — *càng… càng…*\n\n| Công thức | Ví dụ |\n|---|---|\n| **The + so sánh hơn + S + V, the + so sánh hơn + S + V** | ***The better** your understanding of STEM, **the more likely** you are to be selected.* |\n| | ***The sooner** you register, **the better** your chance.* |\n| | ***The more** you practise, **the faster** you improve.* |\n\n### C. Cấu trúc tăng tiến\n\n| Công thức | Ví dụ |\n|---|---|\n| so sánh hơn + **and** + so sánh hơn | *Prices are getting **higher and higher**.* |\n| **more and more** + adj | ***More and more** households are recycling.* |\n\n### D. Bội số\n\n| Công thức | Ví dụ |\n|---|---|\n| **twice / three times + as + adj + as** | *Output is **twice as high as** last year.* |\n| **far / much / a lot + so sánh hơn** | ***far more** than expected* |"}], "vocab": [{"t": "up for grabs", "p": "idiom", "e": "available for anyone who wants it", "v": ""}, {"t": "hands-on experience", "p": "n phr", "e": "practical experience of doing something", "v": ""}, {"t": "in-service training", "p": "n phr", "e": "training given while you are working", "v": ""}, {"t": "a golden opportunity", "p": "n phr", "e": "a very good chance that may not come again", "v": ""}, {"t": "kick-start a career", "p": "v phr", "e": "to make a career begin quickly", "v": ""}], "groups": [{"t": "③ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The better your understanding of STEM, ______ likely you are to be selected.", "o": ["the more", "most", "more", "the most"], "a": 0, "e": "So sánh kép the better…, the more likely…"}, {"q": "She is ______ experienced member of the team.", "o": ["a more", "the more", "the most", "most"], "a": 2, "e": "So sánh nhất từ dài"}, {"q": "Wind power is ______ to operate than coal.", "o": ["cheap", "cheaper", "the cheapest", "more cheap"], "a": 1, "e": "So sánh hơn từ ngắn"}, {"q": "The sooner you register, ______ your chance of a place.", "o": ["better", "the better", "the best", "best"], "a": 1, "e": "So sánh kép"}, {"q": "Output this year is ______ as high as last year.", "o": ["two times", "twice", "double", "twofold"], "a": 1, "e": "twice as high as"}, {"q": "______ households are choosing solar panels.", "o": ["More and more", "The more", "Most and most", "More than more"], "a": 0, "e": "more and more = ngày càng nhiều"}]}, {"t": "Đọc hiểu", "p": "**📖 SUMMER PART-TIME JOBS**\n\n> Techworld Magazine is delighted to announce two IT assistant vacancies up for grabs this summer. The better your understanding of STEM, the more likely you are to be selected.\n>\n> Successful applicants will get plenty of hands-on experience, good pay, and access to the local STEM community. Additionally, we offer flexible working hours and remote options for those living far away. Neither position requires previous experience, as new recruits are provided with in-service training.\n>\n> Applications should be submitted by 30 June. Never before has there been such a golden opportunity to kick-start your career in STEM. The sooner you apply, the better your chances.", "items": [{"q": "According to the advertisement, applicants with a better understanding of STEM ______.", "o": ["will be paid more", "are more likely to be selected", "must have previous experience", "will work longer hours"], "a": 1, "e": "the more likely you are to be selected"}, {"q": "What is offered to those living far away?", "o": ["Free accommodation", "Flexible hours and remote options", "A higher salary", "Transport costs"], "a": 1, "e": "flexible working hours and remote options"}, {"q": "The phrase **\"up for grabs\"** is closest in meaning to ______.", "o": ["difficult to obtain", "available to be taken", "already filled", "under review"], "a": 1, "e": "up for grabs = sẵn để giành lấy"}, {"q": "Which of the following is TRUE according to the advertisement?", "o": ["Previous experience is required.", "Training is provided to new recruits.", "Applications close in July.", "Only local candidates may apply."], "a": 1, "e": "new recruits are provided with in-service training"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **GRADUATE SCHEME — APPLY NOW**\n>\n> Two positions are up for grabs this autumn. The **(1)______** your record, the **(2)______** likely you are to be shortlisted. This is **(3)______** competitive scheme we have ever run. Successful applicants receive **(4)______** training than in previous years. **(5)______** graduates are applying each year, so the **(6)______** you submit your form, the better.", "items": [{"q": "Chỗ trống (1)", "o": ["good", "better", "best", "the best"], "a": 1, "e": "So sánh kép, vế đầu"}, {"q": "Chỗ trống (2)", "o": ["more", "the more", "most", "the most"], "a": 0, "e": "So sánh kép, vế sau"}, {"q": "Chỗ trống (3)", "o": ["a more", "the more", "the most", "most"], "a": 2, "e": "So sánh nhất"}, {"q": "Chỗ trống (4)", "o": ["much", "more", "the most", "many"], "a": 1, "e": "So sánh hơn với than"}, {"q": "Chỗ trống (5)", "o": ["More and more", "The more", "Most and most", "Much and much"], "a": 0, "e": "More and more"}, {"q": "Chỗ trống (6)", "o": ["sooner", "the sooner", "soonest", "the soonest"], "a": 1, "e": "So sánh kép rút gọn"}]}]}, {"id": 35, "month": "12", "title": "Cấu Trúc Câu: Đơn, Ghép Và Phức", "theme": "Reading long sentences", "blocks": [{"h": "Mở đầu", "md": "> **Buổi kỹ năng.** Mục tiêu: bóc được một câu dài 40–50 từ thành mệnh đề chính và mệnh đề phụ. Đây là kỹ năng quyết định khi vào bài đọc tháng 1."}, {"h": "① NGỮ PHÁP", "md": "| Loại câu | Cấu tạo | Ví dụ |\n|---|---|---|\n| **Câu đơn** | 1 mệnh đề độc lập | *The council approved the plan.* |\n| **Câu ghép** | 2 mệnh đề độc lập nối bằng `and, but, or, so, yet` | *The council approved the plan, **but** residents objected.* |\n| **Câu phức** | 1 mệnh đề chính + 1 mệnh đề phụ | ***Although** residents objected*, the council approved the plan. |\n| **Câu phức hợp** | Ghép + phức | *Although residents objected, the council approved the plan, **and** work began in May.* |"}, {"h": "② CÁCH SỬ DỤNG — BA BƯỚC BÓC CÂU DÀI", "md": "**Bước 1 — Tìm động từ chia.** Mỗi mệnh đề có đúng một động từ chia. Đếm động từ chia = đếm mệnh đề.\n\n**Bước 2 — Tìm từ nối đầu mỗi mệnh đề phụ:**\n`although · because · when · while · if · that · which · who · after · before · since · unless`\n\n**Bước 3 — Xoá tạm mọi mệnh đề phụ.** Phần còn lại chính là **mệnh đề chính** — ý cốt lõi của câu."}, {"h": "③ VÍ DỤ — bóc một câu dài", "md": "> *Although the council, **which** owned no part of the site, had been warned repeatedly, work began without a full survey, **and** the problems **that** followed cost the district almost forty billion dong.*\n\n| Bước | Kết quả |\n|---|---|\n| Động từ chia | owned · had been warned · began · followed · cost → **5 mệnh đề** |\n| Từ nối | Although · which · and · that |\n| Xoá mệnh đề phụ | ~~Although…warned~~ · ~~which owned no part of the site~~ · ~~that followed~~ |\n| **Mệnh đề chính còn lại** | ***work began without a full survey, and the problems cost the district almost forty billion dong.*** |\n\n→ Ý cốt lõi: **công việc bắt đầu mà không khảo sát, và hậu quả tốn 40 tỉ đồng.**"}], "vocab": [{"t": "Câu đơn", "p": "1 mệnh đề độc lập", "e": "The council approved the plan.", "v": ""}, {"t": "Câu phức", "p": "1 mệnh đề chính + 1 mệnh đề phụ", "e": "Although residents objected, the council approved the plan.", "v": ""}, {"t": "main clause", "p": "n phr", "e": "the part of a sentence that can stand alone", "v": ""}, {"t": "subordinate clause", "p": "n phr", "e": "a clause that depends on the main clause", "v": ""}, {"t": "linking word", "p": "n phr", "e": "a word that joins ideas together", "v": ""}, {"t": "hold in mind", "p": "v phr", "e": "to keep something in your memory while thinking", "v": ""}, {"t": "central claim", "p": "n phr", "e": "the most important point a writer makes", "v": ""}], "groups": [{"t": "Đọc hiểu", "p": "**📖 WHY LONG SENTENCES ARE NOT THE PROBLEM**\n\n> Students often say that the sentences in examination texts are too long. In fact, length itself is rarely the difficulty; what causes trouble is the number of ideas packed into one sentence.\n>\n> A sentence that contains three clauses, each introduced by a different linking word, demands that the reader hold several ideas in mind at once. Readers who have learned to separate the main clause from the rest, however, find that even a fifty-word sentence becomes manageable.\n>\n> The technique, which takes only a few weeks to learn, is simple: find the verbs, mark the linking words, and remove the subordinate clauses. What remains is the writer's central claim.", "items": [{"q": "According to the passage, what causes difficulty?", "o": ["The length of sentences", "The number of ideas in one sentence", "Unfamiliar vocabulary", "The speed of reading"], "a": 1, "e": "what causes trouble is the number of ideas packed into one sentence"}, {"q": "What do readers who separate the main clause find?", "o": ["That long sentences become manageable", "That reading takes longer", "That linking words are unnecessary", "That they must read twice"], "a": 0, "e": "find that even a fifty-word sentence becomes manageable"}, {"q": "The word **\"which\"** in paragraph 3 refers to ______.", "o": ["the main clause", "the technique", "the claim", "the sentence"], "a": 1, "e": "which trỏ về The technique"}, {"q": "According to the passage, what remains after removing subordinate clauses?", "o": ["The linking words", "The verbs", "The writer's central claim", "The vocabulary"], "a": 2, "e": "What remains is the writer's central claim"}]}]}, {"id": 36, "month": "12", "title": "Quy Trình 4 Bước Giải Bài Điền Từ", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng hợp.** Hệ thống hoá mọi thứ đã học thành một quy trình cố định cho **12 câu, 3,0 điểm**."}, {"h": "① NGỮ PHÁP", "md": "Dạng điền từ có 12 câu chia thành 2 bài leaflet hoặc quảng cáo. Mọi câu hỏi đều rơi vào **một trong bốn loại**."}, {"h": "② QUY TRÌNH 4 BƯỚC", "md": "**Bước 1 — Đọc lướt toàn bài 30 giây.** Chỉ để biết: văn bản nói về cái gì, và **thời gian chủ đạo** (đã xảy ra / đang xảy ra / sắp xảy ra). Không dừng ở chỗ trống.\n\n**Bước 2 — Nhìn 4 phương án để phân loại câu hỏi:**\n\n| 4 phương án trông như thế nào | Đang hỏi gì | Kỹ thuật |\n|---|---|---|\n| Cùng gốc, khác đuôi (-tion/-ive/-ly) | **Từ loại** | Buổi 19 |\n| Các dạng của cùng một động từ | **Thì & thể** | Buổi 14–15 |\n| Cùng từ loại, nghĩa gần nhau | **Collocation** | Buổi 28, 32 |\n| 4 từ nối khác nhau | **Liên kết ý** | Buổi 33 |\n\n**Bước 3 — Giải theo kỹ thuật tương ứng:**\n\n```\nTỪ LOẠI      → nhìn từ đứng ngay TRƯỚC chỗ trống\nTHÌ & THỂ    → (a) chủ động hay bị động? (b) thì nào?\nCOLLOCATION  → từ nào đi được với từ bên cạnh?\nLIÊN KẾT Ý   → quan hệ giữa hai câu là gì?\n```\n\n**Bước 4 — Đọc lại cả câu** với đáp án đã chọn. Nghe trúc trắc thì chọn lại."}, {"h": "③ LUYỆN PHÂN LOẠI", "md": "*Chỉ ghi loại câu hỏi, chưa cần giải.*\n\n| # | 4 phương án | Loại |\n|---|---|---|"}, {"h": "④ LUYỆN GIẢI — 6 câu trong ngữ cảnh", "md": "**1.** The company values ______ above all else.\n\n**2.** New signs ______ at every exit next month.\n\n**3.** The campaign aims to ______ awareness of pollution.\n\n**4.** Costs rose sharply. ______, the scheme was scaled back.\n\n**5.** Your ______ in the survey is much appreciated.\n\n**6.** Volunteers will ______ part in the clean-up."}, {"h": "⑤ BÀI D3 ĐẦY ĐỦ — 6 câu", "md": "> **COMMUNITY GARDEN PROJECT**\n>\n> The Neighbourhood Association is pleased to announce the launch of our community garden. If every household **(7)______** part, the project will transform the site within a year. Raised beds **(8)______** along the north wall next spring. Our aim is to raise **(9)______** of urban food growing among younger residents. **(10)______** the limited space, we expect to supply fifty families with fresh vegetables. Tools and seeds **(11)______** free of charge to all members. Your **(12)______** is what makes this project possible."}], "vocab": [], "groups": [{"t": "③ LUYỆN PHÂN LOẠI", "p": "", "items": [{"q": "Câu 1", "o": ["safe", "safety", "safely", "safest | |"], "a": 1, "e": "Sau động từ values, cần tân ngữ → danh từ"}, {"q": "Câu 2", "o": ["install", "installed", "will be installed", "installing | |"], "a": 2, "e": "Signs được lắp + next month"}, {"q": "Câu 3", "o": ["raise", "lift", "rise", "grow | |"], "a": 0, "e": "raise awareness"}, {"q": "Câu 4", "o": ["However", "Therefore", "Moreover", "Although | |"], "a": 1, "e": "Quan hệ nguyên nhân–kết quả"}, {"q": "Câu 5", "o": ["participate", "participation", "participating", "participated | |"], "a": 1, "e": "Sau Your → danh từ"}, {"q": "Câu 6", "o": ["take", "make", "do", "give | |"], "a": 0, "e": "take part"}]}, {"t": "④ LUYỆN GIẢI — 6 câu trong ngữ cảnh", "p": "", "items": [{"q": "The company values ______ above all else.", "o": ["safe", "safety", "safely", "safest"], "a": 1, "e": "Điều kiện 1; every household số ít"}, {"q": "New signs ______ at every exit next month.", "o": ["install", "installed", "will be installed", "installing"], "a": 2, "e": "Luống được xây + next spring"}, {"q": "The campaign aims to ______ awareness of pollution.", "o": ["raise", "lift", "rise", "grow"], "a": 1, "e": "raise awareness"}, {"q": "Costs rose sharply. ______, the scheme was scaled back.", "o": ["However", "Therefore", "Moreover", "Although"],
