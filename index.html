 take **(8)______** must register by 20 February. Desks **(9)______** through the online booking system during the trial. **(10)______** the scheme proves successful, it will be extended to all departments. Since 2024, three similar trials **(11)______** at our regional offices. We aim to **(12)______** a healthier work-life balance for everyone.", "items": [{"q": "Chỗ trống (1)", "o": ["launch", "launches", "is launched", "launching"], "a": 1, "e": "Phòng HR tự tổ chức; số ít"}, {"q": "Chỗ trống (2)", "o": ["place", "part", "role", "share"], "a": 1, "e": "take part"}, {"q": "Chỗ trống (3)", "o": ["must book", "booked", "must be booked", "must been booked"], "a": 2, "e": "Bàn được đặt → must be booked"}, {"q": "Chỗ trống (4)", "o": ["Despite", "Unless", "If", "However"], "a": 2, "e": "Điều kiện loại 1"}, {"q": "Chỗ trống (5)", "o": ["run", "ran", "have been run", "are running"], "a": 2, "e": "Since 2024 + các đợt được chạy"}, {"q": "Chỗ trống (6)", "o": ["produce", "provide", "promote", "protect"], "a": 2, "e": "promote a balance"}]}, {"t": "📝 BÀI 3 — SCHOOL NOTICE", "p": "> **DIGITAL SKILLS WORKSHOP**\n>\n> The ICT Department is delighted to announce a free workshop series **(13)______** next term. If every class **(14)______** one representative, all year groups will be covered. Laptops **(15)______** to participants on the first day. **(16)______** the short duration, the course covers a considerable **(17)______** of material. Please **(18)______** in the registration form before 15 March.", "items": [{"q": "Chỗ trống (1)", "o": ["start", "starts", "starting", "started"], "a": 2, "e": "Rút gọn mệnh đề chủ động → V-ing"}, {"q": "Chỗ trống (2)", "o": ["send", "sends", "sent", "will send"], "a": 1, "e": "Điều kiện 1; every class số ít"}, {"q": "Chỗ trống (3)", "o": ["issue", "issued", "will be issued", "issuing"], "a": 2, "e": "Laptop được phát"}, {"q": "Chỗ trống (4)", "o": ["Although", "Despite", "Because", "Therefore"], "a": 1, "e": "Theo sau là danh từ"}, {"q": "Chỗ trống (5)", "o": ["number", "amount", "many", "few"], "a": 1, "e": "material không đếm được"}, {"q": "Chỗ trống (6)", "o": ["fill", "take", "get", "set"], "a": 0, "e": "fill in a form"}]}]}, {"id": 38, "month": "12", "title": "Luyện Dạng Điền Từ: Advertisement", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi luyện.** Quảng cáo khác thông báo ở ba điểm: nhiều tính từ mạnh, hay dùng đảo ngữ, hay dùng so sánh kép."}, {"h": "📌 NHẮC LẠI — ba cấu trúc riêng của quảng cáo", "md": "| Cấu trúc | Ví dụ |\n|---|---|\n| **So sánh kép** | *The **better** your understanding, the **more** likely you are to be selected.* |\n| **Đảo ngữ với Never before** | ***Never before has** there **been** such an opportunity.* |\n| **such a(n) + adj + N** | *such **a golden** opportunity* |\n| **so + adj + that** | *so effective **that** it was extended* |"}], "vocab": [], "groups": [{"t": "📝 BÀI 1 — JOB ADVERTISEMENT", "p": "> **SUMMER PART-TIME JOBS FOR UNDERGRADUATES**\n>\n> Techworld Magazine is delighted to announce two IT assistant vacancies up for **(1)______** this summer. The better your understanding of STEM, **(2)______** likely you are to be selected. Successful applicants will get plenty of hands-on experience and access to the local STEM community. **(3)______**, we offer flexible working hours and remote options. **(4)______** position requires previous experience, as new recruits are provided with in-service training. Applications **(5)______** be submitted by 30 June. Never before has there been such a(n) **(6)______** opportunity to kick-start your career.", "items": [{"q": "Chỗ trống (1)", "o": ["grabs", "grips", "gift", "grasp"], "a": 3, "e": "🔴 up for grabs — idiom cố định"}, {"q": "Chỗ trống (2)", "o": ["the more", "most", "more", "the most"], "a": 0, "e": "So sánh kép"}, {"q": "Chỗ trống (3)", "o": ["Subsequently", "Consequently", "Additionally", "Finally"], "a": 2, "e": "Bổ sung thông tin"}, {"q": "Chỗ trống (4)", "o": ["None", "Both", "Either", "Neither"], "a": 3, "e": "🔴 Neither position requires — không vị trí nào yêu cầu, vì có đào tạo"}, {"q": "Chỗ trống (5)", "o": ["should", "ought", "ought not", "should not"], "a": 0, "e": "Yêu cầu → should"}, {"q": "Chỗ trống (6)", "o": ["golden", "private", "active", "lively"], "a": 0, "e": "a golden opportunity"}]}, {"t": "📝 BÀI 2 — COURSE ADVERTISEMENT", "p": "> **EVENING COURSE: DATA FOR BEGINNERS**\n>\n> City Learning Centre is pleased to offer an eight-week evening course **(7)______** this winter. The course **(8)______** by an experienced instructor since 2021. Each participant **(9)______** a printed workbook on the first day. **(10)______** the introductory level, the syllabus covers a considerable amount of practical work. Materials **(11)______** at the moment, so minor changes are possible. The sooner you register, **(12)______** your chance of securing a place.", "items": [{"q": "Chỗ trống (1)", "o": ["start", "starts", "starting", "started"], "a": 2, "e": "Rút gọn mệnh đề chủ động"}, {"q": "Chỗ trống (2)", "o": ["teaches", "taught", "has been taught", "had taught"], "a": 2, "e": "since 2021 + khoá được dạy → HTHT bị động"}, {"q": "Chỗ trống (3)", "o": ["receive", "receives", "are received", "received"], "a": 1, "e": "Each participant số ít, chủ động"}, {"q": "Chỗ trống (4)", "o": ["Although", "Despite", "Because", "However"], "a": 1, "e": "Theo sau là danh từ"}, {"q": "Chỗ trống (5)", "o": ["update", "updates", "are being updated", "updated"], "a": 2, "e": "at the moment + bị động"}, {"q": "Chỗ trống (6)", "o": ["the better", "better", "the best", "best"], "a": 0, "e": "So sánh kép"}]}, {"t": "📝 BÀI 3 — VOLUNTEER ADVERTISEMENT", "p": "> **WEEKEND VOLUNTEER PROGRAMME**\n>\n> Green City Foundation **(13)______** ten volunteer places for this autumn. Volunteers will **(14)______** part in river clean-ups and tree planting. All participants **(15)______** a safety briefing before starting. **(16)______**, transport costs are fully covered. Since 2022, over 500 people **(17)______** in our programmes. The programme has proved so effective **(18)______** two neighbouring districts have requested guidance.", "items": [{"q": "Chỗ trống (1)", "o": ["announce", "announces", "is announced", "announcing"], "a": 1, "e": "Tổ chức tự công bố; số ít"}, {"q": "Chỗ trống (2)", "o": ["make", "take", "do", "give"], "a": 1, "e": "take part in"}, {"q": "Chỗ trống (3)", "o": ["must give", "given", "must be given", "must been given"], "a": 2, "e": "Người tham gia được nghe briefing"}, {"q": "Chỗ trống (4)", "o": ["Addition", "Additional", "Additionally", "Add"], "a": 2, "e": "Đầu câu + dấu phẩy"}, {"q": "Chỗ trống (5)", "o": ["participate", "participated", "have participated", "had participated"], "a": 2, "e": "Since 2022 → HTHT"}, {"q": "Chỗ trống (6)", "o": ["that", "than", "as", "which"], "a": 0, "e": "so + adj + that"}]}]}, {"id": 39, "month": "12", "title": "Dạng Sắp Xếp: Hội Thoại", "theme": "Dịch vụ khách hàng", "blocks": [{"h": "Mở đầu", "md": "> **Dạng sắp xếp — 5 câu, 1,25 điểm.** Không cần hiểu hết từ vựng, chỉ cần nhận ra tín hiệu liên kết."}, {"h": "① NGỮ PHÁP", "md": "Đề cho 3–5 câu xáo trộn, yêu cầu sắp xếp thành hội thoại mạch lạc."}, {"h": "② QUY TRÌNH 4 BƯỚC", "md": "**Bước 1 — Tìm câu MỞ.** Dấu hiệu: lời chào, nêu vấn đề, `I'd like to…`, `Excuse me`, `Good morning`, `I'm calling about…`. Câu mở **không bao giờ** chứa `it`, `that`, `they` trỏ ngược.\n\n**Bước 2 — Tìm câu KẾT.** Dấu hiệu: cảm ơn, chốt phương án — `Thanks for your help`, `That would be fine`, `Great, I'll…`.\n\n**Bước 3 — Nối cặp hỏi–đáp.** Câu hỏi luôn đi liền câu trả lời.\n\n**Bước 4 — Kiểm tra đại từ.** Đại từ (`it`, `that`, `they`) phải có danh từ tương ứng ở câu **trước** nó."}, {"h": "③ BẢNG TÍN HIỆU", "md": "| Vị trí | Tín hiệu ngôn ngữ |\n|---|---|\n| **Mở đầu** | Excuse me · Good morning · I'd like to · I'm calling about · Could I |\n| **Hỏi thêm** | Could you tell me · What exactly · May I have |\n| **Cung cấp thông tin** | It + V · Here it is · Yes, it's… |\n| **Đề xuất** | In that case · We can offer · Would you like |\n| **Chấp nhận / kết** | That would be fine · Thanks for your help · Great, I'll… |\n\n📌 **Thứ tự gần như cố định trong hội thoại dịch vụ:**\n`Khách nêu vấn đề → Nhân viên xin lỗi/hỏi thêm → Khách cung cấp chi tiết → Nhân viên đề xuất giải pháp → Khách chấp nhận`"}, {"h": "④ VÍ DỤ GIẢI MẪU", "md": "> a. Customer: It stopped charging after only two weeks.\n> b. Staff: In that case, we can offer a replacement or a full refund.\n> c. Customer: I'd like to report a problem with the headphones I bought here.\n> d. Staff: I'm sorry to hear that. Could you tell me exactly what went wrong?\n> e. Customer: A replacement would be fine, thank you.\n\n| Bước | Kết luận |\n|---|---|\n| 1 | Câu mở = **c** (`I'd like to report`, không có đại từ trỏ ngược) |\n| 2 | Câu kết = **e** (`would be fine, thank you`) |\n| 3 | Cặp hỏi–đáp = **d → a** (hỏi \"what went wrong\" → đáp \"It stopped charging\") |\n| 4 | `In that case` ở **b** phải đứng sau thông tin ở **a** |\n\n→ **c – d – a – b – e**"}], "vocab": [], "groups": [{"t": "🔹 Bài 3 — Dạng đề thật", "p": "", "items": [{"q": "c. Student: Excuse me, could you tell me how to borrow books from the reserve section?", "o": ["c – b – a", "a – c – b", "b – c – a", "c – a – b"], "a": 0, "e": "Mở = c (Excuse me) · Kết = a (Thank you) · b trả lời c"}, {"q": "d. HR: Successful candidates begin on 1 October.", "o": ["c – b – a – d", "b – c – d – a", "c – a – b – d", "a – c – b – d"], "a": 0, "e": "c nêu yêu cầu → b trả lời → a phản hồi và hỏi tiếp → d trả lời"}, {"q": "e. Support: Thank you. Could you describe the problem?", "o": ["d – e – a – b – c", "a – d – e – b – c", "d – a – e – b – c", "e – d – a – c – b"], "a": 0, "e": "Mở = d (I'm calling about + địa chỉ) → e hỏi → a đáp (It trỏ về broadband) → b đề xuất → c chấp nhận"}, {"q": "d. Customer: Medium, please.", "o": ["b – c – a – d", "b – a – d – c", "a – b – c – d", "c – b – a – d"], "a": 1, "e": "b hỏi màu → a hỏi size → d trả lời size → c thông báo hết màu xanh"}]}]}, {"id": 40, "month": "12", "title": "Dạng Sắp Xếp: Thư Và Đoạn Văn", "theme": "Thư trang trọng", "blocks": [{"h": "① NGỮ PHÁP", "md": "Hai dạng còn lại của phần sắp xếp: **thư/email trang trọng** và **đoạn văn kể việc**. Khác hội thoại ở chỗ không có lượt lời — phải dựa vào **trình tự thông tin**."}, {"h": "② CÁCH SỬ DỤNG", "md": "### A. THƯ TRANG TRỌNG — trình tự gần như cố định\n\n| Thứ tự | Nội dung | Tín hiệu |\n|---|---|---|\n| 1 | **Thông báo chính** | We are pleased/delighted to inform you that… |\n| 2 | **Chi tiết cốt lõi** | The programme will begin on… / A payment of… |\n| 3 | **Điều kiện, lưu ý** | All sessions will be held… / The funding is intended for… |\n| 4 | **Yêu cầu hành động** | Please confirm… / To confirm your acceptance, sign… |\n| 5 | **Hậu quả nếu không làm** | Failure to respond will result in… / Places are limited… |\n\n🔑 Câu **\"Failure to…\"** hoặc **\"Unconfirmed… will be offered to…\"** gần như **luôn đứng cuối**.\n\n### B. ĐOẠN VĂN — theo mạch thời gian và logic\n\n| Thứ tự | Nội dung | Tín hiệu |\n|---|---|---|\n| 1 | **Bối cảnh, vấn đề** | For years… · Traditionally… *(quá khứ hoàn thành)* |\n| 2 | **Hành động giải quyết** | Consequently… · The council committed to… |\n| 3 | **Chi tiết thực hiện** | To minimise disruption… · In order to… |\n| 4 | **Kết quả** | Initial results were… · Within three months… |\n| 5 | **Hệ quả mở rộng** | Encouraged by… · Neighbouring counties have requested… |"}, {"h": "③ BA CÂU HỎI KIỂM TRA", "md": "1. **Câu nào không có đại từ trỏ ngược?** → ứng viên câu đầu.\n2. **Câu nào chứa `this / these / such / the + danh từ đã nhắc`?** → phải đứng sau câu chứa danh từ gốc.\n3. **Câu nào chứa từ nối kết quả** (`Consequently`, `Encouraged by these results`)? → phải đứng sau nguyên nhân."}, {"h": "④ VÍ DỤ GIẢI MẪU", "md": "> a. The programme will begin on 15 October and runs for six weeks.\n> b. Please confirm your attendance by replying before 30 September.\n> c. We are pleased to inform you that your application has been accepted.\n> d. Places are limited, and unconfirmed seats will be offered to the waiting list.\n> e. All sessions will be held online, so a stable connection is required.\n\n| Vị trí | Câu | Lý do |\n|---|---|---|\n| 1 | **c** | Thông báo chính, không đại từ trỏ ngược |\n| 2 | **a** | Chi tiết cốt lõi: ngày bắt đầu |\n| 3 | **e** | Điều kiện; `All sessions` trỏ về programme ở a |\n| 4 | **b** | Yêu cầu hành động |\n| 5 | **d** | Hậu quả nếu không làm → luôn cuối |\n\n→ **c – a – e – b – d**"}], "vocab": [], "groups": [{"t": "🔹 Bài 3 — Dạng đề thật", "p": "", "items": [{"q": "e. The funding is intended to support your fieldwork and must not be used for equipment.", "o": ["c – b – e – d – a", "c – a – b – e – d", "c – e – a – d – b", "c – a – e – d – b"], "a": 3, "e": "c thông báo → a chi tiết tiền → e điều kiện (The funding trỏ về payment) → d yêu cầu ký → b hậu quả (luôn cuối)"}, {"q": "e. Encouraged by the villagers' satisfaction, neighbouring counties have requested guidance.", "o": ["a – e – d – b – c", "b – c – d – a – e", "b – d – c – a – e", "e – b – a – c – d"], "a": 1, "e": "b bối cảnh → c giải pháp → d chi tiết thi công → a kết quả → e hệ quả mở rộng"}, {"q": "e. Please note that the centre cannot provide parking.", "o": ["c – b – e – a – d", "c – a – b – d – e", "b – c – a – e – d", "c – e – b – a – d"], "a": 0, "e": "c thông báo → b chi tiết lịch → e lưu ý → a yêu cầu đóng tiền → d hậu quả"}]}]}, {"id": 41, "month": "12", "title": "Dạng Điền Mệnh Đề", "theme": "Văn bản học thuật", "blocks": [{"h": "Mở đầu", "md": "> **Dạng khó nhất của đề — 5 câu, 1,25 điểm.** Bốn phương án thường gần giống nhau về từ ngữ, chỉ khác ở cấu trúc."}, {"h": "① NGỮ PHÁP", "md": "Đề cho một đoạn văn với 5 chỗ trống, mỗi chỗ điền **một mệnh đề hoặc câu hoàn chỉnh**."}, {"h": "② BỐN KIỂU PHƯƠNG ÁN NHIỄU", "md": "| Kiểu nhiễu | Dấu hiệu | Cách loại |\n|---|---|---|\n| **1. Sai chủ thể logic** | Đảo người thực hiện và người chịu tác động | Hỏi: *ai đang làm việc này?* |\n| **2. Sai trật tự từ** | Các từ đúng nhưng xếp lộn xộn | Đọc to — nghe trúc trắc là loại |\n| **3. Sai bị động** | Chủ động/bị động ngược | Hỏi: *chủ ngữ tự làm được không?* |\n| **4. Sai từ nối** | Dùng `Likewise` khi cần `However` | Xác định quan hệ ý trước |"}, {"h": "③ QUY TRÌNH 3 BƯỚC", "md": "**Bước 1 — Đọc câu TRƯỚC và câu SAU chỗ trống.** Xác định quan hệ ý: tiếp nối · đối lập · giải thích · kết luận.\n\n**Bước 2 — Tìm chủ ngữ logic.** Nếu chỗ trống nối với mệnh đề phân từ (`On spotting…`, `Having done…`), chủ ngữ của chỗ trống **phải là người thực hiện** hành động đó.\n\n**Bước 3 — Loại theo bốn kiểu nhiễu.**\n\n### 📌 Bốn quan hệ diễn ngôn hay gặp\n\n| Quan hệ | Tín hiệu ở phương án |\n|---|---|\n| **Đối lập** | However · By contrast · Yet · Nevertheless |\n| **Bổ sung cùng chiều** | Likewise · Similarly · Moreover |\n| **Tóm ý, chốt** | That is… · This is why… · Hence… |\n| **Cụ thể hoá** | For instance · In practice · In reality |"}, {"h": "④ VÍ DỤ GIẢI MẪU — trích đề thật", "md": "> *On spotting a Ferrari driving around, **(1)______**.*\n\n| Phương án | Đánh giá |\n|---|---|\n| **A. you might assume that the owner of the car must be rich** | ✅ Người nhìn (you) thực hiện việc assume → chủ động, đúng chủ thể |\n| B. people might assume you must be the rich owner of the car | ❌ Sai chủ thể — biến \"bạn\" thành chủ xe |\n| C. the car might be assumed to be owned by a rich person | ❌ Sai chủ thể — chủ ngữ của `On spotting` phải là người |\n| D. you might be assumed to be the rich owner of the car | ❌ Sai bị động — \"bạn **bị** cho là chủ xe\" |"}], "vocab": [{"t": "1. Sai chủ thể logic", "p": "Đảo người thực hiện và người chịu tác động", "e": "Hỏi: ai đang làm việc này?", "v": ""}, {"t": "3. Sai bị động", "p": "Chủ động/bị động ngược", "e": "Hỏi: chủ ngữ tự làm được không?", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Chọn và giải thích bằng một câu", "p": "> *On spotting a Ferrari driving around, **(1)______**.*", "items": [{"q": "Having reviewed the applications, ______.", "o": ["the committee selected six candidates", "six candidates were selected by the committee", "the applications were found suitable", "selecting six candidates the committee was"], "a": 0, "e": "Chủ ngữ của Having reviewed phải là người xét duyệt = the committee, và phải chủ động"}, {"q": "______. It is more than a question of wording.", "o": ["we should be careful to distinguish cost from price", "cost and price should be careful to distinguish", "distinguishing cost from price should be careful", "to be careful is distinguishing cost from price"], "a": 0, "e": "be careful to V; các phương án khác biến khái niệm thành chủ thể \"cẩn thận\""}]}, {"t": "🔹 Bài 3 — Bài D1 đầy đủ 5 câu", "p": "> **THE COST OF CONVENIENCE**\n>\n> Convenience has quietly reshaped how cities live. On ordering a meal through an app, **(3)______**. In reality, however, the labour has not disappeared; it has merely been moved out of sight. **(4)______**.\n>\n> We judge the value of a service by the time it saves **(5)______**. Couriers, warehouse staff and drivers absorb the effort that customers no longer notice. **(6)______**.\n>\n> Hence, we should be careful **(7)______**. It is more than a matter of economics; ignoring the difference distorts every calculation of cost.", "items": [{"q": "Chỗ trống (1)", "o": ["you might assume that the work has been eliminated", "the work might be assumed to be eliminated by you", "people might assume you have eliminated the work", "you might be assumed to have eliminated the work"], "a": 0, "e": "Chủ ngữ của On ordering = người đặt món, chủ động. B, C, D đảo sai chủ thể"}, {"q": "Chỗ trống (2)", "o": ["That is all the app really shows you", "All that the app shows is really you", "What the app shows is all really you", "The app is all that really shows you"], "a": 0, "e": "Trật tự chuẩn That is all + N + really shows you"}, {"q": "Chỗ trống (3)", "o": ["rather than by the labour it transfers", "because the labour it transfers is hidden", "unless the labour it transfers is counted", "other than transferring the labour we save"], "a": 0, "e": "Quan hệ đối lập: đánh giá bằng thời gian tiết kiệm thay vì bằng lao động bị chuyển đi"}, {"q": "Chỗ trống (4)", "o": ["Their time, by contrast, is bought cheaply and counted rarely", "By contrast, their time is bought cheaply by counting rarely", "Likewise, counting their time is bought cheaply and rarely", "However, it is rarely counted that their time buys cheaply"], "a": 0, "e": "by contrast + chủ động đúng logic; C dùng Likewise sai quan hệ"}, {"q": "Chỗ trống (5)", "o": ["saving time and shifting time distinguish themselves", "to distinguish between saving time and shifting time", "saving time is distinguishing itself from shifting time", "for saving time to be distinguished from shifting time"], "a": 1, "e": "be careful to V"}]}]}, {"id": 42, "month": "1", "title": "Quy Trình Đọc: Tóm Ý Từng Đoạn", "theme": "", "blocks": [{"h": "① VẤN ĐỀ CẦN SỬA", "md": "Cách đọc phổ biến là **nhặt từ khoá**: tìm từ trong câu hỏi rồi quét tìm từ đó trong bài.\n\nCách này làm được dạng câu hỏi chi tiết, nhưng **sai toàn bộ** dạng ý chính, suy luận và tiêu đề — tức là mất khoảng 6 trong 18 câu."}, {"h": "② QUY TRÌNH ĐỌC CHUẨN — 4 BƯỚC", "md": "**Bước 1** — Đọc toàn bài một lượt, **không xem câu hỏi**.\n**Bước 2** — Sau mỗi đoạn, **viết một câu tiếng Việt ra lề** tóm ý đoạn đó. Không quá 10 từ.\n**Bước 3** — Bây giờ mới xem câu hỏi.\n**Bước 4** — Với câu hỏi ý chính, suy luận, tiêu đề → **nhìn vào các câu tóm ý**, không đọc lại bài.\n\n📌 **Câu chủ đề thường ở đầu hoặc cuối đoạn.** Câu ở giữa thường là ví dụ minh hoạ."}, {"h": "③ KIỂM TRA CHẤT LƯỢNG TÓM Ý", "md": "Đọc bốn câu tóm ý liền nhau phải thành **một mạch lập luận có nghĩa**. Nếu rời rạc → tóm sai, phải đọc lại."}, {"h": "④ VÍ DỤ MẪU", "md": "| Đoạn | Tóm ý mẫu |\n|---|---|\n| 1 | Tiện lợi định hình đời sống đô thị, ít ai xét tác động |\n| 2 | Tiện lợi không xoá bỏ lao động, chỉ chuyển sang người khác |\n| 3 | Kỹ năng ít dùng thì mai một, kể cả sự kiên nhẫn |\n| 4 | Không nên bỏ tiện lợi; vấn đề là dùng thời gian tiết kiệm vào đâu |\n\n→ Đọc liền bốn câu: mạch rõ ràng. Với chuỗi này, câu hỏi tiêu đề và ý chính giải được **không cần đọc lại bài**."}], "vocab": [{"t": "exceed a limit", "p": "v phr", "e": "to go beyond an allowed level", "v": ""}, {"t": "be linked to", "p": "v phr", "e": "to be connected with something", "v": ""}, {"t": "grow used to", "p": "v phr", "e": "to become familiar with something", "v": ""}, {"t": "leave a trace", "p": "v phr", "e": "to leave a sign that something happened", "v": ""}, {"t": "be underfunded", "p": "adj phr", "e": "not given enough money", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Giờ mới trả lời, dùng chính các câu tóm ý", "p": "**📖 THE PRICE OF STILLNESS**\n\n> Cities have long treated silence as a luxury rather than a necessity. Planning rules limit noise at night, yet daytime levels in most districts exceed what health authorities consider safe.\n>\n> Research now links chronic noise exposure to raised blood pressure, disturbed sleep and reduced concentration in schoolchildren. The effects appear even where residents report having grown used to the sound.\n>\n> Remedies exist. Low-noise road surfaces, traffic calming and green barriers each reduce exposure measurably, and none requires new technology. What they require is money and political attention.\n>\n> The difficulty is that noise leaves no visible trace. A polluted river can be photographed; a noisy street cannot. Problems that cannot be seen are consistently underfunded, and this one is no exception.", "items": [{"q": "Which best summarises paragraph 2?", "o": ["Residents eventually adapt to constant noise.", "Noise exposure harms health even when people stop noticing it.", "Schoolchildren are the only group seriously affected.", "Blood pressure is the main risk of urban noise."], "a": 1, "e": "Khớp tóm ý đoạn 2. A chỉ là chi tiết phụ; C, D thu hẹp sai"}, {"q": "What is the writer's main point in paragraph 4?", "o": ["Noise pollution is harder to photograph than water pollution.", "Invisible problems tend not to receive funding.", "Rivers are more polluted than streets.", "Political attention is never given to cities."], "a": 1, "e": "Khớp tóm ý đoạn 4. 🔴 A là ví dụ minh hoạ, không phải luận điểm"}, {"q": "According to paragraph 3, the remedies ______.", "o": ["require new technology", "are impossible to measure", "need money and political attention", "have never been tested"], "a": 2, "e": "What they require is money and political attention"}, {"q": "Which would be the best title for the passage?", "o": ["Silence: An Unaffordable Luxury", "Noise: The Pollution Nobody Sees", "How to Build Quieter Roads", "Health Risks of Modern Cities"], "a": 1, "e": "Bao quát cả bốn đoạn. A chỉ đúng đoạn 1, C chỉ đoạn 3, D quá rộng"}]}]}, {"id": 43, "month": "1", "title": "Đoán Nghĩa Từ Trong Ngữ Cảnh", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi quan trọng nhất tháng.** Không ai biết hết từ trong bài đọc, kể cả người bản ngữ. Kỹ năng thật sự là **đoán đủ chính xác để trả lời câu hỏi**."}, {"h": "① NĂM MANH MỐI", "md": "| Manh mối | Dấu hiệu | Ví dụ |\n|---|---|---|\n| **1. Tiền tố / hậu tố** | un- · in- · dis- · re- · over- · under- · mis- | *un**employ**ment* = không + việc làm |\n| **2. Từ nối đối lập** | but · however · yet · rather than · far from | *not X **but** Y* → Y trái nghĩa X |\n| **3. Dấu giải thích** | dấu hai chấm · dấu phẩy · dấu gạch ngang | *erode: navigation, cooking, patience* |\n| **4. Ví dụ đi kèm** | such as · for instance · including | |\n| **5. Quan hệ nhân quả** | because · so · as a result · therefore | |"}, {"h": "② BẢNG TIỀN TỐ HAY RA", "md": "| Tiền tố | Nghĩa | Ví dụ |\n|---|---|---|\n| un- / in- / im- / ir- / dis- | phủ định | unreliable · inefficient · impossible · irrecoverable · disregard |\n| re- | lại | reuse · rebuild · reassess |\n| over- / under- | quá / thiếu | overestimate · underfunded |\n| mis- | sai | misleading · misinterpret |\n| pre- / post- | trước / sau | preserve · postpone |"}, {"h": "③ QUY TRÌNH 3 BƯỚC", "md": "**Bước 1** — Đừng dừng lại ngay. Đọc hết câu chứa từ lạ, rồi đọc thêm câu sau.\n**Bước 2** — Xác định từ đó **tích cực hay tiêu cực** trước. Nhiều khi chỉ cần biết đến thế là đủ chọn đáp án.\n**Bước 3** — Tìm một trong năm manh mối."}, {"h": "④ VÍ DỤ MẪU", "md": "| Từ | Câu chứa | Manh mối | Đoán ra |\n|---|---|---|---|\n| **relinquished** | *the net gain relinquished because the resources are no longer available* | nhân quả | từ bỏ, mất đi |\n| **erode** | *Skills seldom practised tend to erode: navigation, cooking, even patience* | dấu hai chấm | mai một |\n| **indolent** | *Hard-working typists can summarise, while indolent writers can drift* | đối lập với `hard-working` | lười biếng |\n| **dispensed with** | *the effort once required has been dispensed with almost entirely* | \"once required\" + \"entirely\" | loại bỏ |"}], "vocab": [{"t": "1. Tiền tố / hậu tố", "p": "un- · in- · dis- · re- · over- · under- · mis-", "e": "unemployment = không + việc làm", "v": ""}, {"t": "3. Dấu giải thích", "p": "dấu hai chấm · dấu phẩy · dấu gạch ngang", "e": "erode: navigation, cooking, patience", "v": ""}, {"t": "relinquished", "p": "the net gain relinquished because the resources are no longer available", "e": "nhân quả", "v": "từ bỏ, mất đi"}, {"t": "erode", "p": "Skills seldom practised tend to erode: navigation, cooking, even patience", "e": "dấu hai chấm", "v": "mai một"}, {"t": "indolent", "p": "Hard-working typists can summarise, while indolent writers can drift", "e": "đối lập với hard-working", "v": "lười biếng"}, {"t": "dispensed with", "p": "the effort once required has been dispensed with almost entirely", "e": "\"once required\" + \"entirely\"", "v": "loại bỏ"}, {"t": "be presented as", "p": "v phr", "e": "to be shown or described as something", "v": ""}, {"t": "spoil a batch", "p": "v phr", "e": "to ruin a whole group of items", "v": ""}, {"t": "end up in", "p": "phr v", "e": "to finally be in a particular place", "v": ""}, {"t": "matter more than", "p": "v phr", "e": "to be more important than", "v": ""}, {"t": "degrade", "p": "v", "e": "to become lower in quality", "v": ""}], "groups": [{"t": "📖 THE LIMITS OF RECYCLING", "p": "**📖 THE LIMITS OF RECYCLING**\n\n> Recycling has long been presented as the answer to waste, yet its record is more **equivocal** than campaigns suggest. Plastics degrade with each cycle, so most are **downcycled** into lower-grade products rather than remade as new.\n>\n> The problem is **compounded** by contamination: a single greasy container can spoil an entire batch. Sorting facilities are therefore **inundated** with material they cannot process, and much of it ends up in landfill after all.\n>\n> None of this makes recycling **futile**. It does, however, suggest that reducing consumption matters more than carefully sorting what we have already bought.", "items": [{"q": "**13. equivocal** ≈", "o": ["clear", "ambiguous", "excellent", "recent"], "a": 1, "e": "yet…more ___ than campaigns suggest → trái với thông điệp tích cực"}, {"q": "**14. downcycled** ≈", "o": ["turned into lower-quality products", "recycled twice", "destroyed", "exported"], "a": 0, "e": "rather than remade as new + lower-grade products"}, {"q": "**15. compounded** ≈", "o": ["solved", "explained", "made worse", "measured"], "a": 2, "e": "The problem is ___ by contamination → vấn đề nặng thêm"}, {"q": "**16. inundated** ≈", "o": ["short of", "overwhelmed with", "paid for", "cleaned with"], "a": 1, "e": "with material they cannot process → quá tải"}, {"q": "**17. futile** ≈", "o": ["pointless", "expensive", "essential", "popular"], "a": 0, "e": "None of this makes recycling ___ + It does, however, suggest"}]}]}, {"id": 44, "month": "1", "title": "Dạng 1: Closest In Meaning", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *The word **X** in paragraph N is closest in meaning to ______.*\n\nĐề **không** hỏi nghĩa từ điển — đề hỏi **nghĩa trong ngữ cảnh cụ thể này**."}, {"h": "② QUY TRÌNH 4 BƯỚC", "md": "**Bước 1** — Che bốn phương án. Đọc lại câu chứa từ đó và câu trước, câu sau.\n**Bước 2** — **Tự nghĩ ra một từ thay thế** — tiếng Anh hay tiếng Việt đều được.\n**Bước 3** — Mở phương án, chọn cái gần nhất với từ mình nghĩ ra.\n**Bước 4** — **Thay ngược vào câu, đọc lại.** Nếu nghĩa câu đổi → chọn lại.\n\n⚠️ **Bẫy cố định:** phương án đúng theo từ điển nhưng **sai trong ngữ cảnh này**. Luôn làm bước 4.\n\n> 🎯 **Đây là lúc Sổ từ vựng phát huy tác dụng.** Cột nghĩa ghi bằng **định nghĩa tiếng Anh** — chính là dạng phương án mà đề đưa ra."}, {"h": "③ BẢNG TỪ HỌC THUẬT HAY ĐƯỢC HỎI", "md": "| Từ | Nghĩa trong đề | Hay bị nhầm với |\n|---|---|---|\n| **relinquish** | từ bỏ, nhường lại | *fill up · make up* |\n| **dispense with** | loại bỏ, không cần đến | *put off · take over* |\n| **instrumental** | then chốt, quan trọng | *specific · trivial* |\n| **mediocre** | tầm thường | *terrible · outstanding* |\n| **cherished** | được trân trọng | *expensive · old* |\n| **erode** | mai một, xói mòn | *shift · vanish* |\n| **substitute** | vật thay thế | *addition · copy* |\n| **sacrifice** | sự hy sinh, đánh đổi | *loss · gift* |\n| **tolerate** | chịu đựng | *enjoy · allow* |\n| **overlook** | bỏ sót, xem nhẹ | *watch · supervise* |"}, {"h": "④ VÍ DỤ MẪU", "md": "*the net gain **relinquished** because the resources are no longer available*\n- Bước 2: tự nghĩ → \"bị mất đi\", \"phải từ bỏ\"\n- Bước 4: thay vào → *the net gain given up* → nghĩa giữ nguyên ✅"}], "vocab": [{"t": "relinquish", "p": "từ bỏ, nhường lại", "e": "fill up · make up", "v": ""}, {"t": "instrumental", "p": "then chốt, quan trọng", "e": "specific · trivial", "v": ""}, {"t": "cherished", "p": "được trân trọng", "e": "expensive · old", "v": ""}, {"t": "substitute", "p": "vật thay thế", "e": "addition · copy", "v": ""}, {"t": "tolerate", "p": "chịu đựng", "e": "enjoy · allow", "v": ""}, {"t": "bear a cost", "p": "v phr", "e": "to pay or suffer a cost", "v": ""}, {"t": "not without foundation", "p": "adj phr", "e": "having some truth in it", "v": ""}, {"t": "relocate", "p": "v", "e": "to move to a different place", "v": ""}, {"t": "livelihood", "p": "n", "e": "the way someone earns money to live", "v": ""}, {"t": "by historical standards", "p": "prep phr", "e": "compared with the past", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Giờ chọn phương án", "p": "", "items": [{"q": "Câu 1", "o": ["sped up", "gradually removed", "repaired", "sold"], "a": 1, "e": "over three years → dần dần"}, {"q": "Câu 2", "o": ["trivial", "specific", "central", "dramatic"], "a": 2, "e": "proved ___ to success → then chốt"}, {"q": "Câu 3", "o": ["outstanding", "average", "dishonest", "wealthy"], "a": 1, "e": "only ___ successes → chỉ ở mức trung bình"}, {"q": "Câu 4", "o": ["enjoy", "prevent", "put up with", "measure"], "a": 2, "e": "must ___ constant noise"}, {"q": "Câu 5", "o": ["supervise", "fail to notice", "watch closely", "calculate"], "a": 1, "e": "frequently ___ hidden costs"}]}, {"t": "📖 THE TRUE PRICE OF CHEAP CLOTHING", "p": "**📖 THE TRUE PRICE OF CHEAP CLOTHING**\n\n> Fast fashion has made clothing **abundant** and, by historical standards, remarkably cheap. What the price tag **conceals**, however, is a chain of costs borne elsewhere: water drawn from stressed rivers, dyes released untreated, and garment workers whose wages remain **stagnant** despite rising output.\n>\n> Defenders argue that the industry has **lifted** millions out of rural poverty, and the claim is not without foundation. Factory work, however hard, often pays more than farming.\n>\n> Yet the improvement is **precarious**. Factories relocate the moment wages rise, leaving communities with neither the old livelihood nor the new one. Whether cheap clothing is worth this price is a question the price tag cannot answer.", "items": [{"q": "**6. abundant** ≈", "o": ["scarce", "plentiful", "expensive", "fashionable"], "a": 1, "e": "and…remarkably cheap → nhiều và rẻ đi cùng nhau"}, {"q": "**7. conceals** ≈", "o": ["reveals", "hides", "raises", "explains"], "a": 1, "e": "What the price tag ___, however, is a chain of costs"}, {"q": "**8. stagnant** ≈", "o": ["rising steadily", "not increasing", "falling sharply", "unfairly taxed"], "a": 1, "e": "remain ___ despite rising output"}, {"q": "**9. lifted** ≈", "o": ["carried", "raised out of", "pushed into", "counted"], "a": 1, "e": "___ millions out of rural poverty"}, {"q": "**10. precarious** ≈", "o": ["secure", "unstable", "permanent", "recent"], "a": 1, "e": "Yet the improvement is ___ + factories relocate the moment wages rise"}]}]}, {"id": 45, "month": "1", "title": "Dạng 2: Opposite In Meaning", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *The word **X** in paragraph N is **OPPOSITE** in meaning to ______.*\n\nChữ OPPOSITE luôn được **in hoa** trong đề — nhưng học sinh vẫn thường đọc lướt qua và chọn từ **đồng nghĩa**."}, {"h": "② QUY TRÌNH 4 BƯỚC", "md": "**Bước 1** — **Khoanh tròn chữ OPPOSITE ngay khi nhìn thấy.** Thao tác cơ học này cứu được một câu mỗi đề.\n**Bước 2** — Xác định nghĩa từ gốc.\n**Bước 3** — **Loại ngay phương án đồng nghĩa** — đề luôn cài ít nhất một cái làm bẫy.\n**Bước 4** — Chọn phương án trái nghĩa."}, {"h": "③ BẢNG CẶP TRÁI NGHĨA HAY RA", "md": "| Từ | Đồng nghĩa (bẫy) | **Trái nghĩa (đáp án)** |\n|---|---|---|\n| erode | weaken, wear away | **strengthen, build up** |\n| indolent | lazy, idle | **active, diligent** |\n| instrumental | central, key | **trivial, insignificant** |\n| abundant | plentiful | **scarce** |\n| mandatory | compulsory | **optional, voluntary** |\n| deteriorate | worsen | **improve** |\n| conceal | hide | **reveal, disclose** |\n| accelerate | speed up | **slow down** |\n| temporary | short-term | **permanent** |\n| explicit | clear, direct | **implicit, vague** |\n| superfluous | unnecessary | **essential** |\n| pronounced | marked, clear | **slight** |"}, {"h": "④ VÍ DỤ MẪU", "md": "*Hard-working typists can summarise, while **indolent** writers can drift.*\n> *The word **indolent** is **OPPOSITE** in meaning to ______.*\n\n→ `indolent` = lười. Bẫy là **C (lazy)** — đồng nghĩa. Đáp án là **A (active)**."}], "vocab": [{"t": "be regarded as", "p": "v phr", "e": "to be considered to be something", "v": ""}, {"t": "land value", "p": "n phr", "e": "how much a piece of land is worth", "v": ""}, {"t": "be least likely to", "p": "v phr", "e": "to have the smallest chance of doing something", "v": ""}, {"t": "write into law", "p": "v phr", "e": "to make something an official rule", "v": ""}, {"t": "budget negotiations", "p": "n phr", "e": "discussions about how to spend money", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Chỉ ra phương án BẪY, rồi chọn đáp án", "p": "", "items": [{"q": "**erode** OPPOSITE:", "o": ["weaken", "strengthen", "vanish", "shift"], "a": 1, "e": "B"}, {"q": "**scarce** OPPOSITE:", "o": ["rare", "plentiful", "costly", "hidden"], "a": 1, "e": "B"}, {"q": "**accelerate** OPPOSITE:", "o": ["hasten", "slow", "repeat", "measure"], "a": 1, "e": "B"}, {"q": "**explicit** OPPOSITE:", "o": ["clear", "vague", "written", "formal"], "a": 1, "e": "B"}, {"q": "**reluctant** OPPOSITE:", "o": ["unwilling", "eager", "tired", "quiet"], "a": 1, "e": "B"}]}, {"t": "📖 URBAN GREEN SPACE", "p": "**📖 URBAN GREEN SPACE**\n\n> Parks were once regarded as **superfluous** ornament in city planning, funded when budgets allowed and cut when they did not. That view has **receded**. Studies now show that access to green space is linked to lower stress, and the benefits are most **pronounced** among low-income residents, who are least likely to have gardens of their own.\n>\n> The obstacle is land value. In dense districts, any **vacant** plot attracts developers within weeks, and councils rarely have the funds to compete. Those that wish to create parks must therefore act with **haste**, often buying land years before they can afford to develop it.\n>\n> Several cities have begun to write green space into planning law, which removes the question from annual budget negotiations altogether.", "items": [{"q": "**11. superfluous** OPPOSITE:", "o": ["unnecessary", "essential", "decorative", "expensive"], "a": 1, "e": "superfluous = thừa thãi → trái là thiết yếu. Bẫy: A"}, {"q": "**12. receded** OPPOSITE:", "o": ["withdrawn", "advanced", "changed", "remained"], "a": 1, "e": "recede = lùi lại → trái là tiến lên. Bẫy: A"}, {"q": "**13. pronounced** OPPOSITE:", "o": ["marked", "slight", "clear", "measured"], "a": 1, "e": "pronounced = rõ rệt → trái là nhẹ. Bẫy: A, C"}, {"q": "**14. vacant** OPPOSITE:", "o": ["empty", "occupied", "green", "private"], "a": 1, "e": "vacant = trống → trái là có người chiếm. Bẫy: A"}, {"q": "**15. haste** OPPOSITE:", "o": ["speed", "delay", "caution", "planning"], "a": 1, "e": "haste = vội vã → trái là chậm trễ. Bẫy: A"}]}]}, {"id": 46, "month": "1", "title": "Dạng 3: Tham Chiếu Đại Từ", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *The word **they / those / this / it** in paragraph N refers to ______.*\n\nĐại từ luôn trỏ về một danh từ đã xuất hiện **trước đó**, thường trong cùng câu hoặc câu liền trước."}, {"h": "② QUY TRÌNH 3 BƯỚC", "md": "**Bước 1** — Quay lại vị trí đại từ **trong bài** (đừng chỉ đọc câu hỏi).\n**Bước 2** — Đọc lùi về trước, tìm danh từ gần nhất **khớp về SỐ** (ít / nhiều).\n**Bước 3** — **Thay danh từ đó vào vị trí đại từ**, đọc lại câu. Câu có nghĩa → đúng.\n\n📌 **Khớp số là manh mối mạnh nhất:**\n\n| Đại từ | Trỏ về |\n|---|---|\n| it · this · that | danh từ **số ít**, hoặc cả một ý |\n| they · them · these · those | danh từ **số nhiều** |\n| **those** + mệnh đề | nhóm người/vật đã nêu, lặp lại để tránh lặp từ |"}, {"h": "③ BA TRƯỜNG HỢP ĐẶC BIỆT", "md": "| Trường hợp | Ví dụ | Trỏ về |\n|---|---|---|\n| **those + V-ing / mệnh đề** | *students taking notes by hand outperformed **those** using laptops* | students |\n| **this / that + cả câu trước** | *Speeds improved. **This** encouraged others.* | cả việc tốc độ cải thiện |\n| **it** giả chủ ngữ | ***It** is said that…* | không trỏ về gì |"}, {"h": "④ VÍ DỤ MẪU", "md": "*students taking notes by hand consistently outperformed **those** using laptops*\n→ Thay vào: *outperformed **students** using laptops* ✅"}], "vocab": [{"t": "those + V-ing / mệnh đề", "p": "students taking notes by hand outperformed those using laptops", "e": "students", "v": ""}, {"t": "dismiss as", "p": "phr v", "e": "to refuse to consider something seriously", "v": ""}, {"t": "a fall in trade", "p": "n phr", "e": "a drop in the amount of business done", "v": ""}, {"t": "secure support", "p": "v phr", "e": "to obtain agreement or help from people", "v": ""}, {"t": "prove decisive", "p": "v phr", "e": "to turn out to be the deciding factor", "v": ""}, {"t": "congestion", "p": "n", "e": "a situation in which roads are too full", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Chọn và giải thích bằng \"khớp số\"", "p": "", "items": [{"q": "*The council considered several sites but rejected **them** all.*", "o": ["the council", "the sites", "several", "all"], "a": 1, "e": "them số nhiều; hội đồng không tự từ chối chính mình"}, {"q": "*Wind turbines are cheaper to run than coal plants, though **they** are noisier.*", "o": ["coal plants", "wind turbines", "costs", "residents"], "a": 1, "e": "Vế sau nói \"ồn hơn\" — tuabin gió mới là thứ ồn"}, {"q": "*Students using laptops produced transcripts; **those** writing by hand produced understanding.*", "o": ["transcripts", "laptops", "students", "hands"], "a": 2, "e": "those thay cho students để tránh lặp"}, {"q": "*The scheme cut waste by 30%. **That** result convinced the board.*", "o": ["the scheme", "the board", "the 30% cut in waste", "the waste"], "a": 2, "e": "That result trỏ về kết quả cắt giảm 30%"}]}, {"t": "📖 THE RETURN OF THE TRAM", "p": "**📖 THE RETURN OF THE TRAM**\n\n> Several European cities have reopened tram networks that they closed in the 1960s. **They** are cheaper to operate than underground lines and carry more passengers than buses, which is why planners who once dismissed trams as obsolete now regard **them** as a practical answer to congestion.\n>\n> The main objection concerns disruption. Laying track closes streets for months, and businesses along **those** streets report sharp falls in trade. Cities that have managed the process well compensate traders during construction; **this** has proved decisive in securing local support.\n>\n> In Bordeaux, passenger numbers have risen by forty per cent since the first line reopened. Officials there say the figure would have been higher still if the second phase had not been delayed by two years.", "items": [{"q": "**10. They** (paragraph 1) refers to:", "o": ["cities", "tram networks", "underground lines", "buses"], "a": 1, "e": "Số nhiều + rẻ hơn tàu điện ngầm → mạng lưới tram"}, {"q": "**11. them** (paragraph 1) refers to:", "o": ["planners", "trams", "answers", "passengers"], "a": 1, "e": "regard ___ as a practical answer → các tuyến tram"}, {"q": "**12. those** (paragraph 2) refers to:", "o": ["businesses", "months", "streets", "cities"], "a": 2, "e": "businesses along those streets khớp với closes streets"}, {"q": "**13. this** (paragraph 2) refers to:", "o": ["the construction", "compensating traders", "local support", "the process"], "a": 1, "e": "this trỏ về việc bồi thường cho tiểu thương"}]}]}, {"id": 47, "month": "1", "title": "Dạng 4: Câu Hỏi Chi Tiết", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *According to paragraph N, ______* · *Which of the following is true according to the passage?*\n\nĐáp án **nằm trong bài**, nhưng được **diễn đạt lại** — đây là lý do người nhặt từ khoá vẫn sai."}, {"h": "② QUY TRÌNH 4 BƯỚC", "md": "**Bước 1** — Định vị đoạn được hỏi (đề luôn ghi rõ paragraph mấy).\n**Bước 2** — Đọc kỹ **đoạn đó thôi**, không đọc cả bài.\n**Bước 3** — Với mỗi phương án, tìm câu tương ứng trong đoạn. Không tìm thấy → loại.\n**Bước 4** — Kiểm tra ba kiểu sai lệch:\n\n| Kiểu sai | Dấu hiệu |\n|---|---|\n| **Nói quá** | Thêm `all`, `always`, `never`, `only` mà bài không nói |\n| **Đảo chiều** | Bài nói A gây ra B, phương án nói B gây ra A |\n| **Ghép sai** | Thông tin đúng nhưng gắn với đối tượng khác trong bài |"}, {"h": "③ BẢNG KIỂM", "md": "| Tự hỏi | Nếu \"không\" |\n|---|---|\n| Thông tin này có trong đoạn được hỏi không? | Loại |\n| Có từ tuyệt đối nào bài không nói không? | Loại |\n| Chiều nhân quả có đúng không? | Loại |\n| Có gắn đúng đối tượng không? | Loại |"}, {"h": "④ VÍ DỤ MẪU", "md": "*According to paragraph 1, the costs of environmental services are ______*\n**D. existent even in the absence of human involvement**\n\n→ Bài viết: *Environmental services, even when they arise without any human labour, are by no means cost-free.*\n→ D diễn đạt lại đúng ý. **C là đảo chiều** — bài nói \"không hề miễn phí\", C nói \"tối thiểu\"."}], "vocab": [{"t": "staff turnover", "p": "n phr", "e": "the rate at which employees leave a company", "v": ""}, {"t": "be barely represented", "p": "v phr", "e": "to be included only very slightly", "v": ""}, {"t": "risk a backlash", "p": "v phr", "e": "to be in danger of a strong negative reaction", "v": ""}, {"t": "be best placed to", "p": "adj phr", "e": "to be in the best position to do something", "v": ""}, {"t": "sector-specific", "p": "adj", "e": "relating to only one part of the economy", "v": ""}], "groups": [{"t": "📖 THE FOUR-DAY WEEK", "p": "**📖 THE FOUR-DAY WEEK**\n\n> Trials of a four-day working week have now been run in more than a dozen countries. In the largest, conducted across 61 British companies, 92% chose to continue the arrangement after the pilot ended. Revenue over the trial period rose slightly, and staff turnover fell by more than half.\n>\n> The results, however, are less straightforward than the headlines suggest. Participating companies volunteered, which means they were probably those best placed to succeed. Most were in knowledge-based sectors where output is measured by projects completed rather than hours present. Manufacturing and healthcare, where staffing levels must match shift patterns, were barely represented.\n>\n> Supporters respond that even a partial reform is worthwhile, and that evidence from one sector is better than none. Critics counter that presenting sector-specific findings as general evidence risks a backlash when the model fails elsewhere.", "items": [{"q": "According to paragraph 1, the British trial found that ______.", "o": ["all participating companies continued the arrangement", "revenue increased slightly during the trial", "staff turnover rose by half", "61 countries took part"], "a": 1, "e": "Revenue… rose slightly. A nói quá (92% ≠ all), C đảo chiều, D ghép sai (61 companies)"}, {"q": "According to paragraph 2, the results should be treated cautiously because ______.", "o": ["the companies were selected at random", "participating companies chose to take part themselves", "revenue data was not collected", "manufacturing firms dominated the sample"], "a": 1, "e": "Participating companies volunteered → mẫu không đại diện"}, {"q": "What does the passage say about healthcare and manufacturing?", "o": ["They reported the best results.", "They were hardly included in the trials.", "They rejected the four-day week.", "They measure output by projects completed."], "a": 1, "e": "were barely represented. D ghép sai — đó là đặc điểm ngành tri thức"}, {"q": "According to paragraph 3, supporters argue that ______.", "o": ["the reform should be abandoned", "partial evidence is better than none", "all sectors have been tested", "critics are entirely wrong"], "a": 1, "e": "evidence from one sector is better than none"}, {"q": "What do critics warn about?", "o": ["A backlash if the model fails in other sectors", "A fall in revenue", "An increase in staff turnover", "The cost of running trials"], "a": 0, "e": "risks a backlash when the model fails elsewhere"}, {"q": "Which of the following is true according to the passage?", "o": ["The four-day week has been proven effective in all sectors.", "Staff turnover fell by more than half in the British trial.", "Supporters believe the reform should be abandoned.", "Manufacturing was well represented in the trials."], "a": 1, "e": "staff turnover fell by more than half"}]}]}, {"id": 48, "month": "1", "title": "Dạng 5: Not / Except", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *Which of the following is **NOT** mentioned…?* · *All of the following are… **EXCEPT** ______*\n\nĐây là dạng **ngược**: ba phương án **đúng**, một phương án **sai**. Phải tìm cái sai."}, {"h": "② QUY TRÌNH 3 BƯỚC", "md": "**Bước 1** — **Khoanh tròn chữ NOT hoặc EXCEPT.**\n**Bước 2** — Kiểm tra **từng phương án**, đánh dấu ✓ nếu tìm thấy trong bài.\n**Bước 3** — Phương án duy nhất không có dấu ✓ là đáp án.\n\n⚠️ **Đừng chọn theo cảm tính \"cái nào nghe sai nhất\".** Dạng này mất thời gian nhưng gần như chắc ăn nếu làm đủ bốn lượt đối chiếu."}, {"h": "③ BẢNG ĐỐI CHIẾU *(vẽ ra nháp)*", "md": "| Phương án | Có trong bài? | Dòng nào |\n|---|---|---|\n| A | ✓ / ✗ | |\n| B | ✓ / ✗ | |\n| C | ✓ / ✗ | |\n| D | ✓ / ✗ | |"}, {"h": "④ VÍ DỤ MẪU", "md": "*Which of the following is **NOT** implied in paragraph 2?*\nBài viết về đoạn sông có thể dùng cho chèo thuyền **hoặc** thuỷ điện, không thể cả hai.\n\n| | Phương án | Đối chiếu |\n|---|---|---|\n| ✓ | A. Giá trị nội tại của sông không chỉ là phát điện | có |\n| ✓ | B. Lợi ích vô hình cũng là chi phí cơ hội của đập | có |\n| ✓ | C. Không thể khai thác một đoạn sông cho cả hai mục đích | có |\n| ✗ | **D. Áp lực lên hệ sinh thái từ giải trí và phát điện là tương đương** | **bài không nói** |\n\n→ Đáp án **D**."}], "vocab": [{"t": "cite (a reason)", "p": "v", "e": "to mention something as a reason", "v": ""}, {"t": "informal learning", "p": "n phr", "e": "learning that happens outside formal training", "v": ""}, {"t": "assess performance", "p": "v phr", "e": "to judge how well someone works", "v": ""}, {"t": "prove durable", "p": "v phr", "e": "to turn out to last a long time", "v": ""}, {"t": "an open question", "p": "n phr", "e": "something that has not been decided", "v": ""}], "groups": [{"t": "📖 REMOTE WORK, FIVE YEARS ON", "p": "**📖 REMOTE WORK, FIVE YEARS ON**\n\n> Remote work expanded rapidly after 2020 and has not returned to earlier levels. Employers report savings on office space, while employees cite reduced commuting costs and greater flexibility over working hours.\n>\n> Not all effects are positive. Junior staff in particular report weaker informal learning, since much of it once happened by overhearing colleagues. Managers also find performance harder to assess when presence is no longer visible, and several companies have introduced monitoring software, which employees widely resent.\n>\n> The current pattern is hybrid rather than fully remote. Most large employers now require two or three days in the office, a compromise that satisfies nobody completely but has proved durable. Whether it survives the next economic downturn is an open question.", "items": [{"q": "Which of the following is NOT mentioned as a benefit?", "o": ["Savings on office space", "Lower commuting costs", "More flexible hours", "Higher salaries for remote workers"], "a": 3, "e": "Bài không nhắc đến lương. A, B, C đều có"}, {"q": "According to the passage, all of the following are drawbacks EXCEPT ______.", "o": ["weaker informal learning for junior staff", "greater difficulty assessing performance", "reduced office space costs", "resentment of monitoring software"], "a": 2, "e": "Tiết kiệm chi phí văn phòng là lợi ích, không phải bất lợi"}, {"q": "Which is NOT implied about junior staff?", "o": ["They benefit less from informal learning remotely.", "They previously learned by overhearing colleagues.", "They are affected differently from senior staff.", "They prefer working from the office."], "a": 3, "e": "🔴 Bài không nói nhân viên trẻ thích làm ở văn phòng — đây là suy diễn thêm"}, {"q": "Which of the following is NOT true of the current pattern?", "o": ["It is hybrid rather than fully remote.", "Most large employers require two or three office days.", "It satisfies everyone completely.", "It has proved durable."], "a": 2, "e": "a compromise that satisfies nobody completely"}, {"q": "Which of the following is NOT mentioned in the passage?", "o": ["Monitoring software", "An economic downturn", "Government regulation of remote work", "Savings on office space"], "a": 2, "e": "Bài không nhắc đến quy định của chính phủ"}]}]}, {"id": 49, "month": "1", "title": "Dạng 6: Chèn Câu Vào Đoạn", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *Where in paragraph N does the following sentence best fit?* — với bốn vị trí **[I] [II] [III] [IV]**."}, {"h": "② BA MANH MỐI", "md": "| Manh mối | Cách dùng |\n|---|---|\n| **1. Đại từ và từ chỉ định trong câu cần chèn** | `this`, `these`, `such`, `the + N` → phải có danh từ tương ứng ở câu **ngay trước** vị trí chèn |\n| **2. Từ nối trong câu cần chèn** | `however` → trước đó là ý đối lập · `therefore` → trước đó là nguyên nhân |\n| **3. Mạch chủ đề** | Câu chèn vào giữa hai câu phải **nối liền** ý của chúng |\n\n🔑 **Cách kiểm tra chắc chắn nhất:** đọc to **ba câu liền nhau** (câu trước – câu chèn – câu sau). Nghe liền mạch → đúng."}, {"h": "③ QUY TRÌNH 3 BƯỚC", "md": "**Bước 1** — Đọc kỹ câu cần chèn, **gạch chân mọi đại từ và từ nối**.\n**Bước 2** — Thử từng vị trí, đọc ba câu liền nhau.\n**Bước 3** — Loại vị trí nào làm **đứt mạch đại từ**."}, {"h": "④ VÍ DỤ MẪU", "md": "Chèn câu: *\"**Such hidden costs** only come to light when one stops to think about the roles nature itself is quietly playing.\"*\n\n- Manh mối 1: `Such hidden costs` → trước đó **phải có** ví dụ về chi phí ẩn.\n- Đoạn liệt kê: phá rừng làm nông → mất carbon; chuyển dòng sông → mất chức năng cũ; bỏ đất hoang → mất thu nhập.\n- Vị trí đúng: **sau khi đã nêu đủ các ví dụ**, không phải giữa chừng."}], "vocab": [{"t": "exceed a waiting list", "p": "v phr", "e": "to be longer than expected", "v": ""}, {"t": "at scale", "p": "prep phr", "e": "in large amounts or numbers", "v": ""}, {"t": "meet demand", "p": "v phr", "e": "to provide enough for what people want", "v": ""}, {"t": "remain doubtful", "p": "v phr", "e": "to continue to be uncertain", "v": ""}, {"t": "a mismatch", "p": "n", "e": "a situation where two things do not fit", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Chọn vị trí chèn", "p": "> **[I]** Electric buses are quieter and produce no local emissions. **[II]** Their purchase price, however, remains roughly double that of a diesel equivalent. **[III]** Several cities have therefore leased rather than bought their fleets. **[IV]**", "items": [{"q": "This arrangement spreads the cost over a decade and transfers maintenance risk to the supplier.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 3, "e": "This arrangement trỏ về việc thuê thay vì mua ở câu [III]"}]}, {"t": "📖 THE ALLOTMENT REVIVAL", "p": "**📖 THE ALLOTMENT REVIVAL**\n\n> Urban allotments have grown rapidly in popularity since 2020. **[I]** Waiting lists in some boroughs now exceed five years, and councils report more applications than at any time since the 1940s.\n>\n> The reasons are mixed. **[II]** Food prices rose sharply in the same period, but surveys suggest that most applicants mention wellbeing before cost. Gardening, it turns out, is one of the few outdoor activities that a city can offer cheaply at scale.\n>\n> Councils have responded by converting unused verges and rooftops into growing space. **[III]** Whether this can meet demand remains doubtful. A single rooftop plot serves perhaps four households, while a waiting list may run to several hundred names. **[IV]**", "items": [{"q": "Such conversions are cheap and quick, but the plots they create are small.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 2, "e": "Such conversions trỏ về việc cải tạo lề đường và mái nhà, vừa nêu ngay trước [III]"}, {"q": "This pattern held true even among applicants on the lowest incomes.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 1, "e": "This pattern trỏ về việc phần lớn người nộp đơn nhắc wellbeing trước chi phí"}, {"q": "The scale of the mismatch has led several councils to consider limiting plot sizes instead.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 3, "e": "The scale of the mismatch trỏ về so sánh bốn hộ / vài trăm tên ngay trước [IV]"}]}]}, {"id": 50, "month": "1", "title": "Dạng 7: Paraphrase Câu Gạch Chân", "theme": "", "blocks": [{"h": "① NHẬN DIỆN DẠNG", "md": "> *Which of the following best paraphrases the underlined sentence in paragraph N?*\n\nĐáp án đúng phải giữ **đủ và đúng ba thứ**: chủ thể · quan hệ logic · mức độ."}, {"h": "② QUY TRÌNH 3 BƯỚC", "md": "**Bước 1** — Phân tích câu gốc thành ba phần:\n- Chủ thể là ai, cái gì?\n- Quan hệ logic là gì? (nguyên nhân · đối lập · so sánh · điều kiện)\n- Mức độ mạnh hay nhẹ? (`less in X than in Y` ≠ `not in X at all`)\n\n**Bước 2** — Kiểm tra từng phương án theo ba phần đó.\n\n**Bước 3** — Loại theo bốn kiểu sai:\n\n| Kiểu sai | Ví dụ |\n|---|---|\n| **Đảo chủ thể** | Bài nói A ảnh hưởng B, phương án nói B ảnh hưởng A |\n| **Đảo quan hệ** | `less X than Y` → `more X than Y` |\n| **Đổi mức độ** | `rarely` → `never` · `less` → `not at all` |\n| **Thêm thông tin** | Thêm ý bài không có |"}, {"h": "③ BẢNG PHÂN TÍCH *(vẽ ra nháp)*", "md": "| | Câu gốc | Phương án đang xét |\n|---|---|---|\n| Chủ thể | | |\n| Quan hệ | | |\n| Mức độ | | |"}, {"h": "④ VÍ DỤ MẪU", "md": "*The reason, according to the researchers, lies **less in the technology itself than in what each method asks of the brain**.*\n\n- Chủ thể: lý do khác biệt về kết quả học tập\n- Quan hệ: **so sánh** — ít nằm ở A, nhiều hơn ở B\n- Mức độ: `less… than` = **không phủ nhận hoàn toàn** A\n\n| Phương án | Đánh giá |\n|---|---|\n| **A. What explains the difference is the mental work each method demands, rather than the technology** | ✅ Giữ đúng cả ba |\n| B. The difference is attributable to modern technology **instead of** the mental work | ❌ Đảo quan hệ |\n| C. The modern device, **along with** the mental requirements, is responsible | ❌ Đổi quan hệ thành \"cả hai\" |\n| D. Regardless of the method, the effects exhibit **little difference** | ❌ Đảo hoàn toàn |"}], "vocab": [{"t": "headline measure", "p": "n phr", "e": "the main figure used to judge something", "v": ""}, {"t": "without regard to", "p": "prep phr", "e": "not considering something", "v": ""}, {"t": "be worth having", "p": "adj phr", "e": "to be valuable enough to want", "v": ""}, {"t": "assign a weighting", "p": "v phr", "e": "to decide how important each part is", "v": ""}, {"t": "shape decisions", "p": "v phr", "e": "to influence what people decide", "v": ""}], "groups": [{"t": "🔹 Bài 2 — Chọn paraphrase đúng, gọi tên kiểu sai của ba phương án còn lại", "p": "", "items": [{"q": "Câu gốc: *The failure stemmed less from a lack of funding than from poor coordination.*", "o": ["Poor coordination contributed more to the failure than insufficient funding did.", "A lack of funding was the sole cause of the failure.", "Poor coordination was caused by insufficient funding.", "Neither funding nor coordination played any role in the failure."], "a": 0, "e": "B = đổi mức độ (sole cause) · C = đảo chủ thể · D = đảo hoàn toàn"}, {"q": "Câu gốc: *Convenience does not remove labour; it relocates it.*", "o": ["Labour disappears when convenience increases.", "Convenience shifts labour elsewhere rather than eliminating it.", "Convenience creates more labour than it removes.", "Labour and convenience are unrelated concepts."], "a": 1, "e": "A = đảo quan hệ · C = thêm thông tin · D = đảo hoàn toàn"}, {"q": "Câu gốc: *Although the scheme rarely exceeded its budget, it seldom delivered on time.*", "o": ["The scheme was usually on budget but usually late.", "The scheme was always over budget and always late.", "The scheme was never over budget and always punctual.", "Budget overruns caused the delays."], "a": 0, "e": "B = đổi mức độ (always) · C = đảo quan hệ · D = thêm thông tin"}]}, {"t": "📖 MEASURING WHAT MATTERS", "p": "**📖 MEASURING WHAT MATTERS**\n\n> Governments have long used GDP as the headline measure of national progress. **The trouble is not that the figure is inaccurate, but that it counts activity without regard to whether that activity is worth having.** A traffic jam raises fuel consumption and therefore GDP; so does rebuilding after a flood.\n>\n> Alternatives exist. Well-being indices attempt to capture health, education and leisure alongside output, and several countries now publish them alongside the national accounts. **Critics of such indices argue less that the underlying idea is wrong than that the weightings assigned to each component are inevitably arbitrary.**\n>\n> The debate matters because measures shape decisions. A government judged on GDP alone has little reason to protect anything that GDP does not count.", "items": [{"q": "Which best paraphrases the first underlined sentence?", "o": ["GDP figures are frequently calculated incorrectly.", "The problem with GDP is that it measures all activity regardless of its value.", "GDP should be replaced because it is inaccurate.", "Activity that is worth having is never counted in GDP."], "a": 1, "e": "Giữ đúng: vấn đề không phải độ chính xác mà là đếm mọi hoạt động bất kể giá trị. A và C đảo ngược"}, {"q": "Which best paraphrases the second underlined sentence?", "o": ["Critics reject the whole concept of well-being indices.", "Critics object mainly to how the components are weighted, not to the concept itself.", "Critics believe the weightings are the only accurate element.", "Critics argue that well-being cannot be measured at all."], "a": 1, "e": "less that X is wrong than that Y is arbitrary → phản đối chủ yếu ở trọng số. A và D đổi mức độ thành phủ nhận toàn bộ"}]}]}, {"id": 51, "month": "1", "title": "Dạng 8: Ý Chính, Tiêu Đề Và Kỹ Thuật Loại Trừ", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi quan trọng thứ hai của tháng.** Ba câu hỏi cùng bản chất, và có **một quy tắc duy nhất** giải quyết được phần lớn."}, {"h": "① BA CÂU HỎI CÙNG BẢN CHẤT", "md": "| Câu hỏi | Phạm vi |\n|---|---|\n| *Which best summarises paragraph N?* | ý chính **một đoạn** |\n| *What can be inferred from the passage?* | suy luận từ **toàn bài** |\n| *Which would be the best title?* | bao quát **toàn bài** |\n\nCả ba đều **không có đáp án nằm nguyên trong bài** — phải tổng hợp."}, {"h": "② KỸ THUẬT LOẠI TRỪ", "md": "### 🔴 Quy tắc số 1 — Gạch bỏ phương án chứa từ tuyệt đối\n\n```\nall · always · never · no · only · every · none · entirely · must · cannot\n```\n\n**Lý do:** đề THPT trích từ báo học thuật, vốn viết giọng **trung lập, cân nhắc hai chiều**. Một phương án khẳng định tuyệt đối gần như luôn sai.\n\n### Quy tắc số 2 — Phân biệt ý chính với ví dụ\n\nPhương án lấy **đúng từ ngữ trong bài** thường là **ví dụ minh hoạ**, không phải luận điểm.\n\n### Quy tắc số 3 — Tiêu đề phải bao quát cả bài\n\nLoại phương án chỉ đúng **một đoạn**, và loại phương án **quá rộng**."}, {"h": "③ BẢNG KIỂM 4 BƯỚC", "md": "| Bước | Thao tác |\n|---|---|\n| 1 | Gạch bỏ mọi phương án có từ tuyệt đối |\n| 2 | Gạch bỏ phương án chỉ đúng **một đoạn** |\n| 3 | Gạch bỏ phương án **rộng hơn** nội dung bài |\n| 4 | Phương án còn lại — kiểm tra bằng bốn câu tóm ý (buổi 42) |"}, {"h": "④ VÍ DỤ MẪU — mổ xẻ ba câu", "md": "**Câu ý chính đoạn 4:**\n\n| | Phương án | Loại vì |\n|---|---|---|\n| ✅ | A. Convenience should be judged by the use made of the time it frees | Khớp tóm ý đoạn 4 |\n| ❌ | B. Convenience is harmful and ought to be strictly limited | Cực đoan — bài nói *\"None of this amounts to an argument for abolishing convenience\"* |\n| ❌ | C. Saving time is **always** worthwhile | Từ tuyệt đối |\n| ❌ | D. Rest and study are the **only** proper uses | Từ tuyệt đối |\n\n**Câu suy luận:** ✅ *Customers who spend saved time on extra work gain little* · ❌ *Convenience offers **no** benefit* (từ tuyệt đối + trái ý bài)\n\n**Câu tiêu đề:** ✅ *Convenience: Counting the Hidden Bill* (bao quát cả bài) · ❌ *Delivery Platforms: An Economic Miracle* (chỉ đúng 1 đoạn) · ❌ ***The End** of Everyday Skills* (cực đoan) · ❌ *Urban Life: A Race Against Time* (quá rộng)"}], "vocab": [{"t": "hold accountable", "p": "v phr", "e": "to make someone responsible for results", "v": ""}, {"t": "across the board", "p": "prep phr", "e": "affecting everyone or everything", "v": ""}, {"t": "distort behaviour", "p": "v phr", "e": "to change how people act in a bad way", "v": ""}, {"t": "carry the weight of", "p": "v phr", "e": "to be responsible for something important", "v": ""}, {"t": "narrow one's teaching", "p": "v phr", "e": "to teach fewer topics than before", "v": ""}], "groups": [{"t": "📖 THE LIMITS OF TARGETS", "p": "**📖 THE LIMITS OF TARGETS**\n\n> Performance targets were introduced to make public services accountable, and in narrow terms they have worked: waiting times fell where targets were set, and reporting improved across the board.\n>\n> The difficulty is that what gets measured gets prioritised. Hospitals meeting four-hour targets have been found to discharge patients early, shifting the problem rather than solving it. Schools judged on exam results narrow their teaching to what is examined, and subjects outside the measured set receive steadily less time.\n>\n> None of this means targets should be abandoned. It suggests instead that a target works best when paired with a measure of what it might distort, and that no single figure should carry the weight of judging a complex service alone.\n>\n> The alternative — judging services by professional opinion alone — has its own history of failure. The choice is not between measurement and no measurement, but between careless measurement and careful measurement.", "items": [{"q": "Which best summarises paragraph 2?", "o": ["Targets always cause harm to public services.", "Measuring something changes what organisations prioritise, sometimes distorting behaviour.", "Hospitals and schools are the only institutions affected by targets.", "Exam results are a poor measure of teaching quality."], "a": 1, "e": "A chứa always, C chứa only, D chỉ là ví dụ trong đoạn"}, {"q": "What can be inferred from the passage?", "o": ["Targets should be removed from all public services.", "Targets are more useful when accompanied by measures of their side effects.", "Waiting times are the only meaningful hospital measure.", "Public services cannot be held accountable."], "a": 1, "e": "Khớp câu cuối đoạn 3. A chứa all và trái ý bài, C chứa only"}, {"q": "According to paragraph 4, the alternative to measurement ______.", "o": ["has always worked well", "has its own record of failure", "is preferred by most professionals", "is impossible to implement"], "a": 1, "e": "has its own history of failure"}, {"q": "Which best summarises the writer's overall position?", "o": ["Measurement should be abandoned entirely.", "Careful measurement is better than either careless measurement or none.", "Professional opinion is the only reliable guide.", "Targets work perfectly in hospitals but not in schools."], "a": 1, "e": "The choice is not between measurement and no measurement, but between careless measurement and careful measurement"}, {"q": "Which would be the best title?", "o": ["Targets: Useful but Never Sufficient Alone", "The Complete Failure of Public Sector Targets", "How Hospitals Discharge Patients Early", "Accountability in Modern Government"], "a": 0, "e": "Bao quát cả bốn đoạn. B cực đoan, C chỉ là chi tiết, D quá rộng"}]}]}, {"id": 52, "month": "1", "title": "Trộn 8 Dạng: Bài 1", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi luyện.** Một bài đọc, đủ tám dạng câu hỏi. Làm trong 15 phút."}], "vocab": [], "groups": [{"t": "Câu hỏi", "p": "**📖 THE CITY THAT SLOWED DOWN**\n\n> In 2015, the council of a small Dutch city made an unusual decision. **[I]** It reduced the speed limit on every road inside the ring road to 30 kilometres an hour.\n>\n> Before the change, the city had recorded around forty serious accidents a year. Within three years, that figure had **plummeted** by more than half. Air quality also improved, because cars produce fewer emissions at lower speeds. **[II]**\n>\n> Not everyone was pleased. While the council was preparing the plan, local businesses argued that slower traffic would drive customers away. **[III]** In fact, shop owners have since reported that more people walk and cycle into the centre, and that sales have risen slightly. **The objection, it turned out, rested less on evidence than on an assumption about how customers arrive.**\n>\n> Several other European cities are now studying the results. **[IV]** By 2028, planners expect that at least twenty more will have introduced similar limits, though a few have ruled out the idea entirely, citing the cost of new signage.", "items": [{"q": "The word **plummeted** in paragraph 2 is closest in meaning to ______.", "o": ["risen sharply", "fallen sharply", "remained stable", "been measured"], "a": 1, "e": "plummet = rơi mạnh; by more than half xác nhận chiều giảm"}, {"q": "The word **plummeted** in paragraph 2 is OPPOSITE in meaning to ______.", "o": ["dropped", "soared", "declined", "shifted"], "a": 1, "e": "soar = tăng vọt. Bẫy: A dropped, C declined — đều đồng nghĩa"}, {"q": "The word **that** in paragraph 2 refers to ______.", "o": ["the change", "the city", "the number of serious accidents", "the ring road"], "a": 2, "e": "that figure trỏ về forty serious accidents a year"}, {"q": "According to paragraph 2, air quality improved because ______.", "o": ["fewer cars entered the city", "cars produce fewer emissions at lower speeds", "accidents fell by half", "the ring road was closed"], "a": 1, "e": "cars produce fewer emissions at lower speeds"}, {"q": "Which of the following is NOT mentioned in the passage?", "o": ["The cost of new signage", "Shop owners' reports on sales", "Government funding for the scheme", "The speed limit inside the ring road"], "a": 2, "e": "Bài không nhắc đến tài trợ của chính phủ"}, {"q": "Residents had complained for years about traffic on residential streets.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 0, "e": "Câu chèn nêu bối cảnh khiếu nại, đứng trước quyết định giảm tốc độ"}, {"q": "Which best paraphrases the underlined sentence in paragraph 3?", "o": ["The businesses' objection was based more on a belief about customer behaviour than on data.", "The businesses had strong evidence that customers would stop coming.", "Customers proved that the businesses were entirely correct.", "Businesses and customers agreed on how people travel."], "a": 0, "e": "rested less on evidence than on an assumption → dựa vào niềm tin hơn là dữ liệu"}, {"q": "Which would be the best title for the passage?", "o": ["Dutch Cities: A Model for Europe", "Slower Streets: A Change That Paid Off", "The End of the Motor Car", "How to Reduce Air Pollution"], "a": 1, "e": "Bao quát cả bài. A quá hẹp, C cực đoan, D chỉ đúng một đoạn"}]}]}, {"id": 53, "month": "1", "title": "Trộn 8 Dạng: Bài 2", "theme": "", "blocks": [], "vocab": [], "groups": [{"t": "Câu hỏi", "p": "**📖 THE QUIET COST OF NOTETAKING**\n\n> For decades, students have been convinced that academic success depends largely on meticulous notetaking. **[I]** What has changed in recent years is not the importance of the practice but the tools used to perform it. The keyboard has subtly supplanted the pen, and with it, the nature of how information is recorded during a lecture has shifted unbeknownst to students.\n>\n> Researchers in cognitive psychology have begun to examine what this change has cost learners. In a series of comparative studies, students taking notes by hand consistently outperformed **those** using laptops on questions that demanded conceptual understanding, even when both groups had access to the same material. **[II]** **The reason, according to the researchers, lies less in the technology itself than in what each method asks of the brain.** Typing rewards speed; handwriting forces selection.\n>\n> The act of writing by hand is slower, and that slowness appears to be its hidden virtue. Unable to capture every word, students are obliged to listen, decide what matters and condense ideas into their own phrasing. This continuous filtering, referred to as encoding by psychologists, turns out to be **instrumental** in aiding long-term recall. **[III]**\n>\n> It would be misleading, of course, to claim that handwriting is inherently superior or that all keyboards undermine learning. Hard-working typists can summarise, while **indolent** writers can drift. **[IV]** What the research highlights is not a conclusion about devices but a question about effort: which tool, in a given context, asks more of the learner?", "items": [{"q": "In paragraph 1, the writer is ______.", "o": ["challenging a long-held assumption about academic success", "introducing a recent change in the way students take notes", "questioning the significance of notetaking in education", "promoting the use of technology in recording lectures"], "a": 1, "e": "Đoạn 1 giới thiệu thay đổi gần đây về công cụ ghi chép"}, {"q": "The word **those** in paragraph 2 refers to ______.", "o": ["students", "researchers", "studies", "notes"], "a": 0, "e": "those thay cho students"}, {"q": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["What explains the difference in student performance is the mental work that each method of notetaking demands, rather than the technology.", "The difference in student performance is attributable to the modern technology instead of the mental work that each method requires.", "The modern device, along with the mental requirements of each method, is responsible for the difference.", "Regardless of the method, the effects on the brain exhibit little difference."], "a": 0, "e": "Giữ đúng chủ thể, quan hệ so sánh và mức độ less…than"}, {"q": "The word **instrumental** in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["specific", "trivial", "central", "dramatic"], "a": 1, "e": "instrumental = then chốt → trái là trivial. Bẫy: C central"}, {"q": "The word **indolent** in paragraph 4 is closest in meaning to ______.", "o": ["active", "serious", "lazy", "careful"], "a": 2, "e": "indolent = lười. Ở đây hỏi closest, nên chọn lazy"}, {"q": "Which of the following statements would the writer NOT agree with?", "o": ["Handwritten and typed notes led to varied degrees of conceptual understanding.", "The slow speed of writing by hand turns out to be an advantage over typing.", "Handwriting is inherently superior to typing in every situation.", "Students are largely unaware of the change in notetaking methods."], "a": 2, "e": "Bài viết rõ: It would be misleading to claim that handwriting is inherently superior"}, {"q": "One lecturer summarised the contrast after reviewing her students' work: the laptops had produced transcripts, while the notebooks had produced understanding.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 2, "e": "Câu chèn minh hoạ cho \"encoding\" vừa nêu ở đoạn 3"}, {"q": "In which paragraph does the writer warn against an overgeneralisation?", "o": ["Paragraph 1", "Paragraph 2", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Đoạn 4 mở đầu bằng It would be misleading… — cảnh báo khái quát hoá"}, {"q": "Which would be the best title for the passage?", "o": ["Laptops: The Enemy of Learning", "Notetaking: Why the Tool Changes the Thinking", "A History of the Written Word", "Cognitive Psychology Explained"], "a": 1, "e": "Bao quát: công cụ nào cũng được, vấn đề là nó đòi hỏi gì ở người học"}]}]}, {"id": 54, "month": "1", "title": "Phân Bổ Thời Gian Và Kỹ Thuật Bỏ Câu", "theme": "", "blocks": [{"h": "① PHÂN BỔ THỜI GIAN CHUẨN — phải thuộc lòng", "md": "| Phần | Số câu | Thời gian | Tốc độ |\n|---|---|---|---|\n| D1 — Điền mệnh đề | 5 | **7 phút** | 1,4 phút/câu |\n| D2 — Sắp xếp | 5 | **5 phút** | 1 phút/câu |\n| D3 — Điền từ (2 bài) | 12 | **12 phút** | 1 phút/câu |\n| **D4 — Đọc hiểu (2 bài)** | **18** | **26 phút** | **1,4 phút/câu** |\n| **Tổng** | **40** | **50 phút** | |\n\n> ⚠️ **Tổng đúng 50 phút, không có thời gian dư.** Đây là lý do kỹ năng bỏ câu là bắt buộc."}, {"h": "② KỸ THUẬT BỎ CÂU — quy tắc 90 giây", "md": "**Bước 1** — Quá **90 giây** ở một câu → đánh dấu ✗ vào lề, chọn bừa một phương án, **chuyển sang câu tiếp**.\n**Bước 2** — Làm hết bài rồi quay lại các câu đã đánh dấu.\n**Bước 3** — Nếu hết giờ, các câu đó đã có đáp án sẵn — không bị bỏ trắng.\n\n📌 **Những câu nên bỏ trước:**\n- Câu ý chính, suy luận, tiêu đề của **bài đọc thứ hai** (thường khó nhất)\n- Câu điền mệnh đề mà cả bốn phương án đều dài và giống nhau\n\n📌 **Những câu không bao giờ nên bỏ:**\n- Tham chiếu đại từ · từ vựng trong ngữ cảnh · NOT/EXCEPT\n→ Ba dạng này luôn giải được bằng quy trình, chỉ tốn thời gian chứ không cần may mắn."}, {"h": "③ THỨ TỰ LÀM BÀI ĐỀ XUẤT", "md": "| Thứ tự | Phần | Lý do |\n|---|---|---|\n| 1 | D3 — Điền từ (12 câu) | Ăn chắc nhất, làm lúc đầu óc còn tỉnh |\n| 2 | D2 — Sắp xếp (5 câu) | Nhanh, có quy trình rõ |\n| 3 | D4 — Đọc hiểu (18 câu) | Chiếm nhiều thời gian nhất |\n| 4 | D1 — Điền mệnh đề (5 câu) | Khó nhất, để cuối |"}], "vocab": [{"t": "D4 — Đọc hiểu (2 bài)", "p": "18", "e": "26 phút", "v": "1,4 phút/câu"}, {"t": "Tổng", "p": "40", "e": "50 phút", "v": ""}], "groups": []}, {"id": 55, "month": "1", "title": "Luyện Phần Đọc Đầy Đủ: 18 Câu", "theme": "", "blocks": [{"h": "Mở đầu", "md": "> **Buổi mô phỏng.** Hai bài đọc, 18 câu, bấm giờ **26 phút** — đúng như đề thật."}, {"h": "📊 BẢNG GHI KẾT QUẢ", "md": "| | Bài 1 | Bài 2 | Tổng |\n|---|---|---|---|\n| Số câu đúng | ___/10 | ___/8 | ___/18 |\n| Thời gian | ___ phút | ___ phút | ___ phút |\n\n**Ngưỡng:** ≥ 12/18 và ≤ 26 phút.\n\n---"}], "vocab": [], "groups": [{"t": "📖 BÀI 1 — ENVIRONMENTAL SERVICES *(10 câu)*", "p": "**📖 BÀI 1 — ENVIRONMENTAL SERVICES *(10 câu)***\n\n> Environmental services, even when they arise without any human labour, are by no means cost-free. Every cost should be understood in terms of opportunity cost. For environmental services, the opportunity cost amounts to the net gain **relinquished** because the resources are no longer available for their second-best application. Whenever a resource has alternative uses, it cannot legitimately be deemed free.\n>\n> For instance, a section of river might serve as a site used for either white-water canoeing or hydroelectric generation. Constructing a dam to produce electricity would flood the rapids, so this makes white-water canoeing here out of the question. The opportunity cost of preserving the river for canoeing equals the net benefit of the electricity that would otherwise have been produced. By the same token, the opportunity cost of erecting the dam involves everything the river in its natural state would have provided — leisure activities, wildlife, scenic beauty, and whatever worth future generations might attach to experiencing the rapids.\n>\n> This understanding carries considerable weight for planning development. **[I]** Numerous decisions initially appearing to be cost-free moves in favour of growth prove, when examined carefully, to be against something else. **[II]** Clearing a forest to make way for crops is hardly without cost; it is paid for through losses in carbon storage, biological diversity, and all the functions the forest once performed unnoticed. **[III]** Channelling a river for irrigation has its price — namely, whatever the river was doing before its course was altered. **[IV]**\n>\n> From this perspective, economic development can never be reduced to whether a project delivers a positive return. Rather, what must be asked is whether that return outweighs the value of sacrifices this — by pricing scarce environmental services, or obliging those in charge to consider both sides — are not against development. What **they** demand is that development should be worth its true cost. The danger lies not in counting too much, but in counting too little.", "items": [{"q": "The word **relinquished** in paragraph 1 is closest in meaning to ______.", "o": ["filled up", "given up", "made up", "ended up"], "a": 1, "e": "relinquished = từ bỏ; nhân quả because the resources are no longer available"}, {"q": "According to paragraph 1, the costs of environmental services are ______.", "o": ["included in the market value of natural resources", "determined by financial investment in natural resources", "minimal because these services are nearly labour-free", "existent even in the absence of human involvement"], "a": 3, "e": "even when they arise without any human labour, are by no means cost-free"}, {"q": "Which of the following is NOT implied in paragraph 2?", "o": ["The intrinsic value of the river is not confined to generating hydroelectricity only.", "Intangible benefits also constitute the opportunity cost of the dam construction.", "It is impossible to exploit one stretch of river for both hydroelectric generation and white-water canoeing.", "The strains on the ecosystem imposed by recreational activities and power generation are similar."], "a": 3, "e": "Bài không so sánh mức độ tác động của giải trí và phát điện lên hệ sinh thái"}, {"q": "Such hidden costs only come to light when one stops to think about the roles nature itself is quietly playing.", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 1, "e": "Such hidden costs cần các ví dụ nêu ngay trước — nhưng ví dụ tiếp tục sau [II], nên câu chèn đứng sau ví dụ đầu tiên"}, {"q": "Which of the following best summarises paragraph 3?", "o": ["Untouched and cultivated lands both produce benefits in the long term.", "Ecological preservation exerts negligible influence on economic development.", "Apparently harmless developments actually come at an underlying price.",
