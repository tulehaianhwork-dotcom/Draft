)______** down from grandmother to granddaughter. After **(5)______** by UNESCO in 2010, several local traditions received new funding. The festival **(6)______** to be the second most important of the year.", "items": [{"q": "Chỗ trống (1)", "o": ["believes", "is believed", "believed", "is believing"], "a": 1, "e": "is believed to + V"}, {"q": "Chỗ trống (2)", "o": ["It says", "It is said", "Says", "Saying"], "a": 1, "e": "It is said that…"}, {"q": "Chỗ trống (3)", "o": ["have", "has", "are having", "had"], "a": 0, "e": "families số nhiều → have + O + V3"}, {"q": "Chỗ trống (4)", "o": ["hands", "is handed", "hand", "handing"], "a": 1, "e": "Công thức được truyền lại"}, {"q": "Chỗ trống (5)", "o": ["recognising", "being recognised", "recognised", "to recognise"], "a": 1, "e": "Sau After + bị động"}, {"q": "Chỗ trống (6)", "o": ["considers", "is considered", "considering", "considered"], "a": 1, "e": "is considered to be"}]}]}, {"id": 17, "month": "11", "title": "Word Form I: Hậu Tố Danh Từ", "theme": "Green living", "blocks": [{"h": "① NGỮ PHÁP", "md": "> Trong tiếng Anh, **đuôi từ quyết định từ loại**. Nhìn đuôi là biết loại — **không cần biết nghĩa**.\n\nĐây là kỹ thuật ăn điểm không cần vốn từ, đặc biệt quan trọng khi vốn từ còn mỏng."}, {"h": "② CÁCH SỬ DỤNG", "md": "Chỗ trống cần **danh từ** khi đứng sau:\n\n| Vị trí | Ví dụ |\n|---|---|\n| Mạo từ `a / an / the` | *the **installation** of new bins* |\n| Tính từ sở hữu `my / your / his / their` | *Your **cooperation** is essential.* |\n| Sở hữu cách `students'` | *students' **knowledge** of pollution* |\n| Tính từ | *public **awareness*** · *primary **goal*** |\n| Giới từ `of / in / for / with / about` | *a lack **of evidence*** |\n| Làm chủ ngữ của câu | ***Registration** is recommended.* |"}, {"h": "③ CẤU TRÚC — BẢNG HẬU TỐ DANH TỪ", "md": "| Hậu tố | Ví dụ | Ghi chú |\n|---|---|---|\n| **-tion / -sion** | pollution · decision · cooperation · installation | phổ biến nhất |\n| **-ment** | development · equipment · government · improvement | từ động từ |\n| **-ness** | awareness · happiness · weakness · illness | từ tính từ |\n| **-ity / -ty** | ability · safety · responsibility · community | từ tính từ |\n| **-ance / -ence** | importance · difference · performance · confidence | |\n| **-er / -or / -ist** | employer · supervisor · scientist | chỉ **người làm** |\n| **-ee** | employee · trainee · interviewee | chỉ **người chịu tác động** |\n| **-ship / -hood** | leadership · membership · childhood | trạng thái |\n| **-al** | proposal · arrival · refusal · approval | ⚠️ cũng là đuôi tính từ — xem vị trí |"}], "vocab": [{"t": "-tion / -sion", "p": "pollution · decision · cooperation · installation", "e": "phổ biến nhất", "v": ""}, {"t": "-ness", "p": "awareness · happiness · weakness · illness", "e": "từ tính từ", "v": ""}, {"t": "-ee", "p": "employee · trainee · interviewee", "e": "chỉ người chịu tác động", "v": ""}, {"t": "raise awareness of", "p": "v phr", "e": "to make people know about a problem", "v": ""}, {"t": "a lack of", "p": "n phr", "e": "a situation in which there is not enough of something", "v": ""}, {"t": "an increase in", "p": "n phr", "e": "a rise in the amount or number of something", "v": ""}, {"t": "the impact on", "p": "n phr", "e": "the effect that something has on a situation", "v": ""}, {"t": "reduce waste", "p": "v phr", "e": "to produce less rubbish", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Your ______ at the meeting is highly appreciated.", "o": ["attend", "attendance", "attentive", "attentively"], "a": 1, "e": "Sau Your → danh từ"}, {"q": "We need to raise public ______ of the issue.", "o": ["aware", "awareness", "awarely", "awaring"], "a": 1, "e": "Sau tính từ public → danh từ"}, {"q": "There is a clear ______ between the two proposals.", "o": ["differ", "different", "difference", "differently"], "a": 2, "e": "Sau a clear → danh từ"}, {"q": "All ______ must wear identification badges.", "o": ["employ", "employment", "employees", "employable"], "a": 2, "e": "Chủ ngữ + must wear → phải là người"}, {"q": "Effective ______ is the key to the project's success.", "o": ["lead", "leader", "leadership", "leading"], "a": 2, "e": "Sau Effective; leader là người, không hợp nghĩa"}, {"q": "The ______ of this equipment requires a specialist.", "o": ["install", "installed", "installation", "installing"], "a": 2, "e": "Sau The → danh từ"}]}, {"t": "Đọc hiểu", "p": "**📖 SMALL CHANGES, BIG RESULTS**\n\n> The improvement of air quality in our district did not come from one big decision. It came from a collection of small ones.\n>\n> First, the council raised public awareness of the problem through a simple leaflet. Then the installation of twenty new bins made recycling easier, and the introduction of a free bicycle scheme reduced short car journeys.\n>\n> The difference after two years is measurable. Pollution levels have fallen by eighteen per cent. According to one environmental scientist, the success of the programme lies in its simplicity: no expensive equipment was needed, only the cooperation of ordinary residents.", "items": [{"q": "According to the passage, the improvement came from ______.", "o": ["one major decision", "a number of small changes", "expensive new equipment", "a national programme"], "a": 1, "e": "It came from a collection of small ones"}, {"q": "What did the council do first?", "o": ["Installed new bins", "Started a bicycle scheme", "Raised public awareness", "Measured pollution levels"], "a": 2, "e": "First, the council raised public awareness"}, {"q": "The word **\"It\"** in paragraph 1 refers to ______.", "o": ["the district", "the improvement", "the decision", "the council"], "a": 1, "e": "It trỏ về the improvement"}, {"q": "According to the scientist, the success of the programme comes from ______.", "o": ["its simplicity", "its cost", "its equipment", "its size"], "a": 0, "e": "the success of the programme lies in its simplicity"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **GREEN HANDS CAMPAIGN**\n>\n> The School Youth Union is launching an eco-friendly campaign. The primary goal is to expand students' **(1)______** of plastic pollution. These sessions ensure that **(2)______** are reused effectively. Your **(3)______** is essential for success. We believe that small individual **(4)______** will turn into long-lasting changes. The **(5)______** of colour-coded bins begins in May, and early **(6)______** is recommended.", "items": [{"q": "Chỗ trống (1)", "o": ["know", "knowing", "knowledge", "knowledgeable"], "a": 2, "e": "Sau sở hữu cách students'"}, {"q": "Chỗ trống (2)", "o": ["resource", "resources", "resourceful", "resourcefully"], "a": 1, "e": "Chủ ngữ + are reused → số nhiều"}, {"q": "Chỗ trống (3)", "o": ["cooperate", "cooperation", "cooperative", "cooperatively"], "a": 1, "e": "Sau Your"}, {"q": "Chỗ trống (4)", "o": ["effort", "efforts", "effortless", "effortlessly"], "a": 1, "e": "Sau small individual + will turn số nhiều"}, {"q": "Chỗ trống (5)", "o": ["install", "installed", "installation", "installing"], "a": 2, "e": "Sau The"}, {"q": "Chỗ trống (6)", "o": ["register", "registration", "registered", "registering"], "a": 1, "e": "Sau early + là chủ ngữ"}]}]}, {"id": 18, "month": "11", "title": "Word Form Ii: Tính Từ Và Trạng Từ", "theme": "Broadband and rural life", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Tính từ** bổ nghĩa cho **danh từ** — trả lời \"cái gì như thế nào?\"\n> **Trạng từ** bổ nghĩa cho **động từ, tính từ, cả câu** — trả lời \"làm như thế nào?\""}, {"h": "② CÁCH SỬ DỤNG", "md": "| Cần **TÍNH TỪ** khi | Cần **TRẠNG TỪ** khi |\n|---|---|\n| Đứng **trước danh từ**: *an **effective** way* | Bổ nghĩa **động từ thường**: *improved **significantly*** |\n| Sau `to be`: *is **essential*** | Bổ nghĩa **tính từ khác**: ***extremely** effective* |\n| Sau linking verb `seem, become, remain, look, feel`: *remained **calm*** | **Đầu câu + dấu phẩy**: ***Consequently**, …* |\n| Sau `very / quite / extremely / highly`: *highly **reliable*** | Bổ nghĩa cả câu: *The team worked **efficiently**.* |"}, {"h": "③ CẤU TRÚC — BẢNG HẬU TỐ", "md": "| Loại | Hậu tố | Ví dụ |\n|---|---|---|\n| **Tính từ** | -ful / -less | helpful · careless · effortless |\n| | -ive | effective · productive · impressive |\n| | -able / -ible | reliable · comparable · responsible |\n| | -al / -ial | environmental · essential · financial |\n| | -ous | dangerous · previous · numerous |\n| | -ing / -ed | interest**ing** (gây ra) / interest**ed** (cảm thấy) |\n| **Trạng từ** | -ly | quickly · significantly · effectively |\n\n⚠️ **Đuôi `-ly` nhưng là TÍNH TỪ:** `friendly · lovely · likely · costly · timely · elderly`\n\n⚠️ **Cặp `-ing / -ed`:**\n- **-ing** = vật/việc **gây ra** cảm giác: *The lecture was **boring**.*\n- **-ed** = người **cảm thấy**: *The audience was **bored**.*"}], "vocab": [{"t": "Tính từ", "p": "-ful / -less", "e": "helpful · careless · effortless", "v": ""}, {"t": "be comparable to", "p": "adj phr", "e": "to be similar in size or quality to something", "v": ""}, {"t": "minimise disruption", "p": "v phr", "e": "to reduce the trouble caused by a change", "v": ""}, {"t": "be satisfied with", "p": "adj phr", "e": "to be pleased with something", "v": ""}, {"t": "handle demand", "p": "v phr", "e": "to deal successfully with what people need", "v": ""}, {"t": "adopt a model", "p": "v phr", "e": "to start using a particular system", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The results were extremely ______.", "o": ["impress", "impression", "impressive", "impressively"], "a": 2, "e": "Sau were extremely → tính từ"}, {"q": "Speeds have improved ______ over the past year.", "o": ["significant", "significance", "significantly", "signify"], "a": 2, "e": "Bổ nghĩa động từ have improved"}, {"q": "This is an ______ issue for the whole community.", "o": ["essence", "essential", "essentially", "essentials"], "a": 1, "e": "Trước danh từ issue"}, {"q": "______, neighbouring counties requested guidance.", "o": ["Consequent", "Consequence", "Consequently", "Consequences"], "a": 2, "e": "Đầu câu + dấu phẩy → trạng từ liên kết"}, {"q": "She remained ______ throughout the negotiation.", "o": ["calm", "calmly", "calmness", "calming"], "a": 0, "e": "remain là linking verb → theo sau là tính từ"}, {"q": "The audience found the lecture ______.", "o": ["bore", "boring", "bored", "boredom"], "a": 1, "e": "Bài giảng gây ra sự chán"}]}, {"t": "Đọc hiểu", "p": "**📖 BROADBAND COMES TO MARSH COUNTY**\n\n> For years, the isolated villages of Marsh County struggled with unreliable copper cables that could not handle increasing demand.\n>\n> In 2023, the council committed to laying fibre optic cables to every household. To minimise disruption, the cables were placed along existing verges, while community halls served as temporary installation hubs.\n>\n> Initial results were impressive. Villagers reported speeds comparable to city standards, with significantly improved reliability. Consequently, two neighbouring counties have requested guidance on adopting the model. Residents are highly satisfied, although some elderly people say the new system is unnecessarily complicated.", "items": [{"q": "According to the passage, what was the problem before 2023?", "o": ["There were no community halls.", "The copper cables were unreliable.", "The villages had no electricity.", "Fibre optic cables were too fast."], "a": 1, "e": "struggled with unreliable copper cables"}, {"q": "Why were the cables placed along existing verges?", "o": ["To reduce the cost", "To minimise disruption", "To reach the community halls", "To improve the speed"], "a": 1, "e": "To minimise disruption"}, {"q": "The word **\"Consequently\"** in paragraph 3 is closest in meaning to ______.", "o": ["However", "As a result", "Similarly", "Although"], "a": 1, "e": "Consequently = As a result"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Everyone is completely satisfied.", "Some elderly residents find the system complicated.", "No other county is interested.", "Speeds are slower than in cities."], "a": 1, "e": "some elderly people say the new system is unnecessarily complicated"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **BROADBAND UPGRADE REPORT**\n>\n> Initial results were **(1)______**: villagers reported speeds comparable to city standards with **(2)______** improved reliability. **(3)______**, the council extended the scheme to two more districts. The new cables are highly **(4)______**, and residents are **(5)______** with the service so far. Engineers worked **(6)______** to finish before the rainy season.", "items": [{"q": "Chỗ trống (1)", "o": ["impress", "impression", "impressive", "impressively"], "a": 2, "e": "Sau were"}, {"q": "Chỗ trống (2)", "o": ["significant", "significance", "significantly", "signify"], "a": 2, "e": "Bổ nghĩa tính từ improved"}, {"q": "Chỗ trống (3)", "o": ["Consequent", "Consequence", "Consequently", "Consequences"], "a": 2, "e": "Đầu câu + dấu phẩy"}, {"q": "Chỗ trống (4)", "o": ["rely", "reliable", "reliably", "reliability"], "a": 1, "e": "Sau are highly"}, {"q": "Chỗ trống (5)", "o": ["satisfy", "satisfying", "satisfied", "satisfaction"], "a": 2, "e": "Cư dân cảm thấy"}, {"q": "Chỗ trống (6)", "o": ["quick", "quickly", "quickness", "quicken"], "a": 1, "e": "Bổ nghĩa động từ worked"}]}]}, {"id": 19, "month": "11", "title": "Kỹ Thuật \"Nhìn Chỗ Trống Đoán Từ Loại\"", "theme": "The world of work", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng hợp.** Kỹ thuật này cho phép làm đúng câu điền từ **ngay cả khi không biết nghĩa của từ**."}, {"h": "① NGỮ PHÁP", "md": "Tổng hợp buổi 17 và 18 thành **một quy trình 3 bước** áp dụng máy móc."}, {"h": "② CÁCH SỬ DỤNG — QUY TRÌNH 3 BƯỚC", "md": "**Bước 1 — Che 4 phương án lại.** Chỉ nhìn chỗ trống và 3 từ trước, 3 từ sau.\n\n**Bước 2 — Xác định từ loại cần điền:**\n\n| Từ đứng ngay TRƯỚC chỗ trống | Cần điền | Ví dụ |\n|---|---|---|\n| a / an / the / my / your / students' | **Danh từ** | *the **installation*** |\n| Tính từ (essential, primary, public) | **Danh từ** | *public **awareness*** |\n| Giới từ (of, in, for, with, about) | **Danh từ / V-ing** | *aware **of pollution*** |\n| to be / seem / remain / become | **Tính từ** | *is **essential*** |\n| very / quite / extremely / highly | **Tính từ** | *highly **reliable*** |\n| Động từ thường | **Trạng từ** | *improved **significantly*** |\n| Đầu câu + có dấu phẩy sau | **Trạng từ liên kết** | ***Consequently**, …* |\n| Modal (will, must, can, should) / to | **Động từ nguyên thể** | *should **consider*** |\n\n**Bước 3 — Mở phương án, loại theo đuôi từ.** Thường loại được 3/4 ngay."}, {"h": "③ SƠ ĐỒ RA QUYẾT ĐỊNH", "md": "```\nChỗ trống đứng ở đâu?\n├─ Sau mạo từ / sở hữu / tính từ  → DANH TỪ   (-tion, -ment, -ness, -ity, -ance)\n├─ Trước danh từ                  → TÍNH TỪ   (-ful, -ive, -able, -al, -ous)\n├─ Sau to be / linking verb       → TÍNH TỪ\n├─ Sau động từ thường             → TRẠNG TỪ  (-ly)\n├─ Đầu câu + dấu phẩy             → TRẠNG TỪ LIÊN KẾT\n└─ Sau modal / to                 → ĐỘNG TỪ NGUYÊN THỂ\n```\n\n⚠️ Kỹ thuật này giải quyết khoảng **85%** câu hỏi từ loại. Phần còn lại cần biết collocation — học ở tháng 12."}], "vocab": [{"t": "apply for", "p": "phr v", "e": "to ask formally for a job or a place", "v": ""}, {"t": "transferable skills", "p": "n phr", "e": "abilities that are useful in many different jobs", "v": ""}, {"t": "gain experience", "p": "v phr", "e": "to get knowledge from doing something", "v": ""}, {"t": "routine tasks", "p": "n phr", "e": "ordinary work that is done regularly", "v": ""}, {"t": "stand out", "p": "phr v", "e": "to be much better or more noticeable than others", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The ______ of the campaign exceeded expectations.", "o": ["succeed", "success", "successful", "successfully"], "a": 1, "e": "Sau The, là chủ ngữ"}, {"q": "Waste must be sorted ______ before collection.", "o": ["proper", "properly", "property", "proprietor"], "a": 1, "e": "Bổ nghĩa be sorted"}, {"q": "This is an ______ effective way to reduce costs.", "o": ["extreme", "extremely", "extremity", "extremist"], "a": 1, "e": "Bổ nghĩa tính từ effective"}, {"q": "Their ______ to the scheme was immediate.", "o": ["respond", "response", "responsive", "responsively"], "a": 1, "e": "Sau Their"}, {"q": "The council should ______ the proposal carefully.", "o": ["consideration", "considerate", "consider", "considerably"], "a": 2, "e": "Sau modal should → nguyên thể"}, {"q": "A ______ internet connection is required.", "o": ["stable", "stability", "stably", "stabilise"], "a": 0, "e": "Trước danh từ connection"}]}, {"t": "Đọc hiểu", "p": "**📖 CHOOSING A FIRST JOB**\n\n> Career advisers say that the first job is rarely the most important decision a graduate makes. What matters more is the development of skills that transfer between industries.\n>\n> Employers frequently report that technical knowledge can be taught quickly, while habits such as reliability and clear communication take far longer to build. A graduate who works efficiently in a small company may therefore gain more than one who joins a famous firm and does routine tasks.\n>\n> Consequently, advisers recommend asking one simple question at an interview: what will I actually do in the first six months? The honesty of the answer is often revealing.", "items": [{"q": "According to career advisers, the first job ______.", "o": ["is the most important decision", "is rarely the most important decision", "should always be at a famous firm", "determines a graduate's whole career"], "a": 1, "e": "the first job is rarely the most important decision"}, {"q": "What do employers say takes longer to build?", "o": ["Technical knowledge", "Habits such as reliability and communication", "Company reputation", "Routine task skills"], "a": 1, "e": "habits such as reliability and clear communication take far longer"}, {"q": "The word **\"one\"** in paragraph 2 refers to ______.", "o": ["a company", "a task", "a graduate", "an employer"], "a": 2, "e": "one thay cho a graduate"}, {"q": "What do advisers recommend asking at an interview?", "o": ["What the salary will be", "How famous the company is", "What the work will actually involve", "How many people work there"], "a": 2, "e": "what will I actually do in the first six months?"}]}, {"t": "🔹 Bài 2 — Chọn phương án đúng", "p": "", "items": [{"q": "She responded ______ to the criticism.", "o": ["calm", "calmly", "calmness", "calming"], "a": 1, "e": "Bổ nghĩa responded → trạng từ"}, {"q": "The council should ______ the proposal carefully.", "o": ["consideration", "considerate", "consider", "considerably"], "a": 2, "e": "Sau should → nguyên thể"}, {"q": "This is an ______ effective way to cut costs.", "o": ["extreme", "extremely", "extremity", "extremist"], "a": 1, "e": "Bổ nghĩa tính từ effective"}, {"q": "He handled the situation ______.", "o": ["profession", "professional", "professionally", "professionalism"], "a": 2, "e": "Bổ nghĩa handled"}, {"q": "We need a more ______ approach.", "o": ["system", "systematic", "systematically", "systemise"], "a": 1, "e": "Trước danh từ approach"}, {"q": "All staff must ______ the safety guidelines.", "o": ["observance", "observant", "observe", "observably"], "a": 2, "e": "Sau must → nguyên thể"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **GRADUATE TRAINING PROGRAMME**\n>\n> Our twelve-month programme offers graduates the **(1)______** to develop transferable skills. Trainees work **(2)______** alongside experienced staff in three departments. **(3)______**, they receive a mentor for the whole period. A **(4)______** attitude matters more to us than a perfect academic record. Applicants should **(5)______** the online form by 30 June. Early **(6)______** is strongly recommended.", "items": [{"q": "Chỗ trống (1)", "o": ["opportune", "opportunity", "opportunistic", "opportunely"], "a": 1, "e": "Sau the → danh từ"}, {"q": "Chỗ trống (2)", "o": ["close", "closely", "closeness", "closer"], "a": 1, "e": "Bổ nghĩa work"}, {"q": "Chỗ trống (3)", "o": ["Addition", "Additional", "Additionally", "Add"], "a": 2, "e": "Đầu câu + dấu phẩy"}, {"q": "Chỗ trống (4)", "o": ["profession", "professional", "professionally", "professionalism"], "a": 1, "e": "Trước danh từ attitude"}, {"q": "Chỗ trống (5)", "o": ["completion", "complete", "completely", "completed"], "a": 1, "e": "Sau modal should"}, {"q": "Chỗ trống (6)", "o": ["apply", "application", "applied", "applicable"], "a": 1, "e": "Sau Early + là chủ ngữ"}]}]}, {"id": 20, "month": "11", "title": "Câu Điều Kiện Loại 0, 1, 2", "theme": "Global warming", "blocks": [{"h": "① NGỮ PHÁP", "md": "Câu điều kiện nói về quan hệ **nếu — thì**. Ba loại đầu khác nhau ở **mức độ có thật**:\n\n> **Loại 0** = luôn đúng (chân lý, quy luật).\n> **Loại 1** = có thật, có thể xảy ra ở tương lai.\n> **Loại 2** = không có thật ở hiện tại (giả định trái sự thật)."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Loại | Dùng khi | Dấu hiệu |\n|---|---|---|\n| **0** | Quy luật, hướng dẫn | Thay `if` bằng `when` vẫn đúng nghĩa |\n| **1** | Điều kiện thực tế trong tờ rơi, thông báo | **`will`** ở vế chính |\n| **2** | Giả định trái với hiện tại | **`would`** ở vế chính; `were` với mọi chủ ngữ |\n\n🔴 **Cách nhận biết nhanh nhất:** nhìn **vế chính** trước.\n`will` → loại 1 · `would` → loại 2 · cả hai vế hiện tại đơn → loại 0"}, {"h": "③ CẤU TRÚC", "md": "| Loại | Công thức | Ví dụ |\n|---|---|---|\n| **0** | If + S + V(s/es), S + V(s/es) | *If you **heat** ice, it **melts**.* |\n| **1** | If + S + V(s/es), S + **will** + V | *If everyone **works** together, we **will make** a difference.* |\n| **1** biến thể | If + S + V(s/es), S + can/should/must + V | *If you **need** help, you **can call** us.* |\n| **2** | If + S + V2/were, S + **would** + V | *If the council **had** more funds, it **would extend** the scheme.* |\n| **2** với be | If + S + **were** (mọi ngôi) | *If I **were** you, I **would apply**.* |\n\n📌 Vế `if` đứng sau thì **bỏ dấu phẩy**: *We will make a difference **if** everyone works together.*"}], "vocab": [{"t": "0", "p": "Quy luật, hướng dẫn", "e": "Thay if bằng when vẫn đúng nghĩa", "v": ""}, {"t": "2", "p": "If + S + V2/were, S + would + V", "e": "If the council had more funds, it would extend the scheme.", "v": ""}, {"t": "cut emissions", "p": "v phr", "e": "to reduce the gases released into the air", "v": ""}, {"t": "sea level", "p": "n phr", "e": "the average height of the sea", "v": ""}, {"t": "take action", "p": "v phr", "e": "to do something to deal with a problem", "v": ""}, {"t": "be at risk", "p": "adj phr", "e": "to be in danger of harm or loss", "v": ""}, {"t": "contribute to", "p": "phr v", "e": "to be one of the causes of something", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "If the school ______ enough volunteers, the project will start next month.", "o": ["find", "finds", "found", "will find"], "a": 1, "e": "will start → loại 1; the school số ít"}, {"q": "If everyone ______ together, we will make a difference.", "o": ["have worked", "worked", "work", "works"], "a": 3, "e": "🔴 will make → loại 1; everyone số ít"}, {"q": "If I ______ you, I would apply for that grant.", "o": ["am", "was", "were", "will be"], "a": 2, "e": "would apply → loại 2, dùng were cho mọi ngôi"}, {"q": "If you ______ metal, it expands.", "o": ["heat", "heats", "heated", "will heat"], "a": 0, "e": "Loại 0, cả hai vế hiện tại đơn; you không thêm -s"}, {"q": "If the council had more funds, it ______ the scheme.", "o": ["will extend", "would extend", "extends", "extended"], "a": 1, "e": "had ở vế if → loại 2"}, {"q": "If the deadline ______, applications will not be accepted.", "o": ["pass", "passes", "passed", "will pass"], "a": 1, "e": "will not be accepted → loại 1"}]}, {"t": "Đọc hiểu", "p": "**📖 IF THE ICE MELTS**\n\n> Scientists agree on one simple rule: if the average temperature rises, polar ice melts. That is not a prediction but a physical fact.\n>\n> What happens next is less certain. If the ice sheets of Greenland disappear completely, sea levels will rise by around seven metres. Cities such as Ho Chi Minh City and Bangkok will lose large areas of land.\n>\n> Many researchers argue that if governments acted faster, the worst effects could still be avoided. Others are less hopeful. If the current rate of emissions continues, they say, the world will pass a dangerous threshold within thirty years.", "items": [{"q": "According to the passage, if the average temperature rises ______.", "o": ["polar ice melts", "sea levels fall", "emissions decrease", "cities gain land"], "a": 0, "e": "if the average temperature rises, polar ice melts"}, {"q": "What would happen if the Greenland ice sheets disappeared?", "o": ["Temperatures would fall.", "Sea levels would rise by about seven metres.", "Emissions would stop.", "Bangkok would gain land."], "a": 1, "e": "sea levels will rise by around seven metres"}, {"q": "The word **\"Others\"** in paragraph 3 refers to ______.", "o": ["governments", "cities", "researchers", "effects"], "a": 2, "e": "Others trỏ về nhóm nhà nghiên cứu khác"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["All scientists are hopeful.", "Some researchers believe faster action could avoid the worst effects.", "Sea levels have already risen seven metres.", "The rate of emissions has stopped."], "a": 1, "e": "if governments acted faster, the worst effects could still be avoided"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **GREEN SCHOOL PLEDGE**\n>\n> If every student **(1)______** part in this campaign, our school **(2)______** a real difference. If you **(3)______** to join, please sign up online before Friday. Remember: if paper **(4)______** properly, it can be recycled up to seven times. If the school **(5)______** a larger budget, we would install bins in every classroom. If everyone **(6)______** just one habit, the effect would be enormous.", "items": [{"q": "Chỗ trống (1)", "o": ["take", "takes", "took", "will take"], "a": 1, "e": "Loại 1; every student số ít"}, {"q": "Chỗ trống (2)", "o": ["makes", "made", "will make", "would make"], "a": 2, "e": "Loại 1 → will make"}, {"q": "Chỗ trống (3)", "o": ["want", "wants", "wanted", "will want"], "a": 0, "e": "Loại 1; you không thêm -s"}, {"q": "Chỗ trống (4)", "o": ["sorts", "is sorted", "sorted", "will sort"], "a": 1, "e": "Giấy được phân loại → bị động"}, {"q": "Chỗ trống (5)", "o": ["has", "had", "will have", "would have"], "a": 1, "e": "would install → loại 2"}, {"q": "Chỗ trống (6)", "o": ["changes", "changed", "will change", "would change"], "a": 1, "e": "would be → loại 2"}]}]}, {"id": 21, "month": "11", "title": "Câu Điều Kiện Loại 3, Hỗn Hợp Và Unless", "theme": "Project failures", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Loại 3** = giả định trái với **quá khứ** — việc đã xảy ra rồi, không sửa được.\n> **Hỗn hợp** = điều kiện ở **quá khứ**, kết quả ở **hiện tại**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Loại | Điều kiện | Kết quả | Ví dụ |\n|---|---|---|---|\n| **3** | Quá khứ | Quá khứ | *If they **had checked** the wiring, the fire **wouldn't have started**.* |\n| **Hỗn hợp** | Quá khứ | Hiện tại | *If they **had checked** it last year, the system **would be** safe now.* |\n\n### 📌 `unless` = `if … not`\n\nSau `unless` dùng câu **khẳng định** — **không** thêm `not` nữa.\n\n*You **won't** pass **unless** you **work** hard.* = *…**if** you **don't** work hard.*\n\n❌ *Unless you don't register…* → ✅ *Unless you **register**…*\n\n**Cụm tương đương `if`:** `as long as` · `provided that` · `on condition that` · `in case`"}, {"h": "③ CẤU TRÚC", "md": "| Loại | Công thức | Ví dụ |\n|---|---|---|\n| **3** | If + S + **had** + V3, S + **would have** + V3 | *If we **had applied** earlier, we **would have got** the grant.* |\n| **3** bị động | If + S + had been + V3, … | *If the form **had been signed**, it **would have been accepted**.* |\n| **Hỗn hợp** | If + S + had + V3, S + **would** + V | *If she **had taken** the job, she **would be** in Da Nang now.* |\n| **Unless** | Unless + S + V, S + will + V | *Unless you **register**, you **will lose** your place.* |\n| **As long as** | As long as + S + V(s/es), S + will + V | *As long as it **rains**, the drill **will be** postponed.* |"}], "vocab": [{"t": "3", "p": "Quá khứ", "e": "Quá khứ", "v": "If they had checked the wiring, the fire wouldn't have started."}, {"t": "Hỗn hợp", "p": "Quá khứ", "e": "Hiện tại", "v": "If they had checked it last year, the system would be safe now."}, {"t": "carry out a survey", "p": "v phr", "e": "to do a study to collect information", "v": ""}, {"t": "go ahead", "p": "phr v", "e": "to begin or continue as planned", "v": ""}, {"t": "be abandoned", "p": "v phr", "e": "to be stopped before being finished", "v": ""}, {"t": "stem from", "p": "phr v", "e": "to be caused by something", "v": ""}, {"t": "result in", "p": "phr v", "e": "to cause a particular situation", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "If the engineers ______ the line, the fault ______.", "o": ["tested / wouldn't appear", "had tested / wouldn't have appeared", "test / won't appear", "had tested / wouldn't appear"], "a": 1, "e": "Loại 3 — cả hai vế ở quá khứ"}, {"q": "Unless you ______ the instructions, the machine will stop.", "o": ["don't follow", "follow", "didn't follow", "won't follow"], "a": 1, "e": "🔴 Sau unless dùng khẳng định"}, {"q": "If she ______ the offer last year, she ______ in Singapore now.", "o": ["accepted / would work", "had accepted / would be working", "accepts / will work", "had accepted / would have worked"], "a": 1, "e": "Điều kiện quá khứ, kết quả hiện tại → hỗn hợp"}, {"q": "We ______ a refund if we ______ the receipt.", "o": ["would get / hadn't lost", "would have got / hadn't lost", "will get / don't lose", "got / didn't lose"], "a": 1, "e": "Loại 3"}, {"q": "You may keep the equipment ______ you return it by June.", "o": ["unless", "provided that", "although", "in spite of"], "a": 1, "e": "provided that = với điều kiện là"}, {"q": "If the form ______ on time, it ______.", "o": ["was signed / would be accepted", "had been signed / would have been accepted", "signed / would accept", "is signed / will accept"], "a": 1, "e": "Loại 3, bị động cả hai vế"}]}, {"t": "Đọc hiểu", "p": "**📖 WHY THE BRIDGE PROJECT FAILED**\n\n> The riverside bridge was planned in 2016 and abandoned three years later. Engineers now agree that if the soil survey had been carried out properly, the problems would have been discovered at the start.\n>\n> Instead, work began without a full report. If the council had delayed the project by six months, it would have saved almost forty billion dong. Unless a proper survey is completed, no new design can be approved.\n>\n> The site is still empty today. If the original plan had gone ahead, residents would now have a direct route to the city centre, and the daily journey would be twenty minutes shorter.", "items": [{"q": "According to the passage, what was the main mistake?", "o": ["The bridge was built too quickly.", "The soil survey was not carried out properly.", "The council spent too little money.", "Residents opposed the project."], "a": 1, "e": "if the soil survey had been carried out properly"}, {"q": "What would have happened if the council had delayed the project?", "o": ["It would have saved a large sum of money.", "The bridge would have been finished.", "The survey would have been cancelled.", "Residents would have moved away."], "a": 0, "e": "it would have saved almost forty billion dong"}, {"q": "The word **\"it\"** in paragraph 2 refers to ______.", "o": ["the project", "the council", "the report", "the survey"], "a": 0, "e": "it trỏ về the project"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The bridge was completed in 2019.", "The site remains empty.", "A new design has been approved.", "The journey is now twenty minutes shorter."], "a": 1, "e": "The site is still empty today"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **PROJECT REVIEW**\n>\n> If the contractors **(1)______** the soil survey, the delay **(2)______**. Unless we **(3)______** our approach, the same problem will recur. If the council **(4)______** the budget last March, the second phase **(5)______** under way now. The team may continue **(6)______** a full report is submitted by June.", "items": [{"q": "Chỗ trống (1)", "o": ["conducted", "had conducted", "conduct", "would conduct"], "a": 1, "e": "Loại 3 → had + V3"}, {"q": "Chỗ trống (2)", "o": ["wouldn't happen", "didn't happen", "wouldn't have happened", "won't happen"], "a": 2, "e": "Loại 3 → wouldn't have + V3"}, {"q": "Chỗ trống (3)", "o": ["don't change", "change", "changed", "won't change"], "a": 1, "e": "Sau unless dùng khẳng định"}, {"q": "Chỗ trống (4)", "o": ["approved", "had approved", "approves", "would approve"], "a": 1, "e": "last March + kết quả hiện tại → hỗn hợp"}, {"q": "Chỗ trống (5)", "o": ["would be", "would have been", "will be", "is"], "a": 0, "e": "Hỗn hợp → kết quả hiện tại dùng would + V"}, {"q": "Chỗ trống (6)", "o": ["unless", "provided that", "although", "despite"], "a": 1, "e": "provided that"}]}]}, {"id": 22, "month": "11", "title": "Mệnh Đề Quan Hệ", "theme": "ASEAN and Viet Nam", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Mệnh đề quan hệ** bổ nghĩa cho danh từ đứng trước, giúp gộp hai câu thành một.\n\nĐây là cấu trúc khiến câu trong bài đọc dài ra — nắm được thì đọc nhanh hơn hẳn."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Đại từ | Thay cho | Ví dụ |\n|---|---|---|\n| **who** | người | *the staff **who** attended the drill* |\n| **which** | vật | *the equipment **which** was inspected* |\n| **that** | cả người và vật *(không dùng sau dấu phẩy)* | *the report **that** we submitted* |\n| **whose** | sở hữu | *the company **whose** policy changed* |\n| **where** | nơi chốn | *the site **where** the cables were laid* |\n| **when** | thời gian | *the year **when** the scheme began* |\n\n### Mệnh đề xác định và không xác định\n\n| Loại | Dấu phẩy | Ý nghĩa | Ví dụ |\n|---|---|---|---|\n| **Xác định** | không | Bỏ đi thì câu mất nghĩa | *Students **who register early** get a discount.* |\n| **Không xác định** | có | Chỉ bổ sung thông tin | *Marsh County, **which lies in the north**, has poor broadband.* |\n\n⚠️ Sau dấu phẩy **cấm dùng `that`**.\n\n### 📌 `which` thay cho CẢ MỆNH ĐỀ\n\n*Speeds improved markedly, **which** encouraged neighbouring counties to follow.*\n→ `which` ở đây không trỏ về danh từ nào, mà trỏ về **toàn bộ việc** \"tốc độ cải thiện\"."}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Công thức | Ví dụ |\n|---|---|---|\n| Chủ ngữ | N + who/which/that + **V** | *the council **which approves** the plan* |\n| Tân ngữ | N + who(m)/which/that + **S + V** | *the plan **which the council approved*** |\n| Sở hữu | N + **whose** + N | *the firm **whose bid** won* |\n| Nơi chốn | N + **where** + S + V | *the hall **where the drill took place*** |\n| Giới từ + which | N + giới từ + **which** + S + V | *the issue **about which** they argued* |\n\n📌 Sau `everything / anything / all / something` → bắt buộc dùng **`that`**."}], "vocab": [{"t": "who", "p": "người", "e": "the staff who attended the drill", "v": ""}, {"t": "that", "p": "cả người và vật (không dùng sau dấu phẩy)", "e": "the report that we submitted", "v": ""}, {"t": "where", "p": "nơi chốn", "e": "the site where the cables were laid", "v": ""}, {"t": "Xác định", "p": "không", "e": "Bỏ đi thì câu mất nghĩa", "v": "Students who register early get a discount."}, {"t": "Không xác định", "p": "có", "e": "Chỉ bổ sung thông tin", "v": "Marsh County, which lies in the north, has poor broadband."}, {"t": "consist of", "p": "phr v", "e": "to be formed from particular parts", "v": ""}, {"t": "be made up of", "p": "v phr", "e": "to be formed from several parts", "v": ""}, {"t": "play a role in", "p": "v phr", "e": "to have an effect on a situation", "v": ""}, {"t": "reach an agreement", "p": "v phr", "e": "to decide something together", "v": ""}, {"t": "member state", "p": "n phr", "e": "a country that belongs to an organisation", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The volunteers ______ signed up early will start in May.", "o": ["which", "who", "whose", "where"], "a": 1, "e": "Người + làm chủ ngữ"}, {"q": "The report, ______ was published last week, contains new data.", "o": ["that", "which", "who", "where"], "a": 1, "e": "Sau dấu phẩy → không dùng that"}, {"q": "The firm ______ bid was lowest won the contract.", "o": ["which", "who", "whose", "when"], "a": 2, "e": "Sở hữu: bid của firm"}, {"q": "This is the district ______ the cables were laid.", "o": ["which", "that", "where", "when"], "a": 2, "e": "Chỉ nơi chốn"}, {"q": "Everything ______ you need is in the handbook.", "o": ["who", "that", "whose", "where"], "a": 1, "e": "Sau Everything → bắt buộc that"}, {"q": "Speeds improved markedly, ______ encouraged other counties to follow.", "o": ["that", "which", "what", "who"], "a": 1, "e": "🔴 which thay cho cả mệnh đề phía trước"}]}, {"t": "Đọc hiểu", "p": "**📖 ASEAN AT FIFTY-FIVE**\n\n> ASEAN, which was founded in 1967, now includes ten member states whose combined population exceeds 670 million.\n>\n> The organisation, which meets several times a year, has no single parliament. Decisions are made by consensus, a method that requires every member to agree. Critics say this is the reason why progress is often slow.\n>\n> Viet Nam, which joined in 1995, has hosted the annual summit three times. The 2020 summit, which took place online because of the pandemic, was the first in the organisation's history to be held entirely by video, which many members later described as a success.", "items": [{"q": "According to the passage, ASEAN ______.", "o": ["was founded in 1995", "has ten member states", "has a single parliament", "meets once every five years"], "a": 1, "e": "now includes ten member states"}, {"q": "Why do critics say progress is often slow?", "o": ["Because there are too many members", "Because decisions require everyone to agree", "Because meetings are held online", "Because Viet Nam joined late"], "a": 1, "e": "Decisions are made by consensus, a method that requires every member to agree"}, {"q": "The last **\"which\"** in the passage refers to ______.", "o": ["the pandemic", "the 2020 summit being held entirely by video", "the organisation's history", "the annual summit"], "a": 1, "e": "which cuối bài trỏ về việc họp hoàn toàn qua video"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Viet Nam has hosted the summit three times.", "The 2020 summit was cancelled.", "ASEAN has more than twenty members.", "Decisions are made by majority vote."], "a": 0, "e": "Viet Nam… has hosted the annual summit three times"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **COMMUNITY NOTICE**\n>\n> Residents **(1)______** live in Block C should use the north entrance. The new bins, **(2)______** were installed last month, are colour-coded. The contractor **(3)______** team carried out the work will return in June. This is the only site **(4)______** recycling is processed locally. Anything **(5)______** cannot be recycled must go in the grey bin. Collection now happens twice a week, **(6)______** has reduced complaints considerably.", "items": [{"q": "Chỗ trống (1)", "o": ["which", "who", "whose", "where"], "a": 1, "e": "Residents là người, làm chủ ngữ"}, {"q": "Chỗ trống (2)", "o": ["that", "which", "who", "where"], "a": 1, "e": "Sau dấu phẩy"}, {"q": "Chỗ trống (3)", "o": ["which", "who", "whose", "when"], "a": 2, "e": "team thuộc về contractor"}, {"q": "Chỗ trống (4)", "o": ["which", "that", "where", "when"], "a": 2, "e": "Chỉ nơi chốn"}, {"q": "Chỗ trống (5)", "o": ["who", "that", "whose", "where"], "a": 1, "e": "Sau Anything"}, {"q": "Chỗ trống (6)", "o": ["that", "which", "what", "who"], "a": 1, "e": "Trỏ về cả việc thu gom hai lần/tuần"}]}]}, {"id": 23, "month": "11", "title": "Rút Gọn Mệnh Đề Quan Hệ", "theme": "Life stories", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Rút gọn** = bỏ đại từ quan hệ và động từ `be`, giữ lại phần còn lại.\n\nĐây là lý do câu trong bài đọc trông \"lạ\" — nhận ra được thì đọc nhanh hơn nhiều."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Mệnh đề gốc | Rút gọn thành | Khi nào |\n|---|---|---|\n| who/which + **V-ing** | **V-ing** | Chủ động |\n| who/which + **be + V3** | **V3** | Bị động |\n| who/which + **be + tính từ/giới từ** | bỏ hẳn `be` | Trạng thái |\n| who/which + be + **the first/only… to V** | **to V** | Sau số thứ tự, so sánh nhất |"}, {"h": "③ CẤU TRÚC", "md": "| Dạng | Đầy đủ | Rút gọn |\n|---|---|---|\n| Chủ động | the staff **who attend** the drill | the staff **attending** the drill |\n| Bị động | the bins **which were installed** last week | the bins **installed** last week |\n| Tính từ | the students **who are responsible** for waste | the students **responsible** for waste |\n| Giới từ | the file **which is on the desk** | the file **on the desk** |\n| To V | he was the first **who arrived** | he was the first **to arrive** |\n\n🔑 **Cách phân biệt V-ing và V3:** hỏi *chủ ngữ tự làm hay bị làm?*\nTự làm → **V-ing** · Bị làm → **V3**"}], "vocab": [{"t": "be known for", "p": "adj phr", "e": "to be famous because of something", "v": ""}, {"t": "devote oneself to", "p": "v phr", "e": "to give all your time and effort to something", "v": ""}, {"t": "look up to", "p": "phr v", "e": "to admire and respect someone", "v": ""}, {"t": "carry on", "p": "phr v", "e": "to continue doing something", "v": ""}, {"t": "leave a legacy", "p": "v phr", "e": "to leave something important behind", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Skills ______ practised tend to erode.", "o": ["seldom practising", "seldom practised", "to seldom practise", "seldom practise"], "a": 1, "e": "Kỹ năng được luyện → bị động → V3"}, {"q": "Households ______ to reduce waste should attend the workshop.", "o": ["wished", "wishing", "to wish", "wish"], "a": 1, "e": "Hộ gia đình muốn → chủ động → V-ing"}, {"q": "The section of river ______ for hydroelectric generation is now closed.", "o": ["using", "used", "to use", "use"], "a": 1, "e": "Đoạn sông được dùng → V3"}, {"q": "He was the first researcher ______ this hidden cost.", "o": ["identifying", "identified", "to identify", "identify"], "a": 2, "e": "Sau the first → to V"}, {"q": "The employees ______ night shifts receive an allowance.", "o": ["worked", "working", "to work", "work"], "a": 1, "e": "Nhân viên làm ca đêm → V-ing"}, {"q": "The report ______ to this email needs review.", "o": ["attaching", "attached", "to attach", "attach"], "a": 1, "e": "Báo cáo được đính kèm → V3"}]}, {"t": "Đọc hiểu", "p": "**📖 THE TEACHER WHO NEVER RETIRED**\n\n> Born in a small village in Quang Nam in 1931, Nguyen Thi Lan was the first person in her family to finish secondary school.\n>\n> She began teaching in 1952 and continued for sixty years. Students taught by her in the 1960s still visit her today. Asked why she never retired, she replied simply that she had nothing else she wanted to do.\n>\n> The classroom built beside her house is still used every Sunday. Children living nearby come for free lessons, and former students returning from the city often teach alongside her. A documentary made about her life won a national prize in 2019.", "items": [{"q": "According to the passage, Nguyen Thi Lan ______.", "o": ["was born in the city", "was the first in her family to finish secondary school", "retired in 1952", "never taught in a classroom"], "a": 1, "e": "the first person in her family to finish secondary school"}, {"q": "How long did she teach?", "o": ["Twenty years", "Forty years", "Sixty years", "Eighty years"], "a": 2, "e": "continued for sixty years"}, {"q": "The word **\"her\"** in paragraph 3 refers to ______.", "o": ["a student", "Nguyen Thi Lan", "a child", "a documentary"], "a": 1, "e": "her trỏ về Nguyen Thi Lan"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The classroom is no longer used.", "Former students sometimes teach with her.", "She charges for the Sunday lessons.", "The documentary was made in 1931."], "a": 1, "e": "former students returning from the city often teach alongside her"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **ENVIRONMENTAL BRIEFING**\n>\n> Skills **(1)______** practised tend to erode over time. The resources **(2)______** for alternative uses can no longer be considered free. Households **(3)______** to reduce waste should attend the workshop. The section of river **(4)______** for hydroelectric generation is now closed to canoeing. He was the first researcher **(5)______** this hidden cost. The report **(6)______** to this notice explains the details.", "items": [{"q": "Chỗ trống (1)", "o": ["seldom practising", "seldom practised", "to seldom practise", "seldom practise"], "a": 1, "e": "Bị động"}, {"q": "Chỗ trống (2)", "o": ["reserving", "reserved", "to reserve", "reserve"], "a": 1, "e": "Bị động"}, {"q": "Chỗ trống (3)", "o": ["wished", "wishing", "to wish", "wish"], "a": 1, "e": "Chủ động"}, {"q": "Chỗ trống (4)", "o": ["using", "used", "to use", "use"], "a": 1, "e": "Bị động"}, {"q": "Chỗ trống (5)", "o": ["identifying", "identified", "to identify", "identify"], "a": 2, "e": "Sau the first"}, {"q": "Chỗ trống (6)", "o": ["attaching", "attached", "to attach", "attach"], "a": 1, "e": "Bị động"}]}]}, {"id": 24, "month": "11", "title": "To V Và V-Ing", "theme": "The generation gap", "blocks": [{"h": "① NGỮ PHÁP", "md": "Sau một động từ, động từ thứ hai phải chia ở dạng `to V` hoặc `V-ing`. **Không có quy tắc logic — phải thuộc danh sách.** Bù lại, đây là loại câu dễ ăn điểm vì chỉ cần nhớ."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Nhóm | Động từ | Ví dụ |\n|---|---|---|\n| **+ to V** | want · decide · hope · plan · agree · promise · refuse · offer · aim · manage · fail · afford · expect · learn | *We **aim to promote** safe habits.* |\n| **+ V-ing** | enjoy · avoid · finish · suggest · consider · mind · practise · deny · recommend · involve · risk · keep | *The scheme **involves sorting** waste.* |\n| **Sau giới từ** | luôn **V-ing** | *interested **in joining*** · *after **being informed*** |\n| **Đổi nghĩa** | remember · forget · stop · try | xem bảng dưới |\n\n### 📌 Bốn động từ đổi nghĩa\n\n| Động từ | + to V | + V-ing |\n|---|---|---|\n| **remember** | nhớ **sẽ** làm | nhớ **đã** làm |\n| **forget** | quên **chưa** làm | quên **đã** làm |\n| **stop** | dừng lại **để** làm | dừng **việc đang** làm |\n| **try** | cố gắng làm | thử làm xem sao |\n\n⚠️ `used to + V` (từng làm) ≠ `be used to + V-ing` (đã quen với việc gì)"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| S + V + **to V** | *They **decided to extend** the scheme.* |\n| S + V + **V-ing** | *We **recommend using** the north gate.* |\n| S + V + O + **to V** | *The council **asked residents to sort** waste.* |\n| giới từ + **V-ing** | *responsible **for managing** the budget* |\n| **to V** chỉ mục đích | *We hold drills **to improve** safety.* |"}], "vocab": [{"t": "+ to V", "p": "want · decide · hope · plan · agree · promise · refuse · offer · aim · manage · fail · afford · expect · learn", "e": "We aim to promote safe habits.", "v": ""}, {"t": "Sau giới từ", "p": "luôn V-ing", "e": "interested in joining · after being informed", "v": ""}, {"t": "remember", "p": "nhớ sẽ làm", "e": "nhớ đã làm", "v": ""}, {"t": "stop", "p": "dừng lại để làm", "e": "dừng việc đang làm", "v": ""}, {"t": "get along with", "p": "phr v", "e": "to have a friendly relationship with someone", "v": ""}, {"t": "look down on", "p": "phr v", "e": "to think you are better than someone", "v": ""}, {"t": "take after", "p": "phr v", "e": "to look or behave like an older relative", "v": ""}, {"t": "generation gap", "p": "n phr", "e": "the difference in attitudes between age groups", "v": ""}, {"t": "give advice", "p": "v phr", "e": "to tell someone what you think they should do", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The council agreed ______ the scheme.", "o": ["extend", "to extend", "extending", "extended"], "a": 1, "e": "agree + to V"}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2, "e": "recommend + V-ing"}, {"q": "She is responsible for ______ the budget.", "o": ["manage", "to manage", "managing", "managed"], "a": 2, "e": "Sau giới từ for"}, {"q": "He stopped ______ the machine because it was overheating.", "o": ["to use", "using", "use", "used"], "a": 1, "e": "🔴 Dừng việc đang dùng máy"}, {"q": "Please remember ______ the door when you leave.", "o": ["lock", "to lock", "locking", "locked"], "a": 1, "e": "Nhớ việc sẽ làm"}, {"q": "Would you mind ______ outside?", "o": ["wait", "to wait", "waiting", "waited"], "a": 2, "e": "mind + V-ing"}]}, {"t": "Đọc hiểu", "p": "**📖 TALKING ACROSS GENERATIONS**\n\n> Many teenagers complain that their parents refuse to listen. Many parents say the same about their children.\n>\n> Psychologists suggest starting with small things. They recommend choosing a time when nobody is tired, and avoiding difficult topics at meals. Parents who manage to ask questions without judging usually learn far more than those who begin by giving advice.\n>\n> Teenagers can help too. Experts advise them to explain rather than defend, and to remember that their parents grew up in a very different world. Families who keep talking, even about ordinary things, tend to find the difficult conversations easier later.", "items": [{"q": "According to the passage, psychologists suggest ______.", "o": ["avoiding all difficult topics forever", "starting with small things", "talking only at meals", "giving advice immediately"], "a": 1, "e": "Psychologists suggest starting with small things"}, {"q": "What do parents who ask questions without judging usually do?", "o": ["They learn more than those who give advice.", "They stop talking to their children.", "They agree with everything.", "They avoid all conversation."], "a": 0, "e": "usually learn far more than those who begin by giving advice"}, {"q": "The word **\"them\"** in paragraph 3 refers to ______.", "o": ["experts", "parents", "teenagers", "families"], "a": 2, "e": "them trỏ về Teenagers"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Only teenagers need to change.", "Families who keep talking find difficult conversations easier.", "Meals are the best time for difficult topics.", "Psychologists advise parents to give more advice."], "a": 1, "e": "Families who keep talking… find the difficult conversations easier"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **PARENT–TEEN WORKSHOP**\n>\n> Our centre aims **(1)______** better communication between generations. The workshop involves **(2)______** in small mixed groups. Parents interested in **(3)______** should register before 20 November. Please remember **(4)______** your confirmation email to the first session. We recommend **(5)______** the online questionnaire beforehand. Participants who manage **(6)______** all four sessions receive a certificate.", "items": [{"q": "Chỗ trống (1)", "o": ["promote", "to promote", "promoting", "promoted"], "a": 1, "e": "aim + to V"}, {"q": "Chỗ trống (2)", "o": ["work", "to work", "working", "worked"], "a": 2, "e": "involve + V-ing"}, {"q": "Chỗ trống (3)", "o": ["attend", "to attend", "attending", "attended"], "a": 2, "e": "Sau giới từ in"}, {"q": "Chỗ trống (4)", "o": ["bring", "to bring", "bringing", "brought"], "a": 1, "e": "Nhớ việc sẽ làm"}, {"q": "Chỗ trống (5)", "o": ["complete", "to complete", "completing", "completed"], "a": 2, "e": "recommend + V-ing"}, {"q": "Chỗ trống (6)", "o": ["attend", "to attend", "attending", "attended"], "a": 1, "e": "manage + to V"}]}]}, {"id": 25, "month": "11", "title": "Động Từ Khuyết Thiếu Và Modal Perfect", "theme": "Inventions", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Động từ khuyết thiếu** thể hiện **thái độ người nói**: bắt buộc, khuyên, cho phép, phỏng đoán.\n> **`Modal + have + V3`** dùng để nói về **quá khứ**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Modal | Nghĩa | Ví dụ |\n|---|---|---|\n| **must** | bắt buộc (người nói áp đặt) | *All forms **must** be signed.* |\n| **have to** | bắt buộc (do quy định, hoàn cảnh) | *We **have to** wear helmets here.* |\n| **should / ought to** | nên, khuyên | *Applications **should** be submitted early.* |\n| **can / may** | có thể, được phép | *Items **can** be exchanged in five days.* |\n| **might / may** | phỏng đoán không chắc | *The syllabus **may** change.* |\n| **mustn't** | **cấm** | *The funding **mustn't** be used for equipment.* |\n| **needn't** | **không cần** | *You **needn't** bring a laptop.* |\n\n⚠️ **Phân biệt:** `mustn't` = cấm · `needn't` = không bắt buộc. Hai nghĩa hoàn toàn khác nhau.\n\n### 📌 Modal perfect — nói về quá khứ\n\n| Cấu trúc | Nghĩa |\n|---|---|\n| **must have + V3** | chắc hẳn đã (suy đoán chắc chắn) |\n| **can't have + V3** | chắc hẳn không |\n| **should have + V3** | lẽ ra nên (nhưng đã không làm) |\n| **needn't have + V3** | lẽ ra không cần (nhưng đã làm) |\n| **might/may have + V3** | có lẽ đã |"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| S + modal + V | *You **should register** online.* |\n| S + modal + **be + V3** | *Helmets **must be worn**.* |\n| S + modal + **have + V3** | *They **must have forgotten** the deadline.* |\n| S + modal + **have been + V3** | *The form **should have been signed**.* |"}], "vocab": [{"t": "must", "p": "bắt buộc (người nói áp đặt)", "e": "All forms must be signed.", "v": ""}, {"t": "should / ought to", "p": "nên, khuyên", "e": "Applications should be submitted early.", "v": ""}, {"t": "might / may", "p": "phỏng đoán không chắc", "e": "The syllabus may change.", "v": ""}, {"t": "needn't", "p": "không cần", "e": "You needn't bring a laptop.", "v": "⚠️ Phân biệt: mustn't = cấm · needn't = không bắt buộc. Hai nghĩa hoàn toàn khác nhau.\n\n### 📌 Modal perfect — nói về quá khứ"}, {"t": "come up with", "p": "phr v", "e": "to think of an idea or a plan", "v": ""}, {"t": "by accident", "p": "prep phr", "e": "not planned or intended", "v": ""}, {"t": "put to use", "p": "v phr", "e": "to start using something for a purpose", "v": ""}, {"t": "shelve a project", "p": "v phr", "e": "to stop working on a plan for a time", "v": ""}, {"t": "turn out", "p": "phr v", "e": "to happen in a particular way in the end", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "You ______ bring your own laptop; we provide them.", "o": ["mustn't", "needn't", "can't", "shouldn't"], "a": 1, "e": "Không cần, vì đã có sẵn"}, {"q": "Visitors ______ enter the laboratory without a pass.", "o": ["needn't", "mustn't", "don't have to", "may"], "a": 1, "e": "Cấm vào khi không có thẻ"}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1, "e": "Suy đoán chắc chắn về quá khứ"}, {"q": "We ______ so early; the hall was empty.", "o": ["needn't book", "needn't have booked", "mustn't book", "shouldn't book"], "a": 1, "e": "Lẽ ra không cần, nhưng đã làm"}, {"q": "The form ______ by a supervisor. *(lẽ ra nên, nhưng đã không)*", "o": ["should sign", "should be signed", "should have signed", "should have been signed"], "a": 3, "e": "Lẽ ra nên + bị động"}, {"q": "He ______ the train — he's usually punctual.", "o": ["must miss", "can't have missed", "needn't miss", "should miss"], "a": 1, "e": "Chắc hẳn không"}]}, {"t": "Đọc hiểu", "p": "**📖 THE INVENTION THAT ALMOST WASN'T**\n\n> In 1968, an engineer at an American company created a glue that would not stick properly. His employers decided that it must have been a failure and shelved the project.\n>\n> Five years later, a colleague realised that the weak glue might be useful. He argued that the company should have tested it on paper rather than on industrial materials.\n>\n> The result was the sticky note, which can now be found in almost every office in the world. Looking back, the company admits that it needn't have waited five years: the idea had been sitting in a drawer all along.", "items": [{"q": "According to the passage, why was the glue shelved?", "o": ["It was too expensive.", "The employers thought it was a failure.", "It stuck too strongly.", "Nobody had tested it."], "a": 1, "e": "His employers decided that it must have been a failure"}, {"q": "What did the colleague argue?", "o": ["That the glue should be thrown away", "That it should have been tested on paper", "That the project should be sold", "That the glue was dangerous"], "a": 1, "e": "should have tested it on paper"}, {"q": "The word **\"it\"** in the last sentence refers to ______.", "o": ["the drawer", "the idea", "the company", "the sticky note"], "a": 2, "e": "it trỏ về the company"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The invention was recognised immediately.", "The company waited five years unnecessarily.", "The glue was very strong.", "The engineer left the company in 1968."], "a": 1, "e": "it needn't have waited five years"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **SITE SAFETY RULES**\n>\n> All visitors **(1)______** report to reception on arrival. Hard hats **(2)______** in the yard at all times. You **(3)______** bring your own tools; the site provides them. Anyone entering without a permit **(4)______** be escorted off the premises. Last week's incident **(5)______** prevented if the guard rail had been checked. Staff **(6)______** use the east gate after 6 p.m.", "items": [{"q": "Chỗ trống (1)", "o": ["must", "needn't", "might", "can't"], "a": 0, "e": "Quy định bắt buộc"}, {"q": "Chỗ trống (2)", "o": ["must wear", "needn't wear", "must be worn", "should have worn"], "a": 2, "e": "Mũ được đội"}, {"q": "Chỗ trống (3)", "o": ["mustn't", "needn't", "can't", "shouldn't"], "a": 1, "e": "the site provides them → không cần mang"}, {"q": "Chỗ trống (4)", "o": ["will", "must", "needn't", "mustn't"], "a": 0, "e": "Hậu quả tất yếu"}, {"q": "Chỗ trống (5)", "o": ["must have been", "could be", "should have been", "needn't have been"], "a": 2, "e": "Lẽ ra đã được ngăn chặn"}, {"q": "Chỗ trống (6)", "o": ["mustn't", "needn't", "don't must", "haven't to"], "a": 0, "e": "Cấm dùng cổng đông sau 6 giờ"}]}]}, {"id": 26, "month": "11", "title": "Mạo Từ Và Danh Từ Đếm Được/Không Đếm Được", "theme": "Urbanisation", "blocks": [{"h": "① NGỮ PHÁP", "md": "> Mạo từ `a / an / the / Ø` cho biết danh từ **xác định hay không xác định**."}, {"h": "② CÁCH SỬ DỤNG", "md": "| Dùng | Khi nào | Ví dụ |\n|---|---|---|\n| **a / an** | Đếm được số ít, nhắc lần đầu | *a golden opportunity* · `an` trước **âm** nguyên âm |\n| **the** | Đã nhắc trước · duy nhất · có cụm xác định · so sánh nhất · thứ tự | *the best candidate* · *the cost **of preserving the river*** |\n| **Ø** | Không đếm được · số nhiều nói chung · mùa, bữa ăn, môn học | *Ø **information*** · *Ø **students** should register* |\n\n🔴 **Quy tắc `a` hay `an` theo ÂM, không theo CHỮ CÁI:**\n- *an hour* (`h` câm, âm đầu /aʊ/) · *an MBA* (/em/) · *an IT assistant* (/aɪ/)\n- *a university* (/juː/ — âm phụ âm) · *a one-year contract* (/wʌn/) · *a European city* (/jʊə/)\n\n### 📌 Danh từ không đếm được hay ra trong đề\n\n`information · advice · equipment · furniture · knowledge · research · progress · evidence · news · work · money · luggage · traffic · weather`\n\n→ Không thêm `-s`, không dùng `a/an`.\n\n| Đếm được | Không đếm được |\n|---|---|\n| many · a few · few · a number of | much · a little · little · a great deal of |\n| *many applicants* | *much evidence* |"}, {"h": "③ CẤU TRÚC", "md": "| Công thức | Ví dụ |\n|---|---|\n| a/an + N đếm được số ít | *such **an** opportunity* |\n| the + N xác định | ***The** installation of new bins* |\n| Ø + N không đếm được | *We need Ø **information**.* |\n| much / a little + N không đếm | *There isn't **much evidence**.* |\n| many / a few + N số nhiều | *Only **a few applicants** were shortlisted.* |"}], "vocab": [{"t": "a / an", "p": "Đếm được số ít, nhắc lần đầu", "e": "a golden opportunity · an trước âm nguyên âm", "v": ""}, {"t": "Ø", "p": "Không đếm được · số nhiều nói chung · mùa, bữa ăn, môn học", "e": "Ø information · Ø students should register", "v": "🔴 Quy tắc a hay an theo ÂM, không theo CHỮ CÁI:\n- an hour (h câm, âm đầu /aʊ/) · an MBA (/em/) · an IT assistant (/aɪ/)\n- a university (/juː/ — âm phụ âm) · a one-year contract (/wʌn/) · a European city (/jʊə/)\n\n### 📌 Danh từ không đếm được hay ra trong đề\n\ninformation · advice · equipment · furniture · knowledge · research · progress · evidence · news · work · money · luggage · traffic · weather\n\n→ Không thêm -s, không dùng a/an."}, {"t": "put pressure on", "p": "v phr", "e": "to create difficulty for a system or person", "v": ""}, {"t": "move in / move out", "p": "phr v", "e": "to start / stop living in a place", "v": ""}, {"t": "in search of", "p": "prep phr", "e": "looking for something", "v": ""}, {"t": "a large amount of", "p": "quant phr", "e": "a lot of something uncountable", "v": ""}, {"t": "high-income", "p": "adj", "e": "earning a lot of money", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "She gave me some useful ______ about the course.", "o": ["advices", "advice", "an advice", "the advices"], "a": 1, "e": "advice không đếm được"}, {"q": "He has been working here for ______ hour.", "o": ["a", "an", "the", "Ø"], "a": 1, "e": "🔴 hour — h câm, âm đầu là nguyên âm"}, {"q": "They are looking for ______ IT assistant.", "o": ["a", "an", "the", "Ø"], "a": 1, "e": "IT đọc /aɪ 'tiː/ → âm nguyên âm"}, {"q": "There isn't ______ evidence to support that claim.", "o": ["many", "a few", "much", "several"], "a": 2, "e": "evidence không đếm được → much"}, {"q": "She is ______ best candidate we have interviewed.", "o": ["a", "an", "the", "Ø"], "a": 2, "e": "So sánh nhất → the"}, {"q": "They offer ______ one-year contract.", "o": ["a", "an", "the", "Ø"], "a": 0, "e": "one đọc /wʌn/ → âm phụ âm"}]}, {"t": "Đọc hiểu", "p": "**📖 A CITY OF TEN MILLION**\n\n> By 2030, the population of Ho Chi Minh City is expected to reach ten million. Much of this growth comes from people moving in from the countryside in search of work.\n>\n> The pressure on housing is severe. A recent study found that a large amount of new construction is aimed at high-income buyers, while only a few projects serve ordinary families. The research also showed that traffic has become the biggest daily complaint.\n>\n> The council has announced a plan to build three new districts on the eastern edge of the city. Whether this will be enough remains an open question.", "items": [{"q": "According to the passage, most of the city's growth comes from ______.", "o": ["births in the city", "people moving in from the countryside", "foreign workers", "new districts"], "a": 1, "e": "people moving in from the countryside in search of work"}, {"q": "What did the recent study find?", "o": ["Most new construction targets high-income buyers.", "Housing pressure has disappeared.", "Traffic is no longer a problem.", "Ordinary families own most new homes."], "a": 0, "e": "a large amount of new construction is aimed at high-income buyers"}, {"q": "The word **\"this\"** in the last sentence refers to ______.", "o": ["the traffic", "the population", "the plan to build three new districts", "the study"], "a": 2, "e": "this trỏ về kế hoạch xây ba quận mới"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The plan will certainly solve the problem.", "Traffic is the biggest daily complaint.", "Only a few people move in from the countryside.", "The population will fall by 2030."], "a": 1, "e": "traffic has become the biggest daily complaint"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **COURSE INFORMATION**\n>\n> City Learning Centre offers **(1)______** eight-week evening course this winter. Participants receive **(2)______** printed workbook and plenty of practical **(3)______**. Only **(4)______** places remain, so early registration is advised. There isn't **(5)______** time left before the deadline. **(6)______** best students may be offered a scholarship.", "items": [{"q": "Chỗ trống (1)", "o": ["a", "an", "the", "Ø"], "a": 1, "e": "🔴 eight đọc /eɪ/ → âm nguyên âm → an"}, {"q": "Chỗ trống (2)", "o": ["a", "an", "the", "Ø"], "a": 0, "e": "printed âm phụ âm"}, {"q": "Chỗ trống (3)", "o": ["experience", "experiences", "an experience", "the experiences"], "a": 0, "e": "experience nghĩa \"kinh nghiệm\" → không đếm được"}, {"q": "Chỗ trống (4)", "o": ["much", "a little", "a few", "a great deal of"], "a": 2, "e": "places đếm được số nhiều"}, {"q": "Chỗ trống (5)", "o": ["many", "a few", "much", "several"], "a": 2, "e": "time không đếm được"}, {"q": "Chỗ trống (6)", "o": ["A", "An", "The", "Ø"], "a": 2, "e": "So sánh nhất"}]}]}, {"id": 27, "month": "11", "title": "Tổng Ôn Tháng 11", "theme": "Ôn tập toàn tháng", "blocks": [{"h": "Mở đầu", "md": "> **Buổi tổng ôn.** Không có kiến thức mới."}, {"h": "① BẢNG TỔNG HỢP THÁNG 11", "md": "| Nhóm | Điểm cốt lõi |\n|---|---|\n| **Bị động** | Giữ nguyên thì ở `be`, động từ chính về **V3**. Modal + **be** + V3. |\n| **Bị động đặc biệt** | `It is said that…` · `S is said to V` · `have/get + O + V3` |\n| **Word form** | Đuôi từ quyết định từ loại. Nhìn từ đứng **trước** chỗ trống. |\n| **Điều kiện** | Nhìn **vế chính**: `will` → loại 1 · `would` → loại 2 · `would have` → loại 3 |\n| **Unless** | = `if…not` → sau `unless` dùng **khẳng định** |\n| **Mệnh đề quan hệ** | who (người) · which (vật) · whose (sở hữu) · where (nơi) · that (không sau dấu phẩy) |\n| **Rút gọn** | Chủ động → **V-ing** · Bị động → **V3** · Sau `the first/only` → **to V** |\n| **To V / V-ing** | Thuộc danh sách. Sau giới từ luôn **V-ing**. |\n| **Modal perfect** | `must have` (chắc đã) · `should have` (lẽ ra nên) · `needn't have` (lẽ ra không cần) |\n| **Mạo từ** | `a/an` theo **âm**. Không đếm được → `much`, không `a/an`. |"}, {"h": "② QUY TRÌNH 4 BƯỚC GIẢI CÂU ĐIỀN TỪ", "md": "**Bước 1 — Nhìn 4 phương án để biết câu hỏi hỏi gì:**\n\n| 4 phương án trông như thế nào | Đang hỏi | Kỹ thuật |\n|---|---|---|\n| Cùng gốc, khác đuôi (-tion/-ive/-ly) | **Từ loại** | Buổi 19 |\n| Các dạng của cùng 1 động từ | **Thì & thể** | Buổi 14–15 |\n| Cùng từ loại, nghĩa gần nhau | **Collocation** | Tháng 12 |\n| 4 từ nối khác nhau | **Liên kết ý** | Tháng 12 |\n\n**Bước 2 — Nếu là thì & thể:** xác định chủ động hay bị động trước, rồi mới chọn thì.\n**Bước 3 — Nếu là từ loại:** nhìn từ đứng ngay trước chỗ trống.\n**Bước 4 — Đọc lại cả câu** với đáp án đã chọn."}], "vocab": [{"t": "be criticised for", "p": "v phr", "e": "to be judged badly because of something", "v": ""}, {"t": "reach a scale", "p": "v phr", "e": "to grow to a particular size", "v": ""}, {"t": "put to use", "p": "v phr", "e": "to start using something for a purpose", "v": ""}, {"t": "be measured by", "p": "v phr", "e": "to be judged or counted by someone", "v": ""}, {"t": "go on (money)", "p": "phr v", "e": "to be spent on something", "v": ""}], "groups": [{"t": "③ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "Warning signs ______ at every exit next month.", "o": ["install", "installed", "will be installed", "installing"], "a": 2, "e": "next month; signs được lắp"}, {"q": "Your ______ is essential for success.", "o": ["cooperate", "cooperation", "cooperative", "cooperatively"], "a": 1, "e": "Sau Your → danh từ"}, {"q": "If everyone ______ together, we will make a difference.", "o": ["work", "works", "worked", "will work"], "a": 1, "e": "Loại 1; everyone số ít"}, {"q": "The report, ______ was published last week, contains new data.", "o": ["that", "which", "who", "where"], "a": 1, "e": "Sau dấu phẩy"}, {"q": "Skills seldom ______ tend to erode.", "o": ["practising", "practised", "to practise", "practise"], "a": 1, "e": "Kỹ năng được luyện"}, {"q": "We recommend ______ the north entrance.", "o": ["use", "to use", "using", "used"], "a": 2, "e": "recommend + V-ing"}, {"q": "They ______ the meeting — nobody came.", "o": ["must forget", "must have forgotten", "should forget", "needn't forget"], "a": 1, "e": "Suy đoán về quá khứ"}, {"q": "There isn't ______ evidence to support that claim.", "o": ["many", "a few", "much", "several"], "a": 2, "e": "evidence không đếm được"}]}, {"t": "Đọc hiểu", "p": "**📖 THE COST OF A CLEAN CITY**\n\n> Ten years ago, the streets of this district were regularly criticised for the amount of rubbish left on them. If the council had acted earlier, the problem would never have reached that scale.\n>\n> A programme launched in 2019 changed the picture. Bins, which are now emptied twice a day, were installed on every corner. Residents wishing to report a full bin can use a free app, and complaints must be answered within twenty-four hours.\n>\n> The improvement has been considerable. Cleanliness scores, measured monthly by an independent team, have risen by forty per cent. Officials admit, however, that the programme needn't have cost so much: much of the early spending went on equipment that was never put to use.", "items": [{"q": "According to the passage, what was the problem ten years ago?", "o": ["There were too many bins.", "Rubbish was left on the streets.", "The council acted too quickly.", "Residents refused to use the app."], "a": 1, "e": "criticised for the amount of rubbish left on them"}, {"q": "How often are the bins emptied now?", "o": ["Once a week", "Twice a day", "Every twenty-four hours", "Once a month"], "a": 1, "e": "Bins, which are now emptied twice a day"}, {"q": "The word **\"which\"** in paragraph 2 refers to ______.", "o": ["the programme", "the bins", "the corners", "the residents"], "a": 1, "e": "which trỏ về Bins"}, {"q": "What do officials admit?", "o": ["That the programme failed", "That the programme cost more than necessary", "That cleanliness scores have fallen", "That the app does not work"], "a": 1, "e": "the programme needn't have cost so much"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["Complaints must be answered within a day.", "All the early equipment was used.", "Scores are measured by the council itself.", "The programme started in 2009."], "a": 0, "e": "complaints must be answered within twenty-four hours"}]}, {"t": "🔹 Bài 2 — Mini-cloze", "p": "> **RIVERSIDE RESTORATION PROJECT**\n>\n> The riverside path **(1)______** next spring for the first time in a decade. Residents' **(2)______** in the consultation has been remarkable. If the council **(3)______** the plan last year, work would already be under way. The section of bank **(4)______** by flooding will be rebuilt first. We recommend **(5)______** the online map before visiting. All feedback **(6)______** in writing before 30 December.", "items": [{"q": "Chỗ trống (1)", "o": ["reopens", "will reopen", "will be reopened", "reopened"], "a": 2, "e": "Path được mở lại"}, {"q": "Chỗ trống (2)", "o": ["involve", "involvement", "involved", "involvingly"], "a": 1, "e": "Sau sở hữu cách Residents'"}, {"q": "Chỗ trống (3)", "o": ["approved", "had approved", "approves", "would approve"], "a": 1, "e": "last year + kết quả hiện tại → hỗn hợp"}, {"q": "Chỗ trống (4)", "o": ["damaging", "damaged", "to damage", "damage"], "a": 1, "e": "Bờ bị hư hại → rút gọn bị động"}, {"q": "Chỗ trống (5)", "o": ["check", "to check", "checking", "checked"], "a": 2, "e": "recommend + V-ing"}, {"q": "Chỗ trống (6)", "o": ["must submit", "must be submitted", "must submitting", "must been submitted"], "a": 1, "e": "must + be + V3"}]}]}, {"id": 28, "month": "12", "title": "Collocation I: Động Từ + Danh Từ", "theme": "Community projects", "blocks": [{"h": "① NGỮ PHÁP", "md": "> **Collocation** = những từ **đi với nhau theo thói quen**, không theo logic.\n\n`raise awareness` đúng, `lift awareness` sai — dù `raise` và `lift` cùng nghĩa \"nâng\". Không có quy tắc, chỉ có thói quen của người bản ngữ."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong bài điền từ, khi **4 phương án cùng từ loại và nghĩa gần nhau** → chắc chắn đang hỏi collocation, không hỏi ngữ pháp.\n\nCả bốn đều là danh từ, nghĩa gần nhau. Nhưng chỉ `raise awareness` là cụm chuẩn."}, {"h": "③ CẤU TRÚC — BẢNG 40 CỤM HAY RA NHẤT", "md": "| Động từ | Danh từ đi kèm |\n|---|---|\n| **raise** | awareness · concern · funds · standards · a question |\n| **make** | a difference · progress · a decision · an effort · a contribution |\n| **take** | part (in) · action · place · responsibility · measures · advantage (of) |\n| **pay** | attention (to) · a visit · a fine |\n| **do** | research · damage · business · homework · a favour |\n| **meet** | a deadline · requirements · demand · expectations · a target |\n| **reach** | an agreement · a conclusion · a target · a decision |\n| **promote** | habits · awareness · growth · understanding |\n| **reduce** | waste · costs · emissions · risk |\n| **provide** | support · information · training · access |\n| **carry out** | research · a survey · an inspection · repairs |\n| **play** | a role · a part |\n\n📌 **Bốn cụm phải thuộc lòng** — mỗi danh từ đi với một động từ riêng:\n`raise awareness` · `pay attention` · `place emphasis` · `focus on`"}], "vocab": [{"t": "raise funds", "p": "v phr", "e": "to collect money for a particular purpose", "v": ""}, {"t": "make a difference", "p": "v phr", "e": "to have an important effect", "v": ""}, {"t": "take measures", "p": "v phr", "e": "to take official action to deal with something", "v": ""}, {"t": "provide access to", "p": "v phr", "e": "to make something available to people", "v": ""}, {"t": "carry out a project", "p": "v phr", "e": "to do a planned piece of work", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "The primary goal is to raise staff ______ of common hazards.", "o": ["focus", "awareness", "emphasis", "attention"], "a": 1, "e": "🔴 Chỉ raise awareness chuẩn. focus đi với on, attention với pay, emphasis với place"}, {"q": "Every employee is invited to take ______ in this project.", "o": ["place", "part", "role", "share"], "a": 1, "e": "take part in"}, {"q": "We aim to ______ safe habits through daily practice.", "o": ["produce", "provide", "protect", "promote"], "a": 3, "e": "promote habits; produce = sản xuất vật"}, {"q": "Small individual efforts will ______ a real difference.", "o": ["do", "take", "make", "give"], "a": 2, "e": "make a difference"}, {"q": "Researchers will ______ out a survey next month.", "o": ["take", "carry", "make", "bring"], "a": 1, "e": "carry out a survey"}, {"q": "The team managed to ______ the deadline despite delays.", "o": ["reach", "meet", "catch", "take"], "a": 1, "e": "meet the deadline"}]}, {"t": "Đọc hiểu", "p": "**📖 A LIBRARY BUILT BY VOLUNTEERS**\n\n> Five years ago, a group of residents in a small commune decided to make a difference. They raised funds by selling home-made food at the weekend market.\n>\n> Within eight months, they had collected enough money to buy 2,000 books. Local carpenters offered to do the work for free, and by the end of the year the shelves were ready.\n>\n> The library now provides free access to books for more than three hundred children. The commune has since taken measures to keep it open every afternoon, and two neighbouring communes have carried out similar projects.", "items": [{"q": "How did the residents raise money?", "o": ["By asking the government", "By selling home-made food at the market", "By charging for library cards", "By selling old books"], "a": 1, "e": "raised funds by selling home-made food"}, {"q": "What did local carpenters do?", "o": ["They donated books.", "They made the shelves for free.", "They designed the building.", "They collected the money."], "a": 1, "e": "Local carpenters offered to do the work for free"}, {"q": "The word **\"it\"** in paragraph 3 refers to ______.", "o": ["the commune", "the library", "the money", "the project"], "a": 1, "e": "it trỏ về the library"}, {"q": "Which of the following is TRUE according to the passage?", "o": ["The project took five months.", "Two other communes have done something similar.", "Children must pay to borrow books.", "The carpenters were paid."], "a": 1, "e": "two neighbouring communes have carried out similar projects"}]}, {"t": "🔹 Bài 3 — Mini-cloze", "p": "> **SAFE STEPS CAMPAIGN**\n>\n> The primary goal is to raise staff **(1)______** of common workplace hazards. Every employee is invited to take **(2)______** in this important project. Short drills will teach staff how to **(3)______** out of the building calmly. We aim to **(4)______** safe habits through consistent daily practice. We firmly believe small individual efforts will **(5)______** a real difference. The department will **(6)______** out an inspection every March.", "items": [{"q": "Chỗ trống (1)", "o": ["focus", "awareness", "emphasis", "attention"], "a": 1, "e": "raise awareness"}, {"q": "Chỗ trống (2)", "o": ["place", "part", "role", "share"], "a": 1, "e": "take part in"}, {"q": "Chỗ trống (3)", "o": ["check", "get", "sort", "fill"], "a": 1, "e": "get out of; check out chỉ dùng cho khách sạn"}, {"q": "Chỗ trống (4)", "o": ["produce", "provide", "protect", "promote"], "a": 3, "e": "promote habits"}, {"q": "Chỗ trống (5)", "o": ["do", "take", "make", "give"], "a": 2, "e": "make a difference"}, {"q": "Chỗ trống (6)", "o": ["take", "carry", "make", "bring"], "a": 1, "e": "carry out an inspection"}]}]}, {"id": 29, "month": "12", "title": "Collocation Ii: Cụm Giới Từ", "theme": "Cities of the future", "blocks": [{"h": "① NGỮ PHÁP", "md": "Giới từ đi sau danh từ, tính từ và động từ theo **thói quen cố định**. Sai giới từ là lỗi mất điểm rất phổ biến vì học viên dịch từ tiếng Việt."}, {"h": "② CÁCH SỬ DỤNG", "md": "Trong đề, câu hỏi giới từ xuất hiện khi **4 phương án là 4 giới từ khác nhau**, hoặc khi chỗ trống nằm ngay sau một tính từ quen thuộc."}, {"h": "③ CẤU TRÚC", "md": "### A. Tính từ + giới từ\n\n| for | of | to | in | with | at | about |\n|---|---|---|---|---|---|---|\n| responsible · essential · suitable · famous · eligible | aware · capable · typical · full · afraid | similar · due · accustomed · harmful · comparable | interested · involved · successful · confident | familiar · satisfied · associated · consistent | good · surprised · skilled | concerned · worried · enthusiastic |\n\n### B. Danh từ + giới từ\n\n| Cụm | Nghĩa |\n|---|---|\n| **a lack of** | sự thiếu |\n| **an increase / decrease in** | sự tăng/giảm về |\n| **a solution to** | giải pháp cho |\n| **the reason for** | lý do cho |\n| **an impact / effect on** | tác động lên |\n| **access to** | quyền tiếp cận |\n| **demand for** | nhu cầu về |\n| **a rise in** | sự tăng về |\n\n### C. Động từ + giới từ\n\n| Cụm | Nghĩa |\n|---|---|\n| **depend / rely on** | phụ thuộc vào |\n| **apply for** | nộp đơn xin |\n| **result in / lead to** | dẫn đến |\n| **result from** | bắt nguồn từ |\n| **contribute to** | góp phần vào |\n| **consist of** | bao gồm |\n| **benefit from** | hưởng lợi từ |\n| **comply with** | tuân thủ |\n\n⚠️ **Cặp dễ nhầm:** `result in` (dẫn đến) ≠ `result from` (bắt nguồn từ)."}], "vocab": [{"t": "have access to", "p": "v phr", "e": "to be able to use or reach something", "v": ""}, {"t": "demand for", "p": "n phr", "e": "the need that people have for something", "v": ""}, {"t": "rely on", "p": "phr v", "e": "to depend on someone or something", "v": ""}, {"t": "suffer from", "p": "phr v", "e": "to be badly affected by something", "v": ""}, {"t": "a solution to", "p": "n phr", "e": "a way of dealing with a problem", "v": ""}], "groups": [{"t": "④ LUYỆN NHẬN DIỆN", "p": "", "items": [{"q": "A stable internet connection is essential ______ all online sessions.", "o": ["to", "in", "for", "with"], "a": 2, "e": "essential for"}, {"q": "Residents were not aware ______ the new policy.", "o": ["of", "fo
