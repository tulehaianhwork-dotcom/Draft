 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Excuse me</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Good morning</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">I&#x27;m calling about…</code>. Câu mở <strong>không bao giờ</strong> chứa <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">it</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">that</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">they</code> trỏ ngược.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Tìm câu KẾT.</strong> Dấu hiệu: cảm ơn, chốt phương án — <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Thanks for your help</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">That would be fine</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Great, I&#x27;ll…</code>.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3 — Nối cặp hỏi–đáp.</strong> Câu hỏi luôn đi liền câu trả lời.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 4 — Kiểm tra đại từ.</strong> Đại từ (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">it</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">that</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">they</code>) phải có danh từ tương ứng ở câu <strong>trước</strong> nó.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG TÍN HIỆU</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Vị trí</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tín hiệu ngôn ngữ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Mở đầu</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Excuse me · Good morning · I&#x27;d like to · I&#x27;m calling about · Could I</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hỏi thêm</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Could you tell me · What exactly · May I have</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Cung cấp thông tin</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">It + V · Here it is · Yes, it&#x27;s…</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đề xuất</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">In that case · We can offer · Would you like</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Chấp nhận / kết</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">That would be fine · Thanks for your help · Great, I&#x27;ll…</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 <strong>Thứ tự gần như cố định trong hội thoại dịch vụ:</strong> <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Khách nêu vấn đề → Nhân viên xin lỗi/hỏi thêm → Khách cung cấp chi tiết → Nhân viên đề xuất giải pháp → Khách chấp nhận</code></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ GIẢI MẪU</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">a. Customer: It stopped charging after only two weeks.\nb. Staff: In that case, we can offer a replacement or a full refund.\nc. Customer: I&#x27;d like to report a problem with the headphones I bought here.\nd. Staff: I&#x27;m sorry to hear that. Could you tell me exactly what went wrong?\ne. Customer: A replacement would be fine, thank you.</p></blockquote><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Bước</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kết luận</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Câu mở = <strong>c</strong> (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">I&#x27;d like to report</code>, không có đại từ trỏ ngược)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Câu kết = <strong>e</strong> (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">would be fine, thank you</code>)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Cặp hỏi–đáp = <strong>d → a</strong> (hỏi &quot;what went wrong&quot; → đáp &quot;It stopped charging&quot;)</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">In that case</code> ở <strong>b</strong> phải đứng sau thông tin ở <strong>a</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ <strong>c – d – a – b – e</strong></p>", "quiz": [{"q": "c. Student: Excuse me, could you tell me how to borrow books from the reserve section?", "o": ["c – b – a", "a – c – b", "b – c – a", "c – a – b"], "a": 0}, {"q": "d. HR: Successful candidates begin on 1 October.", "o": ["c – b – a – d", "b – c – d – a", "c – a – b – d", "a – c – b – d"], "a": 0}, {"q": "e. Support: Thank you. Could you describe the problem?", "o": ["d – e – a – b – c", "a – d – e – b – c", "d – a – e – b – c", "e – d – a – c – b"], "a": 0}, {"q": "d. Customer: Medium, please.", "o": ["b – c – a – d", "b – a – d – c", "a – b – c – d", "c – b – a – d"], "a": 0}]}, {"id": 40, "month": "12", "title": "Dạng Sắp Xếp: Thư Và Đoạn Văn", "theme": "Thư trang trọng", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Thư trang trọng</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Hai dạng còn lại của phần sắp xếp: <strong>thư/email trang trọng</strong> và <strong>đoạn văn kể việc</strong>. Khác hội thoại ở chỗ không có lượt lời — phải dựa vào <strong>trình tự thông tin</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② CÁCH SỬ DỤNG</h4><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">A. THƯ TRANG TRỌNG — trình tự gần như cố định</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left 00\"><strong>Hậu quả nếu không làm</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Failure to respond will result in… / Places are limited…</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">🔑 Câu <strong>&quot;Failure to…&quot;</strong> hoặc <strong>&quot;Unconfirmed… will be offered to…&quot;</strong> gần như <strong>luôn đứng cuối</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">B. ĐOẠN VĂN — theo mạch thời gian và logic</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Thứ tự</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nội dung</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tín hiệu</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Bối cảnh, vấn đề</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">For years… · Traditionally… <em>(quá khứ hoàn thành)</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hành động giải quyết</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Consequently… · The council committed to…</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Chi tiết thực hiện</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">To minimise disruption… · In order to…</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Kết quả</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Initial results were… · Within three months…</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Hệ quả mở rộng</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Encouraged by… · Neighbouring counties have requested…</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BA CÂU HỎI KIỂM TRA</h4><ol class=\"list-decimal pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li><strong>Câu nào không có đại từ trỏ ngược?</strong> → ứng viên câu đầu.</li><li><strong>Câu nào chứa <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">this / these / such / the + danh từ đã nhắc</code>?</strong> → phải đứng sau câu chứa danh từ gốc.</li><li><strong>Câu nào chứa từ nối kết quả</strong> (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Consequently</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Encouraged by these results</code>)? → phải đứng sau nguyên nhân.</li></ol><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ GIẢI MẪU</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">a. The programme will begin on 15 October and runs for six weeks.\nb. Please confirm your attendance by replying before 30 September.\nc. We are pleased to inform you that your application has been accepted.\nd. Places are limited, and unconfirmed seats will be offered to the waiting list.\ne. All sessions will be held online, so a stable connection is required.</p></blockquote><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Vị trí</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Lý do</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>c</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Thông báo chính, không đại từ trỏ ngược</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>a</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chi tiết cốt lõi: ngày bắt đầu</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>e</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Điều kiện; <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">All sessions</code> trỏ về programme ở a</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>b</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Yêu cầu hành động</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">5</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>d</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hậu quả nếu không làm → luôn cuối</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ <strong>c – a – e – b – d</strong></p>", "quiz": [{"q": "e. The funding is intended to support your fieldwork and must not be used for equipment.", "o": ["c – b – e – d – a", "c – a – b – e – d", "c – e – a – d – b", "c – a – e – d – b"], "a": 3}, {"q": "e. Encouraged by the villagers' satisfaction, neighbouring counties have requested guidance.", "o": ["a – e – d – b – c", "b – c – d – a – e", "b – d – c – a – e", "e – b – a – c – d"], "a": 2}, {"q": "e. Please note that the centre cannot provide parking.", "o": ["c – b – e – a – d", "c – a – b – d – e", "b – c – a – e – d", "c – e – b – a – d"], "a": 0}]}, {"id": 41, "month": "12", "title": "Dạng Điền Mệnh Đề", "theme": "Văn bản học thuật", "html": "<p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Chủ đề từ vựng:</strong> Văn bản học thuật</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Dạng khó nhất của đề — 5 câu, 1,25 điểm.</strong> Bốn phương án thường gần giống nhau về từ ngữ, chỉ khác ở cấu trúc.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NGỮ PHÁP</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đề cho một đoạn văn với 5 chỗ trống, mỗi chỗ điền <strong>một mệnh đề hoặc câu hoàn chỉnh</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② BỐN KIỂU PHƯƠNG ÁN NHIỄU</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Kiểu nhiễu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dấu hiệu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cách loại</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1. Sai chủ thể logic</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đảo người thực hiện và người chịu tác động</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hỏi: <em>ai đang làm việc này?</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2. Sai trật tự từ</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Các từ đúng nhưng xếp lộn xộn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Đọc to — nghe trúc trắc là loại</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3. Sai bị động</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Chủ động/bị động ngược</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Hỏi: <em>chủ ngữ tự làm được không?</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>4. Sai từ nối</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Dùng <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Likewise</code> khi cần <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">However</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Xác định quan hệ ý trước</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1 — Đọc câu TRƯỚC và câu SAU chỗ trống.</strong> Xác định quan hệ ý: tiếp nối · đối lập · giải thích · kết luận.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 2 — Tìm chủ ngữ logic.</strong> Nếu chỗ trống nối với mệnh đề phân từ (<code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">On spotting…</code>, <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">Having done…</code>), chủ ngữ của chỗ trống <strong>phải là người thực hiện</strong> hành động đó.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 3 — Loại theo bốn kiểu nhiễu.</strong></p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">📌 Bốn quan hệ diễn ngôn hay gặp</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Quan hệ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tín hiệu ở phương án</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Đối lập</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">However · By contrast · Yet · Nevertheless</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Bổ sung cùng chiều</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Likewise · Similarly · Moreover</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Tóm ý, chốt</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">That is… · This is why… · Hence…</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>Cụ thể hoá</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">For instance · In practice · In reality</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ GIẢI MẪU — trích đề thật</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>On spotting a Ferrari driving around, <strong>(1)______</strong>.</em></p></blockquote><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đánh giá</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>A. you might assume that the owner of the car must be rich</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✅ Người nhìn (you) thực hiện việc assume → chủ động, đúng chủ thể</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">B. people might assume you must be the rich owner of the car</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Sai chủ thể — biến &quot;bạn&quot; thành chủ xe</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">C. the car might be assumed to be owned by a rich person</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Sai chủ thể — chủ ngữ của <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">On spotting</code> phải là người</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D. you might be assumed to be the rich owner of the car</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">❌ Sai bị động — &quot;bạn <strong>bị</strong> cho là chủ xe&quot;</td></tr></tbody></table></div>", "quiz": [{"q": "Having reviewed the applications, ______.", "o": ["the committee selected six candidates", "six candidates were selected by the committee", "the applications were found suitable", "selecting six candidates the committee was"], "a": 0}, {"q": "______. It is more than a question of wording.", "o": ["we should be careful to distinguish cost from price", "cost and price should be careful to distinguish", "distinguishing cost from price should be careful", "to be careful is distinguishing cost from price"], "a": 0}, {"q": "Chỗ trống (3) trong đoạn văn ở phần Kiến thức", "o": ["you might assume that the work has been eliminated", "the work might be assumed to be eliminated by you", "people might assume you have eliminated the work", "you might be assumed to have eliminated the work"], "a": 0}, {"q": "Chỗ trống (4) trong đoạn văn ở phần Kiến thức", "o": ["That is all the app really shows you", "All that the app shows is really you", "What the app shows is all really you", "The app is all that really shows you"], "a": 0}, {"q": "Chỗ trống (5) trong đoạn văn ở phần Kiến thức", "o": ["rather than by the labour it transfers", "because the labour it transfers is hidden", "unless the labour it transfers is counted", "other than transferring the labour we save"], "a": 0}, {"q": "Chỗ trống (6) trong đoạn văn ở phần Kiến thức", "o": ["Their time, by contrast, is bought cheaply and counted rarely", "By contrast, their time is bought cheaply by counting rarely", "Likewise, counting their time is bought cheaply and rarely", "However, it is rarely counted that their time buys cheaply"], "a": 0}, {"q": "Chỗ trống (7) trong đoạn văn ở phần Kiến thức", "o": ["saving time and shifting time distinguish themselves", "to distinguish between saving time and shifting time", "saving time is distinguishing itself from shifting time", "for saving time to be distinguished from shifting time"], "a": 1}]}, {"id": 42, "month": "1", "title": "Quy Trình Đọc: Tóm Ý Từng Đoạn", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① VẤN ĐỀ CẦN SỬA</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Cách đọc phổ biến là <strong>nhặt từ khoá</strong>: tìm từ trong câu hỏi rồi quét tìm từ đó trong bài.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Cách này làm được dạng câu hỏi chi tiết, nhưng <strong>sai toàn bộ</strong> dạng ý chính, suy luận và tiêu đề — tức là mất khoảng 6 trong 18 câu.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH ĐỌC CHUẨN — 4 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Đọc toàn bài một lượt, <strong>không xem câu hỏi</strong>. <strong>Bước 2</strong> — Sau mỗi đoạn, <strong>viết một câu tiếng Việt ra lề</strong> tóm ý đoạn đó. Không quá 10 từ. <strong>Bước 3</strong> — Bây giờ mới xem câu hỏi. <strong>Bước 4</strong> — Với câu hỏi ý chính, suy luận, tiêu đề → <strong>nhìn vào các câu tóm ý</strong>, không đọc lại bài.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">📌 <strong>Câu chủ đề thường ở đầu hoặc cuối đoạn.</strong> Câu ở giữa thường là ví dụ minh hoạ.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ KIỂM TRA CHẤT LƯỢNG TÓM Ý</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đọc bốn câu tóm ý liền nhau phải thành <strong>một mạch lập luận có nghĩa</strong>. Nếu rời rạc → tóm sai, phải đọc lại.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đoạn</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tóm ý mẫu</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">1</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tiện lợi định hình đời sống đô thị, ít ai xét tác động</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">2</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Tiện lợi không xoá bỏ lao động, chỉ chuyển sang người khác</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">3</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Kỹ năng ít dùng thì mai một, kể cả sự kiên nhẫn</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">4</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">Không nên bỏ tiện lợi; vấn đề là dùng thời gian tiết kiệm vào đâu</td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ Đọc liền bốn câu: mạch rõ ràng. Với chuỗi này, câu hỏi tiêu đề và ý chính giải được <strong>không cần đọc lại bài</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>exceed a limit</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to go beyond an allowed level</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be linked to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be connected with something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>grow used to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to become familiar with something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>leave a trace</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to leave a sign that something happened</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be underfunded</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">not given enough money</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "Which best summarises paragraph 2?", "o": ["Residents eventually adapt to constant noise.", "Noise exposure harms health even when people stop noticing it.", "Schoolchildren are the only group seriously affected.", "Blood pressure is the main risk of urban noise."], "a": 1}, {"q": "What is the writer's main point in paragraph 4?", "o": ["Noise pollution is harder to photograph than water pollution.", "Invisible problems tend not to receive funding.", "Rivers are more polluted than streets.", "Political attention is never given to cities."], "a": 1}, {"q": "According to paragraph 3, the remedies ______.", "o": ["require new technology", "are impossible to measure", "need money and political attention", "have never been tested"], "a": 2}, {"q": "Which would be the best title for the passage?", "o": ["Silence: An Unaffordable Luxury", "Noise: The Pollution Nobody Sees", "How to Build Quieter Roads", "Health Risks of Modern Cities"], "a": 1}]}, {"id": 43, "month": "1", "title": "Đoán Nghĩa Từ Trong Ngữ Cảnh", "theme": "", "html": "<blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><strong>Buổi quan trọng nhất tháng.</strong> Không ai biết hết từ trong bài đọc, kể cả người bản ngữ. Kỹ năng thật sự là <strong>đoán đủ chính xác để trả lời câu hỏi</strong>.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NĂM MANH MỐI</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Manh mối</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dấu hiệu</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>1. Tiền tố / hậu tố</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">un- · in- · dis- · re- · over- · under- · mis-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>un<strong>employ</strong>ment</em> = không + việc làm</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>2. Từ nối đối lập</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">but · however · yet · rather than · far from</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>not X <strong>but</strong> Y</em> → Y trái nghĩa X</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>3. Dấu giải thích</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dấu hai chấm · dấu phẩy · dấu gạch ngang</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>erode: navigation, cooking, patience</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>4. Ví dụ đi kèm</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">such as · for instance · including</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>5. Quan hệ nhân quả</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">because · so · as a result · therefore</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② BẢNG TIỀN TỐ HAY RA</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Tiền tố</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Ví dụ</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">un- / in- / im- / ir- / dis-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phủ định</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">unreliable · inefficient · impossible · irrecoverable · disregard</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">re-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">reuse · rebuild · reassess</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">over- / under-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">quá / thiếu</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">overestimate · underfunded</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">mis-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sai</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">misleading · misinterpret</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">pre- / post-</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">trước / sau</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">preserve · postpone</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Đừng dừng lại ngay. Đọc hết câu chứa từ lạ, rồi đọc thêm câu sau. <strong>Bước 2</strong> — Xác định từ đó <strong>tích cực hay tiêu cực</strong> trước. Nhiều khi chỉ cần biết đến thế là đủ chọn đáp án. <strong>Bước 3</strong> — Tìm một trong năm manh mối.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu chứa</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Manh mối</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đoán ra</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>relinquished</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the net gain relinquished because the resources are no longer available</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">nhân quả</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ bỏ, mất đi</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>erode</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Skills seldom practised tend to erode: navigation, cooking, even patience</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">dấu hai chấm</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">mai một</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>indolent</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>Hard-working typists can summarise, while indolent writers can drift</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">đối lập với <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">hard-working</code></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lười biếng</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>dispensed with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>the effort once required has been dispensed with almost entirely</em></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">&quot;once required&quot; + &quot;entirely&quot;</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">loại bỏ</td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be presented as</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be shown or described as something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>spoil a batch</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to ruin a whole group of items</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>end up in</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">phr v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to finally be in a particular place</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>matter more than</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be more important than</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>degrade</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to become lower in quality</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "**equivocal** ≈", "o": ["clear", "ambiguous", "excellent", "recent"], "a": 1}, {"q": "**downcycled** ≈", "o": ["turned into lower-quality products", "recycled twice", "destroyed", "exported"], "a": 0}, {"q": "**compounded** ≈", "o": ["solved", "explained", "made worse", "measured"], "a": 2}, {"q": "**inundated** ≈", "o": ["short of", "overwhelmed with", "paid for", "cleaned with"], "a": 1}, {"q": "**futile** ≈", "o": ["pointless", "expensive", "essential", "popular"], "a": 0}]}, {"id": 44, "month": "1", "title": "Dạng 1: Closest In Meaning", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>The word <strong>X</strong> in paragraph N is closest in meaning to ______.</em></p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đề <strong>không</strong> hỏi nghĩa từ điển — đề hỏi <strong>nghĩa trong ngữ cảnh cụ thể này</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 4 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — Che bốn phương án. Đọc lại câu chứa từ đó và câu trước, câu sau. <strong>Bước 2</strong> — <strong>Tự nghĩ ra một từ thay thế</strong> — tiếng Anh hay tiếng Việt đều được. <strong>Bước 3</strong> — Mở phương án, chọn cái gần nhất với từ mình nghĩ ra. <strong>Bước 4</strong> — <strong>Thay ngược vào câu, đọc lại.</strong> Nếu nghĩa câu đổi → chọn lại.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Bẫy cố định:</strong> phương án đúng theo từ điển nhưng <strong>sai trong ngữ cảnh này</strong>. Luôn làm bước 4.</p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\">🎯 <strong>Đây là lúc Sổ từ vựng phát huy tác dụng.</strong> Cột nghĩa ghi bằng <strong>định nghĩa tiếng Anh</strong> — chính là dạng phương án mà đề đưa ra.</p></blockquote><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG TỪ HỌC THUẬT HAY ĐƯỢC HỎI</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa trong đề</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Hay bị nhầm với</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>relinquish</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">từ bỏ, nhường lại</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>fill up · make up</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>dispense with</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">loại bỏ, không cần đến</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>put off · take over</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>instrumental</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">then chốt, quan trọng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>specific · trivial</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>mediocre</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">tầm thường</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>terrible · outstanding</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cherished</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">được trân trọng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>expensive · old</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>erode</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">mai một, xói mòn</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>shift · vanish</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>substitute</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">vật thay thế</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>addition · copy</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>sacrifice</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">sự hy sinh, đánh đổi</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>loss · gift</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>tolerate</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">chịu đựng</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>enjoy · allow</em></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>overlook</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">bỏ sót, xem nhẹ</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><em>watch · supervise</em></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>the net gain <strong>relinquished</strong> because the resources are no longer available</em></p><ul class=\"list-disc pl-5 my-2 space-y-1 text-slate-700 text-[14px]\"><li>Bước 2: tự nghĩ → &quot;bị mất đi&quot;, &quot;phải từ bỏ&quot;</li><li>Bước 4: thay vào → <em>the net gain given up</em> → nghĩa giữ nguyên ✅</li></ul><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>bear a cost</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to pay or suffer a cost</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>not without foundation</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">adj phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">having some truth in it</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>relocate</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to move to a different place</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>livelihood</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the way someone earns money to live</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>by historical standards</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">prep phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">compared with the past</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "phased out ≈", "o": ["sped up", "gradually removed", "repaired", "sold"], "a": 1}, {"q": "instrumental ≈", "o": ["trivial", "specific", "central", "dramatic"], "a": 2}, {"q": "mediocre ≈", "o": ["outstanding", "average", "dishonest", "wealthy"], "a": 1}, {"q": "tolerate ≈", "o": ["enjoy", "prevent", "put up with", "measure"], "a": 2}, {"q": "overlook ≈", "o": ["supervise", "fail to notice", "watch closely", "calculate"], "a": 1}, {"q": "**abundant** ≈", "o": ["scarce", "plentiful", "expensive", "fashionable"], "a": 1}, {"q": "**conceals** ≈", "o": ["reveals", "hides", "raises", "explains"], "a": 1}, {"q": "**stagnant** ≈", "o": ["rising steadily", "not increasing", "falling sharply", "unfairly taxed"], "a": 1}, {"q": "**lifted** ≈", "o": ["carried", "raised out of", "pushed into", "counted"], "a": 1}, {"q": "**precarious** ≈", "o": ["secure", "unstable", "permanent", "recent"], "a": 1}]}, {"id": 45, "month": "1", "title": "Dạng 2: Opposite In Meaning", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>The word <strong>X</strong> in paragraph N is <strong>OPPOSITE</strong> in meaning to ______.</em></p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Chữ OPPOSITE luôn được <strong>in hoa</strong> trong đề — nhưng học sinh vẫn thường đọc lướt qua và chọn từ <strong>đồng nghĩa</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 4 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — <strong>Khoanh tròn chữ OPPOSITE ngay khi nhìn thấy.</strong> Thao tác cơ học này cứu được một câu mỗi đề. <strong>Bước 2</strong> — Xác định nghĩa từ gốc. <strong>Bước 3</strong> — <strong>Loại ngay phương án đồng nghĩa</strong> — đề luôn cài ít nhất một cái làm bẫy. <strong>Bước 4</strong> — Chọn phương án trái nghĩa.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG CẶP TRÁI NGHĨA HAY RA</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đồng nghĩa (bẫy)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"><strong>Trái nghĩa (đáp án)</strong></th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">erode</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">weaken, wear away</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>strengthen, build up</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">indolent</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">lazy, idle</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>active, diligent</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">instrumental</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">central, key</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>trivial, insignificant</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">abundant</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">plentiful</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>scarce</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">mandatory</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">compulsory</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>optional, voluntary</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">deteriorate</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">worsen</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>improve</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">conceal</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">hide</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>reveal, disclose</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">accelerate</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">speed up</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>slow down</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">temporary</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">short-term</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>permanent</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">explicit</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">clear, direct</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>implicit, vague</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">superfluous</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">unnecessary</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>essential</strong></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">pronounced</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">marked, clear</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>slight</strong></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>Hard-working typists can summarise, while <strong>indolent</strong> writers can drift.</em></p><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>The word <strong>indolent</strong> is <strong>OPPOSITE</strong> in meaning to ______.</em></p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ <code class=\"px-1.5 py-0.5 rounded bg-slate-100 text-brand-700 text-[13px]\">indolent</code> = lười. Bẫy là <strong>C (lazy)</strong> — đồng nghĩa. Đáp án là <strong>A (active)</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be regarded as</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be considered to be something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>land value</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">how much a piece of land is worth</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be least likely to</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to have the smallest chance of doing something</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>write into law</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to make something an official rule</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>budget negotiations</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">discussions about how to spend money</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "**erode** OPPOSITE:", "o": ["weaken", "strengthen", "vanish", "shift"], "a": 1}, {"q": "**scarce** OPPOSITE:", "o": ["rare", "plentiful", "costly", "hidden"], "a": 1}, {"q": "**accelerate** OPPOSITE:", "o": ["hasten", "slow", "repeat", "measure"], "a": 1}, {"q": "**explicit** OPPOSITE:", "o": ["clear", "vague", "written", "formal"], "a": 1}, {"q": "**reluctant** OPPOSITE:", "o": ["unwilling", "eager", "tired", "quiet"], "a": 1}, {"q": "**superfluous** OPPOSITE: e-700\"><strong>congestion</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">a situation in which roads are too full</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div>", "quiz": [{"q": "*The council considered several sites but rejected **them** all.*", "o": ["the council", "the sites", "several", "all"], "a": 1}, {"q": "*Wind turbines are cheaper to run than coal plants, though **they** are noisier.*", "o": ["coal plants", "wind turbines", "costs", "residents"], "a": 1}, {"q": "*Students using laptops produced transcripts; **those** writing by hand produced understanding.*", "o": ["transcripts", "laptops", "students", "hands"], "a": 2}, {"q": "*The scheme cut waste by 30%. **That** result convinced the board.*", "o": ["the scheme", "the board", "the 30% cut in waste", "the waste"], "a": 2}, {"q": "**They** (paragraph 1) refers to:", "o": ["cities", "tram networks", "underground lines", "buses"], "a": 1}, {"q": "**them** (paragraph 1) refers to:", "o": ["planners", "trams", "answers", "passengers"], "a": 1}, {"q": "**those** (paragraph 2) refers to:", "o": ["businesses", "months", "streets", "cities"], "a": 2}, {"q": "**this** (paragraph 2) refers to:", "o": ["the construction", "compensating traders", "local support", "the process"], "a": 1}]}, {"id": 47, "month": "1", "title": "Dạng 4: Câu Hỏi Chi Tiết", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>According to paragraph N, ______</em> · <em>Which of the following is true according to the passage?</em></p></blockquote><p class=\"my-2 text-[14px] le ><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ Bài viết: <em>Environmental services, even when they arise without any human labour, are by no means cost-free.</em> → D diễn đạt lại đúng ý. <strong>C là đảo chiều</strong> — bài nói &quot;không hề miễn phí&quot;, C nói &quot;tối thiểu&quot;.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>staff turnover</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">n phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">the rate at which employees leave a company</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>be barely represented</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v phr</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to be included only very slightly</td><td class= 1 countries took part"], "a": 1}, {"q": "According to paragraph 2, the results should be treated cautiously because ______.", "o": ["the companies were selected at random", "participating companies chose to take part themselves", "revenue data was not collected", "manufacturing firms dominated the sample"], "a": 1}, {"q": "What does the passage say about healthcare and manufacturing?", "o": ["They reported the best results.", "They were hardly included in the trials.", "They rejected the four-day week.", "They measure output by projects completed."], "a": 1}, {"q": "According to paragraph 3, supporters argue that ______.", "o": ["the reform should be abandoned", "partial evidence is better than none", "all sectors have been tested", "critics are entirely wrong"], "a": 1}, {"q": "What do critics warn about?", "o": ["A backlash if the model fails in other sectors", "A fall in revenue", "An increase in staff turnover", "The cost of running trials"], "a": 0}, {"q": "Which of the following is true according to the passage?", "o": ["The four-day week has been proven effective in all sectors.", "Staff turnover fell by more than half in the British trial.", "Supporters believe the reform should be abandoned.", "Manufacturing was well represented in the trials."], "a": 1}]}, {"id": 48, "month": "1", "title": "Dạng 5: Not / Except", "theme": "", "html": "<h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">① NHẬN DIỆN DẠNG</h4><blockquote class=\"border-l-4 border-brand-400 bg-brand-50/60 rounded-r-xl px-4 py-3 my-3 text-slate-700\"><p class=\"mb-2 last:mb-0 leading-relaxed\"><em>Which of the following is <strong>NOT</strong> mentioned…?</em> · <em>All of the following are… <strong>EXCEPT</strong> ______</em></p></blockquote><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">Đây là dạng <strong>ngược</strong>: ba phương án <strong>đúng</strong>, một phương án <strong>sai</strong>. Phải tìm cái sai.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">② QUY TRÌNH 3 BƯỚC</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><strong>Bước 1</strong> — <strong>Khoanh tròn chữ NOT hoặc EXCEPT.</strong> <strong>Bước 2</strong> — Kiểm tra <strong>từng phương án</strong>, đánh dấu ✓ nếu tìm thấy trong bài. <strong>Bước 3</strong> — Phương án duy nhất không có dấu ✓ là đáp án.</p><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">⚠️ <strong>Đừng chọn theo cảm tính &quot;cái nào nghe sai nhất&quot;.</strong> Dạng này mất thời gian nhưng gần như chắc ăn nếu làm đủ bốn lượt đối chiếu.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">③ BẢNG ĐỐI CHIẾU <em>(vẽ ra nháp)</em></h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Có trong bài?</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Dòng nào</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">A</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓ / ✗</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">B</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓ / ✗</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">C</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓ / ✗</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">D</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓ / ✗</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td></tr></tbody></table></div><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">④ VÍ DỤ MẪU</h4><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\"><em>Which of the following is <strong>NOT</strong> implied in paragraph 2?</em> Bài viết về đoạn sông có thể dùng cho chèo thuyền <strong>hoặc</strong> thuỷ điện, không thể cả hai.</p><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\"></th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Phương án</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Đối chiếu</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">A. Giá trị nội tại của sông không chỉ là phát điện</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">B. Lợi ích vô hình cũng là chi phí cơ hội của đập</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✓</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">C. Không thể khai thác một đoạn sông cho cả hai mục đích</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">có</td></tr><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">✗</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>D. Áp lực lên hệ sinh thái từ giải trí và phát điện là tương đương</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>bài không nói</strong></td></tr></tbody></table></div><p class=\"my-2 text-[14px] leading-relaxed text-slate-700\">→ Đáp án <strong>D</strong>.</p><h4 class=\"text-[15px] font-bold text-slate-900 mt-5 mb-2\">⑥ SỔ TỪ VỰNG</h4><div class=\"overflow-x-auto my-3\"><table class=\"w-full text-[13px] border border-slate-200 rounded-xl overflow-hidden\"><thead class=\"bg-brand-50\"><tr><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Cụm từ</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Từ loại</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Định nghĩa (tiếng Anh)</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Nghĩa tiếng Việt</th><th class=\"text-left font-semibold text-brand-800 px-3 py-2 border-b border-slate-200\">Câu tự đặt</th></tr></thead><tbody><tr class=\"odd:bg-white even:bg-slate-50/70\"><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"><strong>cite (a reason)</strong></td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">v</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\">to mention something as a reason</td><td class=\"px-3 py-2 align-top border-b border-slate-100 text-slate-700\"></td><td class=\"px-3 py-2 align-top border-b border-slate-100
